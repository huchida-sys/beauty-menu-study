年ほどで吸収。×¥55,000・XC／1cc：デイズの値段と表記。×半永久：切る方法の持ち。×あおなぎのM字リップ形成：取り扱いなし。", "basis": "足りない部分にヒアルロン酸を注射して、上唇がM字に見えるようにふくらみを足す。切らないので気軽で、溶かすこともできる。"}, {"id": "a-c2-10-1", "ch": "kuma", "card": "c2-10", "level": "apply", "q": "唇が厚ぼったいのが悩みで、できればM字の形にもしたいお客様。サイトの説明に沿うと、入口になる手術は？", "choices": ["M字リップ形成", "口角挙上", "口唇縮小", "ヒアルロン酸でM字を作る方法"], "answer": 2, "explain": "サイトは、唇が厚くて悩む人には口唇縮小をすすめ、口唇縮小も切り取るデザインでM字型にできるとしている。M字リップ形成は左右だけを切る「形」の手術、口角挙上は「位置」、ヒアルロン酸はふくらみを足すので厚みは減らない。", "basis": "サイトは、唇が厚くて悩む人には口唇縮小、唇の形を変えたい人にはM字リップ形成をすすめている。"}, {"id": "a-c2-10-2", "ch": "kuma", "card": "c2-10", "level": "apply", "q": "口唇縮小について、教材の説明と合わないものは？", "choices": ["唇は年をとると自然に厚くなるので、今の厚さを基準に減らしてよい", "再施術は、原則として施術日から半年以降に担当医が行う", "取りすぎると口が閉じにくくなるので、少なめに取るのが安全とされる", "術後すぐは口が開きにくいことがあるが、一時的である"], "answer": 0, "explain": "唇は年をとると自然に薄くなるので、今の厚さを基準に減らすと将来薄すぎると感じることがある。切り取ると元に戻せないため、サイトも将来を考えるよう注意している。再施術は半年以降・口が開きにくいのは一時的、はサイトの説明。少なめに取るのが安全、は教材の＊（一般知識）で、取りすぎは直すのがとても難しいため。", "basis": "元には戻せない。唇は年をとると自然に薄くなるので、将来のことも考えて決めるよう、サイトも注意している。"}, {"id": "d-c2-10-1", "ch": "kuma", "card": "c2-10", "level": "dr", "q": "デイズで口唇縮小を受けて8か月のお客様（保証期間内で、半年も過ぎている）。「左右差が気になるので少し取り足したい。唇の感覚もまだ少し鈍い」と言う。感覚の鈍さについての説明と、取り足しの案内が、どちらも教材に合うものは？", "choices": ["感覚の鈍さは、サイトでは術後1か月ほどでなくなるものとされている。取り足しは医師が診察し、必要と判断すれば受けられるが、危険なら断ることもある", "感覚の鈍さは、サイトでは術後すぐに出る一時的なものとされている。取り足しは医師が診察し、必要と判断すれば麻酔代だけの負担で1回受けられる", "感覚の鈍さは、サイトでは術後すぐに出る一時的なものとされている。取り足しは医師が診察し、必要と判断すれば受けられるが、危険なら断ることもある", "感覚の鈍さは、サイトでは術後1か月ほどでなくなるものとされている。取り足しは医師が診察し、必要と判断すれば麻酔代だけの負担で1回受けられる"], "answer": 2, "explain": "口唇縮小の感覚の鈍さは、サイトでは術後すぐの一時的なもので、時間とともに軽くなるとされる（一般に3〜6か月）。8か月続くなら診察で医師に伝える。保証の再施術は医師が必要と判断した場合で、危険なら断ることもある。×1か月ほど：M字リップの口の違和感の目安。×麻酔代だけで1回：タレ目形成のきまり。", "basis": "術後すぐは口が開きにくい、感覚が鈍いことがあるが、一時的で時間とともに軽くなる"}, {"id": "a-map-2b-1", "ch": "kuma", "card": "quiz-2", "level": "apply", "q": "あおなぎに通う患者が、目の下のふくらみ・みぞ・皮膚のたるみを一度に直したいと希望。教材に沿った説明は？", "choices": ["表ハムラ法が候補だが、あおなぎでは取り扱いがない", "あおなぎの裏ハムラで、余った皮膚も一緒に切り取れる", "あおなぎの脱脂＋脂肪注入で、皮膚のたるみまで直せる", "あおなぎの切開法で、脂肪をみぞへ敷き直してもらえる"], "answer": 0, "explain": "3つを一度に直せるのは、脂肪を敷き直して皮膚も切り取る表ハムラだが、あおなぎは表ハムラも切開法も取り扱いなし。あおなぎにある裏ハムラと脱脂＋脂肪注入は、どちらもまぶたの裏から入り皮膚を切らないので、皮膚のたるみは取れない。", "basis": "表ハムラ法と切開法は、あおなぎでは取り扱いなし"}, {"id": "a-cat-3-1", "ch": "nose", "card": "cat-3", "level": "apply", "q": "あおなぎの総額表示を見たお客様が「あおなぎで小鼻を小さくする手術を受けたい」と相談。教材の説明に合う案内は？", "choices": ["手術はデイズのみ。あおなぎは注射の小鼻縮小ボトックスがある", "あおなぎでも鼻翼縮小の手術を、麻酔代込みの総額表示で受けられる", "あおなぎでは糸の埋没法だけを、麻酔代込みの総額表示で受けられる", "あおなぎには小鼻の施術が無く、小鼻縮小ボトックスも料金表に無い"], "answer": 0, "explain": "鼻の手術はデイズだけのメニューで、あおなぎでは扱っていない。ただし、あおなぎの料金表には注射の「小鼻縮小ボトックス注射」がある。手術を希望するならデイズの案内になり、料金の見せ方も通常／モニターの2本立てに変わる。", "basis": "鼻の手術はデイズだけのメニューで、あおなぎでは扱っていません"}, {"id": "a-map-3c-1", "ch": "nose", "card": "map-3b", "level": "apply", "q": "鼻先まわりの手術の切り方（オープン法／クローズ法）と傷の位置について、教材に合うものはどれ？", "choices": ["鼻柱下降の傷は、オープン法でもクローズ法でも柱の上に残る", "クローズ法は穴の中だけを切る方法だが、傷あとは柱の上に残る", "オープン法は細かい作業ができ、軟骨を足す手術を同時に行うとき向き", "鼻中隔延長はクローズ法で行うので、1週間後の抜糸はいらない"], "answer": 2, "explain": "オープン法は細かい作業ができるので、軟骨を足す手術を同時に行うときによく選ばれる（鼻尖形成＋鼻中隔延長など）。鼻柱下降の傷はオープン法なら柱、クローズ法なら小鼻の内側。クローズ法は傷が表に出ない。鼻中隔延長はオープン法で行い、抜糸は1週間後。", "basis": "オープン法は細かい作業ができるので、軟骨を足す手術を同時に行うときによく選ばれる"}, {"id": "a-c3-04-1", "ch": "nose", "card": "map-3c", "level": "apply", "q": "「正面から鼻の穴が見えるのが悩み。穴の間の柱が引っ込んでいる。鼻先の高さや向きは今のままがいい」という人に合う手術は？", "choices": ["鼻柱下降（柱を下に伸ばす）", "鼻中隔延長（中の支柱を伸ばす）", "鼻孔縁挙上（穴のふちを上げる）", "鼻翼挙上（小鼻の位置を上げる）"], "answer": 0, "explain": "鼻柱下降は穴の間の柱だけを下へ伸ばし、正面から穴を目立ちにくくする。鼻先を細くする手術ではない。鼻中隔延長は鼻先ごと前・下へ動かすので、高さ・向きが変わる。鼻孔縁挙上は垂れたふちを直す手術、鼻翼挙上は小鼻全体の位置を上げる手術で、正面から穴を目立ちにくくする手術としては書かれていない。", "basis": "柱だけが下へ伸び、正面から穴が目立ちにくくなる"}, {"id": "a-map-3d-1", "ch": "nose", "card": "map-3d", "level": "apply", "q": "「鼻筋を高く、鼻先も細くしたい」という人への説明として、教材に合うものはどれ？", "choices": ["鼻中隔延長と鼻尖形成は同時にできない。料金はメニューごと", "鼻尖形成だけで鼻先と鼻筋が両方変わる。料金は1つ分ですむ", "隆鼻術と鼻尖形成を重ねる。料金はメニューごとにかかる", "隆鼻術と小鼻縮小を重ねれば鼻先も細くなる。料金はメニューごと"], "answer": 2, "explain": "鼻は1メニュー＝1か所。隆鼻術は鼻筋（上半分）だけを変えるので、鼻先のメニューと取り合いにならず重ねられ、料金もメニューごとにかかる。鼻尖形成は鼻先だけの手術で、鼻中隔延長と一緒に行うことが多い。小鼻縮小のあとは鼻先が丸く見えることがある。", "basis": "料金もメニューごとにかかる"}, {"id": "a-c3-01-1", "ch": "nose", "card": "c3-01", "level": "apply", "q": "鼻尖形成で団子鼻を細くしたい人が「ついでに小鼻の横幅も同じ日に縮めたい」と希望。教材の説明に合う対応は？", "choices": ["小鼻縮小とは同時にできないので、期間をあけて2回に分ける", "鼻尖形成で鼻先を寄せれば、小鼻の横幅も一緒に縮まると伝える", "鼻翼挙上なら同じ日に受けられるので、小鼻縮小から切り替える", "鼻中隔延長を足してオープン法にすれば、小鼻縮小も同じ日にできる"], "answer": 0, "explain": "鼻先を細くする手術と小鼻縮小は、鼻先の血のめぐりが不安定になる可能性があるため同時にできず、期間をあけて行う。鼻尖形成が寄せるのは鼻先の軟骨で、小鼻の横幅は変えない。鼻翼挙上は小鼻の位置（縦）を上げる手術で横幅は縮めない。切り方を変えれば同時にできる、という説明はない。", "basis": "鼻先の血のめぐりが不安定になる可能性があるため、期間をあけて行う"}, {"id": "a-map-3b-1", "ch": "nose", "card": "c3-01", "level": "apply", "q": "団子鼻の相談。原因と、鼻尖形成で変えられる量について、教材の説明に合うものはどれ？", "choices": ["皮膚が厚くても、軟骨を寄せる量を増やせば鼻先は必ず細くなる", "原因が皮膚そのものの厚さなら、軟骨を寄せても変化が出にくい", "骨切り幅寄せで鼻の骨を寄せれば、丸い鼻先も一緒に細くなる", "鼻尖部軟骨移植で、開いた鼻先の軟骨を糸で寄せて細くする"], "answer": 1, "explain": "東洋人は鼻先の軟骨が小さく弱く、皮膚が厚いことが多い。原因が皮膚そのものの厚さにあるタイプは、軟骨を寄せても厚い皮膚が形を覆い隠すため変化が出にくい。寄せすぎると不自然に細くなり、細くできる量には限界がある。骨切り幅寄せは上半分の骨の手術。鼻尖部軟骨移植は足す手術。", "basis": "厚い皮膚が形を覆い隠してしまうため"}, {"id": "d-k-nose-1", "ch": "nose", "card": "c3-01", "level": "dr", "q": "あおなぎに通っている人が、デイズで鼻尖形成と鼻中隔延長を同じ日に受けたい。「あおなぎと同じように、麻酔も込みの値段で考えたい」。切り方と麻酔代の案内で教材に合うのは？", "choices": ["切り方は傷の見えないクローズ法が多い。麻酔代が含まれるかは記載がなく、院に確認する", "切り方は柱も切るオープン法が多い。オプション表の笑気麻酔¥8,800が別に加わる", "切り方は柱も切るオープン法が多い。麻酔代が含まれるかは記載がなく、院に確認する", "切り方は傷の見えないクローズ法が多い。オプション表の笑気麻酔¥8,800が別に加わる"], "answer": 2, "explain": "鼻尖形成と鼻中隔延長を同時に行うときは、細かい作業ができるオープン法が多く、傷は柱にできる。デイズはどの施術でどの麻酔代が施術料金に含まれるかサイトに記載がなく、院に確認する。×クローズ法：延長はオープン法で行う。×別に加わる：含まれるかの記載はない。", "basis": "同時に行うときは、細かい作業ができるオープン法を選ぶことが多い（サイト記載）。"}, {"id": "d-c3-01-1", "ch": "nose", "card": "c3-02", "level": "dr", "q": "「上向きの鼻を少しだけ下に向けたい。ギプスでの固定は避けたく、1年ほどで元に戻るのも困る」という人。教材でいちばん合う手術と説明は？", "choices": ["切らない鼻中隔延長。溶ける糸だが、まわりにできたコラーゲンが支えるので効果はずっと続く", "鼻柱下降。柱の下側に耳の軟骨を足して鼻先ごと下に向け、効果も半永久的に続く", "鼻尖部軟骨移植。耳の軟骨を鼻先に重ね、固定は数日で、根づけば一生続く", "鼻中隔延長。控えめに伸ばすなら、ギプスを使わず数日の固定で済む"], "answer": 2, "explain": "鼻尖部軟骨移植は上向きの鼻を下に向けたい人に向き、固定は数日（ギプスとの記載はない）、根づけば一生。×切らない延長：持続は約1年。コラーゲンの支えは「すぐ元に戻るわけではない」程度。×鼻柱下降：下へ伸びるのは柱だけで、鼻先は動かさない。×鼻中隔延長：ギプスで鼻を固定する手術。", "basis": "上向きの鼻を下に向けたい"}, {"id": "a-c3-03-1", "ch": "nose", "card": "c3-03", "level": "apply", "q": "「鼻先をツンとさせたいが、今は切る手術は受けられない。1年くらいもてば十分」という人に、教材の説明で合うメニューは？", "choices": ["鼻中隔延長（支柱に耳の軟骨を継ぎ足す）", "鼻尖部軟骨移植（鼻先に耳の軟骨を重ねる）", "切らない鼻中隔延長（溶ける糸を入れる）", "鼻尖形成（クローズ法で軟骨を寄せる）"], "answer": 2, "explain": "切らない鼻中隔延長は、コグのついた溶ける糸を鼻先から入れる方法で、持続は約1年。糸が溶けたあともコラーゲンが高さを支える。軟骨を継ぎ足す鼻中隔延長とは名前が同じでも別メニュー。鼻尖部軟骨移植・鼻尖形成も切る手術で、クローズ法も穴の中を切る。", "basis": "体の中で溶ける医療用の糸を、鼻先から入れる方法"}, {"id": "d-c3-02-1", "ch": "nose", "card": "c3-03", "level": "dr", "q": "「鼻先を大きく伸ばして下に向けたい。団子鼻も細くしたい。2つを同じ日に受けたい」という人。延長に使う軟骨と、同じ日に行う鼻尖形成の料金表の通常価格で、教材に合うのは？", "choices": ["延長は耳の軟骨で行い、鼻尖形成はオープン法の¥268,000", "延長は肋軟骨で行い、鼻尖形成はオープン法の¥268,000", "延長は肋軟骨で行い、鼻尖形成はオープン法の¥248,000", "延長は耳の軟骨で行い、鼻尖形成はオープン法の¥248,000"], "answer": 1, "explain": "大きく伸ばすなら、伸ばせる長さが一番長い肋軟骨。延長はオープン法で行い、同時に行う鼻尖形成もオープン法が多い。鼻尖形成の料金表の通常価格はオープン法¥268,000（クローズ法は¥248,000）。×耳の軟骨：伸ばせる長さは一番短い。×¥248,000：クローズ法の料金。", "basis": "伸ばせる長さは「耳 → 鼻の中 → あばら」の順に長くなる。"}, {"id": "d-c3-03-1", "ch": "nose", "card": "c3-03", "level": "dr", "q": "「鼻先を伸ばしたいが、自分の体から軟骨を採るのは避けたい。遠方で何度も通えないが、モニター価格を希望」という人。鼻中隔延長の案内として教材に合うのは？", "choices": ["肋軟骨を使い、採取料¥250,000が加わるかは院に確認。予約時に希望を伝えればモニターになる", "寄贈軟骨を使い、材料費¥200,000が加わるかは院に確認。モニターは来院の条件と審査で決まる", "寄贈軟骨を使い、材料費¥200,000が加わるかは院に確認。予約時に希望を伝えればモニターになる", "肋軟骨を使い、採取料¥250,000が加わるかは院に確認。モニターは来院の条件と審査で決まる"], "answer": 1, "explain": "自分の体から採らない軟骨は寄贈軟骨で、材料費が手術料に加わるかはサイトに明記なし。モニターになれるかは医師の診察・審査で決まり、条件に「施術内容によっては2回以上来院できる」がある。×肋軟骨：自分のあばらから採る。×希望を伝えればモニター：希望は伝えるが、なれるかは審査で決まる。", "basis": "材料費・採取料は、その軟骨を使うときの費用（手術料に加わるかどうかはサイトに明記なし）。"}, {"id": "d-c3-03-2", "ch": "nose", "card": "c3-03", "level": "dr", "q": "仕事でメガネが欠かせず、メガネをかけて復帰するまでをできるだけ短くしたい人（目安は1週間ほど）。鼻先を下に向ける鼻中隔延長と、鼻筋を高くする隆鼻術の両方を希望している。教材に沿う受け方は？", "choices": ["今回は隆鼻術だけを受け、鼻中隔延長は別の機会にする", "今回は鼻中隔延長だけを受け、隆鼻術は別の機会にする", "担当が鼻先と鼻筋で別なので、2つを同じ日にまとめて受ける", "2つを同じ日に受け、メガネはギプスを外した5日目からかける"], "answer": 1, "explain": "鼻中隔延長だけならメガネはギプスを外した5日目から。隆鼻術はずれる可能性があるのでメガネを最低でも1〜2週間ひかえ、術後1か月は長時間のメガネも避ける。2つは同時に受けられるが、プロテーゼを同時に行うとメガネまでもっと長くかかることがあり、5日目からとは言えない。", "basis": "メガネは、この手術だけならギプスを外した5日目から"}, {"id": "d-k-nose-2", "ch": "nose", "card": "c3-03", "level": "dr", "q": "「鼻筋が低く、団子鼻で、正面から鼻の穴が見える」人。鼻筋は隆鼻術、団子鼻は鼻尖形成で整えると決まった。「食事を抜くなどの準備が要る麻酔は避けたい」と言う。穴の悩みに足すメニューと麻酔で教材に合うのは？（麻酔は、各メニューを単独で受けるときの記載で考える）", "choices": ["鼻柱下降で柱だけを下へ伸ばし、笑気＋局所で受ける", "鼻孔縁挙上で穴のふちを切って上げ、笑気＋局所で受ける", "鼻翼挙上で小鼻全体の位置を上げ、笑気＋局所で受ける", "鼻中隔延長で鼻先ごと前・下へ伸ばし、笑気＋局所で受ける"], "answer": 3, "explain": "正面から穴が見える悩みには鼻中隔延長か鼻柱下降。延長は単独なら笑気＋局所だが、鼻柱下降と鼻翼挙上は静脈麻酔で、静脈・全身は食事を抜くなどの準備が要る。鼻孔縁挙上はふちを上げるので、穴はさらに目立つ方向に変わる。", "basis": "麻酔（笑気麻酔でリラックスしてから局所麻酔）。"}, {"id": "d-c3-02-2", "ch": "nose", "card": "c3-04", "level": "dr", "q": "鼻先は鼻尖部軟骨移植で少しだけ高くし、引っ込んだ穴の間の柱は鼻柱下降で下に伸ばすと決めた人。それぞれの術後の目安で教材に合うのは？", "choices": ["鼻柱下降のダウンタイムは1週間ほど。軟骨移植の鼻は、72時間後に固定を外して洗う", "鼻柱下降のダウンタイムは2週間ほど。軟骨移植の鼻は、手術の翌日から洗顔できる", "鼻柱下降のダウンタイムは1週間ほど。軟骨移植の鼻は、手術の翌日から洗顔できる", "鼻柱下降のダウンタイムは2週間ほど。軟骨移植の鼻は、72時間後に固定を外して洗う"], "answer": 3, "explain": "鼻柱下降のダウンタイムは2週間ほど（腫れ・内出血は1〜2週間）で、傷は柱か穴の中と耳。鼻尖部軟骨移植は数日固定し、鼻の洗顔は固定を外したあと（72時間後）から。×1週間ほど：軟骨移植の腫れの目安。×翌日から洗顔：鼻尖形成の洗顔・シャワーのきまり。", "basis": "腫れ（1〜2週間）、痛み（約1週間。軽めの痛み止めで対応できることがほとんど）、内出血（1〜2週間で自然に消える）。"}, {"id": "d-c3-04-1", "ch": "nose", "card": "c3-04", "level": "dr", "q": "「歯ならびのせいで、横顔の鼻と上くちびるの角度が気になる。猫手術で直せる？」という人。歯の位置と角度の関係、猫手術での変化の説明で教材に合うのは？", "choices": ["角度がせまくなるのは前歯が後ろにあるとき。骨が原因でも、軟骨を多めに入れれば大きくひらけるとされる", "角度がせまくなるのは前歯が後ろにあるとき。骨が原因なら、軟骨を足しても変化は小さいとされる", "角度がせまくなるのは出っ歯のとき。骨が原因なら、軟骨を足しても変化は小さいとされる", "角度がせまくなるのは出っ歯のとき。骨が原因でも、軟骨を多めに入れれば大きくひらけるとされる"], "answer": 2, "explain": "鼻と上唇の角度は前歯の位置でも変わり、出っ歯だとせまく、前歯が後ろにあると広くなる。猫手術は根元に耳の軟骨を足して角度をひらくが、原因が歯ならびの骨にあると変化が小さいとされる（一般知識）。×前歯が後ろ：そのときは広くなる。×多めに入れれば：入れすぎると輪郭が浮き、量には限度がある。", "basis": "出っ歯だと角度はせまく、前歯が後ろにあると広くなって鼻が上向きに見えやすい"}, {"id": "a-c3-05-1", "ch": "nose", "card": "c3-05", "level": "apply", "q": "鼻筋へのヒアルロン酸注射を何年も繰り返している人が「もう通いたくない。鼻先は今の形のままでいい」と相談。教材の説明で合う手術は？", "choices": ["鼻中隔延長（支柱に軟骨を継ぎ足す）", "隆鼻術（シリコンプロテーゼを入れる）", "鼻尖部軟骨移植（鼻先に軟骨を重ねる）", "切らない鼻中隔延長（溶ける糸を入れる）"], "answer": 1, "explain": "隆鼻術は鼻の付け根から鼻筋を高くし、鼻先の形は変えない。吸収されず半永久的。ヒアルロン酸は何度も繰り返すと鼻が横に広がることがある。鼻中隔延長・鼻尖部軟骨移植は鼻先を変える手術。切らない鼻中隔延長は持続約1年で、通い続ける悩みは解決しない。", "basis": "何度も繰り返すと鼻が横に広がることがある"}, {"id": "a-c3-06-1", "ch": "nose", "card": "c3-06", "level": "apply", "q": "「鼻の穴が大きいのが悩み。小鼻の張り出しは気にならない。傷はなるべく見えない所に」という人に、教材の説明でいちばん合う手術は？", "choices": ["外側法（小鼻の外側の付け根のみぞに沿って切る）", "内側法（鼻の穴の底の外側〜小鼻の内側を切る）", "内側法＋外側法（小鼻の内側と外側の両方を切る）", "鼻孔縁挙上（垂れた鼻の穴のふちの皮膚を切り取る）"], "answer": 1, "explain": "穴が大きい悩みには内側法で、傷は穴の中なので目立ちにくい。外側法は張り出し向きで、穴の大きさは基本的に変わらない。内側＋外側は張り出しも気になる人向けで、外側の傷が目立つ可能性がある。鼻孔縁挙上はふちの垂れを直す手術。", "basis": "穴が大きい→内側法、小鼻が張り出す→外側法"}, {"id": "a-c3-06-2", "ch": "nose", "card": "c3-06", "level": "apply", "q": "小鼻の張り出しが強く、皮膚も厚い人が「切らない埋没法で小鼻を小さくしたい」と希望。教材の説明に合う案内は？", "choices": ["埋没法で十分。糸の本数を増やせば強い張り出しも直せる", "張り出しは位置の問題なので、鼻翼挙上で小鼻を上げるのがよい", "鼻尖形成と同じ日に埋没法を行えば、小鼻の変化が大きくなる", "埋没法の変化は少量〜中程度なので、切る方法がすすめられる"], "answer": 3, "explain": "埋没法は傷が針穴だけで糸を抜けば戻せるが、変化は少量〜中程度。張り出しが強い人・皮膚が厚い人には切る方法がすすめられる。鼻翼挙上は小鼻の位置（縦）を上げる手術。鼻先を細くする手術と小鼻縮小は同時にできない。", "basis": "張り出しが強い人・皮膚が厚い人には切る方法がすすめられる"}, {"id": "d-c3-06-1", "ch": "nose", "card": "c3-06", "level": "dr", "q": "小鼻縮小を受けて3か月の人。「左右差と、鼻先の丸みが気になる。今すぐ相談して、小鼻の修正と鼻尖形成を同じ日に受けたい」。教材に沿った案内は？", "choices": ["左右差の診察・相談は今すぐ受けられる。鼻尖形成は小鼻の修正とは日を分ける", "左右差の診察・相談は再施術の時期まで待つ。鼻尖形成は小鼻の修正とは日を分ける", "左右差の診察・相談は今すぐ受けられる。鼻尖形成も小鼻の修正と同じ日にできる", "左右差の診察・相談は再施術の時期まで待つ。鼻尖形成も小鼻の修正と同じ日にできる"], "answer": 0, "explain": "デイズの保証制度では、診察・相談は保証の有無に関わらずいつでもできる（再施術するかは医師が判断）。鼻先を細くする手術は、鼻先の血のめぐりが不安定になる可能性があるため小鼻と同じ日にできず、期間をあける。×時期まで待つ：相談はいつでもできる。×同じ日：期間をあけて行う。", "basis": "鼻先を細くする手術とは同時にできない。鼻先の血のめぐりが不安定になる可能性があるため、期間をあけて行う（サイト記載）。"}, {"id": "d-quiz-3-1", "ch": "nose", "card": "c3-06", "level": "dr", "q": "「正面から鼻筋が太い・横から途中が出っ張る・鼻先が丸い・小鼻が横に張り出す」人。休めるのは1週間で、点滴の麻酔や完全に眠る麻酔は避けたい。1回目の計画として教材に合うものは？", "choices": ["わし鼻修正・鼻尖形成・小鼻縮小の3つを、同じ日にまとめて受ける", "わし鼻修正と鼻尖形成を受け、小鼻縮小は期間をあけて別の回にする", "骨切り幅寄せと小鼻縮小を受け、鼻尖形成は期間をあけて別の回にする", "わし鼻修正と鼻翼挙上を受け、鼻尖形成は期間をあけて別の回にする"], "answer": 1, "explain": "わし鼻修正（固定2日）と鼻尖形成はどちらも笑気＋局所で、鼻筋と鼻先は担当が別なので重ねられる。鼻尖形成と小鼻縮小は鼻先の血のめぐりが不安定になる可能性があり同じ日にできない。骨切り幅寄せは全身麻酔でギプス約3週間。鼻翼挙上は静脈麻酔を使い、張り出しではなく下がりを直す。", "basis": "鼻先を細くする手術とは同時にできない"}, {"id": "a-c3-07-1", "ch": "nose", "card": "c3-07", "level": "apply", "q": "「小鼻が下がって見えるうえに、横にも広がっている。手術は1回の来院でまとめたい」という人に、教材の説明で合う案内は？", "choices": ["鼻翼挙上だけで、下がりと横の広がりが両方直る", "小鼻縮小と鼻翼挙上を同時に行い、両方を一緒に直す", "小鼻縮小と鼻翼挙上は同時にできないので、期間をあける", "鼻孔縁挙上だけで、下がりと横の広がりが両方直る"], "answer": 1, "explain": "小鼻縮小は横幅・穴の大きさ、鼻翼挙上は小鼻の位置（縦）を変える。担当が違うので、広がりと下がりの両方があれば同時に行える。同時にできないのは、小鼻縮小と鼻先を細くする手術の組み合わせ。鼻孔縁挙上はふちの垂れを直す手術で横幅は変えない。", "basis": "小鼻縮小と同時に行い、広がりと下がりを一緒に直すこともできる"}, {"id": "d-c3-04-2", "ch": "nose", "card": "c3-07", "level": "dr", "q": "診察で鼻翼挙上をすすめられた人。「しっかり5mmくらい上げたい。上げ足りなければ1か月後にでも足したい」。教材に沿った案内は？", "choices": ["上げられるのは5mmほどまで。やり直しは原則半年以降", "上げられるのは1〜2mmほど。やり直しは原則半年以降", "上げられるのは5mmほどまで。やり直しは原則1か月以降", "上げられるのは1〜2mmほど。やり直しは原則1か月以降"], "answer": 1, "explain": "鼻翼挙上で上げられるのは1〜2mmほどで、安全と仕上がりのバランスからこの程度が適切とされる。再施術は目元が原則1か月以降、そのほかは原則半年以降。×5mm：上げられるのは1〜2mm。×1か月以降：目元のきまり。", "basis": "上げられるのは1〜2mmほど。安全と仕上がりのバランスから、この程度が適切とされる。"}, {"id": "d-c3-07-1", "ch": "nose", "card": "c3-07", "level": "dr", "q": "診察で「小鼻が外へ張り出し、小鼻全体の位置も下がっている」と言われ、小鼻縮小と鼻翼挙上を同じ日に受けることになった人。小鼻縮小のやり方と、鼻翼挙上の麻酔・傷の場所で教材に合うのは？", "choices": ["張り出しは内側法で縮める。鼻翼挙上は点滴の麻酔でうとうとして受け、傷は外側のみぞ", "張り出しは外側法で縮める。鼻翼挙上は点滴の麻酔でうとうとして受け、傷は外側のみぞ", "張り出しは外側法で縮める。鼻翼挙上は起きたままの麻酔で受け、傷は鼻の穴のふち", "張り出しは内側法で縮める。鼻翼挙上は起きたままの麻酔で受け、傷は鼻の穴のふち"], "answer": 1, "explain": "外への張り出しは外側法（内側法は穴が大きい人向けで、張り出しを直す効果はうすい）。鼻翼挙上は静脈＋笑気＋局所でうとうとした状態で行い、傷は小鼻の外側のみぞに重なる。×内側法：張り出しには効果がうすい。×起きたまま・穴のふち：笑気＋局所で傷がふちに沿うのは鼻孔縁挙上。", "basis": "笑気麻酔と静脈麻酔（点滴の麻酔）でリラックスした状態で、局所麻酔などの注射をする。"}, {"id": "a-c3-08-1", "ch": "nose", "card": "c3-08", "level": "apply", "q": "「ほうれい線の影が気になる。まずは切らずに試して、気に入れば長持ちする方法も考えたい」という人に、貴族手術の材料で合う進め方は？", "choices": ["肋軟骨移植で試し、のちにヒアルロン酸注入を検討する", "ヒアルロン酸注入で試し、のちにプロテーゼを検討", "プロテーゼ挿入で試し、のちに自己脂肪注入を検討", "自己脂肪注入で試し、のちに肋軟骨移植を検討"], "answer": 1, "explain": "貴族手術の4材料のうち、ヒアルロン酸だけは注射で済み切らない。1〜2年で吸収されるので、プロテーゼの前の「お試し」にも使われる。プロテーゼは口の中を切って入れ半永久、自己脂肪は脂肪を採って注入し定着した分が半永久、肋軟骨はあばらから軟骨を採る。", "basis": "吸収されるので、プロテーゼの前の「お試し」にも使われる"}, {"id": "d-c3-05-2", "ch": "nose", "card": "c3-08", "level": "dr", "q": "「ほうれい線の影と、低い鼻筋の両方が気になる」人。貴族手術（プロテーゼ）と隆鼻術を、それぞれ単独で受けるときの麻酔で教材に合うのは？", "choices": ["貴族手術は点滴で眠って受け、隆鼻術は点滴で眠って受ける", "貴族手術は起きたまま受け、隆鼻術は起きたまま受ける", "貴族手術は点滴で眠って受け、隆鼻術は起きたまま受ける", "貴族手術は起きたまま受け、隆鼻術は点滴で眠って受ける"], "answer": 2, "explain": "貴族手術は笑気麻酔と静脈麻酔でリラックスしたあと、眼窩下神経ブロックと局所麻酔をする（眠る麻酔）。隆鼻術は笑気＋局所の眠らない麻酔。貴族手術は鼻の高さを変えないので、鼻筋には隆鼻術が別に要る。×貴族手術を起きたまま：静脈麻酔を使う。×隆鼻術を点滴で：笑気＋局所で受ける。", "basis": "笑気麻酔と静脈麻酔でリラックスしたあと、眼窩下神経ブロックと局所麻酔（その場所だけに効く注射）をする。"}, {"id": "d-c3-08-1", "ch": "nose", "card": "c3-08", "level": "dr", "q": "「メイクで短く見せるのではなく、鼻の下の長さそのものを縮めたい。ほうれい線も浅くしたい。入れた物が数年で消えるのは困る」という人。教材に合う計画は？", "choices": ["鼻の下は猫手術で柱の根元を前に出し、皮膚の長さも短くする。ほうれい線は貴族手術のプロテーゼで底上げする", "鼻の下は人中短縮で皮膚を切り取り、長さを実際に短くする。ほうれい線は貴族手術のヒアルロン酸で底上げする", "鼻の下は猫手術で柱の根元を前に出し、皮膚の長さも短くする。ほうれい線は貴族手術のヒアルロン酸で底上げする", "鼻の下は人中短縮で皮膚を切り取り、長さを実際に短くする。ほうれい線は貴族手術のプロテーゼで底上げする"], "answer": 3, "explain": "人中短縮は鼻の下の皮膚を切り取って実際に短くする。猫手術は根元を前に出して短く「見せる」手術で、皮膚の長さは変わらない。貴族手術のプロテーゼは半永久、ヒアルロン酸は1〜2年で吸収される。×猫手術で皮膚も短く：皮膚の長さは同じ。×ヒアルロン酸：数年もたずに吸収される。", "basis": "ヒアルロン酸だけは切らずに注射で済むが、1〜2年で吸収される。"}, {"id": "d-c3-14-1", "ch": "nose", "card": "c3-08", "level": "dr", "q": "人中短縮と貴族手術を同じ日に受けたい人。もともと小鼻が横に広めで、鼻先も細くしたいと言う。教材に沿った計画は？", "choices": ["2つは同時にできる。小鼻縮小と鼻尖形成も、同じ日にまとめて受ける", "2つはどちらも小鼻が広がりやすいので、同じ日には受けず期間をあける", "2つは同時にできる。小鼻は広がらないので、鼻尖形成だけを同じ日に足す", "2つは同時にできる。小鼻縮小も検討し、鼻尖形成とは日を分けて受ける"], "answer": 3, "explain": "人中短縮と貴族手術は同時にできるが、どちらも術後に小鼻が横に広がりやすいので、小鼻縮小も一緒に（または後から）検討する。小鼻縮小と鼻尖形成は鼻先の血のめぐりが不安定になる可能性があり、同じ日にはできず期間をあける。広がりやすいことは2つを同時にできない理由ではない。", "basis": "どちらも小鼻が横に広がりやすい手術なので、小鼻縮小も一緒に（または後から）検討することをすすめている"}, {"id": "a-c3-09-1", "ch": "nose", "card": "c3-09", "level": "apply", "q": "「鼻の下が長く見える。でも顔の正面に傷を作るのは絶対にいや」という人に、教材の説明で合う手術は？", "choices": ["猫手術（柱の根元に耳の軟骨を入れる）", "人中短縮（鼻の下の皮膚を切り取る）", "外側人中短縮（人中の外側も引き上げる）", "貴族手術（小鼻の横のくぼみを底上げ）"], "answer": 0, "explain": "猫手術は柱の根元を前に出して鼻の下を短く見せ、皮膚は切り取らない。猫手術だけなら基本はクローズ法で、傷は鼻の穴の中（表面に大きな傷は残りにくい）。人中短縮は皮膚を切り取る「顔の正面に傷ができる手術」で、外側人中短縮もその方法の1つ。貴族手術のねらいはほうれい線の影。", "basis": "猫手術は根元を前に出して短く見せる"}, {"id": "d-c3-09-1", "ch": "nose", "card": "c3-09", "level": "dr", "q": "猫手術と鼻柱下降で迷っている人が「どちらも耳の軟骨を使うと聞いた。入れた軟骨や効果は、あとでどうなる？」と相談。教材に合う説明は？", "choices": ["猫手術の軟骨は少し縮むことがあり、多くは2〜3か月で落ち着く。鼻柱下降の効果は半永久的", "猫手術の軟骨は少し縮むことがあり、多くは半年ほどかけて落ち着く。鼻柱下降の効果は約1年", "猫手術の軟骨は少し縮むことがあり、多くは2〜3か月で落ち着く。鼻柱下降の効果は約1年", "猫手術の軟骨は少し縮むことがあり、多くは半年ほどかけて落ち着く。鼻柱下降の効果は半永久的"], "answer": 0, "explain": "猫手術で入れた耳の軟骨は定着しやすいが、少し縮んだり吸収されたりして形が変わることがあり、多くは2〜3か月で落ち着く。鼻柱下降の効果は半永久的（サイトQ&A）。×半年ほど：猫手術の傷のなじみ（3か月〜半年以上）と混同。×約1年：切らない鼻中隔延長の持続期間。", "basis": "入れた軟骨は定着しやすいが、少し縮んだり吸収されたりして形が変わることがある（多くは2〜3か月で落ち着く）。"}, {"id": "d-c3-09-2", "ch": "nose", "card": "c3-09", "level": "dr", "q": "「猫手術を受けたい。鼻中隔延長も考えていて、同じ日にするか別の日にするか迷っている」という人。日の決め方で、猫手術の傷と術後の鼻の洗顔の案内はどう変わる？", "choices": ["猫手術だけでも柱の根元を切るのが基本で、同じ日でも変わらない。延長と同じ日でも、鼻は固定テープを外せば洗える", "猫手術だけなら穴の中の約1cm、同じ日なら柱の根元も切ることが多い。延長と同じ日なら、鼻はギプスを外してから洗う", "猫手術だけなら穴の中の約1cm、同じ日なら柱の根元も切ることが多い。延長と同じ日でも、鼻は固定テープを外せば洗える", "猫手術だけでも柱の根元を切るのが基本で、同じ日でも変わらない。延長と同じ日なら、鼻はギプスを外してから洗う"], "answer": 1, "explain": "猫手術だけならクローズ法で穴の中の仕切りの縁を約1cm切り、洗顔は鼻と耳の傷を除いて翌日から。ほかの鼻の手術と同じ日ならオープン法が多く、柱の根元を切る。延長はギプスで固定するので、同じ日なら鼻はギプスを外してから洗う。×単独でも柱：単独の基本はクローズ法。×固定テープ：猫手術のメイクのきまりで、延長はギプス。", "basis": "猫手術だけを行うときの基本。鼻の穴の中、仕切りの縁を約1cm切る。"}, {"id": "a-c3-10-1", "ch": "nose", "card": "c3-10", "level": "apply", "q": "「正面から見た鼻筋が太い。もともと鼻の通りもあまり良くない」という人が骨切り幅寄せを希望。教材の説明に合う進め方は？", "choices": ["鼻の通りは変わらない手術なので、検査なしで骨切り幅寄せを行う", "わし鼻修正で出っ張りを削れば幅も細くなるので、代わりにする", "CTで中の広さを確かめ、狭ければ鼻炎の手術も一緒にすすめる", "隆鼻術で高さを足せば太さが目立たなくなるので、そちらをすすめる"], "answer": 2, "explain": "骨切り幅寄せは鼻の通りが悪くなることがあるため、手術前にCTで鼻の中の広さを確認し、狭い人には鼻炎の手術を一緒に行うことをすすめている。わし鼻修正は横から見た出っ張り（前後）の手術。土台の骨が大きいと、上に高さを足しても鼻全体が大きく見えてしまう。", "basis": "狭い人には鼻炎の手術を一緒に行うことをすすめている"}, {"id": "d-c3-11-1", "ch": "nose", "card": "c3-10", "level": "dr", "q": "出っ張りの大きいわし鼻。診察で「削った跡で鼻筋が広く見えそうなので、骨切り幅寄せも足す」と判断された。骨切り幅寄せと、わし鼻修正それぞれの術後の目安で教材に合うのは？", "choices": ["骨切り幅寄せの腫れ・内出血は1週間ほど。わし鼻修正だけなら、仕事は3日〜1週間休む", "骨切り幅寄せの腫れ・内出血は2週間〜1か月。わし鼻修正だけなら、仕事は2週間ほど休む", "骨切り幅寄せの腫れ・内出血は1週間ほど。わし鼻修正だけなら、仕事は2週間ほど休む", "骨切り幅寄せの腫れ・内出血は2週間〜1か月。わし鼻修正だけなら、仕事は3日〜1週間休む"], "answer": 3, "explain": "骨切り幅寄せは負担の大きい手術で、腫れ・内出血が引くまで2週間〜1か月。柱と鼻の横の約3mmにも傷ができる。わし鼻修正だけなら腫れは約1週間で、仕事は3日〜1週間休む。×1週間ほど：わし鼻修正の腫れの目安。×2週間ほど休む：わし鼻修正の休みは3日〜1週間。", "basis": "負担の大きい手術。この章で唯一の全身麻酔で、ギプス固定が約3週間、腫れ・内出血が引くまで2週間〜1か月。"}, {"id": "d-k-nose-4", "ch": "nose", "card": "c3-10", "level": "dr", "q": "「正面から見た鼻筋の太さと、丸い鼻先を、同じ日の手術でまとめて細くしたい」というお客様。デイズで受けるときの術後の説明として教材に合うものは？", "choices": ["鼻の固定は2日間で、洗顔は翌日から。鼻をかむのは1か月後から", "鼻の固定は2日間で、洗顔は翌日から。鼻をかむのは抜糸が済む1週間後から", "ギプスは約3週間で、洗顔はそれを外し抜糸が済んでから。鼻をかむのは1か月後から", "ギプスは約3週間で、洗顔はそれを外し抜糸が済んでから。鼻をかむのは抜糸が済む1週間後から"], "answer": 2, "explain": "正面から見た幅は骨切り幅寄せ（全身麻酔・ギプス約3週間・洗顔はギプスを外し抜糸後）で、固定2日間は横から見た出っ張りを削るわし鼻修正の数字。丸い鼻先は鼻尖形成で軟骨を糸で寄せ、抜糸は1週間後だが鼻をかむのは1か月後から。同じ日に重ねるので、両方のきまりを守る。", "basis": "洗顔はギプスを外し、抜糸が済んでから。運動は鼻が安定するまで約1か月控える。"}, {"id": "a-c3-11-1", "ch": "nose", "card": "c3-11", "level": "apply", "q": "横から見た鼻筋の出っ張りが軽度。「仕事を休めないので腫れは困る。ずっと続かなくてもいい」という人に、教材の説明で合う方法は？", "choices": ["わし鼻修正で、出っ張った骨を削って平らにする", "骨切り幅寄せで、鼻の骨を左右から内側に寄せる", "斜鼻修正で、骨を切って中心の位置へ戻す", "ヒアルロン酸で、出っ張りをなめらかに見せる"], "answer": 3, "explain": "出っ張りが軽度〜中度なら、骨を削らずにヒアルロン酸かプロテーゼで改善できる。ヒアルロン酸は針のチクッとした痛み程度で、2年ほどで吸収される。わし鼻修正は腫れ約1週間・仕事は3日〜1週間休む。骨切り幅寄せは幅、斜鼻修正は曲がりの手術でギプス固定がある。", "basis": "軽度〜中度なら骨を削らずにヒアルロン酸かプロテーゼで改善できる"}, {"id": "d-c3-05-1", "ch": "nose", "card": "c3-11", "level": "dr", "q": "「中度のわし鼻。骨は削りたくない。仕事で毎日メガネをかける」という人。削らずにプロテーゼで整えられるかと、入れたあとのメガネの案内で教材に合うのは？", "choices": ["中度でも削らずに整えられる。メガネは最低でも1〜2週間ひかえる", "削らずに整うのは軽度だけ。メガネは最低でも1〜2週間ひかえる", "中度でも削らずに整えられる。メガネは固定が取れる2日後から使える", "削らずに整うのは軽度だけ。メガネは固定が取れる2日後から使える"], "answer": 0, "explain": "わし鼻は出っ張りの大きさで軽度〜重度に分かれ、軽度〜中度なら骨を削らずにヒアルロン酸かプロテーゼで改善できる。プロテーゼを入れたあとは、ずれる可能性があるのでメガネを最低でも1〜2週間ひかえる。×軽度だけ：中度まで削らずに整えられる。×2日後から：固定2日はわし鼻修正（削る方法）の目安。", "basis": "サイトによると、出っ張り（ハンプ）の大きさで軽度〜重度に分かれ、軽度〜中度なら骨を削らずにヒアルロン酸かプロテーゼで改善できる。"}, {"id": "a-c3-12-1", "ch": "nose", "card": "c3-12", "level": "apply", "q": "「スポーツのけがで鼻筋が曲がった」という人が斜鼻修正を希望。教材の説明に合うものは？", "choices": ["けがの場合は、軟骨だけが曲がっていることが多い", "けがなら骨が原因なので、骨を切って寄せれば直る", "生まれつきと同じく、原因ははっきりしないことが多い", "骨と仕切りの軟骨が同時に変形していることが多い"], "answer": 3, "explain": "けがが原因の斜鼻は、骨と仕切り（鼻中隔）の軟骨が同時に変形していることが多く、両方を直す必要がある。軟骨だけ・骨だけとは決めつけず、事前のCT撮影でどこが原因かを確かめる。原因がはっきりしないことが多いのは生まれつきの場合。", "basis": "骨と仕切りの軟骨が同時に変形していることが多く"}, {"id": "d-c3-10-1", "ch": "nose", "card": "c3-12", "level": "dr", "q": "「正面から見ると鼻筋が曲がっている。横から見ると途中も少し出っ張る」という人。手術の進め方と術後の目安で教材に合うのは？", "choices": ["曲がりはCTで原因が骨か軟骨かを確かめ、原因ごとに直し方を変える。出っ張りを削ったあと、鼻が安定するのは2か月後", "曲がりはCTで鼻の中の広さを確かめ、どの原因でも骨を切って寄せる。出っ張りを削ったあと、鼻が安定するのは2か月後", "曲がりはCTで原因が骨か軟骨かを確かめ、原因ごとに直し方を変える。出っ張りを削ったあと、鼻が安定するまで半年ほど", "曲がりはCTで鼻の中の広さを確かめ、どの原因でも骨を切って寄せる。出っ張りを削ったあと、鼻が安定するまで半年ほど"], "answer": 0, "explain": "斜鼻修正は曲がりの原因が骨だけ・軟骨だけ・両方の3タイプで手術の中身が変わるので、事前のCTが必須（軟骨だけなら軟骨を矯正）。横から見た出っ張りはわし鼻修正で削り、鼻が安定するのは2か月後。×鼻の中の広さ：骨切り幅寄せのCTの目的。×半年ほど：鼻尖形成が完全に安定するまでの目安。", "basis": "曲がりの原因は3タイプ。骨だけ／軟骨だけ／骨と軟骨の両方。どこが原因かで手術の中身が変わるので、事前のCT撮影が必須。"}, {"id": "d-c3-12-1", "ch": "nose", "card": "c3-12", "level": "dr", "q": "骨が原因の斜鼻で斜鼻修正を考えている人が「鼻筋の太さも気になるので、骨切り幅寄せと比べたい」。それぞれの麻酔で教材に合うのは？", "choices": ["斜鼻修正は笑気＋局所で起きたまま受け、骨切り幅寄せは全身麻酔で受ける", "斜鼻修正は笑気＋静脈で眠って受け、骨切り幅寄せは全身麻酔で受ける", "斜鼻修正は笑気＋静脈で眠って受け、骨切り幅寄せは笑気＋静脈で受ける", "斜鼻修正は笑気＋局所で起きたまま受け、骨切り幅寄せは笑気＋静脈で受ける"], "answer": 1, "explain": "斜鼻修正は骨切り幅寄せと同じ技術で通常価格も同じだが、麻酔は笑気＋静脈で眠り、局所麻酔も足す。骨切り幅寄せはこの章で唯一の全身麻酔。×骨切り幅寄せを笑気＋静脈：同じなのは技術と通常価格で、麻酔は全身。×斜鼻修正を起きたまま：わし鼻修正の麻酔（笑気＋局所）。", "basis": "麻酔：笑気麻酔と静脈麻酔で眠り、局所麻酔も足す。"}, {"id": "d-c3-12-2", "ch": "nose", "card": "c3-12", "level": "dr", "q": "スポーツのけがで斜鼻修正を受けて4か月の人。「鼻づまりが残っていて、曲がりも少し戻った気がする。保証で見てもらえる？」。教材に沿った案内は？", "choices": ["鼻づまりは腫れと同じく1〜2週間で引くもの。この手術の保証は1か月で、すでに期間外", "鼻づまりは3〜6か月かけて改善していく。この手術の保証は1か月で、すでに期間外", "鼻づまりは3〜6か月かけて改善していく。鼻の保証は1年で、不整・左右差を医師が判断する", "鼻づまりは腫れと同じく1〜2週間で引くもの。鼻の保証は1年で、不整・左右差を医師が判断する"], "answer": 2, "explain": "鼻づまりは鼻の中の粘膜が腫れるためで、3〜6か月かけて通りが戻っていく（腫れそのものは1〜2週間）。鼻の施術の保証は1年で、不整・左右差があり医師が必要と判断した場合に再施術を受けられる。×1〜2週間で引く：腫れの目安。×保証1か月：糸リフトや顔の脂肪吸引などの期間。", "basis": "しばらく鼻がつまりやすい。鼻の中の粘膜が腫れるため。3〜6か月かけて通りは戻っていく。"}, {"id": "a-c3-13-1", "ch": "nose", "card": "c3-13", "level": "apply", "q": "「鼻の穴のふちだけが垂れて重たく見える。小鼻全体の位置や横幅は気にならず、穴の間の柱の位置も今のままがいい」という人に、教材の説明で合う手術は？", "choices": ["鼻翼挙上（小鼻全体の位置を上げる）", "鼻柱下降（柱を下に伸ばして差を直す）", "小鼻縮小（小鼻の横幅をつめる）", "鼻孔縁挙上（ふちの皮膚を切り取る）"], "answer": 3, "explain": "鼻孔縁挙上は、垂れた鼻の穴のふちの皮膚を切り取って、ふちのカーブを上げる。鼻翼挙上は小鼻の上（外側のみぞ沿い）を三日月形に切り、小鼻全体の位置を上げる。鼻柱下降もふちとの差を直すが、動かすのは柱。小鼻縮小は横幅・穴の大きさを小さくする。", "basis": "垂れ下がった鼻の穴のふちの皮膚を切り取って、ふちのカーブを上げ"}, {"id": "a-map-3-1", "ch": "nose", "card": "c3-13", "level": "apply", "q": "鼻の穴の「ふち」と「底」。切る場所が違う手術の説明として、誤っているものはどれ？", "choices": ["鼻孔縁挙上は、穴の底の外側を切って鼻の穴の大きさを小さくする", "小鼻縮小の内側法は、穴の底の外側〜小鼻の内側を切って穴を小さくする", "鼻孔縁挙上は、垂れたふちの皮膚を切り取って、ふちのカーブを上げる", "内側法は張り出しを直す効果がうすく、張り出しには外側法が向く"], "answer": 0, "explain": "鼻孔縁＝鼻の穴のふち（小鼻の下のへり）、挙上＝持ち上げる。鼻孔縁挙上は垂れたふちの皮膚を切り取ってふちを上げる手術で、穴の底の外側を切って穴を小さくするのは小鼻縮小の内側法。内側法は張り出しを直す効果はうすく、張り出しは外側法。部位名は鼻背＝鼻筋、鼻翼＝小鼻、鼻柱＝穴の間の柱。", "basis": "鼻孔縁＝鼻の穴のふち、挙上＝持ち上げる"}, {"id": "d-c3-13-1", "ch": "nose", "card": "c3-13", "level": "dr", "q": "花粉症の人が、鼻孔縁挙上とわし鼻修正の両方を考えている。受ける季節と鼻水の対策で教材に合う案内は？", "choices": ["鼻孔縁挙上は抜糸まで鼻の穴に負担をかけないよう季節を避ける。わし鼻修正は傷が鼻の中なので鼻水を飲み薬でおさえる", "鼻孔縁挙上は傷が鼻の中なので飲み薬で季節中も受けられる。わし鼻修正は傷が鼻の中なので鼻水を飲み薬でおさえる", "鼻孔縁挙上は抜糸まで鼻の穴に負担をかけないよう季節を避ける。わし鼻修正は傷が鼻の外なので鼻水の対策はいらない", "鼻孔縁挙上は傷が鼻の中なので飲み薬で季節中も受けられる。わし鼻修正は傷が鼻の外なので鼻水の対策はいらない"], "answer": 0, "explain": "鼻孔縁挙上は抜糸まで強く鼻をかむ・ティッシュを詰めるなどを避けるので、花粉症の人は症状が出る季節を避ける（傷は穴のふち）。わし鼻修正は鼻の中に傷があり、鼻水は飲み薬でおさえる。×鼻孔縁挙上の傷が鼻の中：傷はふちに沿う。×わし鼻修正の傷が外：鼻の穴の中を数mm切る。", "basis": "そのため花粉症の人は、症状が出る季節を避けて受けるのがおすすめ。"}, {"id": "d-c3-13-2", "ch": "nose", "card": "c3-13", "level": "dr", "q": "鼻の穴のふちと、穴の間の柱の高さの差を直したい人。もともと正面から鼻の穴が見えやすいのも悩み。教材に合う手術と説明は？", "choices": ["鼻柱下降を中心に相談し、鼻孔縁挙上は慎重に決める。鼻柱下降は点滴で眠る麻酔で、耳にも小さな傷", "鼻孔縁挙上を中心に相談し、鼻柱下降は慎重に決める。鼻柱下降は起きたままの麻酔で、傷は柱だけ", "鼻柱下降を中心に相談し、鼻孔縁挙上は慎重に決める。鼻柱下降は起きたままの麻酔で、傷は柱だけ", "鼻孔縁挙上を中心に相談し、鼻柱下降は慎重に決める。鼻柱下降は点滴で眠る麻酔で、耳にも小さな傷"], "answer": 0, "explain": "高さの差は、ふちを上げる鼻孔縁挙上か柱を下げる鼻柱下降で直す。もともと穴が見えやすい人は、鼻孔縁挙上で穴がさらに目立つ方向に変わるため慎重に決めるとされる（一般知識）。鼻柱下降は静脈＋笑気＋局所で、耳から軟骨を採るので耳にも小さな傷。×鼻孔縁挙上を中心：穴が目立つ方向。×起きたまま・柱だけ：眠る麻酔で、耳にも傷。", "basis": "もともと正面から鼻の穴が見えやすい人は、さらに穴が目立つ方向に変わるため慎重に決める必要があるとされる"}, {"id": "a-c3-14-1", "ch": "nose", "card": "c3-14", "level": "apply", "q": "人中短縮と貴族手術を同じ日に受けたい人へ。教材の説明に合う案内は？", "choices": ["どちらも鼻先が上を向きやすいので、鼻中隔延長も検討する", "2つは同時にはできないので、期間をあけて別々の日に受ける", "どちらも小鼻が横に広がりやすいので、小鼻縮小も検討する", "どちらも鼻の高さが変わるので、隆鼻術も合わせて検討する"], "answer": 2, "explain": "貴族手術のページは、人中短縮も貴族手術も術後に小鼻が横に広がりやすいとし、同時に受けるなら小鼻縮小も一緒に（または後から）検討するようすすめている。2つは同時にできる。貴族手術で鼻先が上を向くことは基本的に起こらず、鼻の外に入れるので鼻の高さも変わらない。", "basis": "人中短縮も貴族手術も、術後に小鼻が横に広がりやすい"}, {"id": "d-c3-08-2", "ch": "nose", "card": "c3-14", "level": "dr", "q": "鼻の下が長く見えるのが悩みの人。事情があって、点滴で眠る麻酔は使えない。顔の正面に小さな傷ができるのはかまわない。教材に合う受け方は？", "choices": ["猫手術だけを受け、柱の根元に耳の軟骨を入れて前に出す", "猫手術と人中短縮を併用し、両方から鼻の下を短くする", "人中短縮と貴族手術を同じ日に受け、口元もまとめて整える", "人中短縮だけを受け、鼻の下の皮膚を切り取って縫い縮める"], "answer": 3, "explain": "人中短縮は笑気＋局所の眠らない麻酔で受けられ、鼻の下の皮膚を切り取って実際に短くする（顔の正面に傷ができる）。猫手術は静脈麻酔を使うので、単独でも人中短縮との併用でも条件に合わない。貴族手術も静脈麻酔を使い、人中短縮と同時にできるが、ねらいはほうれい線。", "basis": "笑気麻酔でリラックスしたあと、局所麻酔"}, {"id": "a-map-4-1", "ch": "lift", "card": "map-4", "level": "apply", "q": "診察で「頬の脂肪が下がって、ほうれい線が目立つ」と言われた人が、「ヒアルロン酸で埋めたい」と希望。教材の考え方に合う説明は？", "choices": ["ヒアルロン酸で持ち上げれば、下がった頬の位置も元に戻る", "下がったなら引き上げる。垂れた所に足すと重みで下がりうる", "糸リフトも糸を足すので、ヒアルロン酸と同じ「足す」の施術", "下がった脂肪は減らすのが合うので、メーラー除去が先になる"], "answer": 1, "explain": "原因が「下がった」なら④引き上げる、「へこんだ」なら②足す。ヒアルロン酸が得意なのはへこみで、垂れたたるみに入れると重みでかえって下がったり顔が大きく見えたりしやすい。他：足しても位置は戻らない／糸リフトは分類図で④／減らすのは「多い」ときだけで、下がった頬は上に戻すミッドフェイスリフト。", "basis": "原因が「下がった」なら引き上げる、「へこんだ」なら足すのが合います"}, {"id": "a-map-4-2", "ch": "lift", "card": "map-4", "level": "apply", "q": "顔の脂肪の地図で、4つの部屋のうち1つだけ「深い脂肪」とされるものと、その取り方の組み合わせとして正しいものは？", "choices": ["バッカルファット：口角の内側から管で吸う", "バッカルファット：口の中を切り、引っぱり出す", "メーラーファット：口角の内側から管で吸う", "あご下の脂肪：皮膚を数ミリ切り、管で吸う"], "answer": 1, "explain": "地図で「深い脂肪」はバッカルだけ。筋肉や膜の奥にあるので、管で吸うのではなく口の中を小さく切って引っぱり出す。管で吸うのはメーラー、皮膚を数ミリ切って吸うのはあご下の脂肪吸引で、どちらも浅い脂肪。", "basis": "この図の「深い脂肪」はバッカルだけを指します"}, {"id": "a-c4-01-1", "ch": "lift", "card": "c4-01", "level": "apply", "q": "先日デイズで頬のこけに脂肪注入を受けた人が「思ったより減った。同じ場所にすぐ足したい」と相談。教材に沿った案内は？", "choices": ["残るのは入れた量の全部なので、減ったのは失敗", "ヒアルロン酸と同じく、一度溶かしてから入れ直す", "定着しなかった分の吸収で、再施術は原則半年以降", "同じ場所なら、間をあけずに足し直すのがよい"], "answer": 2, "explain": "残るのは入れた量の30〜70％で、定着しなかった脂肪は分解・吸収されて体の外に出るとサイトは説明する。同じ場所にすぐ入れ直すのはすすめられておらず、再施術は原則として半年以降。他：全部は残らない／脂肪注入は溶かして元に戻す方法ができない／同じ場所への早い入れ直しはすすめられていない。※減る時期の目安（1か月ほどで吸収）は教材の＊一般知識。", "basis": "定着しなかった脂肪は分解・吸収されて体の外に出る"}, {"id": "a-c4-01-2", "ch": "lift", "card": "c4-01", "level": "apply", "q": "「頬のこけに、脂肪注入だけを受けたい」という人。2院の料金表に沿った案内として、教材に合うものは？", "choices": ["あおなぎで受けられ、静脈麻酔込みの総額1本で分かりやすい", "デイズで受けられ、頬の「注入部位」の料金だけで済む", "どちらの院も、目の下のクマ取りとのセットでしか受けられない", "デイズで受けられ、「採取・作成」と「注入部位」の両方がかかる"], "answer": 3, "explain": "デイズの脂肪注入は2段がまえで、「採取・作成」（脂肪を取って加工する：コンデンスリッチかナノリッチ）と「注入部位」（入れる場所ごと）の両方がかかる。あおなぎには脂肪注入だけのメニューがなく、目の下のクマ取り（脱脂・裏ハムラ）とのセット2種類のみ。他：あおなぎでは単独で受けられない／採取・作成もかかる／デイズは単独で受けられる。", "basis": "料金は「採取・作成」＋「注入部位」の2段がまえ"}, {"id": "d-c4-01-2", "ch": "lift", "card": "c4-01", "level": "dr", "q": "1年前にデイズでほうれい線へ脂肪注入を受けた。今回はこめかみに入れたい。費用はモニター価格で考えている。合う案内は？", "choices": ["作成（モニター¥155,000〜）とこめかみ¥125,000の両方がかかる。モニターになれるかはカウンセラーが審査して決める", "こめかみのモニター¥125,000だけがかかる。モニターになれるかは医師が診察と審査で決める", "作成（モニター¥155,000〜）とこめかみ¥125,000の両方がかかる。モニターになれるかは医師が診察と審査で決める", "こめかみのモニター¥125,000だけがかかる。モニターになれるかはカウンセラーが審査して決める"], "answer": 2, "explain": "デイズの脂肪注入は2段がまえで、脂肪の採取・作成（コンデンスリッチのモニター¥155,000など）と注入部位（こめかみのモニター¥125,000）の両方がかかる。モニターになれるかは医師の診察・審査で決まる。デイズのカウンセラーは悩みや要望を聞く役。×部位の料金だけ：採取・作成の料金もかかる／×カウンセラーが審査。", "basis": "料金表は2段がまえ。A（脂肪を取って加工する料金）とB（入れる場所ごとの料金）の両方がかかる。"}, {"id": "a-c4-02-1", "ch": "lift", "card": "c4-02", "level": "apply", "q": "顔の脂肪が原因で頬〜あご下が大きく見える。近く行事があり、1回で済ませてくり返し通うのは避けたい。固定や圧迫のバンドで目立つのも避けたい。合うのは？", "choices": ["脂肪吸引注射", "脂肪溶解注射", "顔の脂肪吸引", "ウルトラセルZi（リニア）"], "answer": 0, "explain": "脂肪吸引注射は1回・約20分で、圧迫バンドがいらない。効果をすぐ実感でき、行事の前にも間に合わせやすいとサイトも説明している。他：溶解注射は3〜6回通う／顔の脂肪吸引は数日の固定バンドが必要／HIFUは3か月ごとにくり返す前提。", "basis": "圧迫バンドがいらないので、仕事を休まない人も多い"}, {"id": "d-c4-02-3", "ch": "lift", "card": "c4-02", "level": "dr", "q": "二重あごの脂肪を減らしたい。「通院は1回だけにしたい。そのうえで、なるべく安く」。合う案内は？", "choices": ["脂肪吸引注射。モニター¥49,800の条件は撮影・掲載・アンケートへの協力で、1回の通院で受けられる", "脂肪吸引注射。モニター¥49,800の条件には施術によって複数回の来院も入るので、通常¥69,800も考える", "脂肪溶解注射のBNLS アルティメット¥5,000。1ccあたりの料金で、1回の注射で減らしきれる", "顔の脂肪吸引の顎下1部位モニター¥98,000。1回で終わり、術後の固定バンドもいらない"], "answer": 1, "explain": "1回・約20分で終わり、圧迫バンドもいらないのは脂肪吸引注射。ただしモニターの条件は4つあり、撮影・掲載・アンケートのほかに「施術内容によっては2回以上来院できる」がある。×条件は3つ：来院の条件が抜けている／×溶解注射：回数を重ねて減らす施術／×顔の脂肪吸引：数日は固定バンドが必要。", "basis": "1回・約20分で終わる。圧迫バンドがいらないので、仕事を休まない人も多い。"}, {"id": "a-c4-03-1", "ch": "lift", "card": "c4-03", "level": "apply", "q": "あご下とエラ下の皮下脂肪が多く、二重あごが悩み。1回で確実にまとめて減らしたい。数日の固定バンドは気にしない。合う施術は？", "choices": ["脂肪溶解注射", "ペリカン手術", "顔の脂肪吸引", "バッカルファット除去"], "answer": 2, "explain": "顔の脂肪吸引は管で皮下脂肪を吸い出し、細胞の数を減らすので1回で終わり、リバウンドしにくい。二重あごにはあご下とエラ下の脂肪を取る。他：溶解注射は3〜6回くり返す／ペリカン手術は脂肪ではなく首の筋肉のゆるみを締める／バッカルは頬の奥の深い脂肪。", "basis": "1回で確実に変えたい"}, {"id": "d-c4-03-2", "ch": "lift", "card": "c4-03", "level": "dr", "q": "エラは奥歯をかみしめると硬くふくらみ、骨格ではないと診断された。エラの下の輪郭には、指でつまめる脂肪ものっている。デイズで、ボトックスは韓国製の薬にしたい。組み方と術後の案内で合うものは？", "choices": ["エラはボツラックスのエラ（普通）¥28,000。エラ下の脂肪は顔の脂肪吸引で取り、数日は固定バンドで押さえる", "エラはボツラックスのエラ（普通）¥9,800。エラ下の脂肪は顔の脂肪吸引で取り、数日は固定バンドで押さえる", "エラはボツラックスのエラ（普通）¥28,000。エラ下の脂肪は顔の脂肪吸引で取り、固定バンドなしで過ごせる", "エラはボツラックスのエラ（普通）¥9,800。エラ下の脂肪は顔の脂肪吸引で取り、固定バンドなしで過ごせる"], "answer": 1, "explain": "かむ筋肉の張りによるエラはボトックスで、韓国製のボツラックスはエラ（普通）¥9,800（¥28,000は米国製アラガンの料金）。エラ下は顔の脂肪吸引の部位の1つで、腫れ・内出血が1〜2週間、数日は固定バンドが必要。×バンドなし：それは脂肪吸引注射の特徴。", "basis": "腫れ・内出血が1〜2週間。数日は固定バンドも必要で、まわりに気づかれやすい期間がある。"}, {"id": "d-c4-09-3", "ch": "lift", "card": "c4-03", "level": "dr", "q": "頬〜あご下のたるみに加え、皮下脂肪がとても厚い。院はあおなぎで、脂肪を減らしてから糸で上げたい。費用の見方として合うものは？", "choices": ["「顎下／エラ下／頬」¥98,000と糸リフト6本¥69,800。どちらの料金にも、眠る静脈麻酔まで含まれる", "「顎下／エラ下／頬」¥98,000と糸リフト6本¥69,800。吸引の料金に静脈麻酔が含まれるかは読み取れない", "「顎下／エラ下／頬」¥98,000と糸リフト6本¥69,800。1部位ごとの料金かと、糸の保証期間は読み取れない", "脂肪は切らない脂肪吸引注射¥49,800で減らし、糸リフト6本¥69,800で引き上げる。どちらも総額"], "answer": 2, "explain": "厚い皮下脂肪は先に顔の脂肪吸引。あおなぎの項目名は「顎下／エラ下／頬」（静脈麻酔込み）¥98,000で、1部位ごとかは読み取れない。糸の6本セットは種類・麻酔・保証期間が記載なし。×糸も静脈込み：糸の麻酔は記載なし／×静脈込みか不明：静脈麻酔込みと書かれている／×吸引注射：あおなぎは取り扱いなし。", "basis": "1部位ごとの料金か、まとめての料金かは、サイトの表記からは読み取れない"}, {"id": "a-c4-04-1", "ch": "lift", "card": "c4-04", "level": "apply", "q": "授乳中のお客様が「切らずに、頬の脂肪を少しずつ減らしたい」と希望。教材の記載に沿った案内は？", "choices": ["授乳が終わってから、脂肪溶解注射を検討する", "注入後48時間授乳をやめて、脂肪溶解注射を受ける", "薬をカベリンに変えて、授乳中に溶解注射を受ける", "脂肪を減らす目的で、ヒアルロン酸注射を受ける"], "answer": 0, "explain": "脂肪溶解注射は、妊娠中・授乳中・妊娠の可能性がある人は受けられないので、授乳が終わってから検討する。他：「注入後48時間は授乳をやめる」はヒアルロン酸注射の条件／カベリンも同じ脂肪溶解注射の薬で、条件は変わらない／ヒアルロン酸は「② 足す」施術で、脂肪は減らない。", "basis": "妊娠中・授乳中、妊娠の可能性がある人"}, {"id": "d-c4-04-3", "ch": "lift", "card": "c4-04", "level": "dr", "q": "エラはボトックス、あご下は脂肪溶解注射を考えている。「国に承認された薬かどうかを知ってから決めたい」。薬の説明として合うものは？", "choices": ["アラガンは厚生労働省の承認あり。溶解注射のBNLS アルティメットとカベリンは、どちらも国内未承認", "アラガンは韓国製で、韓国の当局の承認。溶解注射のBNLS アルティメットとカベリンは、どちらも国内未承認", "アラガンは厚生労働省の承認あり。溶解注射はカベリンだけが国内で承認され、BNLS アルティメットは未承認", "アラガンは韓国製で、韓国の当局の承認。溶解注射はカベリンだけが国内で承認され、BNLS アルティメットは未承認"], "answer": 0, "explain": "ボトックスのアラガン（ボトックスビスタ）は米国製で、厚生労働省にも承認されている。韓国製で韓国の当局に承認されているのはボツラックス。脂肪溶解注射の2つの薬は、どちらも国内未承認薬とサイトに明記されている。なお国内で承認されたボトックスの使い道は眉間と目尻のしわ（＊一般知識）。×カベリンだけ承認：どちらも未承認／×アラガンは韓国製：それはボツラックス。", "basis": "どちらも国内未承認薬とサイトに明記されている"}, {"id": "a-c4-05-1", "ch": "lift", "card": "c4-05", "level": "apply", "q": "口角から下へのびる線（マリオネットライン）が目立ち、以前に小顔注射を受けたが効果がなかった。顔の表面には傷を作りたくない。合う施術は？", "choices": ["脂肪溶解注射の回数を増やす", "メーラーファット除去", "ジョールファット除去", "バッカルファット除去"], "answer": 2, "explain": "口角から下への線と「小顔注射では効果がなかった」は、ジョールファット除去の向いている人そのもの。口角の内側を約5mm切るので顔に傷が出ない。他：溶解注射は口の横に垂れた脂肪に効果が現れにくい／メーラーは頬の上でほうれい線向け／バッカルは頬の奥で丸顔・フェイスライン全体向け。", "basis": "小顔注射では効果がなかった"}, {"id": "d-c4-05-1", "ch": "lift", "card": "c4-05", "level": "dr", "q": "口の横のもたつきは脂肪が原因と診断された。「翌日も出勤する。固定バンドを何日もつけるのは無理」。毎日タバコを吸う。合う施術と術後の案内は？", "choices": ["ジョールファット除去。顔の脂肪吸引のような数日の固定はいらず、タバコは1か月控える", "ジョールファット除去。圧迫は術後20〜30分ほどで、タバコは1週間控える", "脂肪溶解注射を口の横に。翌日から仕事に行け、回数を重ねて減らしていく", "顔の脂肪吸引のジョール部位。外から管で吸い、固定バンドは術後20〜30分で外せる"], "answer": 0, "explain": "ジョールファット除去は口の中から取り、バンドで押さえるのは術後20〜30分の安静のあいだで、翌日出勤する人が多い。タバコは回復を遅らせ感染のおそれもあるので1か月控える。×溶解注射：口の横に垂れた脂肪は顔痩せ注射で効果が出にくい／×1週間：1か月／×顔の脂肪吸引：数日は固定バンド。", "basis": "血の流れが悪くなって回復が長引き、感染のおそれもあるので、1か月は控える"}, {"id": "a-c4-06-1", "ch": "lift", "card": "c4-06", "level": "apply", "q": "「ほうれい線が気になる」というお客様。診察で、頬の脂肪の量は多くなく、位置が下がって目の下がくぼんで見えると言われた。教材の考え方に合う施術は？", "choices": ["メーラーファット除去", "バッカルファット除去", "脂肪溶解注射", "ミッドフェイスリフト"], "answer": 3, "explain": "頬の上の脂肪は、多いなら減らす、下がったなら上へ戻す、減ったなら足す、と向きが分かれる。位置が下がって目の下がくぼむなら、脂肪を上に戻して留めるミッドフェイスリフト。他：メーラー除去は量が多い人向け／バッカルは頬の奥の脂肪／溶解注射も減らす施術。", "basis": "脂肪の位置が下がり、目の下がくぼんで見える"}, {"id": "d-c4-06-2", "ch": "lift", "card": "c4-06", "level": "dr", "q": "笑うと頬の上がふくらみ、ほうれい線も濃く見える。デイズで脂肪を取りたい。「あとで左右差が出たときのことも知りたい」。合う案内は？", "choices": ["メーラーファット除去。口角の内側から細い管で吸う。明らかな左右差は1年の保証の対象", "メーラーファット除去。口角の内側から細い管で吸う。明らかな左右差は1か月の保証の対象", "ジョールファット除去。口角の内側を切って取る。明らかな左右差は1か月の保証の対象", "ジョールファット除去。口角の内側を切って取る。明らかな左右差は1年の保証の対象"], "answer": 1, "explain": "笑ったときの頬のふくらみ・ほうれい線の上の脂肪はメーラーで、口角の内側から管で吸う。デイズの保証は、ファット除去3種と顔の脂肪吸引・糸リフトが1か月（凹凸・不整・明らかな左右差、医師が必要と判断した場合）。×ジョール：口の横の脂肪／×1年：体の脂肪吸引や二重切開などの期間。", "basis": "頬の高い位置に脂肪が多く、笑うとふくらむ"}, {"id": "a-c4-07-1", "ch": "lift", "card": "c4-07", "level": "apply", "q": "50代でたるみが強い人が「頬の奥のバッカルファットを取って細くしたい」と希望。教材に沿った説明は？", "choices": ["顔の表面を切るので傷あとが残る", "取ると余計にたるむことがある", "1回では終わらず3〜6回かかる", "取った脂肪は1年ほどで再生する"], "answer": 1, "explain": "バッカルファット除去は、たるみが強い人や原因がバッカル以外にある人では「余計にたるんでしまうケースもある」とサイトが明記。おすすめはたるみが目立つ前の20〜30代。他：切るのは口の中だけで顔に傷は出ない／1回で終わる／取った脂肪は再生しない。", "basis": "余計にたるんでしまうケースもある"}, {"id": "a-c4-07-2", "ch": "lift", "card": "c4-07", "level": "apply", "q": "デイズでバッカルファット除去を受けて3週間。「左右差が気になる。すぐ取り直したい」という相談。保証制度に沿った案内は？", "choices": ["保証は1年あり、再施術は原則1か月以降に受けられる", "保証は一生涯なので、再施術はいつでも受けられる", "保証の対象外なので、3か月あけてから有料で受ける", "保証は1か月で対象になりうるが、再施術は原則半年以降"], "answer": 3, "explain": "デイズの保証制度で、バッカル・メーラー・ジョールファット除去は1か月（凹凸・不整・明らかな左右差）。再施術は目元以外は原則として半年以降。他：1年・1か月以降は目元の手術の考え方／一生涯は豊胸のしこりの保証／3か月あけるのは糸リフトのやり直し。", "basis": "再施術は原則として半年以降"}, {"id": "d-c4-02-1", "ch": "lift", "card": "c4-07", "level": "dr", "q": "口の横のもたつきは診察で脂肪が多いためと分かり、頬にもはっきりたるみがある。「眠った状態で受けたい。友人がよかったと言うバッカルファット除去も一緒に」。合う案内は？", "choices": ["ジョールとバッカルを両方取る。あおなぎはジョール¥98,000とバッカル¥148,000で、どちらも静脈麻酔込み", "ジョールだけを取る。あおなぎにはジョールの行がないので、デイズのモニター¥98,000に静脈麻酔を足す", "ジョールとバッカルを両方取る。デイズで眠るなら、静脈麻酔¥50,000が別にかかるかを院に確認する", "ジョールだけを取る。あおなぎのジョール¥98,000は、眠るための静脈麻酔まで含んだ総額になる"], "answer": 3, "explain": "バッカルは、たるみが強い人が取ると余計にたるむことがあるので、頬にたるみのある人には併用しない。口の横の脂肪はジョール。あおなぎにもジョールファットの行があり、静脈麻酔込みの総額¥98,000。×あおなぎに行がない：ジョールファット¥98,000がある／×併用の2つ：料金や確認の話は合っていても、バッカルが逆効果。", "basis": "たるみが強い人や、たるみの原因がバッカルファット以外にある人は、取ると余計にたるむことがある"}, {"id": "d-c4-07-1", "ch": "lift", "card": "c4-07", "level": "dr", "q": "頬の上のふくらみと丸顔が気になる20代。メーラーとバッカルを一緒に、あおなぎで眠って受けたい。費用と、休みを考えるときの参考の説明として合うものは？", "choices": ["あおなぎはメーラー¥148,000とバッカル¥128,000で静脈麻酔込み。ダウンタイムはデイズのサイトでメーラー2週間ほど・バッカル1週間ほど", "あおなぎはメーラー¥128,000とバッカル¥148,000に静脈麻酔¥50,000が加わる。ダウンタイムはデイズのサイトでメーラー2週間ほど・バッカル1週間ほど", "あおなぎはメーラー¥128,000とバッカル¥148,000で静脈麻酔込み。ダウンタイムはデイズのサイトでメーラー2週間ほど・バッカル1週間ほど", "あおなぎはメーラー¥128,000とバッカル¥148,000で静脈麻酔込み。ダウンタイムはデイズのサイトでメーラー1週間ほど・バッカル2週間ほど"], "answer": 2, "explain": "あおなぎはメーラー¥128,000・バッカル¥148,000で、静脈麻酔込みの総額。あおなぎは詳細ページが準備中でダウンタイムの記載がないので、目安はデイズのサイト（メーラー2週間ほど・バッカル1週間ほど）で見る。×料金の入れ替え／×静脈麻酔が加わる：総額表示／×期間の入れ替え。", "basis": "赤み・内出血・頭痛・だるさ・頬がこけるなどの症状が1週間ほど（時間とともに消えていく）。"}, {"id": "d-map-4-3", "ch": "lift", "card": "c4-07", "level": "dr", "q": "45歳。頬のたるみがあり、丸顔も気になる。「あおなぎでバッカルファット除去を受けたい」。来院前の案内として合うものは？", "choices": ["カウンセラーが希望と適応を判断し、合うとされればバッカル¥148,000（静脈麻酔込み）に進む", "医師が合わないと判断して見送った場合は、診察料がかかる。代わりの案は糸リフト6本¥69,800", "医師が適応を判断し、合わなくても費用はかからない。糸リフト6本¥69,800で引き上げる案もある", "バッカルのおすすめは40〜50代なので45歳は向く。あおなぎなら¥148,000で静脈麻酔込み"], "answer": 2, "explain": "あおなぎはカウンセラーがおらず、医師が適応を判断する。合わない場合も本人が見送った場合も無料（基礎編「デイズとあおなぎ」）。バッカルのおすすめは20〜30代で、たるみが強いと余計にたるむので引き上げも候補。×カウンセラー：あおなぎにはいない／×診察料：かからない／×40〜50代：20〜30代。", "basis": "サイトのおすすめは、たるみが目立つ前の20〜30代。"}, {"id": "a-map-4b-1", "ch": "lift", "card": "map-4b", "level": "apply", "q": "60代。フェイスラインから首にかけて、皮膚そのものが大きく余って垂れている。たるみ治療の「はしご」の各段について、教材に合うものは？", "choices": ["HIFUはSMASを縮めるので、余った皮膚の量も減らせる", "糸リフトも強い糸を選べば、余った皮膚を減らせる", "ソフウェーブで真皮を温めれば、余った皮膚も縮みきる", "3段目までの施術は、どれも余った皮膚を切り取らない"], "answer": 3, "explain": "余った皮膚を切り取れるのは4段目の切開リフトだけ。3段目のペリカン手術・ミッドフェイスリフトも皮膚は切り取らない。他：機械も糸も皮膚の量は減らせない／糸では余った皮膚を減らせず、強いたるみは期待に届きにくい／浅い層を温めるだけでは期待に届きにくい。", "basis": "余った皮膚を切り取れるのは切開リフトだけ"}, {"id": "a-c4-08-1", "ch": "lift", "card": "c4-08", "level": "apply", "q": "目の下のクマも、頬のたるみも両方気になる。ヒアルロン酸は長続きしないと感じている。教材に出てくる受け方で合うのは？", "choices": ["ミッドフェイスリフト単独", "メーラーファット除去＋糸リフト", "ペリカン手術＋脂肪注入", "表ハムラ法＋ミッドフェイスリフト"], "answer": 3, "explain": "ミッドフェイスリフトの受け方は2つ。クマも頬のたるみも気になる人は表ハムラ法との同時、クマが気にならない人は単独。同時の場合はまつ毛のすぐ下を切り、後日抜糸がある。他：メーラー除去は減らす施術で向きが逆／ペリカン手術はあご下が対象。", "basis": "目の下のクマも頬のたるみも気になる人向け"}, {"id": "a-c4-08-2", "ch": "lift", "card": "c4-08", "level": "apply", "q": "ミッドフェイスリフトについて、誤っているものは？", "choices": ["まぶたの裏から入る方法は抜糸がいらない", "白目が2〜3週間赤くなることがある", "麻酔は笑気＋局所で、眠らずに受ける", "前に出ていた眼窩脂肪も、へこみへ移す"], "answer": 2, "explain": "ミッドフェイスリフトは、静脈麻酔で眠ってから局所麻酔を足す（眠った状態で受ける、180分程度）。笑気＋局所で眠らずに受けるのは糸リフトなど。他の3つは記載どおり（結膜から入れば抜糸不要、白目の充血は2〜3週間、眼窩脂肪とメーラーファットをへこみへ移す）。", "basis": "静脈麻酔で眠ってから、局所麻酔を足す"}, {"id": "d-c4-06-1", "ch": "lift", "card": "c4-08", "level": "dr", "q": "頬の脂肪が下にずれて、目の下〜頬にへこみが出ている。目の下のふくらみ（クマ）の悩みはない。注入や糸は前に試したが、もちが短かった。「眠って受けたい。顔の表に切った傷は残したくない。休みは3週間まで」。合うものは？", "choices": ["表ハムラ法と同時のミッドフェイスリフト。まぶたの裏から入り、静脈麻酔＋局所で眠って受け、抜糸はいらない", "ミッドフェイスリフトを単独で。まぶたの裏から入り、静脈麻酔＋局所で眠って受け、抜糸はいらない", "こめかみリフトで、目の下〜頬のへこみを引き上げる。まぶたは切らず、休みは3週間以内で済む", "フェイスリフトで、頬の奥の膜ごと引き上げる。まぶたは切らず、休みは3週間以内で済む"], "answer": 1, "explain": "下がった頬の脂肪を上に戻すのはミッドフェイスリフト。クマの悩みがなければ単独で受け、まぶたの裏から入るので抜糸はいらない。麻酔は静脈麻酔＋局所。×表ハムラと同時：まつ毛のすぐ下を切り、後日抜糸がある／×こめかみリフト：ねらいは目元〜こめかみ／×切開リフト：腫れは3〜4週間。", "basis": "ミッドフェイスリフト単独：クマは気にならないが、頬のたるみ・ほうれい線を若返らせたい人向け。"}, {"id": "a-c4-09-1", "ch": "lift", "card": "c4-09", "level": "apply", "q": "フェイスラインの糸リフトを左右3本ずつ考えているお客様。「もちの長い糸を比べて選びたい」という希望への案内として、教材に合うものは？", "choices": ["あおなぎのセットは、本数ごとに糸の種類が決まっている", "デイズも本数セットの総額で、糸の種類は医師まかせ", "あおなぎのモニター価格なら、糸の種類を選んで受けられる", "デイズの糸の表で、もちと引き上げる力を比べて選ぶ"], "answer": 3, "explain": "デイズは糸を5種類から選び、1本ごとに料金がかかる。サイトの表に素材・引き上げる力・もちが載っているので、比べて選べる。他：あおなぎは6本・8本・10本のセット料金で、糸の種類の説明はまだない／デイズは本数セットではなく1本ごと／あおなぎにモニター価格の掲載はない（基礎編）。", "basis": "糸を5種類から選び、1本ごとに料金がかかる"}, {"id": "d-c4-04-2", "ch": "lift", "card": "c4-09", "level": "dr", "q": "口の横〜フェイスラインがもたついて見える。診察で、口の横の脂肪は多くなく、頬の組織が下がったためと言われた。頬はすでにこけぎみ。合う施術は？", "choices": ["ミッドフェイスリフトで、下がった頬の脂肪を上に戻す。ねらいは口の横〜フェイスライン", "ペリカン手術で、ゆるんだ首の筋肉を締め、口の横〜フェイスラインを引き上げる", "糸リフトで、下がった頬〜フェイスラインを引き上げる。切らずに、傷は針穴だけ", "HIFUのリニアで、口の横〜フェイスラインを線で打ち、下がった組織を引き上げる"], "answer": 2, "explain": "原因が「下がった」なら引き上げる。糸リフトは頬やあごのたるみ・口の横の線に向き、切らずに引き上げる。×ミッドフェイスリフト：ねらいは目の下〜頬／×ペリカン手術：あご下〜首まわりが対象／×リニア：ねらいは二重あご・小顔で、脂肪がつきやすい所向け（引き上げはドット）。", "basis": "頬やあごのたるみ、ほうれい線・口の横の線（マリオネットライン）が気になる人"}, {"id": "d-c4-09-1", "ch": "lift", "card": "c4-09", "level": "dr", "q": "糸リフトでフェイスラインを上げたい。「2年近くはもたせたい。費用はモニターで、6本くらい」。案内として合うものは？", "choices": ["アルテミスストロングをモニター1本¥52,800で6本。モニター価格はあおなぎでも同じ条件で選べる", "あおなぎの糸リフト6本¥69,800。糸の種類はアルテミスストロングを選べ、2年近くもつ見込み", "アルテミスストロングをモニター1本¥52,800で4本。フェイスラインは左右2本ずつが目安", "アルテミスストロングをモニター1本¥52,800で6本。フェイスラインは左右3本ずつが目安"], "answer": 3, "explain": "約2年もつのはPLLAのアルテミスストロング（モニター1本¥52,800）。本数の目安はフェイスラインで左右3本ずつ。×4本・左右2本ずつ：目安は左右3本ずつ／×あおなぎで種類を選ぶ：糸の種類はサイトに記載なし／×あおなぎのモニター：あおなぎはモニター価格の掲載がない。", "basis": "本数の目安：フェイスライン・ほうれい線は左右3本ずつ、二重あごは2〜3本。"}, {"id": "d-c4-09-2", "ch": "lift", "card": "c4-09", "level": "dr", "q": "デイズで糸リフトを受けて3週間。凹凸や左右差はないが「思ったほど上がらない」。診察では皮下脂肪がとても厚い。合う案内は？", "choices": ["引き上げ効果の有無は保証の対象外。皮下脂肪は、先に顔の脂肪吸引で減らしてから糸を考える", "上がり不足も1か月以内なら保証の対象。皮下脂肪は、先に顔の脂肪吸引で減らしてから糸を考える", "引き上げ効果の有無は保証の対象外。皮下脂肪は減らさずに、糸の本数を増やして引き上げを足す", "上がり不足も1か月以内なら保証の対象。皮下脂肪は減らさずに、糸の本数を増やして引き上げを足す"], "answer": 0, "explain": "糸リフトの保証は1か月で、対象は凹凸・不整・明らかな左右差。引き上げ効果の有無は保証しない。皮下脂肪がとても厚いと糸では引き上がりにくく、先に顔の脂肪吸引を考える。×上がり不足も保証：対象外／×本数を増やす：厚い脂肪はそのままでは引き上がりにくい。", "basis": "その場合は切開リフトや、先に顔の脂肪吸引を考える。"}, {"id": "a-c4-10-1", "ch": "lift", "card": "c4-10", "level": "apply", "q": "二重あごが悩み。あご下に縦の「とさか」のようなスジが出て、HIFUも糸リフトも効果がなかった。教材で「次の段」として挙げられているのは？", "choices": ["顔の脂肪吸引（顎下）", "ペリカン手術", "脂肪溶解注射", "ミッドフェイスリフト"], "answer": 1, "explain": "ペリカン手術は、ゆるんだ首の筋肉（広頸筋）を中央に寄せて縫う手術。「HIFUや糸リフトで効果が得られなかった方」「とさかのようなスジ」が対象に挙がる。他：脂肪吸引・溶解注射は皮下脂肪を減らすだけで筋肉は締まらない／ミッドフェイスリフトは目の下〜頬が対象。", "basis": "HIFUや糸リフトで効果が得られなかった方"}, {"id": "a-c4-10-2", "ch": "lift", "card": "c4-10", "level": "apply", "q": "ペリカン手術の術後について、誤っているものは？", "choices": ["ドレーンは7日目の抜糸と同時に抜く", "あご下はフェイスバンドで固定する", "抜糸の翌日から顔全体のメイクができる", "飲酒は1週間、ぬり薬は抜糸まで朝晩"], "answer": 0, "explain": "ドレーン（血や液を外に出す細い管）は翌日、液が多ければ翌々日に抜く。入っている間は洗髪・洗顔ができない。7日目の抜糸とは別。他の3つは記載どおり（フェイスバンドで固定、抜糸の翌日から傷を含めた顔全体のメイク可、飲酒は1週間控え、ぬり薬は抜糸まで朝晩2回）。", "basis": "翌日（液が多ければ翌々日）に抜く"}, {"id": "d-c4-10-1", "ch": "lift", "card": "c4-10", "level": "dr", "q": "ペリカン手術と、顎下の顔の脂肪吸引を同じ日に受ける。術後に通う日と、保証の扱いの説明として合うものは？", "choices": ["ドレーンを抜く翌日〜翌々日と、7日目の抜糸に通う。保証の一覧にあるのは顔の脂肪吸引の1か月", "ドレーンは7日目の抜糸と同じ日にまとめて抜く。保証の一覧にあるのは顔の脂肪吸引の1か月だけ", "ドレーンを抜く翌日〜翌々日と、7日目の抜糸に通う。保証はどちらの施術も一覧に記載がない", "ドレーンは7日目の抜糸と同じ日にまとめて抜く。保証はどちらの施術も一覧に記載がない"], "answer": 0, "explain": "ドレーンは翌日（液が多ければ翌々日）に抜き、入っている間は洗髪・洗顔ができない。抜糸は7日目。デイズの保証の一覧には顔の脂肪吸引（1か月）があり、ペリカン手術は載っていない。×7日目に抜く：抜くのは翌日〜翌々日／×どちらも記載なし：顔の脂肪吸引は1か月と書かれている。", "basis": "翌日（液が多ければ翌々日）に抜く。入っている間は洗髪・洗顔ができない"}, {"id": "d-c4-10-2", "ch": "lift", "card": "c4-10", "level": "dr", "q": "あご下に縦のスジが出ていて、そのうえ指でつまめる脂肪も厚い。デイズで受けたい。施術と費用の案内として合うものは？", "choices": ["顔の脂肪吸引だけを顎下1部位¥175,000で。縦のスジも皮下脂肪なので、吸えば一緒に消える", "ペリカン手術¥300,000と、顎下の顔の脂肪吸引を組む。脂肪吸引は1部位モニター¥128,000", "ペリカン手術¥300,000と、顎下の顔の脂肪吸引を組む。脂肪吸引は1部位モニター¥98,000", "ペリカン手術¥150,000と、顎下の顔の脂肪吸引を組む。同時に受けるときの料金はサイトに記載なし"], "answer": 2, "explain": "縦のスジが出るあご下はペリカン手術（¥300,000）の対象で、つまめる皮下脂肪は顔の脂肪吸引（1部位 通常¥175,000／モニター¥98,000）。両方が原因なら組み合わせる（同時の料金はサイトに記載なし）。×吸引だけ：スジは脂肪を吸っても消えない／×¥128,000：メーラーのモニター価格／×¥150,000：ミッドフェイスリフトの価格。", "basis": "脂肪が原因なら脂肪吸引、筋肉が原因ならペリカン手術。両方なら組み合わせる"}, {"id": "a-c4-11-1", "ch": "lift", "card": "c4-11", "level": "apply", "q": "50代。フェイスラインから首にかけて皮膚そのものが余って垂れ、糸リフトでは十分な効果を感じなかった。長もちを強く希望。教材で合うのは？", "choices": ["切開リフト", "アルテミスストロングの糸", "ソフウェーブ 250ショット", "ミッドフェイスリフト"], "answer": 0, "explain": "余った皮膚そのものを切り取れるのは切開リフトだけ。効果は5〜10年ほどで、サイトは糸リフトで十分な効果を感じなかった人に向くとしている。他：糸も機械も皮膚の量は減らせない／ミッドフェイスリフトは目の下〜頬が対象で、皮膚は切り取らない。", "basis": "余った皮膚そのものを切り取れる唯一の方法"}, {"id": "d-c4-11-1", "ch": "lift", "card": "c4-11", "level": "dr", "q": "60代。首の皮膚が大きく余って垂れている。「眠っているうちに終わらせたい。モニターで安くなるなら、それがいい」。デイズでの費用の案内として合うものは？", "choices": ["ペリカン手術¥300,000。モニター価格はなく、余った首の皮膚もいっしょに切り取れる", "ネックリフト¥800,000。モニター価格はなく、眠る麻酔の代金が料金に含まれるかはサイトに記載がない", "ネックリフト¥800,000。モニター価格はなく、あおなぎと同じように麻酔代まで込みの総額になる", "ネックリフトはモニター価格¥900,000。眠る麻酔の代金が料金に含まれるかはサイトに記載がない"], "answer": 1, "explain": "首の皮膚が大きく余るなら、皮膚も切り取るネックリフト（¥800,000）。モニター価格があるのはフェイスリフトだけ（¥900,000はフェイスリフトのモニター価格）。デイズはどの麻酔代が施術料金に含まれるかサイトに記載がなく、院に確認する。×ペリカン：余った皮膚は切り取らない／×麻酔代込みの総額：それはあおなぎの見せ方。", "basis": "どこを引き上げるかでメニューが分かれる。モニター価格があるのはフェイスリフトだけ。"}, {"id": "d-c4-11-2", "ch": "lift", "card": "c4-11", "level": "dr", "q": "基礎編「顔の5層」を、表面から①〜⑤の番号で呼ぶ。施術と、手を入れる層の番号の組み合わせとして正しいものは？", "choices": ["フェイスリフトは③を切除し、さらに④も切って留め直す", "ソフウェーブは②を60〜70℃に温めて、ハリを出す", "フェイスリフトは②を切除し、さらに③も切って留め直す", "ミッドフェイスリフトは、下がった脂肪を③に糸で留める"], "answer": 0, "explain": "5層は①皮膚②浅い脂肪③筋肉の膜（SMAS）④靭帯と深い脂肪⑤骨。フェイスリフトはSMASを切除し、靭帯も切って留め直すので③と④。×②と③：1層ずつ浅い／×ソフウェーブ：温めるのは真皮で①／×ミッドフェイス：骨の表面の膜（骨膜）に留めるので⑤。", "basis": "奥の膜（SMAS）を切除し、さらに骨と皮膚をつなぐ柱（靭帯＝リガメント）も切って留め直す"}, {"id": "d-k-layers-3", "ch": "lift", "card": "c4-11", "level": "dr", "q": "顔の5層の番号を使って、デイズのフェイスリフト（切開リフト）で手を入れる層を説明する。教材に合うものは？", "choices": ["②を切除して引き上げ、④は切らずにそのまま留める", "③を切除して引き上げ、④の層も切ってから留め直す", "③を切除して引き上げ、④は切らずにそのまま留める", "②を切除して引き上げ、④の層も切ってから留め直す"], "answer": 1, "explain": "5層は①皮膚 ②浅い脂肪 ③筋肉の膜（SMAS） ④靭帯と深い脂肪 ⑤骨。デイズのフェイスリフトは③の膜を切除し、骨と皮膚をつなぐ④の靭帯も切って留め直す。②は浅い脂肪で、切除するのは膜のほう。同じ③を、切らずに熱で縮めるのがHIFU。", "basis": "奥の膜（SMAS）を切除し、さらに骨と皮膚をつなぐ柱（靭帯＝リガメント）も切って留め直す"}, {"id": "a-c4-12-1", "ch": "lift", "card": "c4-12", "level": "apply", "q": "やせ型で顔の脂肪が少ない。以前HIFUを受けて頬がこけた。小じわとハリが気になり、翌日から普通に仕事をしたい。合う機械は？", "choices": ["ソフウェーブ（全顔）", "ウルトラセルZi（ドット）", "XERF（ディープ）", "ウルトラセルZi（リニア）"], "answer": 0, "explain": "ソフウェーブは浅い真皮だけを温めてハリ・小じわを出す機械で、サイトは「HIFUのあと頬がこけた方」「顔の脂肪が少ない方」にすすめている。他：ドットはSMASを熱して引き上げる打ち方／XERFディープは脂肪のボリュームを減らす効果も期待されるモード／リニアは脂肪にも熱が入る二重あご向け。", "basis": "HIFUのあと頬がこけた方"}, {"id": "a-c4-12-2", "ch": "lift", "card": "c4-12", "level": "apply", "q": "ソフウェーブのしくみの説明で、誤っているものは？", "choices": ["真皮を60〜70℃に温めて、コラーゲンを縮める", "表皮は熱に弱いので、冷やして守りながら打つ", "超音波を1点に集め、奥の筋肉の膜を点で熱する", "深さは約0.5〜2.0mmで、HIFUより浅い所に効く"], "answer": 2, "explain": "ソフウェーブは同じ超音波でも、浅い真皮を広く温めてハリを出す機械。超音波を1点に集めて深い筋肉の膜（SMAS）を点で熱し、引き上げるのはHIFU（ウルトラセルZi）。他の3つはソフウェーブの記載どおり（真皮を60〜70℃、表皮を冷やして守る、深さ約0.5〜2.0mmでHIFUより浅い）。", "basis": "ソフウェーブは浅い真皮を広く温めてハリを出す"}, {"id": "d-c4-12-2", "ch": "lift", "card": "c4-12", "level": "dr", "q": "目元の小じわにはソフウェーブ、フェイスラインの引き上げにはHIFUのドットを使う予定。続けて通う間隔の案内として合うものは？", "choices": ["ソフウェーブは、しわも最初から3〜6か月に1回。HIFUは効果が最長6か月ほどで、3か月に1回が目安", "ソフウェーブは、しわには最初1か月ごとに3回。HIFUは効果が1〜2年ほど続くので、年に1回が目安", "ソフウェーブは、しわも最初から3〜6か月に1回。HIFUは効果が1〜2年ほど続くので、年に1回が目安", "ソフウェーブは、しわには最初1か月ごとに3回。HIFUは効果が最長6か月ほどで、3か月に1回が目安"], "answer": 3, "explain": "ソフウェーブの回数の目安は3〜6か月に1回だが、しわは最初1か月ごとに3回。HIFUの効果はQ&Aで最長6か月ほどで、3か月に1回（3か月〜半年ペース）くり返すのが前提。×しわも最初から3〜6か月：しわは別の目安／×HIFU 1〜2年：それは糸リフトの目安。", "basis": "しわは最初1か月ごとに3回"}, {"id": "a-c4-13-1", "ch": "lift", "card": "c4-13", "level": "apply", "q": "歯列矯正中で、以前にレディエッセ（体に吸収されない注入剤）を入れた人が「麻酔なしで受けられる、たるみの施術がいい」と希望。教材に沿った案内は？", "choices": ["ソフウェーブは、この2つの条件で受けられないことがある", "HIFUは、この2つの条件で受けられないことがある", "XERFは、この2つの条件で受けられないことがある", "糸リフトは、この2つの条件で受けられないことがある"], "answer": 2, "explain": "麻酔なしで受けられるとサイトにあるのはXERF。ただし歯列矯正中の人と、体に吸収されない注入剤（レディエッセなど）が入っている人は、XERFのQ&Aで「受けられないことがある人」に挙がる。他：ソフウェーブ／糸リフトの記載には、この2つは挙がっていない／HIFUの条件は、あてる場所の金属・皮膚の病気・心臓の病気・妊娠授乳。", "basis": "体に吸収されない注入剤（レディエッセなど）が入っている人"}, {"id": "d-c4-13-2", "ch": "lift", "card": "c4-13", "level": "dr", "q": "目元の小じわと、二重あごの脂肪の両方が気になる。デイズの機械で、XERFとHIFUを組み合わせたい。モード・打ち方の組み方として合うものは？", "choices": ["目元はXERFのミドルで、真皮から浅い脂肪まで温める。二重あごはHIFUのリニアで、超音波を線で打つ", "目元はXERFのシャローで、真皮を中心に温める。二重あごはHIFUのドットで、筋肉の膜を点で温める", "目元はXERFのシャローで、真皮を中心に温める。二重あごはHIFUのリニアで、超音波を線で打つ", "目元はXERFのミドルで、真皮から浅い脂肪まで温める。二重あごはHIFUのドットで、筋肉の膜を点で温める"], "answer": 2, "explain": "XERFのシャローは真皮が中心で、ねらいは小じわ・毛穴・ハリ。ミドルは真皮〜浅い脂肪で、ねらいはたるみの引き締め。HIFUのリニアは超音波を線で打ち、ねらいは二重あご・小顔（脂肪がつきやすい所）。ドットは筋肉の膜を点で温め、ねらいはたるみの引き上げ。", "basis": "モードを切りかえて、真皮から脂肪の奥まで深さを選べる"}, {"id": "d-c4-14-1", "ch": "lift", "card": "c4-13", "level": "dr", "q": "リウマチの薬を飲んでいて、あご下には他院でレディエッセが入っている。顔の引き締めがほしい。HIFUとXERFについての案内で合うものは？", "choices": ["HIFUも、体に吸収されない注入剤が入っていると受けられないことがある。XERFはリウマチの薬とレディエッセのどちらでも受けられないことがある", "HIFUは、受けられない条件にリウマチの薬も注入剤も挙がっていない。XERFはレディエッセでは受けられないことがあるが、薬は条件に挙がっていない", "HIFUも、体に吸収されない注入剤が入っていると受けられないことがある。XERFはレディエッセでは受けられないことがあるが、薬は条件に挙がっていない", "HIFUは、受けられない条件にリウマチの薬も注入剤も挙がっていない。XERFはリウマチの薬とレディエッセのどちらでも受けられないことがある"], "answer": 3, "explain": "HIFUの受けられない条件（サイト記載）は、あてる場所の金属の糸・プレート、重い皮膚の病気や感染、心臓の病気、妊娠中・授乳中で、薬や注入剤は挙がっていない。XERFは、一部の薬（リウマチの薬など）と、体に吸収されない注入剤（レディエッセなど）の両方が、受けられないことがある条件。", "basis": "一部の薬（リウマチの薬など）を飲んでいる人"}, {"id": "d-c4-14-3", "ch": "lift", "card": "c4-13", "level": "dr", "q": "以前HIFUのあと、頬の感覚が1か月ほど鈍った。今回は同じことを避けたい。塗る麻酔でかぶれたこともある。ハリを出したい人に、教材のしくみから考えて合う選び方は？", "choices": ["ソフウェーブ。麻酔なしで受けられ、温めるのは浅い真皮だけ。HIFUのねらう筋肉の膜の深さから離れている", "XERFのディープ。麻酔なしで受けられ、2つの周波数で真皮を中心に温めて、小じわ・ハリを出す", "XERFのシャロー。麻酔なしで受けられ、温めるのは真皮が中心。HIFUのねらう筋肉の膜まで届かない", "XERFのミドル。麻酔なしで受けられ、ねらいは小じわ・毛穴・ハリ。熱は筋肉の膜より浅い所にとどまる"], "answer": 2, "explain": "感覚の変化は、顔の神経がHIFUのねらう深さの近くを通るため。塗る麻酔が合わないのでソフウェーブは外れ、麻酔のいらないXERFで真皮中心のシャロー（小じわ・毛穴・ハリ）。×ソフウェーブ：表面麻酔のクリームをぬる／×ディープ：脂肪の奥までで、ねらいはフェイスライン／×ミドル：ねらいはたるみの引き締め。", "basis": "モードを切りかえて、真皮から脂肪の奥まで深さを選べる"}, {"id": "d-k-layers-6", "ch": "lift", "card": "c4-13", "level": "dr", "q": "XERFの3つのモードのうち、シャローとミドル。それぞれが温める深さを顔の5層の番号で言った文として、教材に合うものは？", "choices": ["シャローは主に②を温め、ミドルは②から③まで温める", "シャローは主に①を温め、ミドルは②から③まで温める", "シャローは主に②を温め、ミドルは①から②まで温める", "シャローは主に①を温め、ミドルは①から②まで温める"], "answer": 3, "explain": "5層は①皮膚（表皮・真皮） ②浅い脂肪 ③筋肉の膜（SMAS） ④靭帯と深い脂肪 ⑤骨。XERFのシャローは真皮が中心なので①、ミドルは真皮〜浅い脂肪なので①から②。③の膜を点でねらうのはHIFU。", "basis": "ミドル（中間）真皮〜浅い脂肪"}, {"id": "a-c4-14-1", "ch": "lift", "card": "c4-14", "level": "apply", "q": "メスも注射も使いたくない。フェイスラインのたるみを、切らずに奥の筋肉の膜（SMAS）から引き上げたい。いちばん合う打ち方は？", "choices": ["ハイフシャワー", "ソフウェーブ", "XERFのシャロー", "HIFUのドットモード"], "answer": 3, "explain": "ウルトラセルZiのドットモードは、筋肉の膜（SMAS）を点で一瞬だけ約65℃にして縮め、たるみを引き上げる。3つの機械でいちばん深い所に届く。他：ハイフシャワーは浅い層でハリ向け／ソフウェーブは真皮でハリ・小じわ向け／XERFのシャローは真皮中心で小じわ・毛穴向け。", "basis": "筋肉の膜（SMAS）を、点で一瞬だけ約65℃に"}, {"id": "a-c4-14-2", "ch": "lift", "card": "c4-14", "level": "apply", "q": "あおなぎで「HIFUの全顔＋顎下に、首も足したい」というお客様。デイズの料金表と見比べた案内として、教材に合うものは？", "choices": ["デイズのモニター価格で受けるほうが、首の料金は安い", "あおなぎに首の行はなく、首はデイズでだけ受けられる", "首の料金はデイズと同じで、あおなぎは表示価格が総額", "あおなぎは麻酔代が別なので、合計は表の金額より高い"], "answer": 2, "explain": "HIFUは2院でメニューの分け方も料金も同じで、首は¥12,800（デイズは「首 追加」の表記）。あおなぎは表示価格が総額で追加料金なし。他：あおなぎにも首の行がある／デイズのHIFUにモニター価格の記載はない／あおなぎは麻酔代・薬代込みの総額（基礎編）。", "basis": "メニューの分け方も料金も同じ。あおなぎは表示価格が総額"}, {"id": "d-c4-12-1", "ch": "lift", "card": "c4-14", "level": "dr", "q": "膝の手術で、金属のボルトが体に入っている。フェイスラインのもたつきは脂肪が多め。機械で引き締めたい。合う機械と打ち方は？", "choices": ["XERFの全顔500ショット¥62,800をディープで。膝の金属はあてる場所から遠いので受けられる", "ソフウェーブの全顔＋顎下200ショット¥96,000。真皮から脂肪まで温めて、脂肪を減らす", "HIFUのドット 全顔＋顎下¥42,800。膝の金属はあてる場所でなく、点の熱で脂肪を主に減らす", "HIFUのリニア フェイスライン＋顎下¥42,800。膝の金属はあてる場所でなく、脂肪がつきやすい所に向く"], "answer": 3, "explain": "HIFUが受けられないのは「あてる場所」に金属がある人。リニアのねらいは二重あご・小顔で、脂肪がつきやすい所に向く。XERFは体の中に金属が入っている人は受けられないことがある。×XERF：場所を問わない条件／×ソフウェーブ：温めるのは真皮だけ／×ドット：ねらいは筋肉の膜（SMAS）の引き上げ。", "basis": "二重あご・小顔。脂肪がつきやすい所に"}, {"id": "d-map-4b-2", "ch": "lift", "card": "c4-14", "level": "dr", "q": "顔の脂肪が少なく、頬はやせて見えやすい。頬のハリを出したいが、二重あごには脂肪がある。デイズの機械だけで、日を分けて受けてもよい。組み方と料金の案内で合うものは？", "choices": ["頬はソフウェーブ両頬80ショット¥46,800。あご下はHIFUのハイフシャワー¥42,800で、脂肪の層まで熱を入れる", "頬はソフウェーブ両頬100ショット¥58,000。あご下はHIFUのリニア¥42,800で、脂肪がつきやすい所に線で打つ", "頬はソフウェーブ両頬80ショット¥46,800。あご下はHIFUのリニア¥42,800で、脂肪がつきやすい所に線で打つ", "頬はソフウェーブ両頬100ショット¥58,000。あご下はセットの＋HIFU¥29,800を足して、顎下だけにあてる"], "answer": 2, "explain": "ソフウェーブは顔の脂肪が少ない人にもすすめられ、両頬は80ショット¥46,800。HIFUのリニア（フェイスライン＋顎下¥42,800）は線で打ち、ねらいは二重あご・小顔（脂肪がつきやすい所）。×100ショット¥58,000：それは全顔／×ハイフシャワー：深さ2.0mm用の部品で浅い層だけ／×＋HIFU：あたる範囲は頬＋顎下。", "basis": "二重あご・小顔。脂肪がつきやすい所に"}, {"id": "a-c4-15-1", "ch": "lift", "card": "c4-15", "level": "apply", "q": "ほうれい線のくぼみを初めて治療したい。仕上がりが気に入らなかったら元に戻せる方法がいい、という希望。教材に合う案内は？", "choices": ["ナノリッチの脂肪注入", "ヒアルロン酸注射", "メーラーファット除去", "口元のボトックス"], "answer": 1, "explain": "へこみには「足す」施術。ヒアルロン酸は溶かして戻す方法があり、脂肪注入のページにも「ヒアルロン酸注射と違い、溶かして元に戻す方法ができない」とある。他：脂肪注入は戻せない／メーラー除去は減らす施術で向きが逆／ボトックスは動きを弱めるだけでふくらませない。", "basis": "脂肪注入は、ヒアルロン酸注射と違い、溶かして元に戻す方法ができない"}, {"id": "a-c4-15-2", "ch": "lift", "card": "c4-15", "level": "apply", "q": "「ボリューマは、デイズよりあおなぎのほうが安いですよね？」と聞かれた。料金表を見ながらの案内として、教材に合うものは？", "choices": ["あおなぎも1ccの価格なので、そのまま安いと言える", "同じ量どうしの比較かは表から分からず、院に確認する", "デイズのモニター価格で比べれば、同じ金額になる", "あおなぎは麻酔代が別なので、合計はデイズより高い"], "answer": 1, "explain": "あおなぎで「1cc」と書かれているのは下の3つだけで、ボリューマを含む上の4つは量の表記がない。同じ量どうしの比較かは表から分からないので、院に確かめてから答える。他：あおなぎのボリューマは量の表記なし／デイズのヒアルロン酸にモニター価格の列はない（基礎編）／あおなぎは麻酔代・薬代込みの総額。", "basis": "上の4つは量の表記なし"}, {"id": "d-c4-15-2", "ch": "lift", "card": "c4-15", "level": "dr", "q": "ほうれい線のくぼみは「合わなければ戻せる方法」で、フェイスラインは切らずに上げたい。院はあおなぎでまとめたい。保証も知りたい。合う案内は？", "choices": ["くぼみはヒアルロン酸、フェイスラインは糸リフト6本¥69,800。糸の保証期間はサイトに書かれていない", "くぼみはヒアルロン酸、フェイスラインは糸リフト6本¥69,800。糸の保証はデイズと同じ1か月", "くぼみはヒアルロン酸、フェイスラインは糸リフト6本でアルテミスストロングを選ぶ。保証は記載なし", "くぼみは脂肪注入、フェイスラインは糸リフト6本¥69,800。脂肪注入に麻酔代が含まれるかは書かれていない"], "answer": 0, "explain": "溶かして戻せるのはヒアルロン酸。あおなぎの糸リフトは本数セットで、糸の種類・麻酔・保証期間はサイトに記載なし。×保証1か月：それはデイズの保証／×アルテミスストロング：あおなぎは糸の種類が書かれていない／×脂肪注入：溶かして戻せず、あおなぎはクマ取りとのセットだけ（総額表示）。", "basis": "気に入らなければ溶かして戻す方法がある"}, {"id": "d-c4-16-4", "ch": "lift", "card": "c4-15", "level": "dr", "q": "眉間に、表情を動かすと出るしわと、じっとしていても見える溝の両方がある。いま授乳中の人への案内は？", "choices": ["しわも溝もボトックスで、筋肉がゆるめば溝も下から持ち上がってふくらむ", "溝はヒアルロン酸で、注入後48時間は授乳をやめる。動くしわのボトックスは授乳後に", "溝は脂肪注入で足し、気に入らなければ溶かして戻せるので授乳中も安心", "注入後48時間授乳をやめれば、ヒアルロン酸もボトックスも同じ日に受けられる"], "answer": 1, "explain": "じっとしていても見える溝はヒアルロン酸で、授乳中も受けられるが注入後48時間は授乳をやめる。動くと出るしわはボトックスだが、薬の説明書では授乳中は使えないとされる（＊一般知識）。他：ボトックスは何も足さないので溝はふくらまない／脂肪注入は溶かして戻せない／48時間のきまりはヒアルロン酸の話。", "basis": "授乳中は受けられるが、注入後48時間は授乳をやめる"}, {"id": "a-c4-16-1", "ch": "lift", "card": "c4-16", "level": "apply", "q": "「エラが張っていて小顔にしたい」。奥歯をかみしめるとエラのあたりが硬くふくらみ、骨格の問題ではないと診断された。合う施術は？", "choices": ["バッカルファット除去", "顔の脂肪吸引（エラ下）", "ボトックス（エラ）", "ジョールファット除去"], "answer": 2, "explain": "かみしめると硬くふくらむのは咬筋。同じ「小顔」でも、かむ筋肉の張りならボトックス、脂肪なら顔の脂肪吸引やバッカルファット除去と原因で分かれる。他の3つは脂肪を減らす施術で、筋肉の張りは変わらない。エラの効果は2〜3週間後から出はじめる。", "basis": "かむ筋肉（咬筋）の張りならボトックス"}, {"id": "a-c4-16-2", "ch": "lift", "card": "c4-16", "level": "apply", "q": "「耳下腺のボトックスと、脚やせのボトックスを、あおなぎで受けたい」というお客様。2院の料金表に沿った案内は？", "choices": ["あおなぎのモニター価格なら、どちらもデイズより安い", "どちらもデイズと同じ料金で、あおなぎは表示価格が総額", "耳下腺はあおなぎだけにあり、脚はデイズと同じく1行", "耳下腺はあおなぎに掲載がなく、脚はあおなぎでは別の行"], "answer": 3, "explain": "耳下腺（耳の下の、つばを作る器官）はデイズの料金表だけ。腕と脚は、デイズは「腕・脚やせ」で1行、あおなぎは腕と脚で別の行になっていて料金も違う。顔の部位・エラ・多汗症・肩こりは2院で同じ料金。他：耳下腺は同じ料金ではなく掲載なし／逆／あおなぎにモニター価格の掲載はない（基礎編）。", "basis": "耳下腺はデイズだけ"}, {"id": "d-c4-16-1", "ch": "lift", "card": "c4-16", "level": "dr", "q": "結婚式まで3週間。かむ筋肉の張りでエラが目立ち、頬〜あご下にはつまめる脂肪もある。「できればあおなぎで受けたい」。合う案内は？", "choices": ["エラは数日で効き始めるので式に間に合う。脂肪は吸引注射が合うが、あおなぎのサイトには掲載がない（デイズで受ける）", "エラは効き始めが2〜3週間後で間に合いにくい。脂肪は吸引注射が合うが、あおなぎのサイトには掲載がない（デイズで受ける）", "エラは効き始めが2〜3週間後で間に合いにくい。脂肪は吸引注射をあおなぎで受けられ、総額¥49,800", "エラは数日で効き始めるので式に間に合う。脂肪は吸引注射をあおなぎで受けられ、総額¥49,800"], "answer": 1, "explain": "ボトックスは数日で効くが、エラは2〜3週間後から効き始め、平均2か月ほどで見える。脂肪吸引注射は施術後すぐ実感でき行事の前に合わせやすいが、あおなぎのサイトには掲載がない（¥49,800はデイズのモニター価格）。×数日で効く：エラは別／×あおなぎで吸引注射：サイトに掲載なし。", "basis": "エラは2〜3週間後から効き始め、平均2か月ほどで小顔の効果が目に見える"}, {"id": "d-c4-16-2", "ch": "lift", "card": "c4-16", "level": "dr", "q": "デイズで、耳下腺のボトックスをアラガンで受けたい。打つときの痛みが心配なので、麻酔クリームも使いたい。料金の見方として合うものは？", "choices": ["耳下腺はアラガン¥22,000。麻酔クリームは、オプション表に¥3,000とある", "耳下腺はアラガン¥55,000。麻酔クリームは、オプション表に¥8,800とある", "耳下腺はアラガン¥22,000。麻酔クリームは、オプション表に¥8,800とある", "耳下腺はアラガン¥55,000。麻酔クリームは、オプション表に¥3,000とある"], "answer": 3, "explain": "耳下腺はデイズだけの部位で、アラガン¥55,000（¥22,000はボツラックス）。麻酔クリームは希望で追加でき、オプション表のリドカインクリームは¥3,000（¥8,800は笑気麻酔）。どの麻酔代が料金に含まれるかはサイトに記載がなく、院に確認する。", "basis": "希望すれば笑気麻酔や麻酔クリームを追加できる"}, {"id": "d-c4-16-3", "ch": "lift", "card": "c4-16", "level": "dr", "q": "20代。エラが張って見え、頬の奥のふくらみで丸顔にも見える。小顔にしたいという相談への案内として合うものは？", "choices": ["エラは骨格が原因でないかを先に診断し、筋肉の張りならボトックス。頬の奥はバッカル除去で、口の中の粘膜を切って取り出す", "エラは骨格が原因でも筋肉の張りでも、ボトックスの対象になる。頬の奥はバッカル除去で、口の中の粘膜を切って取り出す", "エラは骨格が原因でないかを先に診断し、筋肉の張りならボトックス。頬の奥はメーラー除去で、口角の内側から管で吸い出す", "エラは骨格が原因でも筋肉の張りでも、ボトックスの対象になる。頬の奥はメーラー除去で、口角の内側から管で吸い出す"], "answer": 0, "explain": "エラの張りが骨格によるものだとボトックスは効果が期待できないので、事前の診断が必要。かむ筋肉の張りならボトックス。頬の奥の脂肪はバッカルファットで、口の中の粘膜を切って引っぱり出す。×骨格でも対象：骨格はどちらでも変わらない／×メーラー：頬の上のほう（ほうれい線の上）の脂肪。", "basis": "効果が期待できないので、事前の診断が必要"}, {"id": "a-quiz-4-1", "ch": "lift", "card": "quiz-4", "level": "apply", "q": "頬がこけ気味の人が「小顔にしたいので、とにかく脂肪を取りたい」と希望。教材の考え方で、まず検討に挙がるのは？", "choices": ["脂肪注入", "バッカルファット除去", "脂肪溶解注射", "メーラーファット除去"], "answer": 0, "explain": "顔が大きく見える原因は、脂肪が多い・下がった・へこんだ・筋肉・骨格とさまざま。こけている人から脂肪を取ると、かえってやつれて老けて見えるので、へこみには「② 足す」の脂肪注入を考える。他：バッカル除去・溶解注射・メーラー除去はどれも「① 減らす」で、こけを強めるおそれがある。", "basis": "こけている人から脂肪を取ると、かえってやつれて老けて見える"}, {"id": "a-cat-5-1", "ch": "body", "card": "cat-5", "level": "apply", "q": "本厚木に住むお客様から「あおなぎで袋の豊胸を受けたい」と問い合わせ。教材にそった案内は？", "choices": ["あおなぎで受けられ、麻酔代込みの総額で案内する", "取り扱いはデイズだけ。バッグ代は別途と伝え、院は確認する", "豊胸はあおなぎだけのメニューなので、そのまま予約を取る", "あおなぎで受けられ、バッグ代は別にかかると案内する"], "answer": 1, "explain": "ボディの章のメニューはすべてデイズだけで、あおなぎには取り扱いがない。袋を使う豊胸はバッグ代が大きさと種類で別途かかる。どの院で受けられるかは教材にないので院に確認する。「あおなぎで受けられる」とした2つは前提が誤り（総額表示はあおなぎの見せ方）。「あおなぎだけ」は逆。", "basis": "この章のメニューはすべてデイズだけで、あおなぎには取り扱いがありません。"}, {"id": "d-c5-01-1", "ch": "body", "card": "c5-01", "level": "dr", "q": "ハイブリッド豊胸を受け、のちに袋を取り出したお客様。「もう人工物は入っていないので、乳がん検診で豊胸のことは言わなくていいですよね？」と聞かれた。教材に合う答えは？", "choices": ["定着した脂肪は胸に残り、石灰化するとレントゲンに写る場合があるので、豊胸したことを伝える", "袋を取り出すときに定着した脂肪もいっしょに取るので、もう豊胸したことは伝えなくてよい", "定着した脂肪は胸に残るが、自分の脂肪はレントゲンに写らないので、豊胸したことは伝えなくてよい", "定着した脂肪が残るので伝える。豊胸後の検診はマンモグラフィーが1か月以降、エコーが6か月以降"], "answer": 0, "explain": "袋を取り出しても定着した脂肪のぶんは残り、脂肪は石灰化するとレントゲンに写る場合がある。だから検診では豊胸を伝える。×脂肪も取る：残るのは定着した脂肪。×脂肪は写らない：石灰化で写る場合がある。×月数：マンモは6か月以降、エコーは1か月以降で逆。", "basis": "袋をあとで取り出した場合、袋のぶんは小さくなりますが、定着した脂肪のぶんは残ります。"}, {"id": "d-c5-01-2", "ch": "body", "card": "c5-01", "level": "dr", "q": "乳輪縮小術を受け、受けられるいちばん早い日にハイブリッド豊胸を受けたお客様。乳輪縮小から1年と2週間たった今、「胸のしこり」と「ワキの傷あと」を相談に来た。保証についての案内で教材に合うものは？", "choices": ["しこり：保証は傷あとと同じ1年／ワキの傷あと：豊胸は乳輪縮小の術後1か月以降なので、まだ1年未満で期間内", "しこり：保証は一生涯／ワキの傷あと：豊胸は乳輪縮小と同じ日にでき、もう1年を過ぎて期間外", "しこり：保証は傷あとと同じ1年／ワキの傷あと：豊胸は乳輪縮小と同じ日にでき、もう1年を過ぎて期間外", "しこり：保証は一生涯／ワキの傷あと：豊胸は乳輪縮小の術後1か月以降なので、まだ1年未満で期間内"], "answer": 3, "explain": "乳輪縮小と豊胸は同じ日にはできず、豊胸は乳輪縮小の術後1か月以降。だから豊胸からはまだ1年たたず、傷あと（保証1年）は期間内。豊胸のしこりの保証は一生涯。×同じ日にでき：同時にはできない。×しこり1年：1年は傷あとの期間。", "basis": "しこりは一生涯、傷あとは1年間（医師が必要と判断した場合に再施術。再施術は原則半年以降）"}, {"id": "a-c5-02-1", "ch": "body", "card": "c5-02", "level": "apply", "q": "やせ型で吸える脂肪がほとんどなく、人工物には抵抗がない。2カップ以上大きくしたいが、手術時間はできるだけ短くしたい。合う案内は？", "choices": ["ハイブリッド豊胸。3つの中で最も大きくしやすく、やせ型にも向く", "脂肪豊胸。吸引1時間＋注入30分なので、袋の豊胸より手術が短い", "シリコンバッグ豊胸。体質に関係なく大きくでき、時間は3〜4時間", "脂肪豊胸・コンデンスリッチファット。定着しやすく袋なみに大きくできる"], "answer": 2, "explain": "袋は体質に関係なく入れたぶん確実に大きくでき、やせ型にも向く。時間も袋3〜4時間でハイブリッド4〜5時間より短い。×ハイブリッド：時間が長い。×脂肪豊胸：2カップ以上を希望する人には向かず袋が案内される。×CRF：脂肪豊胸の料金表にあるプランで、脂肪豊胸で大きくできるのは1〜2カップまで。", "basis": "やせ型で脂肪が取れない人にも向く"}, {"id": "a-map-5-1", "ch": "body", "card": "c5-02", "level": "apply", "q": "広告で「シリコンバッグ豊胸 ¥348,000」を見たお客様が「これで全部込み？」と質問。教材に合う答えは？", "choices": ["通常価格で、バッグ代も手術の料金にふくまれる", "あおなぎの総額表示なので、バッグ代も込みになる", "モニター価格で、審査はなく、バッグ代もふくまれる", "モニター価格で審査があり、バッグ代は別にかかる"], "answer": 3, "explain": "¥348,000はデイズのモニター価格（通常は¥468,000）。モニターは撮影・掲載への協力などの条件と医師の審査がある。表の金額は手術の料金で、バッグ代は大きさと種類で別にかかる。豊胸はあおなぎでは取り扱いがない。", "basis": "料金に袋の代金は入っていない。"}, {"id": "d-c5-02-1", "ch": "body", "card": "c5-02", "level": "dr", "q": "胸が小さいやせ型のお客様。「被膜拘縮はできるだけ避けたい。でも袋のふちが波打つのも嫌」という。袋を入れる深さ（シリコンバッグ豊胸の説明）と、ハイブリッド豊胸でかぶせる脂肪を取る場所について、教材に合う案内は？", "choices": ["胸が小さい人向けの深さは乳腺の下。かぶせる脂肪は基本的にお腹から取る", "胸が小さい人向けの深さは乳腺の下。かぶせる脂肪は基本的に内ももから取る", "胸が小さい人向けの深さは筋肉の下。かぶせる脂肪は基本的に内ももから取る", "胸が小さい人向けの深さは筋肉の下。かぶせる脂肪は基本的にお腹から取る"], "answer": 2, "explain": "胸が小さい人向けの筋肉の下は被膜拘縮のリスクが低いが、弱点はリップリング（深さは医師が選ぶ）。そこを脂肪でおおうのがハイブリッドで、脂肪は基本的に内ももから取る。×乳腺の下：もともと胸がある人向けで、被膜拘縮のリスクが比較的高い。×お腹から：内ももが基本。", "basis": "リップリング（袋のゆがみ）が出ることがある"}, {"id": "a-c5-03-1", "ch": "body", "card": "c5-03", "level": "apply", "q": "「人工物は入れたくない。でも3カップ大きくしたい」というお客様。教材にそった説明は？", "choices": ["CRFは普通の脂肪注入より定着しやすいので、CRFで3カップをめざす", "脂肪豊胸は1〜2カップまでなので、袋を使う方法も案内する", "幹細胞を足すと定着率が上がるので、脂肪豊胸で3カップをめざす", "吸う脂肪の量を増やして、脂肪豊胸のまま3カップをめざす"], "answer": 1, "explain": "脂肪豊胸で大きくできるのは1〜2カップまでで、それ以上を希望する人には袋を使う方法が案内される。公式も脂肪注入は片胸200cc程度（約2カップ）が限界と説明している。CRFや幹細胞は定着しやすくする工夫で、限界をなくすとは書かれていない。吸う量を増やす案も1〜2カップまでという説明から外れる。", "basis": "それ以上を希望する人は、袋を使う方法が案内される"}, {"id": "a-c5-03-2", "ch": "body", "card": "c5-03", "level": "apply", "q": "人工物は入れたくないので脂肪豊胸に決めたお客様が、料金表の「脂肪豊胸（吸引代別途）」を見て「これで全部？」と質問。教材に合う答えは？", "choices": ["脂肪豊胸も袋を使うので、大きさと種類でバッグ代が別にかかる", "脂肪を吸う料金は別にかかり、その金額はこのページに書かれていない", "デイズの料金表は総額表示なので、表の金額だけで支払いが済む", "吸った所も細くなるので、脂肪を吸う料金は表の金額にふくまれる"], "answer": 1, "explain": "脂肪豊胸は「やせる」と「大きくする」が同時だが、脂肪を吸う料金（吸引代）は別にかかり、金額はページに記載がない。バッグ代が別なのは袋を使う豊胸。総額表示はあおなぎの見せ方で、デイズは通常／モニターの2本立て。", "basis": "ただし脂肪を吸う料金は別にかかる"}, {"id": "a-c5-03-3", "ch": "body", "card": "c5-03", "level": "apply", "q": "ハイブリッド豊胸から2年。胸にしこりができたと相談があった。デイズの保証について教材に合う案内は？", "choices": ["豊胸の保証は1年間なので、2年たつと保証の対象外になる", "保証は1か月間なので、しこりは通常料金での再施術になる", "豊胸のしこりは一生涯の保証で、医師が必要と判断すれば再施術", "袋を取り出せば定着した脂肪も消えるので、取り出しで対応する"], "answer": 2, "explain": "豊胸（袋・脂肪・ハイブリッド）の保証は、しこりが一生涯、傷あとが1年間で、医師が必要と判断した場合に再施術する（原則半年以降）。1年は傷あとの期間、1か月は糸リフト・顔の脂肪吸引など。袋を取り出しても定着した脂肪のぶんは残る。", "basis": "しこりは一生涯、傷あとは1年間"}, {"id": "d-c5-02-2", "ch": "body", "card": "c5-03", "level": "dr", "q": "シリコンバッグ豊胸を受けたAさん（術後3か月）と、脂肪豊胸を受けたBさん（術後4か月）が、乳がん検診を受けたいという。教材に合う案内は？", "choices": ["Aさん：今ならエコー。袋はレントゲンに白い影で写ることがある／Bさん：脂肪が石灰化すると写る場合があり、豊胸を伝える", "Aさん：マンモグラフィーは1か月以降なので今受けられる／Bさん：脂肪が石灰化すると写る場合があり、豊胸を伝える", "Aさん：今ならエコー。袋はレントゲンに白い影で写ることがある／Bさん：完全になじむ約3か月を過ぎたので写らず、伝えなくてよい", "Aさん：袋はエコーにしか写らないので、豊胸は伝えなくてよい／Bさん：脂肪が石灰化すると写る場合があり、豊胸を伝える"], "answer": 0, "explain": "袋のあとの検診はマンモが術後6か月以降、エコーが1か月以降なので3か月ならエコー。袋はレントゲンに白い影で写ることがある。脂肪も石灰化すると写る場合があり伝える。×マンモ1か月：エコーの月数。×3か月で写らない：約3か月はなじむ目安。×エコーだけ：袋はレントゲンにも写る。", "basis": "脂肪が石灰化するとレントゲンに写る場合があります。"}, {"id": "d-c5-02-3", "ch": "body", "card": "c5-03", "level": "dr", "q": "脂肪豊胸から1週間のお客様。「この大きさで決まりですか？」と聞かれ、さらに「友人が、注射だけのヒアルロン酸豊胸や袋の豊胸のほうが長持ちと言っていた」という。教材に合う説明は？", "choices": ["見た目は1週間で完成し、完全になじむのは約2週間。ヒアルロン酸豊胸は約2〜3年、袋は劣化・破損がなければ半永久", "いまは腫れで大きく見え、完全になじむのは約3か月。ヒアルロン酸豊胸も定着すれば半永久、袋は劣化・破損がなければ半永久", "いまは腫れで大きく見え、完全になじむのは約3か月。ヒアルロン酸豊胸は約2〜3年、袋は数年ごとの入れ替えが前提", "いまは腫れで大きく見え、完全になじむのは約3か月。ヒアルロン酸豊胸は約2〜3年、袋は劣化・破損がなければ半永久"], "answer": 3, "explain": "脂肪豊胸は術後1週間ほど腫れで大きく見え、見た目は2週間、完全になじむまで約3か月。比較表のヒアルロン酸豊胸は約2〜3年。袋は劣化・破損がなければ基本的に半永久。×1週間で完成：腫れの時期。×ヒアルロン酸も半永久：約2〜3年。×入れ替えが前提：交換は基本不要で定期チェック。", "basis": "術後1週間ほどは腫れで実際より大きく見え、腫れが引くと「小さくなった」と感じることがあります。"}, {"id": "d-map-5-1", "ch": "body", "card": "c5-03", "level": "dr", "q": "豊胸の相談が2人。Aさんは「人工物は入れたくない。1カップで十分なので脂肪豊胸にしたい。手術の2週間後にジムで激しいトレーニングを再開したい」。Bさんは「やせ型で3カップ大きくしたい。袋が入っているとわかる見た目は避けたい」。先に伝えることとして教材に合うものは？", "choices": ["Aさん：最低10日あければ激しい運動もでき、2週間後に間に合う／Bさん：ハイブリッド豊胸。袋の上に自分の脂肪を足して輪郭をかくす", "Aさん：激しい運動は3週間ほど控えるので、2週間後では早い／Bさん：ハイブリッド豊胸。袋の上に自分の脂肪を足して輪郭をかくす", "Aさん：最低10日あければ激しい運動もでき、2週間後に間に合う／Bさん：シリコンバッグ単独。筋肉の下に入れれば、やせ型でも輪郭は出にくい", "Aさん：激しい運動は3週間ほど控えるので、2週間後では早い／Bさん：シリコンバッグ単独。筋肉の下に入れれば、やせ型でも輪郭は出にくい"], "answer": 1, "explain": "脂肪豊胸は入浴・軽い運動・飲酒が最低10日、激しいスポーツは3週間ほど控えるので、2週間後のジムは早い。やせ型で袋の輪郭が心配な人にはハイブリッドが案内される。×10日で激しい運動も：10日は入浴などの日数。×バッグ単独：やせ型だと輪郭が出やすく、筋肉の下はリップリングが弱点。", "basis": "うつ伏せ寝・胸のマッサージ・激しいスポーツは3週間ほど控える"}, {"id": "a-c5-04-1", "ch": "body", "card": "c5-04", "level": "apply", "q": "乳輪のぶつぶつが気になるお客様に「ニキビみたいなので自分でつぶしてもいい？ すぐ手術したほうがいい？」と聞かれた。教材に合う答えは？", "choices": ["ニキビと同じなので、清潔にした指でつぶしてよい", "病気のサインなので、食事や保湿の前にすぐ手術する", "授乳に影響するので、出産を終えるまで手術は待つ", "つぶさずに来院。まず野菜中心の食事と保湿をためす"], "answer": 3, "explain": "ぶつぶつの正体は乳輪の皮脂腺（モントゴメリー腺）で、ニキビではないので指でつぶすとばい菌が入る。病気でもなく、公式はまず野菜中心の食事と保湿、変わらなければ手術の順をすすめる。取っても授乳機能に影響しないとされる。", "basis": "まずは野菜中心の食事と保湿をためし、それでも変わらなければ手術、という順番がすすめられている。"}, {"id": "a-map-5b-1", "ch": "body", "card": "c5-04", "level": "apply", "q": "胸の先まわりの小さな手術で、モントゴメリー腺除去だけは「かかる時間」も「料金」も取る数で変わる。その理由として教材に合うのは？", "choices": ["輪の縁を切って縫いちぢめるので、輪が大きいほど長く切るから", "母乳の通り道を残すかどうかで、切り方と料金が変わるから", "ぶつぶつを1個ずつ切り取って縫う方法で、料金も1個いくらだから", "組織ごと切って取るので、ふくらみの中身で方法が変わるから"], "answer": 2, "explain": "モントゴメリー腺除去は、ぶつぶつを1個ずつ切り取って縫うので、取る数が多いほど時間（片側10分前後）も総額も増える。輪の縁を縫いちぢめるのは乳輪縮小、乳管を残すかで料金が変わるのは乳頭縮小、組織ごと取り中身を診察するのは副乳除去。", "basis": "取る数が多いほど時間も料金も増えます"}, {"id": "d-c5-04-1", "ch": "body", "card": "c5-04", "level": "dr", "q": "モントゴメリー腺除去と副乳除去を、同じ時期に受けたいお客様。術後10日目に温泉（湯船）、2週間後にテニスの試合（激しいスポーツ）の予定がある。教材に合う案内は？", "choices": ["温泉は副乳除去とぶつかる。試合はどちらの手術も間に合う", "温泉はどちらの手術も間に合う。試合もどちらの手術も間に合う", "温泉はどちらの手術も間に合う。試合はモントゴメリー腺除去とぶつかる", "温泉は副乳除去とぶつかる。試合はモントゴメリー腺除去とぶつかる"], "answer": 2, "explain": "湯船は、副乳除去が翌日から1週間シャワーのみのあと、モントゴメリー腺除去が抜糸（7日後）の翌日からで、10日目はどちらも間に合う。運動は、副乳除去は飲酒・運動を最低1週間ひかえる（激しいスポーツの日数は記載なし）。一方、モントゴメリー腺除去は激しいスポーツを3週間ほど控えるので、2週間後の試合とぶつかる。", "basis": "うつ伏せ寝・乳首への刺激・激しいスポーツは3週間ほど控える。"}, {"id": "d-c5-04-2", "ch": "body", "card": "c5-04", "level": "dr", "q": "「乳輪のぶつぶつを6個取りたい（1個¥20,000）。乳頭も授乳機能を残して低くしたい。痛みが不安なので、できれば眠って受けたい」というお客様。ぶつぶつの料金のほかに伝える内容で、教材に合うものは？", "choices": ["乳頭はてっぺんを三角形に切り取って低くする／ぶつぶつ除去は局所麻酔だけで、静脈麻酔は追加できない", "乳頭は根元をドーナツのように切り取って低くする／ぶつぶつ除去は局所麻酔に、静脈麻酔を追加できる", "乳頭はてっぺんを三角形に切り取って低くする／ぶつぶつ除去は局所麻酔に、静脈麻酔を追加できる", "乳頭は根元をドーナツのように切り取って低くする／ぶつぶつ除去は局所麻酔だけで、静脈麻酔は追加できない"], "answer": 1, "explain": "低くするなら根元をドーナツのように切り、乳管を残しながら余分な皮を取る（三角に切るのは細くする方法）。ぶつぶつ除去は局所麻酔で、笑気・表面・静脈麻酔を追加できる。追加する麻酔の料金はページに記載なし。×三角：細くする切り方。×追加できない：静脈麻酔も追加できる。", "basis": "痛みが不安な人は笑気ガス・表面麻酔・静脈麻酔を追加できる"}, {"id": "a-c5-05-1", "ch": "body", "card": "c5-05", "level": "apply", "q": "わきのふくらみが気になるお客様。料金表には副乳除去と、脂肪吸引の「副乳（脇肉）」の両方がある。教材に合う案内は？", "choices": ["中身を医師が診察し、切って取るか吸い出すかを決める", "わきのふくらみは脂肪なので、脂肪吸引の副乳（脇肉）を案内する", "副乳は乳腺のなごりなので、脂肪溶解注射を3〜6回案内する", "副乳は病気のもとなので、早めに切って取るよう案内する"], "answer": 0, "explain": "副乳除去は切って組織ごと取る方法、脂肪吸引の「副乳（脇肉）」は細い管で吸い出す方法。どちらが合うかは、ふくらみの中身を診察して医師が判断する。副乳は乳房のなごりで病気ではなく、乳腺の組織まである人もいる。", "basis": "どちらが合うかは、ふくらみの中身を診察して医師が判断する。"}, {"id": "a-c5-05-2", "ch": "body", "card": "c5-05", "level": "apply", "q": "副乳除去について、教材の説明と合わないものはどれ？", "choices": ["30分ほどの手術で、そのまま帰宅できる", "授乳中も手術はできるが、術後3日間は授乳を控える", "傷あとは少し残る可能性があり、糸は7日後に抜く", "副乳は脂肪だけでできているので、吸い出せば取れる"], "answer": 3, "explain": "副乳は生まれる前に消えるはずだった乳腺のもとのなごりで、乳頭だけの人も、乳輪や乳腺の組織まである人もいる。脂肪だけとは限らず、切るか吸うかは中身を診察して医師が決める。30分で帰宅、授乳中は術後3日控える、傷あとが少し残る可能性・7日後抜糸は教材どおり。", "basis": "乳頭だけの人、乳輪や乳腺の組織まである人がいます"}, {"id": "d-c5-05-1", "ch": "body", "card": "c5-05", "level": "dr", "q": "授乳中のお客様。わきのふくらみを診察したら、中身は乳腺の組織だった。「切らずに吸引で、モニター価格で受けたい」という。教材に合う案内は？", "choices": ["脂肪吸引の副乳（脇肉）ならモニター¥98,000で、乳腺の組織も細い管で吸い出せる。術後3日間は授乳を控える", "吸引で取れるのは皮下脂肪なので、切って組織ごと取る副乳除去。モニター価格も選べ、審査しだい。術後3日間は授乳を控える", "吸引で取れるのは皮下脂肪なので、切って組織ごと取る副乳除去。モニター設定はなく¥250,000。術後1週間は授乳を控える", "吸引で取れるのは皮下脂肪なので、切って組織ごと取る副乳除去。モニター設定はなく¥250,000。術後3日間は授乳を控える"], "answer": 3, "explain": "吸引で取れるのはつまめる皮下脂肪だけで、乳腺の組織は切って取る副乳除去になる。副乳除去は通常価格のみ¥250,000。授乳中も手術でき、術後3日間は授乳を控える。×吸引で組織も：吸えるのは皮下脂肪。×モニター：設定なし。×1週間：授乳を控えるのは3日間。", "basis": "切ることで組織を完全に取りのぞけるので、きれいに無くせると説明されている。"}, {"id": "a-c5-06-1", "ch": "body", "card": "c5-06", "level": "apply", "q": "乳頭の高さは気にならず、「太さ」だけを細くしたい。将来は授乳の予定もある。教材の切り方の説明に合うのは？", "choices": ["根元をドーナツのように切り取って、乳管を残しながら低くする", "根元のドーナツ切りと、てっぺんの三角切りを組み合わせる", "乳管の部分もふくめて三角形に切り取り、皮膚を縫い合わせる", "乳管をよけて三角形に切り取り、切り口を縫い合わせる"], "answer": 3, "explain": "細く（小さく）するだけなら、乳管をよけてケーキのように三角形に切り取り、縫い合わせる。根元のドーナツ切りは低くする方法、ドーナツ＋三角の組み合わせは低く・小さくする方法。乳管ごと切り取るのは男性や授乳の予定がない人向け。", "basis": "乳管をよけて、ケーキのように三角形に切り取り、切り口を縫い合わせる。"}, {"id": "a-c5-06-2", "ch": "body", "card": "c5-06", "level": "apply", "q": "乳頭縮小術について、教材の説明と合わないものはどれ？", "choices": ["一度小さくすれば、授乳などで再び大きくはならない", "料金表は、乳管温存とそうでないものに分かれている", "感覚は1か月以降に戻り、術後1週間はにぶい人もいる", "喫煙や持病の血行不良で、乳頭が壊死することがある"], "answer": 0, "explain": "乳頭縮小術は、授乳などの影響でまた大きくなることがあり、その場合は再手術ができると書かれている。料金は乳管温存かどうかで分かれる、感覚は1か月以降に戻る、喫煙・持病の血行不良で壊死することがある（たばこは厳禁）、は教材どおり。", "basis": "授乳などでまた大きくなることもある。"}, {"id": "d-c5-06-1", "ch": "body", "card": "c5-06", "level": "dr", "q": "乳頭縮小術から2か月、たばこを吸うお客様が「左右差が気になる。感覚もまだにぶい。すぐに直したい」と来院した。デイズの保証と過ごし方で教材に合う案内は？", "choices": ["明らかな左右差なら保証の対象で、再施術は目元と同じ1か月以降。感覚のにぶさは1か月以降に戻るので様子を見る", "明らかな左右差なら保証の対象で、再施術は原則半年以降。喫煙は乳頭の壊死につながるので、まずやめてもらう", "左右差も感覚のにぶさも保証の対象で、再施術は原則半年以降。喫煙は乳頭の壊死につながるので控えてもらう", "明らかな左右差なら保証の対象で、再施術は原則半年以降。喫煙の影響は抜糸までなので、いまは吸ってもよい"], "answer": 1, "explain": "乳頭縮小の保証は1年で、対象は明らかな左右差（医師が判断）。再施術は目元が1か月以降、そのほかは原則半年以降なので2か月では早い。喫煙は血行不良で乳頭の一部や全体が壊死するおそれ。×1か月以降：目元のきまり。×感覚も対象：対象は左右差。×抜糸まで：術後の喫煙は控える。", "basis": "保証：1年間（明らかな左右差があり、医師が必要と判断した場合に再施術）。"}, {"id": "a-c5-07-1", "ch": "body", "card": "c5-07", "level": "apply", "q": "乳頭がへこんでいて、来年出産を予定しているお客様。教材に合う説明は？", "choices": ["授乳が終わるまで待ってから手術するのがすすめられる", "見た目だけの問題なので、出産後に考えればよい", "乳頭縮小術で突起を小さくし、形を整えるのがよい", "出産前の手術がすすめられ、入浴は1か月ほど控える"], "answer": 3, "explain": "陥没乳頭はへこみに汚れがたまり乳腺炎・乳管炎を起こしやすい。授乳で困らないよう公式は出産前の手術をすすめ、入浴は1か月ほど控える。見た目だけの問題ではない。乳頭縮小術は出すぎた突起を小さくする逆向きの手術。", "basis": "授乳のときに困らないよう、公式は出産前の手術をすすめている。"}, {"id": "d-c5-07-1", "ch": "body", "card": "c5-07", "level": "dr", "q": "「陥没乳頭で乳腺炎をくり返している。乳輪のぶつぶつも取りたい。来年出産予定で、授乳もしたい」というお客様。手術の時期と、ぶつぶつを取ったあとの授乳について、教材に合う案内は？", "choices": ["陥没乳頭は授乳を終えてからの手術がすすめられる／ぶつぶつは赤ちゃんへの目印なので、取ると授乳で困る", "陥没乳頭は出産前の手術がすすめられる／ぶつぶつは取っても授乳に影響しないと説明される", "陥没乳頭は授乳を終えてからの手術がすすめられる／ぶつぶつは取っても授乳に影響しないと説明される", "陥没乳頭は出産前の手術がすすめられる／ぶつぶつは赤ちゃんへの目印なので、取ると授乳で困る"], "answer": 1, "explain": "陥没乳頭は授乳のときに困らないよう、公式は出産前の手術をすすめる。ぶつぶつ（モントゴメリー腺）は授乳期ににおいで母乳の場所を知らせるといわれるが、赤ちゃんはにおいがなくても見つけられ、授乳機能に影響しないと説明される。×授乳後：公式は出産前。×授乳で困る：影響しない。", "basis": "授乳のときに困らないよう、公式は出産前の手術をすすめている"}, {"id": "d-c5-07-3", "ch": "body", "card": "c5-07", "level": "dr", "q": "陥没乳頭術と脂肪豊胸を受けたいお客様。3週間後に温泉旅行があり、受けられるものはできるだけ旅行前に済ませたいという。教材に合う日程の案内は？", "choices": ["脂肪豊胸は旅行前でよい／陥没乳頭術も旅行前でよい", "脂肪豊胸は旅行のあとにする／陥没乳頭術は旅行前でよい", "脂肪豊胸は旅行のあとにする／陥没乳頭術も旅行のあとにする", "脂肪豊胸は旅行前でよい／陥没乳頭術は旅行のあとにする"], "answer": 3, "explain": "陥没乳頭術は入浴を1か月ほど控える（シャワーは患部をさければ当日から）ので、今受けると3週間後の温泉とぶつかる。脂肪豊胸は入浴・軽い運動・飲酒を最低10日あければよく、3週間あれば間に合う。できるだけ旅行前に、という希望なら脂肪豊胸を先に、陥没乳頭術は旅行のあとに組む。", "basis": "1か月ほど控える シャワーは患部をさければ当日から"}, {"id": "d-c5-07-4", "ch": "body", "card": "c5-07", "level": "dr", "q": "「陥没乳頭と、わきの副乳の両方を治したい。眠るのはこわいが、少しぼんやりはしたい」というお客様。2つの手術の麻酔と、副乳除去にかかる時間について、教材で確かめられる案内は？", "choices": ["副乳除去：笑気を足すと、眠らずにぼんやりする／陥没乳頭術：併用の記載は眠る静脈麻酔だけ／副乳除去の時間：約30分で、そのまま帰れる", "副乳除去：笑気を足すと、点滴の麻酔のように眠る／陥没乳頭術：併用の記載は眠る静脈麻酔だけ／副乳除去の時間：約1時間で、入院はいらない", "副乳除去：笑気を足すと、眠らずにぼんやりする／陥没乳頭術：笑気も併用できるとページにある／副乳除去の時間：約1時間で、入院はいらない", "副乳除去：笑気を足すと、点滴の麻酔のように眠る／陥没乳頭術：笑気も併用できるとページにある／副乳除去の時間：約30分で、そのまま帰れる"], "answer": 0, "explain": "副乳除去は局所麻酔に笑気・表面・静脈を追加でき、笑気は眠らずぼんやりする。約30分でそのまま帰れる。陥没乳頭術は局所麻酔で、併用の記載は眠る静脈麻酔だけ。×笑気で眠る：眠るのは静脈麻酔。×陥没乳頭術に笑気：記載なし。×約1時間：陥没乳頭術の時間。", "basis": "痛みが心配なら静脈麻酔も併用可"}, {"id": "a-c5-08-1", "ch": "body", "card": "c5-08", "level": "apply", "q": "「乳輪を小さくして、同じ日に豊胸もまとめて受けたい」と相談された。教材どおりの案内は？", "choices": ["同じ日に受けられ、傷も一度ですむ", "先に豊胸をして、乳輪縮小は半年後以降になる", "同じ日にはできず、豊胸は1か月後以降になる", "ハイブリッド豊胸なら同じ日に受けられる"], "answer": 2, "explain": "乳輪縮小術は豊胸と同じ日にはできず、豊胸は乳輪縮小の術後1か月以降になる。豊胸の種類を変えても同じ日にはできない。また間隔は半年ではなく1か月。一度切ると戻せないので大きさは事前によく相談する。", "basis": "豊胸と同じ日にはできない"}, {"id": "d-c5-08-1", "ch": "body", "card": "c5-08", "level": "dr", "q": "1〜2年以内に妊娠・授乳の予定があるお客様が、乳頭・乳輪・乳輪のぶつぶつを全部直したいという。手術の時期を考えるうえで教材に合う説明は？", "choices": ["乳頭は授乳でまた大きくなることがあるが、ぶつぶつは一度取れば再発しない。乳輪は授乳に影響しないが元に戻せない", "乳頭は授乳でまた大きくなることがあり、ぶつぶつは妊娠でまた出ることがある。乳輪は授乳に影響しないが元に戻せない", "乳頭は授乳の影響を受けないが、ぶつぶつは妊娠でまた出ることがある。乳輪は授乳に影響しないが元に戻せない", "乳頭は授乳でまた大きくなることがあり、ぶつぶつは妊娠でまた出ることがある。乳輪は乳管を傷つけるので授乳に影響する"], "answer": 1, "explain": "乳頭は授乳などでまた大きくなることがあり、ぶつぶつも妊娠や乾燥でまた出ることがあるので、授乳後に回す理由がある。乳輪縮小は乳管を傷つけず授乳に影響しないが、一度切ると戻せない。×ぶつぶつ再発なし：妊娠で出る。×乳頭は影響なし：授乳で大きくなる。×乳輪が授乳に影響：影響しない。", "basis": "一度切ると元には戻せない"}, {"id": "d-c5-08-2", "ch": "body", "card": "c5-08", "level": "dr", "q": "「乳輪を小さくしたい。そのあとハイブリッド豊胸もモニター価格で受けたい。乳輪の手術は、終わったらすぐ帰りたい」というお客様。乳輪縮小の当日のことと、豊胸のモニター価格で教材に合う案内は？", "choices": ["乳輪縮小は、終わればそのまま帰れる／ハイブリッド豊胸のモニター価格は¥548,000", "乳輪縮小は、術後に約2時間休んでから帰る／ハイブリッド豊胸のモニター価格は¥348,000", "乳輪縮小は、術後に約2時間休んでから帰る／ハイブリッド豊胸のモニター価格は¥548,000", "乳輪縮小は、終わればそのまま帰れる／ハイブリッド豊胸のモニター価格は¥348,000"], "answer": 2, "explain": "乳輪縮小は約60分で、体調を見るため術後は約2時間休んでから帰宅する。ハイブリッド豊胸のモニター価格は¥548,000（バッグ代は別途）で、モニターになれるかは医師の審査で決まる。×そのまま帰れる：副乳除去や乳頭縮小術のこと。×¥348,000：シリコンバッグ豊胸のモニター価格。", "basis": "体調を見るため約2時間休む"}, {"id": "a-c5-09-1", "ch": "body", "card": "c5-09", "level": "apply", "q": "「VIO脱毛のあとに形が気になりだし、下着や自転車のサドルでこすれて痛い」という相談。教材に合う案内は？", "choices": ["小陰唇縮小手術。デイズで受け、担当は女性医師になる", "小陰唇縮小手術。あおなぎで受け、料金は総額表示になる", "副皮除去。デイズで受け、担当は女性医師になる", "クリトリス（陰核）包茎手術。デイズで受け、担当は女性医師"], "answer": 0, "explain": "VIO脱毛のあとに気になりだした・下着やサドルでこすれて痛いは、いちばん相談が多い小陰唇縮小の悩み。婦人科形成はデイズだけで、女性医師が担当する。副皮除去は黒ずみ・においの原因になるヒダ、包茎手術は陰核をおおう皮が対象。あおなぎには取り扱いがない。", "basis": "下着や自転車のサドルでこすれて痛い"}, {"id": "a-c5-09-2", "ch": "body", "card": "c5-09", "level": "apply", "q": "婦人科形成の相談で「男性に見られるのは恥ずかしい。手術は来月の生理の時期に入れたい」と言われた。教材に合う案内は？", "choices": ["担当は女性医師で、スタッフも全員女性。日程は生理の期間をさけるのがよい", "担当は女性医師だが、スタッフは男女いる。日程は生理の期間をさけるのがよい", "担当は女性医師で、スタッフも全員女性。日程は生理中でも清潔なら問題ない", "担当は男性医師の場合もあり、スタッフは全員女性。日程は生理中でも問題ない"], "answer": 0, "explain": "婦人科形成は元産婦人科専門医などの女性医師が担当し、スタッフも全員女性が対応する。日程は、清潔を保つため生理の期間をさけて組むのがおすすめ（公式Q&A）。男性医師やスタッフが入る、生理中でも問題ない、という説明はない。", "basis": "元産婦人科専門医などの女性医師が担当し、スタッフも全員女性が対応する。"}, {"id": "d-c5-09-1", "ch": "body", "card": "c5-09", "level": "dr", "q": "通常価格で小陰唇縮小手術（Days式ではない）を受けて8か月のお客様。左右差が気になり再施術を希望。術前後の写真撮影には協力した。今回は静脈麻酔とガードルを希望している。教材に合う案内は？", "choices": ["保証の対象になりうる。施術代は無料で、静脈麻酔¥8,800とガードル¥10,000は通常料金で負担する", "保証の対象になりうる。施術代は無料で、静脈麻酔¥50,000とガードル¥10,000は通常料金で負担する", "保証の対象になりうる。施術代は無料で、静脈麻酔¥50,000は負担するが、ガードルはDays式と同じく込み", "写真で判定する保証はモニター価格の人だけ。通常価格なので対象外で、施術代も通常料金で負担する"], "answer": 1, "explain": "小陰唇縮小の保証は1年で、医師の診察と前後の写真で判定（撮影を断ると対象外）。再施術の施術代は無料、麻酔代・オプション代は通常料金。オプション表で静脈麻酔¥50,000、ガードル¥10,000（込みはDays式だけ）。×¥8,800：笑気の額。×ガードル込み：Days式のみ。×モニターだけ：撮影は保証の条件。", "basis": "再施術の施術代は無料だが、麻酔代・オプション代は通常料金がかかる。施術代の返金はない。"}, {"id": "a-c5-10-1", "ch": "body", "card": "c5-10", "level": "apply", "q": "二重あごが気になり、1回で終わらせたい。仕事は休みたくないので、包帯や圧迫バンドも避けたい。合うのは？", "choices": ["脂肪吸引注射", "脂肪溶解注射", "身体の脂肪吸引", "メディカルダイエット"], "answer": 0, "explain": "脂肪吸引注射は極細の針で脂肪を吸い出す小さな脂肪吸引で、公式の説明は顔（小顔・二重あご）が対象。回数の目安は1回で、圧迫バンドなしで過ごせる。溶解注射は3〜6回、身体の脂肪吸引は包帯固定あり、メディカルダイエットは注射5回。", "basis": "公式の説明は「顔」が対象。小顔・二重あご向けのメニュー。"}, {"id": "a-c5-10-2", "ch": "body", "card": "c5-10", "level": "apply", "q": "二重あごが気になるが「日本で承認されていない薬を体に入れるのは不安」。できれば1回で終わらせたい。教材に合う案内は？", "choices": ["脂肪溶解注射。カベリンなら国内で承認された薬で、1回で済む", "脂肪吸引注射。名前は注射だが薬は入れず、脂肪を吸い出す", "脂肪溶解注射。BNLSアルティメットは国内で承認された薬", "メディカルダイエット。飲み薬が中心で、未承認の薬は使わない"], "answer": 1, "explain": "脂肪吸引注射は極細の針で脂肪を吸い出す小さな脂肪吸引で、薬を入れない。回数の目安も1回で、公式の説明は顔（二重あご）が対象。脂肪溶解注射の2つの薬は国内未承認薬で3〜6回通う。メディカルダイエットは溶解注射＋飲み薬（オルリファストも日本では未承認）。", "basis": "名前は「注射」でも、やることは「吸引」"}, {"id": "d-c5-10-2", "ch": "body", "card": "c5-10", "level": "dr", "q": "二重あごの脂肪と、あご下の皮膚のゆるみが気になるお客様。「切る手術と眠る麻酔は嫌」という。脂肪吸引注射とHIFUを組み合わせる案内で、教材に合うものは？", "choices": ["吸引注射は静脈麻酔で眠って受ける。HIFUはドットで筋肉の膜（SMAS）を縮めて引き上げる。余った皮膚もHIFUで膜を縮めれば減らせる", "吸引注射は笑気＋局所で眠らずに受ける。HIFUはドットで筋肉の膜（SMAS）を縮めて引き上げる。余った皮膚そのものは切る手術でしか減らせない", "吸引注射は笑気＋局所で眠らずに受ける。HIFUはハイフシャワーで筋肉の膜（SMAS）まで熱を届ける。余った皮膚もHIFUで膜を縮めれば減らせる", "吸引注射は静脈麻酔で眠って受ける。HIFUはハイフシャワーで筋肉の膜（SMAS）まで熱を届ける。余った皮膚そのものは切る手術でしか減らせない"], "answer": 1, "explain": "脂肪吸引注射は笑気＋局所で眠らない。皮膚のたるみが心配な人は吸引注射が向かないとされ、脂肪が減ったぶん皮膚が余ることがある。HIFUのドットはSMASを点で熱して縮め引き上げるが、余った皮膚そのものは切る手術でしか減らせない。×静脈麻酔：眠らない。×ハイフシャワー：浅い層だけ。×HIFUで減らせる：切る手術だけ。", "basis": "笑気麻酔でリラックスしたあと、局所麻酔をする。"}, {"id": "a-c5-11-1", "ch": "body", "card": "c5-11", "level": "apply", "q": "お腹を1回でしっかり細くし、リバウンドもしにくい方法がいい。1週間ほどなら休みも取れる。合うのは？", "choices": ["身体の脂肪吸引", "脂肪溶解注射", "メディカルダイエット", "脂肪吸引注射"], "answer": 0, "explain": "身体の脂肪吸引は管で脂肪の細胞そのものを吸い出し、細胞の「数」が減るのでリバウンドしにくい。1回で終わるが、強い腫れ約1週間・包帯約2日。溶解注射は3〜6回、メディカルダイエットは注射5回＋飲み薬、吸引注射は公式の説明が顔。", "basis": "脂肪の細胞の「数」が減る。だからリバウンドしにくい。"}, {"id": "d-c5-11-1", "ch": "body", "card": "c5-11", "level": "dr", "q": "お腹（腹部全体）と頬の脂肪吸引を同じ日に受けて4か月のお客様。どちらも明らかな左右差がある。「担当医の予約は先まで埋まっているので、空いている先生に直してほしい」という。教材に合う案内は？", "choices": ["お腹：半年以降に、担当医が再施術する／頬：顔の脂肪吸引の保証は1か月で、期間外", "お腹：半年以降に、空いている別の医師が再施術する／頬：体の脂肪吸引と同じ保証1年で、期間内", "お腹：半年以降に、担当医が再施術する／頬：体の脂肪吸引と同じ保証1年で、期間内", "お腹：半年以降に、空いている別の医師が再施術する／頬：顔の脂肪吸引の保証は1か月で、期間外"], "answer": 0, "explain": "体の脂肪吸引は保証1年で、再施術は担当医が行い、原則として施術日から半年以降。顔の脂肪吸引の保証は1か月なので、4か月たった頬は期間外。×別の医師：再施術は担当医が行う。×頬も1年：顔の脂肪吸引は1か月。", "basis": "再施術は担当医が行い、原則として施術日から半年以降。"}, {"id": "a-c5-12-1", "ch": "body", "card": "c5-12", "level": "apply", "q": "来週から人前に出る仕事が続き、ダウンタイムは取れない。何回か通うのはかまわない。ダイエットしても落ちない二の腕を細くしたい。合うのは？", "choices": ["身体の脂肪吸引（二の腕）", "脂肪吸引注射", "脂肪溶解注射", "副乳除去"], "answer": 2, "explain": "脂肪溶解注射は薬で脂肪を溶かし、3〜6回に分けて減らす。お腹・二の腕などやせにくい所にも使え、翌日から仕事OK。身体の脂肪吸引は強い腫れ約1週間と包帯固定、脂肪吸引注射は公式の説明が顔、副乳除去はわきの組織を切って取る手術。", "basis": "お腹・二の腕など、ダイエットしてもやせにくい部分にも使う"}, {"id": "d-c5-12-1", "ch": "body", "card": "c5-12", "level": "dr", "q": "メディカルダイエットを検討中のお客様。「注射は3回くらいでよいので、単品で通うほうが合うかも」という。BNLSアルティメットを単品で受ける場合と、BNLSアルティメット スタンダード（¥398,000）を比べるために伝える内容で、教材に合うものは？", "choices": ["単品のBNLSアルティメットは1cc ¥9,000。スタンダードの注射は20cc×5回分", "単品のBNLSアルティメットは1cc ¥5,000。スタンダードの注射は16cc×5回分", "単品のBNLSアルティメットは1cc ¥9,000。スタンダードの注射は16cc×5回分", "単品のBNLSアルティメットは1cc ¥5,000。スタンダードの注射は20cc×5回分"], "answer": 3, "explain": "脂肪溶解注射の単品は1ccいくらで、BNLSアルティメットは1cc ¥5,000（総額は使う量×回数）。スタンダードは20cc×5回の注射に、オルリファスト1か月分とスムージーが付く。×¥9,000：カベリンの単価。×16cc：カベリンのコースの量。", "basis": "料金は1ccいくら。総額は「使う量×回数」で決まる"}, {"id": "a-c5-13-1", "ch": "body", "card": "c5-13", "level": "apply", "q": "健診で「お腹が出ているのは内臓脂肪が原因」と言われたお客様。教材の考え方に合う提案は？", "choices": ["身体の脂肪吸引で、お腹の内臓脂肪を吸い出す", "脂肪吸引注射で、内臓のまわりの脂肪を吸う", "脂肪溶解注射の単品で、内臓脂肪を溶かす", "食事療法と飲み薬で対策するメディカルダイエット"], "answer": 3, "explain": "吸引や溶解注射が相手にするのは、つまめる皮下脂肪。内臓脂肪は吸引では取れず、メディカルダイエットでは食事療法と飲み薬（オルリファスト）で対策する。脂肪吸引注射の公式の説明は顔が対象。", "basis": "お腹の中の内臓脂肪は増えると健康を害するので、食事療法と飲み薬で対策する。"}, {"id": "a-c5-13-2", "ch": "body", "card": "c5-13", "level": "apply", "q": "メディカルダイエットを検討中で「とにかく食欲がおさえられない」のが悩み。この悩みに合わせて選ぶなら？", "choices": ["BNLSアルティメット プレミアム", "BNLSアルティメット スタンダード", "脂肪溶解注射（BNLSアルティメット単品）", "カベリン スタンダード"], "answer": 0, "explain": "スタンダードとプレミアムの違いはGLP-1注射3本が入るかどうか。GLP-1は食後に小腸から出るホルモンで、食欲をおさえる。スタンダード（BNLS・カベリンとも）には食欲をおさえるGLP-1注射が入らない。溶解注射の単品は注射だけ。", "basis": "スタンダードとプレミアムの違いは、GLP-1注射3本が入るかどうか。"}, {"id": "a-c5-13-3", "ch": "body", "card": "c5-13", "level": "apply", "q": "メディカルダイエットについて、教材の説明と合わないものはどれ？", "choices": ["注射は1回でも実感でき、3〜5回でより実感するとされる", "同じ部分への次の注射は、1週間後から打てる", "飲み薬で、油もれや油っぽい便が出ることがある", "飲み薬は食欲に、GLP-1は脂肪の吸収に働く"], "answer": 3, "explain": "働く場所が逆。飲み薬（オルリファスト）は腸で脂肪の吸収をじゃまし、食べた脂肪の約30%を外へ出す。GLP-1は食後に小腸から出るホルモンで、食欲をおさえる。注射5回（1回でも実感・3〜5回でより実感）、同じ部分は1週間後から、飲み薬の油もれ・脂肪便は教材どおり。", "basis": "注射は「いまある脂肪」、飲み薬は「食べた脂肪の吸収」、GLP-1は「食欲」に働く。"}, {"id": "d-c5-13-1", "ch": "body", "card": "c5-13", "level": "dr", "q": "授乳中で、断乳まであと3か月のお客様。お腹は健診で内臓脂肪と言われ、わきのふくらみは診察で乳腺の組織と分かった。「今できることから始めたい」という。教材に合う案内は？", "choices": ["わきは副乳除去を今受けられ、術後3日間は授乳を控える。お腹は脂肪溶解注射の単品なら、授乳中でも今から始められる", "わきは副乳除去を今受けられ、術後3日間は授乳を控える。お腹は吸引では取れないので、断乳後にメディカルダイエットを検討", "わきも授乳中は手術できないので断乳後に回す。お腹も吸引では取れないので、断乳後にメディカルダイエットを検討", "わきは副乳除去を今受けられ、術後3日間は授乳を控える。お腹は断乳後に身体の脂肪吸引で、内臓脂肪を吸い出す"], "answer": 1, "explain": "副乳除去は授乳中も手術でき、術後3日間は授乳を控える。内臓脂肪は吸引では取れず食事・運動やメディカルダイエットの領域だが、メディカルダイエットも溶解注射も授乳中は受けられないので断乳後。×溶解注射は授乳中も可：受けられない。×わきも不可：副乳除去はできる。×吸引で内臓脂肪：取れない。", "basis": "20歳未満／妊娠中・授乳中・妊娠の可能性がある"}, {"id": "d-c5-13-4", "ch": "body", "card": "c5-13", "level": "dr", "q": "「以前、薬で吐き気が出やすかった」というお客様が、メディカルダイエットのコースで迷っている。注射のあとの痛みと、通う間隔も知りたいという。教材に合う案内は？", "choices": ["GLP-1が入らないのはスタンダード。注射の痛みはその日だけで、翌日には消える。同じ部分には1週間後から打てる", "GLP-1が入らないのはスタンダード。注射後2〜3日、筋肉痛のような痛みが出ることがある。同じ部分には1週間後から打てる", "GLP-1が入らないのはスタンダード。注射後2〜3日、筋肉痛のような痛みが出ることがある。同じ部分にも翌日から打てる", "食欲に働くのは飲み薬で、どちらのコースも同じ。注射後2〜3日、筋肉痛のような痛みが出ることがある。同じ部分には1週間後から打てる"], "answer": 1, "explain": "GLP-1注射はプレミアムだけで、副作用はサイトに記載がないため医師に確認する。脂肪溶解注射のあとは2〜3日、筋肉痛のような痛みが出ることがあり、同じ部分への次の注射は1週間後から。×その日だけ：2〜3日続くことがある。×翌日から：1週間後から。×飲み薬が食欲に：飲み薬は脂肪の吸収をおさえる。", "basis": "同じ部分への次の注射は1週間後から"}, {"id": "d-map-5c-2", "ch": "body", "card": "c5-13", "level": "dr", "q": "お腹が気になる2人。Aさんは「健診で内臓脂肪と言われた。食欲がおさえられない」。Bさんは「お腹全体につまめる脂肪がある。1回で減らしたい。モニター価格を希望」。教材に合う案内は？", "choices": ["Aさん：GLP-1が入るプレミアム／Bさん：極細の針で吸う脂肪吸引注射。モニター¥49,800は、申し出れば審査なしで決まる", "Aさん：GLP-1が入るスタンダード／Bさん：身体の脂肪吸引の腹部全体。モニター¥398,000は、申し出れば審査なしで決まる", "Aさん：GLP-1が入るプレミアム／Bさん：身体の脂肪吸引の腹部全体。モニター¥398,000は、条件と医師の審査しだい", "Aさん：GLP-1が入るスタンダード／Bさん：極細の針で吸う脂肪吸引注射。モニター¥49,800は、条件と医師の審査しだい"], "answer": 2, "explain": "内臓脂肪は食事療法と飲み薬で対策し、食欲に働くGLP-1はプレミアムのみ。お腹全体を1回で減らすなら身体の脂肪吸引で、腹部全体はモニター¥398,000。なれるかは条件4つと医師の審査で決まる。×スタンダード：GLP-1なし。×吸引注射：公式の説明は顔が対象。×審査なし：医師の審査がある。", "basis": "注射で補って、食欲と体重をコントロールする（プレミアムコースのみ）"}, {"id": "a-map-6-1", "ch": "skin", "card": "map-6", "level": "apply", "q": "「毛穴の開きとニキビ跡のでこぼこが主な悩み。鼻の黒ずみ（毛穴の汚れ）も少し気になる」。悩みの5分類の表に沿って、「まず候補」と「補助・組み合わせ」を正しく分けたのは？", "choices": ["まず候補＝e-cool／補助＝ピーリング", "まず候補＝ダーマペン4／補助＝ハイドラジェントル", "まず候補＝ニードルRF／補助＝白玉点滴", "まず候補＝ハイドラジェントル／補助＝ダーマペン4"], "answer": 1, "explain": "開き・ニキビ跡は「②凹凸・毛穴・ニキビ跡」で、まず候補は針のダーマペン4など。毛穴の汚れには②の補助にハイドラジェントルがある。2つ目はその逆。白玉点滴は①色の補助、e-coolは④うるおいのまず候補（①では補助）で、②の欄には無い。", "basis": "ピーリング／ハイドラジェントル（毛穴の汚れ）"}, {"id": "a-map-6-2", "ch": "skin", "card": "map-6", "level": "apply", "q": "「ニキビ跡のへこみ」は、基礎編の肌の層でいうとどこの問題で、悩みの5分類ではどんなメニューが候補になる？", "choices": ["表皮の問題で、ルメッカピークやピコトーニング", "真皮の問題で、ダーマペン4やニードルRF", "皮下脂肪の問題で、MiniFxやモフィウス8", "表皮の問題で、ハイドラジェントルや水光注射"], "answer": 1, "explain": "基礎編では色＝表皮、ハリ・へこみ＝真皮、たるみ＝もっと深い層。へこみは真皮の問題で、5分類の「②凹凸・毛穴・ニキビ跡」の候補が針（ダーマペン4）や針＋熱（ニードルRF）。光は色、脂肪の層は輪郭、水光などはうるおいの担当。", "basis": "ダーマペン4（針）、ニードルRF（針＋熱）、キュアジェット、サブシジョン、ピコフラクショナル"}, {"id": "a-map-6c-1", "ch": "skin", "card": "map-6c", "level": "apply", "q": "「針は絶対にいや。それでも美容成分を肌の中に入れたい。施術した当日からメイクもしたい」。合うのは？", "choices": ["キュアジェット", "水光注射", "ブレッシング", "e-cool"], "answer": 3, "explain": "針なしで成分を入れるのはe-coolとキュアジェット。e-coolは洗顔・メイク・入浴が当日からできる。キュアジェットはメイクが12時間後から（翌日推奨）。水光注射は細い針で、ブレッシングは斜めの針から熱と薬を入れるので条件に合わない。", "basis": "針なし。電気の力で成分をしみ込ませる"}, {"id": "a-c6-01-1", "ch": "skin", "card": "c6-01", "level": "apply", "q": "「デイズ新宿院に通っている。来週大事な会議があり休みは取れない。顔全体のシミと赤ら顔を一度に整えたい」。デイズの料金表の院の表記もふまえて、まず候補になるのは？", "choices": ["カスタマイザーIPL", "ピコトーニング", "ルメッカピーク", "ハイドラジェントル"], "answer": 2, "explain": "茶色と赤の両方に反応する光（IPL）が候補で、料金表が「新宿院」表記なのはルメッカピーク（メイクは当日から）。カスタマイザーIPLも光だが料金表は本厚木院の表記。ピコトーニングはくすみ・肝斑向けで、赤みは光の担当。ハイドラジェントルは毛穴そうじ。", "basis": "シミと赤みを1台で。光が茶色（メラニン）と赤（血管）の両方に反応するので、顔全体をまとめて整えられる。"}, {"id": "d-c6-01-1", "ch": "skin", "card": "c6-01", "level": "dr", "q": "「顔全体の赤ら顔と、頬の濃いシミ1個が気になる。今日施術を受けて、今夜は会食でメイクしたい」というお客様。教材に沿った案内は？", "choices": ["赤ら顔のルメッカはメイクが当日から可で今日受けられる。濃い1個のピコスポットはメイク翌日からで別の日に", "赤ら顔のルメッカはメイクが当日から可で今日受けられる。濃い1個のピコスポットも当日からメイク可で今日に", "赤ら顔のルメッカはメイク翌日からで別の日に。濃い1個のピコスポットも当日からメイク可で今日に", "赤ら顔のルメッカはメイク翌日からで別の日に。濃い1個のピコスポットはメイク翌日からで別の日に"], "answer": 0, "explain": "ルメッカは赤み（血管）にも反応し、メイク・洗顔・シャワーは当日から。シミ1個を狙うピコスポットは洗顔もメイクも翌日からなので、会食の日は避ける。×ルメッカは翌日から：当日から可。×ピコスポットも当日：翌日から。", "basis": "メイク・洗顔・シャワーは当日から"}, {"id": "d-c6-01-2", "ch": "skin", "card": "c6-01", "level": "dr", "q": "「昨日日焼けした。今日、顔のルメッカピークとワキの脱毛を両方受けた
