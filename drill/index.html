方を希望するお客様への説明として正しいのは？", "choices": ["同じ日にまとめて受けられる", "豊胸を先にしないと、乳輪縮小は受けられない", "乳輪縮小をすると、その後は豊胸を受けられない", "同じ日にはできず、豊胸は乳輪縮小の術後1か月以降になる"], "answer": 3, "explain": "乳輪縮小術は豊胸術と同時にはできない。豊胸を希望する場合は、乳輪縮小の術後1か月以降になる。両方の希望が出たら、最初に順番と間隔を伝える。"}, {"id": "c5-09-1", "ch": "body", "card": "c5-09", "level": 1, "q": "「婦人科形成」とはどんな手術？", "choices": ["デリケートゾーンの形を整える手術の総称", "胸の先の形を細かく整える手術の総称", "お腹の脂肪を細い管で吸い出す手術", "薬を注射して脂肪を溶かす施術"], "answer": 0, "explain": "婦人科形成は、デリケートゾーンの大きさ・形・たるみを、余分な皮膚を切り取って整える手術の総称。どの部分を整えるかで手術の名前が変わる。"}, {"id": "c5-09-2", "ch": "body", "card": "c5-09", "level": 1, "q": "婦人科形成で「クリトリスに皮がかぶっている」悩みに対応する手術は？", "choices": ["小陰唇縮小手術", "副皮除去", "クリトリス包茎手術", "大陰唇たるみ除去手術"], "answer": 2, "explain": "クリトリス（陰核）包茎手術は、かぶっている皮を一部取りのぞく。小陰唇縮小は小陰唇の大きさ、副皮除去はヒダ、大陰唇たるみ除去はたるみを整える手術。"}, {"id": "c5-09-3", "ch": "body", "card": "c5-09", "level": 1, "q": "婦人科形成を受ける目的として、教材に書かれているのは？", "choices": ["胸の形と大きさを整えること", "体重を大きく落としてやせること", "食欲をおさえて食べすぎを防ぐこと", "見た目に加え、蒸れなどの不快感を減らすこと"], "answer": 3, "explain": "婦人科形成は見た目だけが目的ではない。こすれる痛み・蒸れ・においなど、毎日の不快感を減らすために受ける人も多い。デリケートゾーンの形を整える手術の総称。"}, {"id": "c5-10-1", "ch": "body", "card": "c5-10", "level": 2, "q": "「脂肪吸引注射」と「脂肪溶解注射」の違いは？", "choices": ["吸引注射は極細の針で脂肪を吸い出し、溶解注射は薬を入れて脂肪を溶かす", "吸引注射は薬を入れて脂肪を溶かし、溶解注射は針で脂肪を吸い出す", "どちらも薬を入れて溶かす施術で、薬の種類だけが違う", "どちらも細い管で吸い出す施術で、管の太さだけが違う"], "answer": 0, "explain": "脂肪吸引注射は名前に注射と付くが、やることは吸引（薬を入れない小さな脂肪吸引）。脂肪溶解注射は薬を注射して脂肪を溶かし、3〜6回通う。"}, {"id": "c5-10-2", "ch": "body", "card": "c5-10", "level": 1, "q": "脂肪吸引注射は、公式の説明ではどこが対象？", "choices": ["顔", "お腹・太もも", "胸", "全身"], "answer": 0, "explain": "脂肪吸引注射の公式の説明は顔が対象で、小顔・二重あご向けのメニュー。体の部分やせには、細い管で吸い出す身体の脂肪吸引を案内する。"}, {"id": "c5-11-1", "ch": "body", "card": "c5-11", "level": 1, "q": "身体の脂肪吸引がリバウンドしにくいとされるのはなぜ？", "choices": ["食欲をおさえる薬を使うから", "食べた脂肪の吸収をおさえるから", "脂肪の細胞の数そのものが減るから", "吸った脂肪を胸に移すから"], "answer": 2, "explain": "脂肪吸引は脂肪の細胞そのものを吸い出し、細胞の数が減るのでリバウンドしにくい。ただし不摂生を続けると太ることはある。食欲や吸収をおさえるのはメディカルダイエット。"}, {"id": "c5-11-2", "ch": "body", "card": "c5-11", "level": 2, "q": "身体の脂肪吸引のダウンタイムとして、教材に書かれているのは？", "choices": ["ダウンタイムはほぼなし", "強い腫れが約1週間、包帯で約2日押さえる", "腫れは1〜2週間あるが、おさえるバンドは不要", "直後に腫れ、まれに内出血がある程度"], "answer": 1, "explain": "身体の脂肪吸引は痩身の中でいちばん負担が大きく、強い腫れが約1週間、包帯で約2日押さえる。バンド不要は脂肪吸引注射、ほぼなしはメディカルダイエット。"}, {"id": "c5-11-4", "ch": "body", "card": "c5-11", "level": 1, "q": "2026年10月時点で、デイズの身体の脂肪吸引（二の腕・お腹・太ももなど）1部位の通常料金は？", "choices": ["¥69,800", "¥110,000", "¥230,000", "¥148,000"], "answer": 3, "explain": "身体の脂肪吸引は1部位いくらの均一制で、1部位¥148,000（モニター¥120,000）。¥110,000は副乳（脇肉）、¥230,000は腰、¥69,800は脂肪吸引注射の料金。"}, {"id": "c5-12-1", "ch": "body", "card": "c5-12", "level": 1, "q": "脂肪溶解注射（ボディ）に通う回数の目安は？", "choices": ["1回", "10〜15回", "3〜6回", "注射5回＋飲み薬1か月分"], "answer": 2, "explain": "脂肪溶解注射は薬で脂肪を少しずつ溶かすので、3〜6回くり返して通う。1回で終わるのは吸い出す方法。注射5回＋飲み薬はメディカルダイエットの中身。"}, {"id": "c5-13-1", "ch": "body", "card": "c5-13", "level": 1, "q": "メディカルダイエットの「スタンダード」と「プレミアム」の違いは？", "choices": ["GLP-1注射3本が入るかどうか", "注射する薬の種類", "飲み薬（オルリファスト）が付くかどうか", "食事指導が付くかどうか"], "answer": 0, "explain": "スタンダードとプレミアムの違いは、食欲をおさえるGLP-1注射3本が入るかどうか。注射する薬の種類と量の違いは、BNLSとカベリンの違い。"}, {"id": "c5-13-2", "ch": "body", "card": "c5-13", "level": 2, "q": "メディカルダイエットの飲み薬（オルリファスト）は、どんな働きをする？", "choices": ["脳に働いて食欲そのものをおさえる", "皮膚の下にある脂肪を溶かして減らす", "脂肪の細胞を管で吸い出す", "食べた脂肪の約30%を吸収させない"], "answer": 3, "explain": "オルリファストは腸で脂肪を分解する酵素をじゃまし、食べた脂肪の約30%を吸収させない。食欲をおさえるのはGLP-1注射、脂肪を溶かすのは脂肪溶解注射。"}, {"id": "map-5-1", "ch": "body", "card": "map-5", "level": 1, "q": "豊胸の3つの方法は、主に何の違いで分かれる？", "choices": ["使う麻酔の種類", "切る場所の数", "胸の中に入れるもの", "通う回数"], "answer": 2, "explain": "豊胸は「何を入れるか」で3つに分かれる。人工の袋か、自分の脂肪か、その両方か。入れるものが決まると、大きくできる量・さわり心地・傷・料金がほぼ決まる。"}, {"id": "map-5-2", "ch": "body", "card": "map-5", "level": 2, "q": "やせ型で「しっかり大きく、でも自然に見せたい」人に向いている豊胸は？", "choices": ["ハイブリッド豊胸", "シリコンバッグ豊胸", "脂肪注入（脂肪豊胸）", "脂肪豊胸・コンデンスリッチファット"], "answer": 0, "explain": "ハイブリッド豊胸は袋で大きさを出し、上に自分の脂肪を足して袋の輪郭をかくす。袋だけだと、やせ型では輪郭が出やすい。脂肪だけでは1〜2カップまで。"}, {"id": "map-5-3", "ch": "body", "card": "map-5", "level": 2, "q": "「体に袋を入れたくない」「ついでに脂肪も減らしたい」人に向いている豊胸は？", "choices": ["シリコンバッグ豊胸", "ハイブリッド豊胸", "Days式シリコンバッグ豊胸", "脂肪豊胸"], "answer": 3, "explain": "脂肪豊胸は自分の脂肪だけを入れ、人工物を使わない。脂肪を吸った所も細くなる。シリコンバッグ豊胸とハイブリッド豊胸は、どちらも袋を入れる。"}, {"id": "map-5b-1", "ch": "body", "card": "map-5b", "level": 1, "q": "胸まわりの小さな手術5つは、何で区別すると覚えやすい？", "choices": ["どの部分を直すか", "胸に何を入れるか", "脂肪をどうするか", "何回通うか"], "answer": 0, "explain": "小さな手術5つは名前が似ているので「どの部分の話か」で覚える。輪（乳輪）、輪の中のぶつぶつ、中央の突起（乳頭）、わきのふくらみ（副乳）。"}, {"id": "map-5c-1", "ch": "body", "card": "map-5c", "level": 1, "q": "痩身（体を細くする）メニューの違いは、主に何で分かれる？", "choices": ["胸に何を入れるか", "脂肪をどうするか", "どの部分の形を直すか", "麻酔の種類"], "answer": 1, "explain": "痩身メニューの違いは脂肪をどうするか。細い管で吸い出すか、薬で溶かすか、飲み薬と注射で食欲や吸収をおさえるかの3ルートに分かれる。"}, {"id": "map-5c-2", "ch": "body", "card": "map-5c", "level": 2, "q": "痩身の3ルートを、強さとダウンタイムの重い順に並べると？", "choices": ["薬で溶かす ＞ 吸い出す ＞ 飲み薬・注射でおさえる", "飲み薬・注射でおさえる ＞ 薬で溶かす ＞ 吸い出す", "吸い出す ＞ 薬で溶かす ＞ 飲み薬・注射でおさえる", "吸い出す ＞ 飲み薬・注射でおさえる ＞ 薬で溶かす"], "answer": 2, "explain": "強さとダウンタイムは、吸い出す（脂肪吸引）＞薬で溶かす（脂肪溶解注射）＞飲み薬・注射でおさえる（メディカルダイエット）の順。強いものほど回数は少ない。"}, {"id": "c6-01-1", "ch": "skin", "card": "c6-01", "level": 1, "q": "ルメッカピーク（IPL）は、ひとことで言うとどんな施術？", "choices": ["細い針で美容成分を顔全体に入れる", "強い光を顔全体に当てて、シミと赤みのもとを熱で壊す", "ほくろを電気メスで丸くくり抜く", "針を使わず外から高周波で脂肪を減らす"], "answer": 1, "explain": "ルメッカピークは光（IPL）の施術。光は色の濃いところにだけ吸われて熱になるので、シミの色と赤みのもとだけを壊して薄くしていく。"}, {"id": "c6-01-2", "ch": "skin", "card": "c6-01", "level": 1, "q": "ルメッカピークのあと、シミが一度濃くなるのはなぜ？", "choices": ["やけどをしたサインだから", "光が効かなかったサインだから", "壊れた色が表面に出てきた合図だから", "新しいシミができ始めたから"], "answer": 2, "explain": "シミが一度濃くなるのは失敗ではなく、壊れた色が表面に出てきた合図。浮き出たシミは、1〜2週間ほどで自然に剥がれ落ちていく。"}, {"id": "c6-01-3", "ch": "skin", "card": "c6-01", "level": 2, "q": "シミ治療で、光（IPL）とディスカバリーピコのスポット照射の使い分けは？", "choices": ["光はシミ1個を狙って、ピコのスポットは顔全体を広く", "どちらも同じ機械で、名前が違うだけ", "光はタトゥー除去、ピコのスポットは赤み（血管）の担当", "光は顔全体を広くまとめて、ピコのスポットはシミ1個を狙って強く"], "answer": 3, "explain": "光（IPL）は顔全体を広く・まとめて整え、ピコのスポットは濃いシミ1個を狙って強く当てる。赤み（血管）は光の担当、タトゥー除去はピコ。"}, {"id": "c6-01-4", "ch": "skin", "card": "c6-01", "level": 2, "q": "IPL（光）とレーザーでは、当てる「光」そのものがどう違う？", "choices": ["IPLはいろいろな色が混ざった光、レーザーは1色だけの光", "IPLは1色だけの光、レーザーはいろいろな色が混ざった光", "IPLは光ではなく電気、レーザーは光", "まったく同じ光で、呼び方が違うだけ"], "answer": 0, "explain": "IPLはいろいろな色（波長）が混ざった強い光、レーザーは1色だけの光で、厳密には別のもの。デイズのサイトは「IPLレーザー機器」と書いている。"}, {"id": "c6-02-1", "ch": "skin", "card": "c6-02", "level": 2, "q": "ルメッカピークとカスタマイザーIPLの違いとして正しいのは？", "choices": ["カスタマイザーIPLは1色だけのレーザーを使う", "カスタマイザーIPLは針の先から熱を出す", "カスタマイザーIPLは6種類のフィルターで調整できる", "ルメッカピークは光ではなく薬を塗る施術"], "answer": 2, "explain": "どちらも同じ光（IPL）の施術。ルメッカは出力の高さが売り、カスタマイザーIPLは6種類のフィルターで肌と悩みに合わせて光を作り分けるのが売り。"}, {"id": "c6-03-1", "ch": "skin", "card": "c6-03", "level": 1, "q": "ディスカバリーピコ（ピコレーザー）は、シミの色のもとをどうする？", "choices": ["一瞬の衝撃で細かく砕く", "熱でじっくり溶かす", "酸の薬で溶かす", "針で吸い出す"], "answer": 0, "explain": "ピコはごく一瞬だけ光るレーザーの衝撃で、色のもとを砂つぶのように細かく砕く。細かくなった色は、体が少しずつ片づけてくれる。"}, {"id": "c6-03-2", "ch": "skin", "card": "c6-03", "level": 2, "q": "ディスカバリーピコの当て方のうち、くすみ・肝斑に向くのは？", "choices": ["トーニング（弱く・広く）", "スポット（1個を強く）", "フラクショナル（点々と奥へ）", "サブシジョン（針で筋を切る）"], "answer": 0, "explain": "トーニングは弱い光を顔全体にくり返し、色を少しずつ砕く当て方で、くすみ・肝斑向き。スポットはシミ1個、フラクショナルはニキビ跡・毛穴向け。"}, {"id": "c6-03-3", "ch": "skin", "card": "c6-03", "level": 2, "q": "顔の「赤み（細い血管）」が気になる人に、まず候補になるのは？", "choices": ["ディスカバリーピコのスポット", "ルメッカピーク", "ダーマペン4", "ハイドラジェントル"], "answer": 1, "explain": "光（IPL）は茶色（メラニン）と赤（血管）の両方に反応するので、赤みも担当。ピコのページには赤み（血管）は書かれていない。"}, {"id": "c6-04-1", "ch": "skin", "card": "c6-04", "level": 1, "q": "水光注射（ハイコックス）は、どんな施術？", "choices": ["固めのヒアルロン酸で、1か所に形を作る", "美容成分を細い針で、顔全体に同じ深さで均一に入れる", "光を当てて、シミの色を壊す", "水の流れで、毛穴の汚れを吸い取る"], "answer": 1, "explain": "水光注射は、専用の機械の細い針で美容成分を顔全体に同じ深さで均一に入れる。形を作るヒアルロン酸注入や、毛穴そうじのハイドラジェントルとは別物。"}, {"id": "c6-04-2", "ch": "skin", "card": "c6-04", "level": 2, "q": "水光注射と、しわ・輪郭のヒアルロン酸注入との違いは？", "choices": ["水光注射は肌質のために、顔全体へ浅く広く入れる", "水光注射は1か所に固めの製剤で形を作る", "水光注射は針を使わず空気の圧力で入れる", "水光注射は熱で肌を引き締める"], "answer": 0, "explain": "しわや輪郭のヒアルロン酸は、1か所に形を作るための固めの製剤。水光注射は肌質のために顔全体へ浅く広く入れ、熱は使わない。"}, {"id": "c6-05-1", "ch": "skin", "card": "c6-05", "level": 1, "q": "「ニードルRF」という名前は、どういう意味？", "choices": ["針を使わず、外から熱を当てる機械", "針で穴をあけるだけで、熱は出ない機械", "一瞬だけ光るレーザーの機械", "針の先から熱を出す機械"], "answer": 3, "explain": "ニードル＝針、RF＝高周波（電気の力で起こす熱）。つまり「針の先から熱を出す機械」。外から当てるのはインモード、針だけはダーマペン4。"}, {"id": "c6-05-2", "ch": "skin", "card": "c6-05", "level": 2, "q": "ダーマペン4とニードルRFの違いは？", "choices": ["ダーマペン4は針＋熱、ニードルRFは針だけ", "ダーマペン4は針だけ、ニードルRFは針＋熱", "ダーマペン4は光、ニードルRFは針", "どちらも針＋熱で、違いは値段だけ"], "answer": 1, "explain": "ダーマペン4は針だけ（熱なし）で、治る力でハリを作らせる。ニードルRFは針の先から熱（高周波）を出すぶん、引き締めの働きが加わる。"}, {"id": "c6-05-3", "ch": "skin", "card": "c6-05", "level": 1, "q": "ニードルRFの効果の出方と、すすめられている受け方は？", "choices": ["直後に完成し、1回だけ受ければ終わる", "1週間後に実感し、毎週続けて受ける", "半年後に実感が出て、1回だけ受ける", "実感は1〜3か月後が多く、4〜6週ごとに3〜6回"], "answer": 3, "explain": "ニードルRFは治る過程でハリの繊維が増えるので、効果はゆっくり。実感は1〜3か月後が多く、4〜6週間ごとに3〜6回がすすめられている。"}, {"id": "c6-06-1", "ch": "skin", "card": "c6-06", "level": 1, "q": "ブレッシングの針の特徴は？", "choices": ["針を使わない", "24本の針を脂肪の層まで刺す", "針を斜めに刺す", "針で硬い筋を切り離す"], "answer": 2, "explain": "ブレッシングは針を斜めに刺すのが特徴で、表面に大きな負担をかけずに奥へ届くとサイトは説明。24本の針はモフィウス8、筋を切るのはサブシジョン。"}, {"id": "c6-06-2", "ch": "skin", "card": "c6-06", "level": 2, "q": "ブレッシングと水光注射の違いは？", "choices": ["ブレッシングは薬に加えて、熱による引き締めが加わる", "ブレッシングは針を使わず電気で薬を入れる", "水光注射のほうが熱を強く使う", "ブレッシングは薬を入れず熱だけ"], "answer": 0, "explain": "水光注射は熱を使わず、針で薬だけを入れる。ブレッシングは同じ針の先から熱（高周波）も出すので、熱による引き締めが加わる。"}, {"id": "c6-07-1", "ch": "skin", "card": "c6-07", "level": 1, "q": "キュアジェットがいちばん得意とする悩みは？", "choices": ["赤ら顔（細い血管）", "ワキのにおい", "ほくろ", "ニキビ跡のへこみ"], "answer": 3, "explain": "キュアジェットの得意はニキビ跡のへこみ。へこみの原因である肌の奥の固まった組織を、針を使わず空気の力でほぐしながら、薬も届ける。"}, {"id": "c6-07-2", "ch": "skin", "card": "c6-07", "level": 2, "q": "キュアジェットとサブシジョンの違いは？", "choices": ["キュアジェットは針で切り、サブシジョンは空気の力で行う", "キュアジェットはシミの色を砕き、サブシジョンは毛穴を洗う", "どちらも熱で脂肪を溶かす", "考え方は同じで、キュアジェットは空気の力、サブシジョンは針で切り離す"], "answer": 3, "explain": "どちらも、へこみを下に引っぱる固まりを切り離す考え方。サブシジョンは針で切り離し、キュアジェットは針を使わず空気の力で行う。"}, {"id": "c6-08-1", "ch": "skin", "card": "c6-08", "level": 1, "q": "インモードリフト（Forma／MiniFx）は、どうやって熱を届ける？", "choices": ["針を使わず、肌の外から高周波の熱を当てる", "細い針を刺し、針の先から熱を出す", "光を色の濃いところに吸わせる", "斜めの針から熱と薬を同時に入れる"], "answer": 0, "explain": "インモードリフトは「熱だけ」の機械で、針を使わず肌の外から高周波の熱を当てる。針の先から熱を出すのはニードルRFやモフィウス8。"}, {"id": "c6-08-2", "ch": "skin", "card": "c6-08", "level": 2, "q": "インモードリフトとモフィウス8バーストの違いは？", "choices": ["インモードは針を刺し、モフィウス8は外から当てる", "インモードは外から当て、モフィウス8は針を刺して中から熱を出す", "インモードは光、モフィウス8はレーザーを使う", "インモードは薬を入れ、モフィウス8は入れない"], "answer": 1, "explain": "どちらも高周波の熱。インモードリフトは外から当て、モフィウス8バーストは針を刺して中から熱を出すので、より深く強く届くが、麻酔が必要で針のあとも出る。"}, {"id": "c6-09-1", "ch": "skin", "card": "c6-09", "level": 2, "q": "次のうち、施術の直後から洗顔・メイクができるのは？", "choices": ["モフィウス8バースト", "インモードリフト", "ダーマペン4", "ブレッシング"], "answer": 1, "explain": "インモードリフトは針を使わず外から温めるので、直後から洗顔・メイクができる。モフィウス8バーストとダーマペン4はメイク24時間後から、ブレッシングは翌日から。"}, {"id": "c6-09-2", "ch": "skin", "card": "c6-09", "level": 1, "q": "モフィウス8バーストが、フェイスライン・二重あごも対象にできるのはなぜ？", "choices": ["脂肪の層まで熱が届くから", "光が脂肪の色に吸われるから", "薬で脂肪を溶かすから", "空気の圧力で脂肪を押し出すから"], "answer": 0, "explain": "モフィウス8バーストは「針＋熱」の中でいちばん深く、ハリの層だけでなく脂肪の層まで熱が届く。だからフェイスライン・二重あごも対象になる。"}, {"id": "c6-10-1", "ch": "skin", "card": "c6-10", "level": 1, "q": "ダーマペン4は「何を使う施術」に分類される？", "choices": ["針＋熱（針の先から高周波）", "光（IPL）", "針だけ（熱も電気も使わない）", "熱だけ（外から高周波）"], "answer": 2, "explain": "ダーマペン4は「針だけ」の施術で、熱も電気も使わない。ニードルRFやモフィウス8バーストとの違いは、針の先から熱が出ないこと。"}, {"id": "c6-11-1", "ch": "skin", "card": "c6-11", "level": 1, "q": "サブシジョンは、ニキビ跡の凹みに何をする治療？", "choices": ["針で小さな穴をたくさんあけ、治る力でハリを作る", "酸の薬を塗って、古い角質を入れ替える", "凹みを下に引っ張る硬い筋を、針で切り離す", "光を当てて、凹みの色を砕く"], "answer": 2, "explain": "サブシジョンは凹みの「原因」を切る治療。肌の奥で皮膚を引き込む硬い筋を針で切り離して持ち上げる。穴をあけて底上げするのはダーマペン4。"}, {"id": "c6-12-1", "ch": "skin", "card": "c6-12", "level": 1, "q": "ピーリング（コラーゲンピール／ミラノリピール）は、どんな施術？", "choices": ["水の流れで毛穴の汚れを吸い取る", "電気で美容成分をしみ込ませる", "酸の薬を肌に塗ってなじませる", "細い針で小さな穴をあける"], "answer": 2, "explain": "ピーリングは塗るだけの施術。酸の薬を塗ってなじませ、針も機械も使わず15〜30分で終わる。水の流れで洗うのはハイドラジェントル。"}, {"id": "c6-12-2", "ch": "skin", "card": "c6-12", "level": 2, "q": "コラーゲンピールとミラノリピールの違いは？", "choices": ["コラーゲンピールのほうが酸が濃く、皮むけが起きやすい", "ミラノリピールのほうが酸が濃く、皮むけが起きやすい", "ミラノリピールは針を使い、コラーゲンピールは使わない", "2つは同じ薬で、名前が違うだけ"], "answer": 1, "explain": "薬は2種類。コラーゲンピールは刺激が少なめ。ミラノリピールは酸が少し濃く、皮むけが起きやすい代わりに、肌の入れ替わりを強く促す。"}, {"id": "c6-13-1", "ch": "skin", "card": "c6-13", "level": 1, "q": "ハイドラジェントルは、ひとことで言うとどんな施術？", "choices": ["酸の薬を塗って、肌の奥のコラーゲンを増やす", "水の流れで毛穴の汚れを洗い、同時に吸い取る「毛穴そうじ」", "針で穴をあけて、毛穴を引き締める", "光を当てて、毛穴の黒い色を壊す"], "answer": 1, "explain": "ハイドラジェントルは、薬液をまぜた水の流れで毛穴の汚れを洗い、同時に吸い取る「毛穴そうじ」。熱も針も使わず、こすらずに汚れを浮かせて吸う。"}, {"id": "c6-13-2", "ch": "skin", "card": "c6-13", "level": 1, "q": "ハイドラジェントル1回（約30分）で行う3つのケアは？", "choices": ["麻酔クリーム・針・保湿パック", "光・レーザー・冷却", "切開・縫合・抜糸", "クレンジング・ピーリング・美容液導入"], "answer": 3, "explain": "1回でクレンジング→ピーリング→美容液導入を約30分でまとめて行う。痛みもダウンタイムもほぼなく、直後からメイクできる。"}, {"id": "c6-13-3", "ch": "skin", "card": "c6-13", "level": 2, "q": "毛穴の黒ずみのうち、ハイドラジェントルの得意分野は？", "choices": ["毛穴のまわりの肌が茶色く色づいたもの", "角栓の先が空気にふれて黒くなったもの", "毛穴が開いて影になっているもの", "ニキビ跡のへこみ"], "answer": 1, "explain": "角栓の先が黒くなったものは洗って取れるので、この施術の得意分野。肌が茶色く色づいたものや開いて影になったものは、光・レーザーや引き締める施術のほうが合う。"}, {"id": "c6-14-1", "ch": "skin", "card": "c6-14", "level": 1, "q": "e-cool（エレクトロポレーション）は、どうやって美容成分を入れる？", "choices": ["細い針で、同じ深さに均一に入れる", "空気の圧力で撃ち込む", "斜めの針から熱と一緒に入れる", "電気ですき間を作り、針を使わずに入れる"], "answer": 3, "explain": "e-coolは電気の力で肌の表面に一時的なすき間を作り、針を使わずに成分を奥へ入れる。すき間はすぐ閉まるので傷は残らない。"}, {"id": "c6-14-2", "ch": "skin", "card": "c6-14", "level": 2, "q": "e-coolとニードルRFは、どちらも電気を使う。違いは？", "choices": ["e-coolは熱を起こして引き締め、ニードルRFは成分の通り道を開ける", "どちらも成分の通り道を開けるためで、違いは値段だけ", "e-coolの電気は成分の通り道を開けるため、ニードルRFは熱を起こして引き締めるため", "e-coolの電気は脂肪を温めて減らすため"], "answer": 2, "explain": "ニードルRFなど高周波（RF）の機械は、電気で肌の中に熱を起こして引き締める。e-coolの電気は成分の通り道を開けるためのもので、目的が違う。"}, {"id": "c6-15-1", "ch": "skin", "card": "c6-15", "level": 1, "q": "シミは光で薄くするのに、ほくろは「取る」のはなぜ？", "choices": ["ほくろは血管のかたまりだから", "ほくろには色のもとが無いから", "ほくろは色を持つ細胞のかたまりだから", "ほくろは脂肪の層だけにあるから"], "answer": 2, "explain": "ほくろは色を持つ細胞のかたまりなので、シミのように光で砕くのではなく、物として取りのぞく。小さめは電気メスでくり抜き、大きめは切って縫う。"}, {"id": "c6-15-2", "ch": "skin", "card": "c6-15", "level": 1, "q": "大きく、根が深いほくろの取り方は？", "choices": ["まわりごと切り取って縫う（切開法）", "電気メスで丸くくり抜く（くりぬき法）", "ピコスポットで色を砕く", "光（IPL）を何回か当てる"], "answer": 0, "explain": "取り方は大きさと深さで決まる。小さめは電気メスで丸くくり抜き、大きい・盛り上がっている・根が深いものは、まわりごと切り取って縫う。"}, {"id": "c6-16-1", "ch": "skin", "card": "c6-16", "level": 1, "q": "シミ・くすみの悩みで処方される内服のセットは？", "choices": ["ニキビ内服（シナール・ピドキサール・リボフラビン）", "シンエック", "美肌内服（シナール・トラネキサム酸・ユベラ）", "イソトレチノイン"], "answer": 2, "explain": "シミ・くすみには「美肌内服」、ニキビには「ニキビ内服」の3種セット。シンエックは手術後の腫れ・内出血用、イソトレチノインは重いニキビ用。"}, {"id": "c6-16-2", "ch": "skin", "card": "c6-16", "level": 2, "q": "内服と、光・レーザーの役割の違いは？", "choices": ["内服はいまあるシミをすぐ消し、光・レーザーは予防だけ", "光・レーザーはいまあるシミ、内服は新しいシミの予防", "同じ役割なので、一緒には使えない", "内服は脂肪を減らし、光・レーザーはシミを消す"], "answer": 1, "explain": "ルメッカピークやディスカバリーピコは、いまあるシミを外から直接ねらう。内服は新しいシミを作らせにくくする土台づくりで、組み合わせて使える。"}, {"id": "c6-17-1", "ch": "skin", "card": "c6-17", "level": 1, "q": "ドクターズコスメとは？", "choices": ["医療機関だけで買える化粧品で、家で毎日使う", "院内で医師だけが使う施術用の薬", "どこのお店でも買える市販の化粧品", "点滴で血管に入れる美容成分"], "answer": 0, "explain": "ドクターズコスメは医療機関だけで買える化粧品。院内の施術の「続き」を家でやる道具として、治療のあとや毎日の肌の手入れに使う。"}, {"id": "c6-18-1", "ch": "skin", "card": "c6-18", "level": 1, "q": "白玉点滴の主成分は？", "choices": ["トラネキサム酸", "ヒアルロン酸", "グルタチオン", "ハイドロキノン"], "answer": 2, "explain": "白玉点滴は、美白成分グルタチオンを点滴で血管に入れ、全身のくすみ・シミ予防をねらう美容点滴。成分は顔だけでなく全身に届く。"}, {"id": "c6-18-2", "ch": "skin", "card": "c6-18", "level": 2, "q": "白玉点滴と内服は、どちらも内側から効かせる。違いは？", "choices": ["点滴は来院して血管に直接入れ、内服は家で毎日飲む", "点滴は家で毎日、内服は来院して受ける", "点滴は顔だけ、内服は全身に効く", "点滴は肌に塗り、内服は飲む"], "answer": 0, "explain": "どちらも内側からシミのもとをおさえる。内服は家で毎日飲み、白玉点滴は来院して血管に直接入れる。点滴は顔だけでなく全身に届く。"}, {"id": "c6-19-1", "ch": "skin", "card": "c6-19", "level": 1, "q": "医療脱毛のレーザーは、何に反応して毛を生えにくくする？", "choices": ["毛のまわりの細い血管", "汗を出す汗腺", "肌のハリの繊維", "毛の黒い色"], "answer": 3, "explain": "レーザーの光は毛の黒い色（メラニン）に吸われて熱になり、その熱が根もとの「毛を作る組織」を壊す。まわりの肌は黒くないので熱くなりにくい。"}, {"id": "c6-19-2", "ch": "skin", "card": "c6-19", "level": 2, "q": "医療脱毛が1回で終わらず、何回も通う必要があるのはなぜ？", "choices": ["1回目は弱い出力しか当てられない決まりだから", "壊した毛を作る組織が、毎回すぐ元に戻るから", "よく効くのは育っている毛だけで、生えかわりに周期があるから", "肌の赤みが引くまで、ほかの部位に当てられないから"], "answer": 2, "explain": "毛は「育つ→抜ける準備→お休み」の周期をくり返す。レーザーがよく効くのは根もとまで黒い育っている毛だけなので、お休みの毛が生えるのを待って次をあてる。"}, {"id": "c6-20-1", "ch": "skin", "card": "c6-20", "level": 1, "q": "ワキの「におい（ワキガ）」の原因になる汗腺は？", "choices": ["エクリン汗腺", "皮脂を出す毛穴", "毛を作る組織", "アポクリン汗腺"], "answer": 3, "explain": "におい（ワキガ）のもとはアポクリン汗腺。量が多い汗（多汗症）はエクリン汗腺が原因で、「におい」と「汗の量」はそもそも別の悩み。"}, {"id": "c6-20-2", "ch": "skin", "card": "c6-20", "level": 2, "q": "ワキの悩みの説明として正しいのは？", "choices": ["においも汗の量も、同じエクリン汗腺が原因", "においはエクリン汗腺、汗の量はアポクリン汗腺が原因", "においの原因は毛なので、医療脱毛で治る", "においはアポクリン汗腺、汗の量はエクリン汗腺が原因で、別の悩み"], "answer": 3, "explain": "「におい」と「汗の量」は別の悩み。ワキガはアポクリン汗腺、多汗症はエクリン汗腺が原因。医療脱毛は毛を減らすもので、汗腺には働かない。"}, {"id": "c6-20-3", "ch": "skin", "card": "c6-20", "level": 2, "q": "ワキ汗治療の「手術」と「ボトックス注射」の違いは？", "choices": ["注射は汗腺を取るので長く続き、手術は数か月で切れる", "どちらも汗腺を取りのぞく方法で、傷の大きさだけが違う", "注射のほうがワキを長く固定する必要がある", "手術は汗腺を取るので長く続き、注射は指令を止めるので手軽だが期限つき"], "answer": 3, "explain": "手術はにおいの汗腺を「取る」ので長く続く。ボトックス注射は「汗を出せ」の指令を「止める」ので、切らずに受けられるが数か月で効果が切れる。"}, {"id": "map-6-1", "ch": "skin", "card": "map-6", "level": 1, "q": "「シミ・そばかす・くすみ・赤み」は、肌の悩みの5分類のどれ？", "choices": ["② 凹凸・毛穴", "③ ハリ・たるみ", "① 色", "④ うるおい・ツヤ"], "answer": 2, "explain": "シミ・そばかす・くすみ・赤みは「① 色」の悩み。光（IPL）やピコレーザーで色のもとを壊すのが、まず候補になる主な手段。"}, {"id": "map-6-2", "ch": "skin", "card": "map-6", "level": 1, "q": "悩み別の早見表で、「凹凸・毛穴・ニキビ跡」の欄にまず候補として挙がっているのは？", "choices": ["ルメッカピークやカスタマイザーIPL", "ダーマペン4やニードルRF", "水光注射やe-cool", "内服や白玉点滴"], "answer": 1, "explain": "凹凸・毛穴・ニキビ跡には、針（ダーマペン4）や針＋熱（ニードルRF）などで、肌に作り直しをうながすメニューがまず候補になる。"}, {"id": "map-6-3", "ch": "skin", "card": "map-6", "level": 1, "q": "「小じわ・ゆるみ・フェイスライン」など、ハリ・たるみの悩みでまず候補になるメニューは？", "choices": ["ほくろ除去やいぼ除去", "医療脱毛やワキ汗治療", "ハイドラジェントル（毛穴そうじ）", "インモードリフトやモフィウス8バースト"], "answer": 3, "explain": "ハリ・たるみには、熱（高周波）で肌の土台を引き締めるインモードリフト（熱だけ）やモフィウス8バースト（針＋熱）がまず候補になる。"}, {"id": "map-6-4", "ch": "skin", "card": "map-6", "level": 1, "q": "「乾燥・キメの乱れ・ツヤがない」悩みで、まず候補になるメニューは？", "choices": ["ディスカバリーピコのスポット", "サブシジョン", "ほくろ除去", "水光注射やe-cool"], "answer": 3, "explain": "うるおい・ツヤの悩みには、美容成分を肌の中に直接入れる水光注射やe-coolがまず候補。ピコのスポットはシミ1個、サブシジョンはへこみ向け。"}, {"id": "map-6-5", "ch": "skin", "card": "map-6", "level": 1, "q": "肌の悩みの5分類のうち「⑤ 内側から」で使う手段は？", "choices": ["飲み薬（内服）や点滴（白玉点滴）", "光（IPL）やピコレーザー", "針や針＋熱の機械", "外から当てる熱（高周波）"], "answer": 0, "explain": "⑤ 内側からは、内服（飲み薬）や白玉点滴で全身に効かせる手段のこと。①〜④の施術と組み合わせて、体の中から効果を後押しする。"}, {"id": "map-6b-1", "ch": "skin", "card": "map-6b", "level": 1, "q": "教材では、肌の機械どうしの違いは「何と何だけ」と説明している？", "choices": ["値段と、通う回数", "メーカーと、発売された年", "何を使うかと、どの深さに届けるか", "施術の時間と、痛みの強さ"], "answer": 2, "explain": "機械の違いは、何を使って（光・レーザー・針・熱・薬）、どの深さに届けるかだけ。商品名は覚えなくても、この2つに言い換えればわかる。"}, {"id": "map-6b-2", "ch": "skin", "card": "map-6b", "level": 1, "q": "「RF（アールエフ）」とは何のこと？", "choices": ["色の濃いところに吸われる強い光", "高周波＝電気の力で肌の中に熱を起こすもの", "空気の圧力で薬を撃ち込むしくみ", "針で小さな穴をあけるだけのしくみ"], "answer": 1, "explain": "RFは高周波のことで、電気の力で肌の中に熱を起こすもの。ニードルRF・モフィウス8・インモードなど、この章で何度も出てくる言葉。"}, {"id": "map-6b-3", "ch": "skin", "card": "map-6b", "level": 2, "q": "ニードルRFとモフィウス8バーストは同じ「針＋熱」。いちばんの違いは？", "choices": ["ニードルRFは針を使わず外から温める", "モフィウス8は熱を使わず針だけ", "届く深さで、モフィウス8は脂肪の層まで届く", "ニードルRFは同じ針から薬も入れる"], "answer": 2, "explain": "どちらも針の先から熱を出す「針＋熱」。違いは深さで、モフィウス8バーストは脂肪の層まで届く。同じ針で薬も入れるのはブレッシング。"}, {"id": "map-6b-4", "ch": "skin", "card": "map-6b", "level": 2, "q": "インモード（熱だけ）の2つの先端、FormaとMiniFxが温める深さの組み合わせは？", "choices": ["Forma＝脂肪の層／MiniFx＝ハリの層", "Forma＝ハリの層／MiniFx＝脂肪の層", "どちらも表面の層だけ", "どちらも脂肪の層だけ"], "answer": 1, "explain": "インモードは針を使わず外から温める。Formaはハリの層（真皮）、MiniFxは肌を吸い上げて脂肪の層を温める。深さで役割が違う。"}, {"id": "map-6c-1", "ch": "skin", "card": "map-6c", "level": 2, "q": "あおなぎの料金表にある「Dr.手打ち」とは？", "choices": ["同じ薬を、医師が注射器で1点ずつ打つ方法", "針を使わず、空気の圧力で薬を入れる方法", "針から熱も出して、薬と同時に入れる方法", "電気の力で、薬をしみ込ませる方法"], "answer": 0, "explain": "手打ちは、機械（ハイコックス）ではなく医師が注射器で1点ずつ打つ方法。あおなぎの料金表には機械と手打ちの2通りが並ぶ。空気の圧力はキュアジェット。"}, {"id": "map-6c-2", "ch": "skin", "card": "map-6c", "level": 1, "q": "肌に塗っただけの化粧品の成分は、ほとんどがどこで止まる？", "choices": ["肌の表面", "ハリの層（真皮）", "脂肪の層", "血管の中"], "answer": 0, "explain": "塗っただけの化粧品は、ほとんどが表面で止まる。そこで中まで届ける工夫（針・空気の圧力・針＋熱・電気）が、それぞれ別のメニューになっている。"}, {"id": "map-6c-3", "ch": "skin", "card": "map-6c", "level": 2, "q": "「薬を入れる」4つのメニュー（水光注射・キュアジェット・ブレッシング・e-cool）の主な違いは？", "choices": ["入れる薬が、4つともまったく別のもの", "薬を肌に入れる方法", "届く深さは同じで、値段だけが違う", "施術するのが医師か看護師か"], "answer": 1, "explain": "入れる薬は共通のものも多く、違いは薬よりも「入れ方」。水光注射は針、キュアジェットは空気の圧力、ブレッシングは針＋熱、e-coolは電気。"}, {"id": "map-6c-4", "ch": "skin", "card": "map-6c", "level": 1, "q": "針を使わず、空気の圧力（ジェット）で薬を届けるメニューは？", "choices": ["キュアジェット", "水光注射", "ブレッシング", "e-cool"], "answer": 0, "explain": "キュアジェットは針なしで、空気の圧力で薬を届け、同時に肌の奥の固まりもほぐす。e-coolも針なしだが、こちらは電気でしみ込ませる。"}, {"id": "map-6c-5", "ch": "skin", "card": "map-6c", "level": 1, "q": "「薬を入れる」4つのメニューのうち、熱（高周波）も同時に使うのは？", "choices": ["水光注射", "キュアジェット", "e-cool", "ブレッシング"], "answer": 3, "explain": "ブレッシングは斜めに刺す針から熱（高周波）を出し、その針を通して薬も入れる。水光注射・キュアジェット・e-coolは熱を使わない。"}]</script>

<script id="mdata" type="application/json">[{"id": "c1-01", "ch": "eye", "name": "二重整形（二重埋没法）", "yomi": "ふたえせいけい（ふたえ まいぼつほう）", "one": "まぶたを切らずに、細い糸でまぶたの中を1〜数か所留めて、二重の「折り目」を作る施術。", "pts": ["切らずに糸で留めるだけ。両目10〜20分で終わり、その日に帰れる。抜糸もいらない。", "作るのは「折り目」だけ。目の開きそのものは変わらない。開きを良くしたい人は眼瞼下垂の施術が別にある。", "糸がゆるむと元に戻ることがある。だからデイズのプランは、糸の留め方（留める点の数など）がしっかりするほど「戻ったときの保証」が長くなり、料金も上がる。"]}, {"id": "c1-02", "ch": "eye", "name": "二重切開法", "yomi": "ふたえ せっかいほう", "one": "まぶたの皮膚を切って中を縫い、取れにくい二重の折り目を作る手術。余分な皮膚や脂肪も一緒に取れる。", "pts": ["切って作るので戻りにくい。埋没法が何度も取れた人、まぶたが厚い人、幅の広い二重にしたい人の選択肢。", "余分な皮膚・脂肪も同時に取れる。だからまぶたの脂肪取りを別に足す必要はない。", "代わりに、休みと傷あとが必要。腫れのピークは1〜2週間。元に戻すことはできない。"]}, {"id": "c1-03", "ch": "eye", "name": "まぶたの脂肪取り", "yomi": "まぶたの しぼうとり", "one": "厚ぼったい上まぶたの奥の脂肪を、数mmの小さな穴から取り出して、まぶたを薄くする施術。", "pts": ["二重の「下準備」のメニュー。単独ではなく、ふつうは二重埋没法と同時に行う。", "切るのは数mmだけ。約10分で終わり、傷は小さいので縫わない（抜糸なし）。", "取りすぎると、くぼむ。まぶたの脂肪は年齢とともに減るので、将来を考えて量を決める。"]}, {"id": "c1-04", "ch": "eye", "name": "切らない眼瞼下垂", "yomi": "きらない がんけんかすい", "one": "皮膚を切らず、まぶたを上げる筋肉を糸でまぶたのふちに結び直して、目の開きを良くする施術。", "pts": ["変わるのは「開き」。二重の線を作る埋没法とは目的が別で、まぶたのふち自体が上がる。", "切らないので回復が早い。当日帰宅、メイクは翌日から。表に傷あとはほぼ出ない。", "効くのは軽い〜中くらいまで。重い場合は、切る手術（眼瞼下垂）が必要になる。"]}, {"id": "c1-05", "ch": "eye", "name": "眼瞼下垂（眼瞼挙筋前転術）", "yomi": "がんけんかすい（がんけん きょきん ぜんてんじゅつ）", "one": "上まぶたを切り、のびてゆるんだ「まぶたを上げる筋肉の先」を縫い縮めて、目の開きを良くする手術。", "pts": ["目元でいちばん本格的な「開き」の手術。切らない方法では足りない下垂にも対応でき、効果は半永久的。", "二重も同時にできる。二重切開と同じ線を切って行うので、仕上がりは二重まぶたになる。", "腫れは長め。ピークは1〜2週間、抜糸は1週間後。傷あとは3か月ほどで白く目立ちにくくなる。"]}, {"id": "c1-06", "ch": "eye", "name": "目頭切開", "yomi": "めがしら せっかい", "one": "目頭にかぶさっている皮膚のひだを切って整え、目を内側（鼻側）に広げる手術。", "pts": ["目が「内側」に広がる。隠れていた白目と目頭のピンクの部分が出る。埋没法だけでは難しい平行型の二重も作りやすくなる。", "目と目の距離が縮まる。だから、もともと目と目が近い人には勧めない（目上切開や目尻切開を考える）。", "効果は半永久。ただし切るので、白い線のような傷あとは残る。"]}, {"id": "c1-07", "ch": "eye", "name": "目上切開", "yomi": "めうえ せっかい", "one": "目頭の「上」の皮膚を切ってつっぱりを取り、目と目の距離は変えずに、目を縦に広げる手術。", "pts": ["目頭切開の「縦」版。切るのは目頭の先ではなく、その上。だから目と目の距離は縮まらない。", "目と目が近い人の受け皿。目頭切開だと寄り目に見えそうな人でも、目を大きく見せられる。", "運動は1か月後から。抜糸は7日後。傷の赤みが目立ちにくくなるまで3か月ほどかかる。"]}, {"id": "c1-08", "ch": "eye", "name": "目尻切開", "yomi": "めじり せっかい", "one": "目尻（目の外側の端）を切って外へ広げ、目の横幅を大きくする手術。", "pts": ["目が「外側」に広がる。白目が増え、つり目・切れ長の印象がやわらぐ。目と目が近い人でも受けられる。", "効果の出やすさに条件がある。目尻を引っぱったとき、白目が1.5mm以上かくれている人は効果が高い傾向。", "戻ることがある。切った所がくっついて元に戻ろうとするため。タレ目形成との併用も多い。"]}, {"id": "c1-09", "ch": "eye", "name": "グラマラスライン形成（タレ目形成）", "yomi": "ぐらまらすらいん けいせい（たれめ けいせい）", "one": "目尻側の下まぶたを少し下げて白目の見える範囲を広げ、やさしいタレ目に見せる施術。", "pts": ["目を「下」に広げる。目尻側の下まぶたを下げて白目を増やし、つり目のきつさをやわらげる。目が縦に大きく見える。", "方法は3つ。持ちと腫れが段階的に変わる。糸だけで留める（戻りやすい）→ 裏側を切る（表に傷なし）→ 表の皮膚を切る（効果が一番大きく半永久）。", "下げすぎのリスクがある。赤い粘膜が見える・黒目の下に白目が出る・目が閉じにくい・ドライアイなど、下まぶたを触る施術ならではの注意点がある。"]}, {"id": "c1-10", "ch": "eye", "name": "涙袋形成", "yomi": "なみだぶくろ けいせい", "one": "下まつげのすぐ下のぷっくりしたふくらみ（涙袋）を糸で作り、いつでも見えるようにする施術。", "pts": ["目の開きは変えず、ふくらみを作る。涙袋があると目が大きく見え、顔の中央（中顔面）が短く見える。左右差の調整にも使う。", "切らずに、裏側から糸で作る。二重の埋没法と似たしくみ。表に傷が残らず、好みに合わなければ糸を外して元に戻せる。", "持ちは半年〜数年。時間がたつと糸がゆるんだり取れたりすることがある。仕上がりが安定するまで1〜3か月かかる。"]}, {"id": "c2-01", "ch": "kuma", "name": "目の下の切らないクマ・たるみ取り（経結膜脱脂）", "yomi": "めのしたの きらない くま・たるみとり（けいけつまく だっし）", "one": "下まぶたの裏側から、前にはみ出した脂肪を取り出して、目の下のふくらみを平らにする手術。", "pts": ["皮膚を切らない。下まぶたの内側の粘膜を数mm切るだけなので、顔の表に傷が残らない。", "直せるのは「ふくらみ」だけ。下のみぞや皮膚のたるみには触らない。みぞには脂肪注入を足すプランがある。", "取った脂肪はほぼ戻らない。ただし年齢とともに、またたるんでくることはある。"]}, {"id": "c2-02", "ch": "kuma", "name": "裏ハムラ法（クマ取り）", "yomi": "うらハムラほう", "one": "まぶたの裏から入り、前に出た脂肪を取らずに下のみぞへ移して留め、ふくらみとみぞを同時にならす手術。", "pts": ["脂肪を捨てずに使う。前に出た脂肪を下のみぞへ移して糸で留める。ふくらみとみぞが同時に平らになる。", "入口は裏。表に傷なし。まぶたの裏の粘膜を数mm切るだけ。皮膚は切らないので、しわへの効果は表ハムラより限定的。", "脂肪注入がいらないことが多い。自分の目の下の脂肪でみぞを埋めるので、太ももなどから脂肪を採らずに済む。"]}, {"id": "c2-03", "ch": "kuma", "name": "表ハムラ法（クマ取り）", "yomi": "おもてハムラほう", "one": "まつげのすぐ下の皮膚を切って入り、脂肪を下のみぞへ敷き直し、余った皮膚も切り取る、目の下の総合手術。", "pts": ["ふくらみ・みぞ・しわを一度に。脂肪を敷き直し、余った皮膚も切り取る。クマ取りの手術4つの中で、直せる範囲がいちばん広い。", "入口は表。まつげのすぐ下を切るので細い傷ができる。数か月は赤みがあるが、最終的にはほとんど目立たなくなる。", "時間もダウンタイムも長め。両目で約120分。1週間後に抜糸があり、腫れは2〜3週間ほどで落ち着く。"]}, {"id": "c2-04", "ch": "kuma", "name": "切開法による目の下のたるみ取り", "yomi": "せっかいほうによる めのしたの たるみとり（下眼瞼除皺術）", "one": "下まつげのすぐ下の皮膚を切り、余ってたるんだ皮膚と、ふくらみのもとの脂肪を切り取る手術。", "pts": ["皮膚そのものを減らせる。切らない方法では取れない皮膚のたるみ・しわ・目袋に対応する。切らないクマ取りやヒアルロン酸注射でも気になる人向け。", "脂肪は必要なら取る。たるみの原因が脂肪なら一緒に切り取る。目のまわりの筋肉がゆるんでいれば、上へ引き上げることもある。", "腫れが長い。ピークは1〜2週間、完成まで1〜3か月。傷はまつげの際で、1週間後に抜糸する。"]}, {"id": "c2-05", "ch": "kuma", "name": "眉下リフト（眉下切開）", "yomi": "まゆしたリフト（まゆした せっかい）", "one": "眉毛のすぐ下で余った皮膚を切り取って縫い、上まぶたのたるみを引き上げる手術。", "pts": ["この章で唯一「目の上」の施術。上まぶたにかぶさった皮膚を減らす。目のきわは切らないので、目元の印象が自然なまま。", "傷は眉の下のラインに隠す。眉毛の下ぎりぎりを切る。赤みは1か月ほど、3か月ほどで白く目立たなくなる。", "おでこのしわにも関係する。まぶたが重いと、眉を持ち上げて見るくせがつき、おでこに深いしわができる。そのもとを減らせる。"]}, {"id": "c2-06", "ch": "kuma", "name": "しわ取り再生注射（スネコス）", "yomi": "しわとり さいせいちゅうしゃ", "one": "ヒアルロン酸とアミノ酸を注射して、肌が自分でハリの成分を作るのを後押しする治療。", "pts": ["ふくらませる注射ではない。肌の中の「繊維を作る細胞」を刺激して、ハリのもと（コラーゲンとエラスチン）を自分で作らせる。", "効果はゆっくり出る。10〜14日後ごろから肌の水分量が増え、約1か月後にキメ・ツヤ・弾力が上がる。", "続けて受けるのが基本。1回でも実感できるが、最初の月は週1回、その後は月1回ほどがすすめられている。"]}, {"id": "c2-07", "ch": "kuma", "name": "ベビーコラーゲン", "yomi": "べびーこらーげん", "one": "赤ちゃんの肌に多い種類のコラーゲンを、目元の細かいしわのすぐ下に注射して、しわとハリを改善する治療。", "pts": ["コラーゲンそのものを入れる。ヒトの胎盤由来で、赤ちゃんの肌に多い「Ⅲ型コラーゲン」が入っている。入れてすぐハリを感じる人がほとんど。", "目元の細かいしわが得意。ヒアルロン酸では治療が難しかった、皮膚が薄い所の「ちりめんジワ」に使う。", "効果は6か月〜1年。体に吸収されるので永久ではない。定期的に受けると長持ちしやすい。"]}, {"id": "c2-08", "ch": "kuma", "name": "口角挙上（口角リフト）", "yomi": "こうかく きょじょう", "one": "下がった口角（口の両はし）を、切って縫うことで上向きに整える手術。", "pts": ["2つの方法を使い分ける。口角の外側の皮膚を切り取る「外側法」と、口角そのものを移す「全層法」。どちらにするかは診察で医師が決める。", "効果は半永久。ヒアルロン酸やボトックスの注射（半年〜1年）と違い、打ち直しがいらない。", "傷あとはゼロにはならない。外側法は皮膚の表に、全層法は口角から口の中にかけて傷ができる。時間とともに目立ちにくくなる。"]}, {"id": "c2-09", "ch": "kuma", "name": "M字リップ形成", "yomi": "えむじ リップ けいせい", "one": "上唇の内側を左右で少し切り取って縫い、一直線の唇をメリハリのあるM字の形にする手術。", "pts": ["切るのは唇の内側。上唇の内側（粘膜側）を左右でひし形に切り取って縫う。傷は治れば目立たない。", "効果は半永久。同じページには、切らずにヒアルロン酸注射でM字を作る方法も載っている（こちらは溶かして戻せる）。", "約30分で終わる。1週間後に抜糸。口の開け閉めの違和感は1か月ほどでなくなる。"]}, {"id": "c2-10", "ch": "kuma", "name": "口唇縮小（スマートリップ）", "yomi": "こうしん しゅくしょう", "one": "唇の内側を切り取って縫い、厚ぼったい唇を薄く小さくする手術。切るのは口の中側なので傷は外から見えない。", "pts": ["切るのは唇の内側。口の中側の粘膜と、その下の組織（粘膜下組織）を切り取って縫う。傷は隠れて外から見えない。", "上だけ・下だけ・上下どちらも。希望と唇の状態で決める。切り取るデザインで、M字型にもアヒル口にもできる。約1時間。", "元には戻せない。唇は年をとると自然に薄くなるので、将来のことも考えて決めるよう、サイトも注意している。"]}, {"id": "c3-01", "ch": "nose", "name": "鼻尖形成", "yomi": "びせんけいせい", "one": "鼻先の中の軟骨を糸で寄せて、丸い「団子鼻」を細くすっきりさせる手術。", "pts": ["足さずに、今ある軟骨を寄せて細くする。鼻先の形・向き・高さを調整できる。", "切り方は2種類。オープン法は細かく作れる（傷は穴の間の柱に）。クローズ法は穴の中だけで傷が見えない。", "軟骨を足す手術と一緒に行うことが多い。耳の軟骨の移植や鼻中隔延長と組み合わせて全体を整える。"]}, {"id": "c3-02", "ch": "nose", "name": "鼻尖部軟骨移植", "yomi": "びせんぶ なんこついしょく", "one": "自分の耳の軟骨を少し採って鼻先に重ね、鼻先を少し高く・シャープにする手術。", "pts": ["材料は自分の耳の軟骨。人工物を使わないので、アレルギーの心配がなく、見た目も触り心地も自然（サイト記載）。", "変化は「少し」。鼻先を少し整えたい、一番高い位置を少し下げたい人向け。大きく伸ばすなら鼻中隔延長。", "根づけば一生そのまま。そのかわり、やり直しても完全に元の状態には戻せない。"]}, {"id": "c3-03", "ch": "nose", "name": "鼻中隔延長", "yomi": "びちゅうかく えんちょう", "one": "鼻の中の支柱に軟骨を継ぎ足して、鼻先を前に出したり、下に向けたりする手術。", "pts": ["鼻先の「高さ」と「向き」を両方変えられる。短い鼻・上向きの鼻・低い鼻に。変化は大きくも控えめにもできる。", "継ぎ足す軟骨は選べる。多くは耳の軟骨。伸ばせる長さは「耳 → 鼻の中 → あばら」の順に長くなる。", "「切らない鼻中隔延長」は別物。溶ける糸を鼻先から入れる方法で、持続は約1年。"]}, {"id": "c3-04", "ch": "nose", "name": "鼻柱下降", "yomi": "びちゅう かこう", "one": "左右の鼻の穴の間にある「柱」に耳の軟骨を足して、柱を下に伸ばす手術。", "pts": ["動かすのは「柱」だけ。正面から鼻の穴が目立ちにくくなり、鼻が長く見える。鼻先を細くする手術ではない。", "横顔の「鼻と上唇の角度」が整う。このページでは理想を「およそ100°」としている（猫手術のページは別の数字。下の注意を参照）。", "材料は自分の耳の軟骨。効果は半永久的に続く（サイトQ&A）。"]}, {"id": "c3-05", "ch": "nose", "name": "隆鼻術（シリコンプロテーゼ）", "yomi": "りゅうびじゅつ", "one": "鼻の穴の中からシリコン製の細い棒を入れて、鼻の付け根から鼻筋を高くする手術。", "pts": ["担当は鼻筋（上半分）だけ。鼻先の形は変わらないので、鼻先のメニューと組み合わせることが多い。", "一人ひとりに合わせて削る。I型という棒を、0.1mm単位で削って形を合わせる（サイト記載）。", "人工物なので「感染」に注意。術後1か月は歯の治療も避ける。あとから取り出し・入れ替えはできる。"]}, {"id": "c3-06", "ch": "nose", "name": "小鼻縮小", "yomi": "こばな しゅくしょう（鼻翼縮小）", "one": "小鼻の皮膚を切り取って縫い縮め、鼻の横幅や鼻の穴を小さくする手術。", "pts": ["悩みで切る場所が変わる。穴が大きい→内側法、小鼻が張り出す→外側法、両方→内側＋外側。", "切らない方法（糸）もある。傷は針穴だけで、糸を抜けば戻せる。ただし変化は小〜中くらい。", "鼻先を細くする手術とは同時にできない。鼻先の血のめぐりが不安定になる可能性があるため、期間をあけて行う（サイト記載）。"]}, {"id": "c3-07", "ch": "nose", "name": "鼻翼挙上", "yomi": "びよく きょじょう", "one": "小鼻の上の皮膚を三日月形に切り取って縫い寄せ、下がった小鼻を持ち上げる手術。", "pts": ["小鼻の「位置」を上げる手術。横幅を縮める小鼻縮小とは目的が違う（横ではなく縦）。", "上げられるのは1〜2mmほど。安全と仕上がりのバランスから、この程度が適切とされる。", "傷は小鼻の外側のみぞに重なる。時間とともにほとんどわからなくなる。"]}, {"id": "c3-08", "ch": "nose", "name": "貴族手術", "yomi": "きぞくしゅじゅつ（鼻翼基部形成 びよくきぶけいせい）", "one": "小鼻の横のくぼみを口の中から底上げし、ほうれい線の影を浅くする手術。", "pts": ["鼻を高くする手術ではない。さわるのは小鼻の横の土台（鼻翼基部）。「貴族」は韓国での呼び名 Nobility Surgery（気品のある口元にする手術）の訳。", "入れる物は4種類から選ぶ。人工の詰め物（プロテーゼ）・自分の脂肪・あばらの軟骨・ヒアルロン酸。値段と長持ちの度合いが違う。", "切るのは口の中。顔の表面に傷が出にくい。ヒアルロン酸だけは切らずに注射で済むが、1〜2年で吸収される。"]}, {"id": "c3-09", "ch": "nose", "name": "猫手術", "yomi": "ねこしゅじゅつ（鼻唇角矯正 びしんかくきょうせい／Cカール形成）", "one": "鼻の穴の間の柱の根元に耳の軟骨を入れ、鼻と上くちびるの角度を整える手術。猫の鼻にするわけではない。", "pts": ["鼻先も鼻筋も触らない。さわるのは鼻の穴の間の柱（鼻柱）の根元だけ。「猫」は鼻と口の段差が少ない猫の横顔をイメージした、韓国発の呼び名とされる。", "ねらいは横顔の角度。鼻と上くちびるが作る角度（鼻唇角）がひらき、鼻の下が短く見える。このページは「東洋人はおおよそ90〜95°が美しく見える」としている（鼻柱下降のページは別の数字。下の注意を参照）。", "入れるのは自分の耳の軟骨。入れ替えなどの手入れは基本いらない。ただし軟骨が少し縮んで、効果が控えめに感じられることがある。"]}, {"id": "c3-10", "ch": "nose", "name": "骨切り幅寄せ", "yomi": "ほねきり はばよせ（鼻骨骨切り幅寄せ術）", "one": "鼻の上半分の骨に切れ込みを入れ、左右から中央へ寄せて、太い鼻筋を細くまっすぐにする手術。", "pts": ["動かすのは骨そのもの。対象は鼻の上半分の骨（鼻骨）だけ。鼻先は変わらないので、鼻尖形成などと組み合わせることが多い。", "負担の大きい手術。この章で唯一の全身麻酔で、ギプス固定が約3週間、腫れ・内出血が引くまで2週間〜1か月。", "鼻の通りが悪くなることがある。手術前にCTで鼻の中の広さを確認し、狭い人には鼻炎の手術を一緒に行うことをすすめている。"]}, {"id": "c3-11", "ch": "nose", "name": "わし鼻修正", "yomi": "わしばな しゅうせい（ハンプ切除）", "one": "横から見た鼻筋の出っ張り（骨のこぶ）を、鼻の穴の中から削って、まっすぐなラインにする手術。", "pts": ["削るだけなので軽い。約30分、固定は2日間。同じ「骨をさわる」手術でも、骨切り幅寄せや斜鼻修正（ギプス3週間）よりずっと負担が小さい。", "傷は鼻の穴の中。鼻の内側を数mm切るだけなので、外から見える傷はできない。", "削ったら戻せない。効果は半永久。軽度〜中度の出っ張りなら、削らずにヒアルロン酸やプロテーゼでなだらかにする方法もある。"]}, {"id": "c3-12", "ch": "nose", "name": "斜鼻修正", "yomi": "しゃび しゅうせい", "one": "正面から見て曲がっている鼻筋を、骨を切って位置を直し（必要なら軟骨も整え）、まっすぐにする手術。", "pts": ["曲がりの原因は3タイプ。骨だけ／軟骨だけ／骨と軟骨の両方。どこが原因かで手術の中身が変わるので、事前のCT撮影が必須。", "中身は「骨を切って動かす」手術。骨切り幅寄せと同じ技術で、目的が「細く」ではなく「まっすぐ」。ギプス固定は3週間。", "しばらく鼻がつまりやすい。鼻の中の粘膜が腫れるため。3〜6か月かけて通りは戻っていく。軽い曲がりならプロテーゼやヒアルロン酸で済むこともある。"]}, {"id": "c3-13", "ch": "nose", "name": "鼻孔縁挙上", "yomi": "びこうえん きょじょう", "one": "垂れ下がった鼻の穴のふちの皮膚を切り取って、ふちのカーブを上げ、小鼻をすっきり見せる手術。", "pts": ["名前を分解すると中身がわかる。鼻孔縁＝鼻の穴のふち、挙上＝持ち上げる。何かを足すのではなく、垂れた分の皮膚を切り取る。", "傷はふちと重なる。ふちに沿って縫うので目立ちにくい。赤みは1か月ほど、3か月ほどで白くわかりにくくなる。", "切り取るので基本的に戻らない。そのぶん、どれだけ上げるか（鼻の穴の見え方）を事前によく確認する。"]}, {"id": "c3-14", "ch": "nose", "name": "人中短縮（リップリフト）", "yomi": "じんちゅう たんしゅく", "one": "鼻のすぐ下の皮膚を数mm切り取って縫い縮め、鼻とくちびるの距離を実際に短くする手術。", "pts": ["人中＝鼻の下からくちびるまでの部分。ここの皮膚を切り取るので、距離が実際に短くなる。効果は基本的に半永久。", "別名「リップリフト」。縫い縮めるときに上くちびるが引き上げられ、くちびるに立体的な厚みが出る。", "顔の正面に傷ができる手術。鼻の穴のすぐ下のきわ（鼻孔底）に沿って切り、鼻の影に隠す。赤みは1か月ほど、白くなるまで3か月ほど。"]}, {"id": "c4-01", "ch": "lift", "name": "脂肪注入（ナノファット2.0）", "yomi": "しぼうちゅうにゅう", "one": "自分の太ももから取った脂肪を、顔のくぼみやシワに少しずつ入れて、ふっくらさせる施術。", "pts": ["材料は自分の脂肪。自分の細胞なので、体が異物としてはねのける反応が起きにくい。", "残るのは入れた量の30〜70％。根づいた分（定着）は長く残るが、どれだけ残るかは人による。", "元に戻すのは難しい。ヒアルロン酸のように「溶かしてやり直す」ことができない。"]}, {"id": "c4-02", "ch": "lift", "name": "脂肪吸引注射", "yomi": "しぼうきゅういん ちゅうしゃ", "one": "名前は「注射」でも薬は入れない。ごく細い針で顔の脂肪をじかに吸い出す、小さな脂肪吸引。", "pts": ["薬は入れない。針で脂肪を吸い出すだけ。薬で溶かす脂肪溶解注射とは、名前が似ているだけの別もの。", "1回・約20分で終わる。圧迫バンドがいらないので、仕事を休まない人も多い。", "脂肪が減ると、皮膚が余る。そのぶんシワやたるみが目立つことがある、とサイトも書いている。"]}, {"id": "c4-03", "ch": "lift", "name": "顔の脂肪吸引", "yomi": "かおの しぼうきゅういん", "one": "皮膚を数ミリ切って細い管を入れ、頬やあご下の脂肪を吸い出す、1回で終わる小顔の手術。", "pts": ["脂肪の細胞そのものを取る。ダイエットは細胞が小さくなるだけで数は同じ。吸引は数を減らすので、リバウンドしにくい。", "腫れ・内出血が1〜2週間。数日は固定バンドも必要で、まわりに気づかれやすい期間がある。", "たくさん取るのが目的ではない。取りすぎると痩せこけて見えるので、丸みを残して形をつくる。"]}, {"id": "c4-04", "ch": "lift", "name": "脂肪溶解注射", "yomi": "しぼうようかい ちゅうしゃ", "one": "脂肪を溶かす薬を注射して、数回かけて少しずつ脂肪を減らす、切らない施術。", "pts": ["薬を「入れる」注射。針で脂肪を「吸い出す」脂肪吸引注射とは、向きが逆の別メニュー。", "手軽だが、1回では終わらない。1回5〜15分で、翌日から仕事や学校に行ける。回数の目安は3〜6回。", "何にでも効くわけではない。口の横に垂れた脂肪（ジョールファット）は「ダイエットや顔痩せ注射を施しても効果が現れにくい」と、ジョールファット除去のページに書かれている。"]}, {"id": "c4-05", "ch": "lift", "name": "ジョールファット除去", "yomi": "じょーるふぁっと じょきょ", "one": "口の横からフェイスラインに垂れた脂肪を、口の中から取りのぞいて、口元のもたつきをなくす手術。", "pts": ["切るのは口の中だけ。口角の内側を約5mm切るので、顔の表面に傷が出ない。溶ける糸で縫うので抜糸もいらない。", "取った脂肪は再生しない。だから効果は半永久的。逆に言うと、取りすぎても元に戻せない。", "取りすぎると頬がこける。サイトもリスクとして明記している。どれだけ取るかの見きわめが大事。"]}, {"id": "c4-06", "ch": "lift", "name": "メーラーファット除去", "yomi": "めーらーふぁっと じょきょ", "one": "ほうれい線の上にのっている頬の脂肪を、口の中から細い管で吸い出して減らす手術。", "pts": ["口の中から、細い管で吸う。口角の内側に小さな傷を作るだけなので、外からは見えない。抜糸もいらない。", "ねらいは、ほうれい線と「笑ったときの頬のふくらみ」。早めに取ると将来のたるみ予防にもなる、とサイトは説明している。", "同じ脂肪を「取らずに上へ戻す」メニューもある（ミッドフェイスリフト）。脂肪が「多い」のか「下がった」のかで、合う向きが逆になる。"]}, {"id": "c4-07", "ch": "lift", "name": "バッカルファット除去", "yomi": "ばっかるふぁっと じょきょ", "one": "頬の奥にある脂肪のかたまりを、口の中を小さく切って取り出し、フェイスラインをすっきりさせる手術。", "pts": ["顔に傷ができない。切るのは口の中だけなので、洗顔もメイクも当日からできる。溶ける糸で縫うので抜糸もいらない。", "1回で終わり、効果は半永久的。取った脂肪は再生しない。サイトのおすすめは、たるみが目立つ前の20〜30代。", "合わない人が受けると逆効果。たるみが強い人や、たるみの原因がバッカルファット以外にある人は、取ると余計にたるむことがある、とサイトも書いている。"]}, {"id": "c4-08", "ch": "lift", "name": "ミッドフェイスリフト", "yomi": "みっどふぇいすりふと（中顔面リフト）", "one": "下がった頬の脂肪を上へ戻し、糸で骨の表面の膜に留めて、目の下〜頬を若返らせる手術。", "pts": ["脂肪を取らずに「戻す」。同じ頬の脂肪を扱うメーラーファット除去とは向きが逆。こけた人・へこんだ人向け。", "ねらいは目の下〜頬（中顔面）。あご下や首のたるみには、別にペリカン手術や切開リフト（ネックリフト）がある。", "まぶたの裏から入るので、顔に傷が出ない。そのかわり白目が2〜3週間赤くなることがある。"]}, {"id": "c4-09", "ch": "lift", "name": "糸リフト", "yomi": "いとりふと（スレッドリフト）", "one": "溶ける糸を針で頬の中に通し、下がった頬やフェイスラインを引っぱり上げる、切らないリフト。", "pts": ["切らずに、糸で物理的に引っぱる。20〜30分で終わり、傷は針穴だけ。当日からメイクも入浴もできる。", "糸は溶ける。効果は1〜2年ほど。糸の種類で引き上げる力・もち・料金が変わる。", "デイズの料金は「1本あたり」。フェイスラインなら左右3本ずつが目安なので、本数とセットで考える。"]}, {"id": "c4-10", "ch": "lift", "name": "ペリカン手術", "yomi": "ぺりかんしゅじゅつ（広頸筋しばり・コルセットリフト）", "one": "あごの下を小さく切り、左右に開いてゆるんだ首の筋肉を中央に寄せて縫い、二重あごを締め直す手術。", "pts": ["ねらうのは脂肪ではなく「筋肉」。首の前をおおう薄い筋肉のゆるみを、縫って締め直す。", "脂肪が原因なら脂肪吸引、筋肉が原因ならペリカン手術。両方なら組み合わせる、とサイトが明記している。", "あご下〜首まわりが対象。機械や糸リフトで効果が出なかった人の「次の段」（サイトの対象にも「HIFUや糸リフトで効果が得られなかった方」とある）。"]}, {"id": "c4-11", "ch": "lift", "name": "切開リフト（フェイスリフト）", "yomi": "せっかいりふと", "one": "耳のまわりを切って皮膚の奥の膜ごと引き上げ、余った皮膚を切り取る、たるみ治療でいちばん強い手術。", "pts": ["余った皮膚そのものを切り取れる唯一の方法。機械も糸も、皮膚の量は減らせない。", "効果は5〜10年ほど。そのかわり全身麻酔で4〜5時間、腫れは3〜4週間と、負担はいちばん大きい。", "リスクも重い。顔の神経のまひ、皮膚の壊死など、機械や糸にはないリスクがある。"]}, {"id": "c4-12", "ch": "lift", "name": "ソフウェーブ", "yomi": "そふうぇーぶ", "one": "超音波で皮膚の浅い層だけを温め、ハリを出して、小じわと軽いたるみをケアする機械。", "pts": ["温めるのは皮膚の浅い層（真皮）。深さ約0.5〜2.0mm。HIFUより浅く、ハリ・小じわが得意。", "休みはほぼいらない。赤みは数時間〜数日。施術の直後からメイクできる。", "頬がこけやすい人にも向く。サイトは「HIFUのあと頬がこけた方」「顔の脂肪が少ない方」にすすめている。"]}, {"id": "c4-13", "ch": "lift", "name": "XERF（ザーフ）", "yomi": "ざーふ", "one": "2種類の高周波（電気の熱）で、皮膚の浅い層から脂肪の奥までを温めて引き締める機械。", "pts": ["3つの機械の中で唯一の「高周波」。モードを切りかえて、真皮から脂肪の奥まで深さを選べる。", "麻酔なしで受けられる。冷やしながら打つので熱さ・痛みはほとんどなく、当日からメイクできる。", "受けられない条件が多い。体の中に金属がある人、心臓に持病がある人、歯の矯正中の人などは受けられないことがある。"]}, {"id": "c4-14", "ch": "lift", "name": "ウルトラセルZi（HIFU）", "yomi": "うるとらせる じー（ハイフ）", "one": "超音波を1点に集め、皮膚の奥にある「筋肉の膜」を熱で縮めて、切らずに顔を引き上げる機械。", "pts": ["3つの機械でいちばん深い所に届く。ねらうのは筋肉の膜（SMAS）。だから「引き上げ」が得意。", "打ち方は3種類。点で打つドット（たるみ）、線で打つリニア（あご下など）、浅い層だけのハイフシャワー（ハリ）。", "効果は数か月。サイトのQ&Aでは「最長6か月ほど」。3か月〜半年ごとにくり返すのが前提。"]}, {"id": "c4-15", "ch": "lift", "name": "ヒアルロン酸注射", "yomi": "ひあるろんさん ちゅうしゃ", "one": "水分をたっぷり含むゼリー状のヒアルロン酸を注射で入れ、へこみを持ち上げたり、形を作ったりする施術。", "pts": ["「足して」ふくらませる。注射は5分ほど。当日からメイクも入浴もできる。", "場所によって硬さを使い分ける。目の下や唇はやわらかいもの、鼻やあごは形が出るかためのもの。", "少しずつ吸収される。1回目のもちは半年〜1年ほど。気に入らなければ溶かして戻す方法がある。"]}, {"id": "c4-16", "ch": "lift", "name": "ボトックス", "yomi": "ぼとっくす（ボツリヌストキシン注射）", "one": "筋肉の動きを弱める薬を注射して、表情じわを目立たなくしたり、エラの筋肉を細くしたりする施術。", "pts": ["何も足さない。筋肉の動きを弱めるだけ。ふくらませるヒアルロン酸（② 足す）とは考え方が逆で、この章の分類では5つの原理の外の「動きを止める」に入る。", "使い道は3つ。表情じわを出にくくする／エラなどの筋肉を細くする／汗を抑える。", "効果は一時的。しわへの効果は3〜6か月ほど。薬は2種類あり、どちらを選ぶかで料金が大きく変わる。"]}, {"id": "c5-01", "ch": "body", "name": "ハイブリッド豊胸", "yomi": "はいぶりっど ほうきょう", "one": "人工の袋で胸の大きさを出し、その上に自分の脂肪を足して、袋の輪郭をかくす豊胸。", "pts": ["袋と脂肪のいいとこ取り。袋で確実に大きくし、脂肪で自然な形とやわらかさを足す。やせ型の人ほど向いている。", "脂肪を吸う所も細くなる。脂肪は基本的に内ももから取る。ただし公式は「極端にやせることはない」と説明。", "この章でいちばん大がかり。4〜5時間かかり、内出血や痛みが1〜3週間続くことがある。"]}, {"id": "c5-02", "ch": "body", "name": "シリコンバッグ豊胸", "yomi": "しりこんばっぐ ほうきょう", "one": "ワキを数センチ切って胸の中にすき間を作り、シリコンの袋を入れて胸を大きくする手術。", "pts": ["体質に関係なく大きくできる。脂肪注入は人によって効果に差が出るが、袋は入れたぶんだけ確実。やせ型で脂肪が取れない人にも向く。", "入れる深さが3通りある。乳腺の下・筋肉の下・筋肉の膜の下。もとの胸の大きさや希望で医師が選ぶ。", "料金に袋の代金は入っていない。表の金額は手術の料金。袋（バッグ）の代金は、大きさと種類によって別にかかる。"]}, {"id": "c5-03", "ch": "body", "name": "豊胸術・脂肪幹細胞注入（脂肪豊胸）", "yomi": "ほうきょうじゅつ・しぼうかんさいぼうちゅうにゅう", "one": "お腹や太ももの脂肪を吸い取り、きれいにしてから胸に注射で移す、人工物を使わない豊胸。", "pts": ["入れるのは自分の脂肪だけ。人工物を使わないので、さわり心地がやわらかく、アレルギーの心配もない。", "「やせる」と「大きくする」が同時。脂肪を吸った所は細くなる。ただし脂肪を吸う料金は別にかかる。", "大きくできるのは1〜2カップまで。それ以上を希望する人は、袋を使う方法が案内される。"]}, {"id": "c5-04", "ch": "body", "name": "モントゴメリー線（乳輪のぶつぶつ）除去", "yomi": "もんとごめりーせん じょきょ", "one": "乳輪（胸の先の色のついた輪）にある小さなぶつぶつを、1個ずつ切り取って縫う手術。", "pts": ["ぶつぶつは病気ではない。正体は、乳輪の乾燥をふせぐ「あぶらを出す腺」。大きくて目立つ人が、見た目のために取る。", "1個いくら、の料金。取りたい個数をカウンセリングで決める。数が多いほど総額が上がる。", "取っても授乳はできる。公式は「健康や授乳機能に影響を与えない」と説明している。"]}, {"id": "c5-05", "ch": "body", "name": "副乳除去", "yomi": "ふくにゅう じょきょ", "one": "わきなどに残っている「余分な乳房の組織（副乳）」を、切って取りのぞく手術。", "pts": ["副乳は病気ではない。生まれる前に消えるはずだった乳房のなごり。放っておいても害はないが、見た目や妊娠時の腫れ・痛みで取る人がいる。", "切って、組織ごと取る。切ることで組織を完全に取りのぞけるので、きれいに無くせると説明されている。", "傷あとは少し残る可能性がある。30分ほどの手術で、そのまま帰れる。糸は7日後に抜く。"]}, {"id": "c5-06", "ch": "body", "name": "乳首を小さくする・乳頭縮小術", "yomi": "にゅうとう しゅくしょうじゅつ", "one": "大きい・長い乳頭（胸の先の突起）の一部を切り取って縫い、細く・低く整える手術。", "pts": ["「細く」「低く」「両方」の3通り。どこが気になるかで切り方が決まり、料金も変わる。", "母乳の通り道を残すかどうかで料金が変わる。料金表は「乳管温存」とそうでないものに分かれている。", "たばこは厳禁。血のめぐりが悪いと、乳頭の一部や全体が死んでしまう（壊死）ことがある。"]}, {"id": "c5-07", "ch": "body", "name": "陥没乳頭術", "yomi": "かんぼつ にゅうとうじゅつ", "one": "内側にへこんで埋もれている乳頭（胸の先の突起）を、切開して外に出す手術。", "pts": ["見た目だけの問題ではない。へこみに汚れがたまり、ばい菌が増えて、胸の中で炎症（乳腺炎・乳管炎）を起こしやすい。男女共通。", "出産の予定がある人は、その前に。授乳のときに困らないよう、公式は出産前の手術をすすめている。", "入浴は1か月ほどがまん。胸まわりの小さな手術の中では、制限の期間がいちばん長い。"]}, {"id": "c5-08", "ch": "body", "name": "乳輪を小さくする・乳輪縮小術", "yomi": "にゅうりん しゅくしょうじゅつ", "one": "乳輪（胸の先の色のついた輪）の一部を輪の形に切り取って縫い、輪を小さくする手術。", "pts": ["最大で50%小さくできる。輪が小さくなるとバランスが整い、胸そのものが大きく見える効果もある。", "授乳には影響しない。母乳の通り道（乳管）を傷つけずに行う、と説明されている。", "一度切ると元には戻せない。また、豊胸と同じ日にはできない（豊胸は術後1か月以降）。"]}, {"id": "c5-09", "ch": "body", "name": "婦人科形成", "yomi": "ふじんか けいせい", "one": "デリケートゾーン（女性器）の大きさ・形・たるみを、余分な皮膚を切り取って整える手術の総称。", "pts": ["4つの手術の総称。小陰唇・副皮・クリトリスの皮・大陰唇のうち、どこを整えるかで手術名が決まる。", "見た目だけが目的ではない。こすれる痛み・蒸れ・においなど、毎日の不快感を減らすために受ける人も多い。", "担当は女性だけ。元産婦人科専門医などの女性医師が担当し、スタッフも全員女性が対応する。"]}, {"id": "c5-10", "ch": "body", "name": "脂肪吸引注射", "yomi": "しぼうきゅういん ちゅうしゃ（顔の章にも掲載）", "one": "極細の針を刺して、皮膚の下の脂肪をそのまま吸い出す、小さな脂肪吸引。", "pts": ["名前は「注射」でも、やることは「吸引」。薬を入れて溶かす脂肪溶解注射とは逆で、脂肪を吸い出す。", "公式の説明は「顔」が対象。小顔・二重あご向けのメニュー。体の部分やせは身体の脂肪吸引を案内する。", "あとが楽。腫れは1〜2週間あるが、おさえるバンドは不要。仕事を休まない人も多い。"]}, {"id": "c5-11", "ch": "body", "name": "身体の脂肪吸引", "yomi": "からだの しぼうきゅういん", "one": "小さな穴から細い管を入れて、お腹や太ももなどの脂肪を直接吸い出す手術。", "pts": ["痩身の中でいちばん効果が大きく、いちばん負担も大きい。1回で終わるかわりに、強い腫れが約1週間、包帯で約2日押さえる。", "脂肪の細胞の「数」が減る。だからリバウンドしにくい。ただし不摂生を続けると太ることはある。", "料金は「1部位いくら」の均一制。ほとんどの部位が同じ値段。腰・副乳だけ別の値段で、広い範囲はセットがある。"]}, {"id": "c5-12", "ch": "body", "name": "脂肪溶解注射（ボディ）", "yomi": "しぼうようかい ちゅうしゃ（顔の章にも掲載）", "one": "脂肪を溶かす薬を注射して、やせにくい部分の脂肪を何回かに分けて減らす施術。", "pts": ["顔の章の脂肪溶解注射と同じメニュー。お腹・二の腕など、ダイエットしてもやせにくい部分にも使う。", "薬を「入れる」注射。脂肪を「吸い出す」脂肪吸引注射・脂肪吸引とは向きが逆。手軽なぶん、3〜6回通う。", "料金は1ccいくら。総額は「使う量×回数」で決まる。食事指導や飲み薬とセットにしたのがメディカルダイエット。"]}, {"id": "c5-13", "ch": "body", "name": "メディカルダイエット", "yomi": "めでぃかる だいえっと（医療のダイエットコース）", "one": "脂肪を溶かす注射に、飲み薬・食事指導（と食欲をおさえる注射）を組み合わせたダイエットコース。", "pts": ["中身は4つのセット。脂肪溶解注射5回＋飲み薬（オルリファスト）1か月分＋食事指導とスムージー。プレミアムはさらにGLP-1注射3本。", "体に入る量もおさえる。注射は「いまある脂肪」、飲み薬は「食べた脂肪の吸収」、GLP-1は「食欲」に働く。", "ダウンタイムはほぼなし。ただし飲み薬で油もれ・油っぽい便などが出ることがある。20歳未満・妊娠中などは受けられない。"]}, {"id": "c6-01", "ch": "skin", "name": "ルメッカピーク（IPL）", "yomi": "るめっかぴーく（あいぴーえる）＝光でシミ・赤みを薄くする", "one": "強い光を顔全体に当てて、シミの色と赤みのもとだけを熱で壊し、薄くしていく光の施術。", "pts": ["シミと赤みを1台で。光が茶色（メラニン）と赤（血管）の両方に反応するので、顔全体をまとめて整えられる。", "シミは一度「濃く」なる。失敗ではなく、壊れた色が表面に出てきた合図。1〜2週間で自然に剥がれる。", "1回で終わりではない。4週間に1回のペースで3〜5回が目安。3回・5回のコース料金がある。"]}, {"id": "c6-02", "ch": "skin", "name": "カスタマイザーIPL", "yomi": "かすたまいざー あいぴーえる＝肌に合わせて調整できる光の施術", "one": "光の「色」をその人の肌と悩みに合わせて調整し、シミ・くすみ・赤み・ニキビ跡をまとめてケアする光の施術。", "pts": ["ルメッカと同じ「光」の仲間。違いは、6種類のフィルターと細かな調整で、肌と悩みに合わせて光を作り分けられること。", "日本人の肌に合わせた設計。やけどなどのリスクをおさえながら、色のもと（メラニン）と細い血管に働きかける、とサイトは説明。", "休みがいらない。肌への負担が少なく、施術直後からメイクして帰れる。顔のほか背中のメニューもある。"]}, {"id": "c6-03", "ch": "skin", "name": "ディスカバリーピコ", "yomi": "でぃすかばりーぴこ＝ピコレーザー（シミ・くすみ・肌質・タトゥー）", "one": "ごく一瞬だけ光るレーザーの衝撃で、シミの色のもとを細かく砕く機械。当て方が3通りある。", "pts": ["1台で3つの当て方。トーニング（弱く広く）／スポット（1個を強く）／フラクショナル（点々と奥へ）。悩みで使い分ける別メニュー。", "肝斑にも使える。出力をおさえ、当たる時間をごく短くしたことで、肝斑（かんぱん）が濃くなるリスクをおさえられる、とサイトは説明。", "シミ以外にも。タトゥー（入れ墨）の除去にも対応。8色に対応できるとしている。"]}, {"id": "c6-04", "ch": "skin", "name": "水光注射（ハイコックス）", "yomi": "すいこうちゅうしゃ＝美容成分を細い針で顔全体に入れる", "one": "うるおい・ハリのもとになる美容成分を、専用の機械の細い針で、顔全体に同じ深さで均一に入れる施術。", "pts": ["「水光」は韓国語から。「水のように光る肌」という意味（ムルグァンピプ）。ハイコックスは、その注入に使う機械の名前。", "メニュー名＝入れる薬の名前。料金表のジュベルック・プルリアルなどは薬（製剤）の名前。機械は同じで、中身と値段が変わる。", "針を使うので跡が出る。針のあと・内出血・小さなふくらみが数日〜1週間。最初は2〜3週間に1回のペースがすすめられている。"]}, {"id": "c6-05", "ch": "skin", "name": "ニードルRF", "yomi": "にーどる あーるえふ＝細い針の先から熱を出す", "one": "とても細い針を肌に刺し、針の先から熱を出して、肌の奥の「ハリを作る層」だけを温める施術。", "pts": ["名前を分解すると中身がわかる。ニードル＝針、RF＝高周波（電気の力で起こす熱）。「針の先から熱を出す機械」という意味。", "ねらいは「ハリを作る層」。熱の刺激でコラーゲンなどの繊維が増え、ニキビ跡・毛穴・小じわ・肝斑に対応する、とサイトは説明。", "効果はゆっくり。実感は1〜3か月後が多い。4〜6週間ごとに3〜6回がすすめられている。"]}, {"id": "c6-06", "ch": "skin", "name": "ブレッシング", "yomi": "ぶれっしんぐ＝斜めの針から「熱」と「薬」を同時に入れる", "one": "細い針を斜めに刺して針先から熱を出し、同じ針から美容成分も入れる、「針＋熱＋薬」の施術。", "pts": ["「針＋熱」に「薬」を足したもの。ニードルRFと同じく針先から熱（高周波）を出すが、同じ針から薬も入れられるのが違い。", "針を斜めに刺すのが特徴。肌の表面に大きな負担をかけずに奥へ届く、とサイトは説明（世界初の「傾斜ニードル」と紹介）。", "値段は「ショット数」と「薬」で決まる。基本の薬はトラネキサム酸。薬を替えると追加料金がかかる。"]}, {"id": "c6-07", "ch": "skin", "name": "キュアジェット", "yomi": "きゅあじぇっと＝針を使わず、空気の圧力で薬を届ける", "one": "針を使わず、空気の圧力で美容成分を肌の奥へ届け、ニキビ跡のへこみの原因もほぐす施術。", "pts": ["針を使わない「入れる」施術。細く速い噴射（ジェット）の力で、美容成分を肌の深い層まで届ける。注射より痛みが少ない、とサイトは説明。", "得意はニキビ跡のへこみ。へこみは、肌の奥で固まった組織が表面を下に引っぱってできる。それを空気の力でほぐす。", "新宿院だけのメニュー。料金は「薬の種類 × 当てる範囲の広さ × 回数」で決まる。"]}, {"id": "c6-08", "ch": "skin", "name": "インモードリフト（Forma／MiniFx）", "yomi": "いんもーどりふと（ふぉーま／みに えふえっくす）＝外から熱で引き締める", "one": "針を使わず、肌の外から高周波の熱を当てて、あご下の脂肪を減らし、肌を引き締める施術。", "pts": ["インモードは会社（機械シリーズ）の名前。FormaとMiniFxは、その機械に付ける2種類の先端の名前。2つを組み合わせた施術を「インモードリフティング」と呼ぶ。", "針を使わない。高周波の熱を肌の外から当てるだけ。施術直後から洗顔・メイクができる。", "深さで役割が違う。MiniFx＝脂肪の層（あご下・フェイスラインをすっきり）、Forma＝表面〜ハリの層（小ジワ・ハリ）。"]}, {"id": "c6-09", "ch": "skin", "name": "モフィウス8バースト", "yomi": "もふぃうす えいと ばーすと＝針＋熱を、脂肪の層まで深く", "one": "24本の細い針を刺し、針から熱を出して、ハリの層から脂肪の層までを引き締める「針＋熱」の施術。", "pts": ["「針＋熱」の中でいちばん深い。ハリの層だけでなく脂肪の層まで熱が届く。だからフェイスライン・二重あごも対象になる。", "表面は守る設計。針の先と、針と機械の頭の間から熱が流れ、肌の表面を傷めずに深い所だけを温める、とサイトは説明。", "効果はゆっくり、回数は3回。1〜3か月かけて引き締まる。4〜8週間おきに3回、その後は半年〜1年ごとのメンテナンスがすすめられている。"]}, {"id": "c6-10", "ch": "skin", "name": "ダーマペン4", "yomi": "だーまぺん ふぉー＝細い針で小さな穴をあけ、肌の治る力を引き出す", "one": "髪の毛より細い針で肌に小さな穴をたくさんあけ、肌が治ろうとする力でハリを作らせる施術。", "pts": ["「針だけ」の施術。熱も電気も使わない。ニードルRFやモフィウス8バーストとの違いは、針の先から熱が出ないこと。", "穴は美容成分の通り道にもなる。薬と組み合わせたメニュー（ヴェルベットスキンなど）がある。", "続けて受けるもの。1回でも変化を感じることはあるが、回数を重ねるほど実感しやすい。目安は1か月に1回。"]}, {"id": "c6-11", "ch": "skin", "name": "サブシジョン", "yomi": "さぶしじょん", "one": "ニキビ跡の凹みを下に引っ張っている硬い筋を、針で切り離して持ち上げる治療。", "pts": ["凹みの「原因」を切る治療。肌の奥の硬い筋（線維）が皮膚を引き込んでいるので、それを針で切り離す。", "1回では終わらない。3〜6回が目安で、2回目以降は4週間以上あける。直後はかえって凸凹が目立つこともある。", "料金は「面積」で決まる。2cm四方〜5cm四方の4サイズ。デイズとあおなぎで同じ金額。"]}, {"id": "c6-12", "ch": "skin", "name": "ピーリング（コラーゲンピール／ミラノリピール）", "yomi": "ぴーりんぐ", "one": "酸の薬を肌に塗って、古い角質の入れ替わりを促し、肌の奥のコラーゲンを増やす施術。", "pts": ["塗るだけの施術。酸の薬を塗ってなじませる。針も機械も使わず、15〜30分で終わる。", "薬は2種類。コラーゲンピールは刺激が少なめ。ミラノリピールは酸が少し濃く、皮むけが起きやすい代わりに肌の入れ替わりを強く促す。", "くり返して育てる施術。2〜4週間に1回のペースで続ける。顔だけでなく、体の妊娠線・肉割れにも使う。"]}, {"id": "c6-13", "ch": "skin", "name": "ハイドラジェントル", "yomi": "はいどらじぇんとる", "one": "薬液をまぜた水の流れで毛穴の汚れを洗い、同時に吸い取る「毛穴そうじ」の施術。", "pts": ["水の流れで洗う「毛穴そうじ」。熱も針も使わない。うずを巻く水流に薬液をのせ、汚れを浮かせて吸い取る。", "1回で3つのケア。クレンジング → ピーリング → 美容液導入を、約30分でまとめて行う。", "痛みもダウンタイムもほぼない。直後からメイクできる。月1回のお手入れとして続けるタイプの施術。"]}, {"id": "c6-14", "ch": "skin", "name": "e-cool（エレクトロポレーション）", "yomi": "いーくーる（えれくとろぽれーしょん）", "one": "電気の力で肌の表面に一時的なすき間を作り、針を使わずに美容成分を奥へ入れる施術。", "pts": ["針を使わない「導入」。電気で肌の表面に一時的なすき間を作り、ビタミンCなどの美容成分を奥へ入れる。痛みはピリピリする程度。", "冷やす機能がある。−5〜−10℃で冷やしながら入れられるので、レーザーなどの後の赤み・ほてりを落ち着かせるケアにも使う。", "続けて効かせるタイプ。効果はすぐ感じられるが、続くのは2週間ほど。2週間に1回が目安。"]}, {"id": "c6-15", "ch": "skin", "name": "ほくろ除去・いぼ除去", "yomi": "ほくろじょきょ・いぼじょきょ", "one": "ほくろ・いぼを、電気メスで丸くくり抜くか、切って縫うかして取りのぞく施術。", "pts": ["「消す」のではなく「取る」。ほくろは色を持つ細胞のかたまりなので、シミのように光で砕くのではなく、物として取りのぞく。", "取り方は大きさと深さで決まる。小さめは電気メスで丸くくり抜く。大きい・盛り上がっている・根が深いものは切って縫う。", "料金は1mmあたり。大きさで金額が決まるので、カウンセリングで大きさを測る。まれに悪性のこともあるため、まず医師が診る。"]}, {"id": "c6-16", "ch": "skin", "name": "内服", "yomi": "ないふく（飲み薬）", "one": "シミやニキビに、体の内側から効かせる医療用の飲み薬。悩みに合わせて組み合わせる。", "pts": ["薬であって、サプリではない。美肌用・ニキビ用の内服は医療用の薬なので、市販のサプリより成分が濃い。そのぶん医師の診察を受けて処方される。", "悩みで組み合わせが決まる。シミ・くすみには「美肌内服」、ニキビには「ニキビ内服」の3種セット。肝斑にはトラネキサム酸が中心。", "すぐには変わらない。3か月〜半年、毎日続けて実感しやすくなる。妊娠中・授乳中は処方しない。"]}, {"id": "c6-17", "ch": "skin", "name": "ドクターズコスメ", "yomi": "どくたーずこすめ", "one": "医療機関だけで買える化粧品。治療のあとや毎日の肌の手入れに、家で使う。", "pts": ["院内の施術の「続き」を家でやる道具。洗顔料・化粧水・美容液・クリーム・日焼け止め・サプリまで、4ブランド22品を扱う。", "医師に選んでもらう。肌に合わないと肌荒れすることがあるため、肌の状態を見て組み合わせを決める。", "魔法の薬ではない。サイト自身が「効果は市販品と大きな差はない。成分や品質の安全面・信頼度で優れる」と説明している。実感は2〜3か月が目安。"]}, {"id": "c6-18", "ch": "skin", "name": "白玉点滴", "yomi": "しらたまてんてき", "one": "美白成分グルタチオンを点滴で血管に入れ、全身のくすみ・シミ予防をねらう美容点滴。", "pts": ["主成分はグルタチオン。シミのもと（メラニン）が作られるのをおさえる成分を、点滴で血管に直接入れる。", "顔だけでなく全身に届く。体や白目のくすみにも期待できる、とサイトは説明。肝臓の働きも助けるので、お酒やタバコをたしなむ人にもすすめている。", "続けて受ける前提。初めての人だと、効果が続くのは数日〜1週間ほど。量は3段階で、多いほど高い。"]}, {"id": "c6-19", "ch": "skin", "name": "医療脱毛", "yomi": "いりょうだつもう", "one": "レーザーの熱で、毛を作る組織を壊して、毛を生えにくくする施術。", "pts": ["光が「黒い色」にだけ反応する。毛の黒い色（メラニン）がレーザーを吸って熱くなり、その熱で毛を作る組織を壊す。", "1回では終わらない。毛には生えかわりの周期があるので、約1.5〜2か月おき（顔は1か月おき）に通い、5回ほどで実感する人が多い。", "デイズの機械は「痛みが少なめ・肌を選びにくい」タイプ。ダイオードレーザーで、うぶ毛や、多少の日焼け肌にも対応できると説明している。"]}, {"id": "c6-20", "ch": "skin", "name": "ワキ汗治療", "yomi": "わきあせちりょう（ワキガ・多汗症）", "one": "ワキのにおい・汗のもとになる汗腺を、手術で取りのぞくか、注射で働きを止める治療。", "pts": ["「におい」と「汗の量」は別の悩み。におい（ワキガ）はアポクリン汗腺、量が多い汗（多汗症）はエクリン汗腺が原因。", "手術は「取る」ので長く続く。傷が小さい吸引シェービング法と、重い症状向けに大きく切る剪除法の2種類。術後はワキを固定して安静にする。", "注射は「止める」ので手軽だが期限つき。ボトックスは切らずに受けられるが、数か月で効果が切れる。"]}]</script>
<script>
(function(){
"use strict";
var Q = JSON.parse(document.getElementById('qdata').textContent);
var CH = JSON.parse(document.getElementById('cdata').textContent);
var MENUS = JSON.parse(document.getElementById('mdata').textContent);
var TEXTBOOK = "https://huchida-sys.github.io/beauty-menu-study/guide";
var byId = {}; Q.forEach(function(q){ byId[q.id] = q; });
var mById = {}; MENUS.forEach(function(m){ mById[m.id] = m; });
var chByKey = {}; CH.forEach(function(c){ chByKey[c.key] = c; });
var INTERVAL = [0, 1, 3, 7, 21];        // 箱ごとの次の出題までの日数（ライトナー方式）
var MASTER = 3;                          // 日を変えて3回続けて正解（箱3以上）＝定着
var K = 'beauty-drill-v2', KS = K + '-session';

// ---------- 日付 ----------
function ymd(d){ d = d || new Date(); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function addDays(s, n){ var p = s.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate()+n); return ymd(d); }
var TODAY = ymd();
function refreshDay(){ var t = ymd(); if (t !== TODAY) { TODAY = t; return true; } return false; }

// ---------- 保存（この端末のブラウザ。使えない環境でも動く） ----------
function load(k, def){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch(e){ return def; } }
function store(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
var db = load(K, null);
if (!db || !db.s) {
  db = {s:{}, x:{}, days:[], pref:{size:10, level:0}};
  var v1 = load('beauty-drill-v1', null);           // 旧版の成績を引き継ぐ
  if (v1) Object.keys(v1).forEach(function(id){ if (byId[id]) { var o = v1[id]; db.s[id] = {n:o.n||1, c:o.c||0, last:o.last, box:o.last===1?1:0, due:TODAY, d:null, g:0}; } });
}
db.x = db.x || {}; db.days = db.days || []; db.pref = db.pref || {size:10, level:0};
function save(){ store(K, db); }

// ---------- 記憶の箱 ----------
function rec(box, id, result){          // result: 'sure' | 'unsure' | 'wrong'
  var s = box[id] || {n:0, c:0, last:null, box:0, due:null, d:null, g:0};
  var prev = JSON.parse(JSON.stringify(s));
  s.n++;
  if (result === 'wrong') { s.last = 0; s.box = 1; s.due = addDays(TODAY, 1); s.g = 0; }
  else {
    s.c++; s.last = 1;
    if (result === 'unsure') { s.g = 1; if (s.box < 1) s.box = 1; s.due = addDays(TODAY, 1); }
    else { s.g = 0; if (s.d !== TODAY || s.box === 0) s.box = Math.min(s.box + 1, 4); s.due = addDays(TODAY, Math.max(1, INTERVAL[s.box])); }
  }
  s.d = TODAY; box[id] = s;
  if (db.days.indexOf(TODAY) < 0) { db.days.push(TODAY); db.days = db.days.slice(-60); }
  save(); return prev;
}
function isDue(st){ return !!(st && st.due && st.due <= TODAY); }
function mastered(st){ return !!(st && st.box >= MASTER && st.last === 1 && !st.g); }
function counts(){
  var seen = 0, mas = 0, due = 0, xok = 0, xdue = 0;
  Q.forEach(function(q){ var s = db.s[q.id]; if (!s) return; seen++; if (mastered(s)) mas++; if (isDue(s)) due++; });
  MENUS.forEach(function(m){ var s = db.x[m.id]; if (!s) return; if (s.last === 1 && !s.g) xok++; if (isDue(s)) xdue++; });
  return {seen:seen, mas:mas, due:due, xok:xok, xdue:xdue};
}
function chapterCounts(key){
  var qs = Q.filter(function(q){ return q.ch === key; }), m = 0, p = 0, r = 0;
  qs.forEach(function(q){ var s = db.s[q.id]; if (!s) return; if (mastered(s)) m++; else if (isDue(s) || s.last === 0) r++; else p++; });
  return {n:qs.length, m:m, p:p, r:r};
}
function dueTomorrow(){ var t = addDays(TODAY, 1); return Q.filter(function(q){ var s = db.s[q.id]; return s && s.due && s.due <= t; }).length; }

// ---------- 出題の選び方 ----------
function shuffle(a){ a = a.slice(); for (var i = a.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function lv1Passed(card){ return Q.some(function(q){ var s = db.s[q.id]; return q.card === card && q.level === 1 && s && s.c > 0; }); }
function hasLv1(card){ return Q.some(function(q){ return q.card === card && q.level === 1; }); }
function newPool(filter){   // まだ解いていない問題を教材の順に。応用は、同じカードの基本に正解してから
  return Q.filter(function(q){ return !db.s[q.id] && (!filter || filter(q)) && (q.level === 1 || !hasLv1(q.card) || lv1Passed(q.card)); });
}
function duePool(filter){   // 復習の期限が来た問題を、期限の古い順に
  return Q.filter(function(q){ return isDue(db.s[q.id]) && (!filter || filter(q)); })
          .sort(function(a, b){ var x = db.s[a.id].due, y = db.s[b.id].due; return x < y ? -1 : x > y ? 1 : 0; });
}
function todayPlan(){
  var size = db.pref.size || 10, dueAll = duePool();
  var due = dueAll.slice(0, Math.max(0, size - 3)), fresh = newPool().slice(0, size - due.length);
  if (due.length + fresh.length < size) due = dueAll.slice(0, size - fresh.length);
  return {due:due, fresh:fresh};
}
function lvOK(q){ return !db.pref.level || q.level === db.pref.level; }

// ---------- セッション（1問ごとに保存。24時間以内なら続きから） ----------
var S = load(KS, null);
if (S && (S.done || Date.now() - (S.t || 0) > 48*3600*1000 || !S.items || S.items.some(function(it){ return S.mode === 'x' ? !mById[it.id] : !byId[it.id]; }))) { S = null; store(KS, null); }
var view = 'home', sheet = null, ui = {};
function persist(){ if (S && !S.done) { S.t = Date.now(); store(KS, S); } else store(KS, null); }
function begin(mode, ids, label, kind, norecord, force){
  if (S && !S.done && !force && view === 'home') { ui.pending = [mode, ids, label, kind, norecord]; sheet = 'discard'; render(); return; }
  ids = ids.filter(function(v, i, a){ return a.indexOf(v) === i; });
  if (!ids.length) return;
  var c = counts();
  S = {mode:mode, kind:kind, label:label, norecord:!!norecord, items:ids.map(function(id){ return {id:id, order:shuffle([0,1,2,3])}; }),
       i:0, picked:null, res:[], prev:null, requeued:0, streak:0, day:TODAY, before:{mas:c.mas, seen:c.seen}, t:Date.now()};
  persist(); go('quiz');
}
function go(v){
  view = v; sheet = null;
  try { if (v !== 'home') history.pushState({v:v}, ''); } catch(e){}
  render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', function(){
  if (sheet) { sheet = null; if (view === 'quiz' && S && !S.done) { try { history.pushState({v:'quiz'}, ''); } catch(e){} } render(); return; }
  if (view === 'quiz' && S && !S.done) { sheet = 'quit'; try { history.pushState({v:'quiz'}, ''); } catch(e){} render(); return; }
  if (S && S.done) S = null;
  view = 'home'; render();
});

// ---------- 小物 ----------
// 日本語を文節の切れ目でだけ折り返すための <wbr> を入れる（句読点・カッコ・助詞のあと）
function jb(t){
  var e = esc(t);
  e = e.replace(/([、。・／！？」』）】〉：])/g, '$1<wbr>');

  var miss = r.filter(function(x){ return !x.ok || x.un; }).filter(function(x, i, a){ return a.findIndex(function(y){ return y.id === x.id; }) === i; });
  var msg = isX ? (ok === n ? '全部説明できました。間をあけて、また確かめます。' : 'あいまいだったメニューは、明日また出します。教材の「ひとことで」と図を見直しておきましょう。')
    : S.norecord ? (ok === n ? '全部取り返せました。明日の復習でもう一度確かめます。' : '残った問題は、明日の復習でもう一度出ます。')
    : rate === 1 ? '全問正解です。間をあけて、また出題します。'
    : rate >= .8 ? 'よくできています。間違えた問題は明日もう一度出ます。'
    : rate >= .5 ? (n - ok) + '問は、解説を読めば取れる問題です。下で確認しておきましょう。'
    : 'まだ覚え始めの段階です。間違えた問題の「教材で読み直す」から、該当カードの「ひとことで」と図を見ておきましょう。';
  var h = '<div class="wrap quiz"><section class="card result-top"><span class="sub">' + esc(S.label) + '</span>' +
    '<div class="score"><b>' + ok + '</b><span>/ ' + n + '</span><em>' + (isX ? '説明できた' : '問正解') + '</em></div>' +
    '<div class="rdots" aria-hidden="true">' + r.map(function(x){ return '<i class="' + (x.ok ? (x.un ? 'un' : '') : 'ng') + '"></i>'; }).join('') + '</div>' +
    '<p class="msg">' + msg + '</p>';
  if (!isX && !S.norecord) h += '<div class="delta"><span>定着に近づいた <b>+' + (S.up || 0) + '</b>問</span>' + (c.mas > S.before.mas ? '<span>定着 <b>+' + (c.mas - S.before.mas) + '</b></span>' : '') + '<span>新しく解いた <b>+' + Math.max(0, c.seen - S.before.seen) + '</b></span><span>明日の' + (db.pref.size || 10) + '問 準備OK</span></div>';
  h += '</section>';
  var wrongIds = r.filter(function(x){ return !x.ok; }).map(function(x){ return x.id; });
  var plan = todayPlan();
  if (!isX && wrongIds.length) h += '<button class="btn primary" data-act="retry">間違えた' + wrongIds.length + '問をもう一度<small>ここで正解しても、明日の復習には残ります</small></button>';
  else if (!isX && plan.due.length) h += '<button class="btn primary" data-act="today">残りの復習 ' + plan.due.length + '問を解く</button>';
  else if (isX && c.xdue) h += '<button class="btn primary" data-act="explain">続けて5メニュー</button>';
  else h += '<div class="done-today"><span class="ck">✓</span><div><b>今日はここまでで十分です</b><br><span class="sub">明日の' + (db.pref.size || 10) + '問は準備できています</span></div></div>';
  h += '<div class="row"><button class="btn secondary" data-act="home">ホームへ</button><button class="btn secondary" data-act="' + (isX ? 'explain' : 'more') + '">' + (isX ? 'もう5メニュー' : 'もう5問だけ') + '</button></div>';
  if (miss.length) {
    h += '<section class="sec"><h2>' + (isX ? '説明があいまいだったメニュー' : '見直しておきたい問題') + '（' + miss.length + '）</h2><ul class="misses">';
    miss.forEach(function(x){
      if (isX) { var m = mById[x.id]; h += '<li><details class="card"><summary>' + esc(m.name) + '</summary><p class="e">' + esc(m.one) + '</p>' + tbLink(m.id, m.name, chName(m.ch)) + '</details></li>'; return; }
      var q = byId[x.id];
      h += '<li><details class="card"><summary>' + jb(q.q) + (x.ok ? '<span class="more">うろ覚えで正解した問題</span>' : '') + '</summary><p class="a">正解：<b>' + esc(q.choices[q.answer]) + '</b></p><p class="e">' + esc(q.explain) + '</p>' + tbLink(q.card, cardTitle(q), chName(q.ch)) + '</details></li>';
    });
    h += '</ul></section>';
  }
  return h + '</div>';
}
function sign(n){ return (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n); }

// ---------- シート（中断の確認） ----------
function sheetHtml(){
  if (sheet === 'discard' && S) return '<div class="sheet-bg" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true" aria-label="確認">' +
    '<h3>前回の続きがあります</h3><p>「' + esc(S.label) + '」の ' + (S.i + 1) + ' 問目から再開できます。新しく始めると、この続きは消えます（答えた分の成績は残ります）。</p>' +
    '<button class="btn primary" data-act="resume">続きから再開する</button><button class="btn secondary" data-act="discard">続きを消して新しく始める</button></div></div>';
  if (sheet !== 'quit' || !S) return '';
  var answered = S.res.filter(Boolean).length;
  return '<div class="sheet-bg" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true" aria-label="中断の確認">' +
    '<h3>ここで中断しますか？</h3><p>' + (answered ? '答えた' + answered + '問は記録済みです。' : '') + '次にホームを開くと「前回の続きから」で再開できます（2日間）。</p>' +
    '<button class="btn primary" data-act="sheet-close">続ける</button>' +
    '<button class="btn secondary" data-act="later">あとで続きから</button>' +
    (answered ? '<button class="btn secondary" data-act="tores">ここまでの結果を見る</button>' : '') + '</div></div>';
}

// ---------- 描画 ----------
var app = document.getElementById('app'), live = document.getElementById('live');
function render(){
  refreshDay();
  var h = view === 'quiz' && S ? (S.done ? result() : S.mode === 'x' ? explain() : quiz()) : home();
  app.innerHTML = h + sheetHtml();
  ui.anim = false;
  if (ui.focusQ) { ui.focusQ = false; var f = document.getElementById('qtext') || document.querySelector('.xcard .name'); if (f) { f.setAttribute('tabindex', '-1'); try { f.focus({preventScroll:true}); } catch(e){} } }
  var sh = document.querySelector('.sheet h3'); if (sh) { sh.setAttribute('tabindex', '-1'); try { sh.focus({preventScroll:true}); } catch(e){} }
}

// ---------- 操作 ----------
function answer(pick){
  var it = S.items[S.i], q = byId[it.id], ok = pick === q.answer;
  S.picked = pick; S.prev = null;
  if (!it.re && !S.norecord) {
    S.prev = rec(db.s, q.id, ok ? (it.undone ? 'unsure' : 'sure') : 'wrong');
    S.b0 = S.b0 || {}; if (!(q.id in S.b0)) S.b0[q.id] = S.prev.box || 0;
    if (!ok && S.requeued < 3) {                     // 間違えた問題は3問あとにもう一度（成績には数えない）
      S.items.splice(Math.min(S.i + 4, S.items.length), 0, {id:q.id, order:shuffle([0,1,2,3]), re:true}); S.requeued++;
    }
  }
  S.res[S.i] = {id:q.id, ok:ok, re:!!it.re};
  S.streak = ok ? S.streak + 1 : 0;
  persist(); ui.anim = true; render();
  live.textContent = ok ? '正解' : '不正解。正解は ' + q.choices[q.answer];
  try { if (navigator.vibrate) navigator.vibrate(ok ? 12 : [18, 40, 18]); } catch(e){}
  var v = document.getElementById('verdict');
  if (v) {
    var rc = v.getBoundingClientRect(), bar = document.querySelector('.actionbar'), top = document.querySelector('.topbar');
    var limit = bar ? bar.getBoundingClientRect().top + 14 : window.innerHeight, head = top ? top.getBoundingClientRect().bottom + 12 : 60;
    if (rc.bottom > limit) window.scrollBy({top: Math.min(rc.bottom - limit, rc.top - head), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  }
}
function next(){
  if (S.i + 1 < S.items.length) { S.i++; S.picked = null; S.prev = null; persist(); ui.focusQ = true; render(); window.scrollTo(0, 0); }
  else finish();
}
function finish(partial){
  if (S.b0) S.up = Object.keys(S.b0).filter(function(id){ var st = db.s[id]; return st && st.box > S.b0[id] && !st.g; }).length;
  if (S.kind === 'today' && !partial) db.doneDay = TODAY;
  save(); S.done = true; persist();
  render(); window.scrollTo(0, 0);
  var r = S.res.filter(function(x){ return x && !x.re; });
  if (r.length >= 5 && r.every(function(x){ return x.ok && !x.un; })) confetti();
}
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  var dpr = window.devicePixelRatio || 1, W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr, x = cv.getContext('2d');
  var cs = getComputedStyle(document.documentElement), cols = [cs.getPropertyValue('--teal').trim(), cs.getPropertyValue('--ao').trim(), '#f2c14e'];
  var ps = []; for (var i = 0; i < 90; i++) ps.push({x: W/2, y: H*0.32, vx:(Math.random()-.5)*14*dpr, vy:(-Math.random()*12-4)*dpr, r:(Math.random()*4+3)*dpr, c:cols[i%3], a:Math.random()*6});
  var t0 = performance.now();
  (function f(t){ x.clearRect(0,0,W,H); var k = (t - t0)/900;
    ps.forEach(function(p){ p.x += p.vx; p.y += p.vy; p.vy += .45*dpr; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - k); x.fillRect(-p.r, -p.r/2, p.r*2, p.r); x.restore(); });
    if (k < 1) requestAnimationFrame(f); else cv.remove(); })(t0);
}
function ids(list){ return list.map(function(q){ return q.id; }); }
function startToday(){
  var p = todayPlan();
  begin('q', shuffle(ids(p.due)).concat(ids(p.fresh)), '今日の' + (p.due.length + p.fresh.length) + '問', 'today');   // 復習は章を混ぜ、新しい問題は教材の順
}
function startChapter(key){
  var size = db.pref.size || 10, f = function(q){ return q.ch === key && lvOK(q); };
  var rest = shuffle(Q.filter(function(q){ return f(q) && db.s[q.id] && !isDue(db.s[q.id]); }));
  var list = duePool(f).concat(newPool(f)).concat(rest);
  if (!list.length) list = shuffle(Q.filter(f));
  begin('q', ids(list).slice(0, size), chName(key), 'chapter');
}
function startExplain(){
  var due = shuffle(MENUS.filter(function(m){ return isDue(db.x[m.id]); })), fresh = MENUS.filter(function(m){ return !db.x[m.id]; });
  var pick = due.concat(fresh).slice(0, 5);
  if (!pick.length) pick = shuffle(MENUS).slice(0, 5);
  begin('x', ids(pick), '説明チャレンジ', 'explain');
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act],[data-pick],[data-ch],[data-size],[data-level],[data-rate]');
  if (!b || b.disabled) return;
  if (b.classList.contains('sheet-bg') && e.target !== b) return;
  var d = b.dataset, it;
  if (d.pick !== undefined) { if (S && S.picked === null) answer(+d.pick); return; }
  if (d.rate) { it = S.items[S.i]; rec(db.x, it.id, d.rate); S.res[S.i] = {id:it.id, ok:d.rate !== 'wrong', un:d.rate === 'unsure'}; persist(); next(); return; }
  if (d.ch) { startChapter(d.ch); return; }
  if (d.size) { db.pref.size = +d.size; ui.customOpen = true; save(); render(); return; }
  if (d.level !== undefined) { db.pref.level = +d.level; ui.customOpen = true; save(); render(); return; }
  switch (d.act) {
    case 'today': startToday(); break;
    case 'intro': begin('q', ids(Q.filter(function(q){ return q.ch === 'k1' && q.level === 1; })).slice(0, 5), '基礎編①の基本 5問', 'today'); break;
    case 'explain': startExplain(); break;
    case 'random': begin('q', ids(shuffle(Q.filter(lvOK))).slice(0, db.pref.size), '全範囲からランダム', 'random'); break;
    case 'review': begin('q', ids(duePool(lvOK)).slice(0, db.pref.size), '要復習だけ', 'review'); break;
    case 'more': begin('q', ids(newPool().concat(shuffle(Q))).filter(function(v, i, a){ return a.indexOf(v) === i; }).slice(0, 5), 'もう5問', 'more'); break;
    case 'retry': var w = S.res.filter(function(x){ return x && !x.ok && !x.re; }).map(function(x){ return x.id; }); begin('q', w, '間違えた問題をもう一度', 'retry', true); break;
    case 'resume': sheet = null; go('quiz'); break;
    case 'discard': var pd = ui.pending; S = null; store(KS, null); sheet = null; if (pd) begin(pd[0], pd[1], pd[2], pd[3], pd[4], true); break;
    case 'next': next(); break;
    case 'unsure': it = S.items[S.i]; if (S.prev) { if (S.prev.n === 0) delete db.s[it.id]; else db.s[it.id] = S.prev; } rec(db.s, it.id, 'unsure'); S.res[S.i].un = true; persist(); next(); break;
    case 'undo': it = S.items[S.i];
      if (S.prev) { if (S.prev.n === 0) delete db.s[it.id]; else db.s[it.id] = S.prev; save(); }
      S.items = S.items.filter(function(x, k){ return !(k > S.i && x.re && x.id === it.id); });
      S.requeued = S.items.filter(function(x){ return x.re; }).length;
      it.order = shuffle([0,1,2,3]); it.undone = true;
      S.res.length = S.i; S.picked = null; S.prev = null; S.streak = 0; persist(); render(); break;
    case 'reveal': S.picked = 1; persist(); render(); break;
    case 'quit': sheet = 'quit'; render(); break;
    case 'sheet-close': sheet = null; render(); break;
    case 'later': sheet = null; view = 'home'; persist(); render(); window.scrollTo(0,0); break;
    case 'tores': sheet = null; S.items = S.items.slice(0, S.res.length); S.i = S.items.length - 1; finish(true); break;
    case 'home': if (S && S.done) S = null; view = 'home'; render(); window.scrollTo(0,0); break;
    case 'backup': ui.panel = 'backup'; ui.copied = false;
      try { navigator.clipboard.writeText(JSON.stringify(db)).then(function(){ ui.copied = true; render(); }, function(){}); } catch(err){}
      render(); var t = document.getElementById('bk'); if (t) t.select(); break;
    case 'restore': ui.panel = 'restore'; ui.err = ''; render(); break;
    case 'restore-do': try { var v = JSON.parse(document.getElementById('rs').value); if (!v || !v.s) throw 0;
        db = v; db.pref = db.pref || {size:10, level:0}; db.x = db.x || {}; db.days = db.days || []; save(); ui.panel = null; render(); }
      catch(err){ ui.err = '読み込めませんでした。バックアップで表示された文字列を、最初から最後まで貼り付けてください。'; render(); } break;
    case 'reset': ui.panel = 'reset'; render(); break;
    case 'reset-do': db = {s:{}, x:{}, days:[], pref:db.pref}; save(); S = null; store(KS, null); ui.panel = null; render(); break;
    case 'panel-close': ui.panel = null; render(); break;
    case 'line-x': ui.lineClosed = true; render(); break;
  }
});
document.addEventListener('toggle', function(e){ if (e.target.classList && e.target.classList.contains('custom')) ui.customOpen = e.target.open; }, true);
document.addEventListener('keydown', function(e){
  if (view !== 'quiz' || !S || S.done || sheet) return;
  var k = e.key.toLowerCase(), idx = '1234'.indexOf(k); if (idx < 0) idx = 'abcd'.indexOf(k);
  if (S.mode === 'q' && S.picked === null && idx >= 0) { var bs = document.querySelectorAll('.choice'); if (bs[idx]) bs[idx].click(); }
  else if (k === 'enter' && S.picked !== null && S.mode === 'q') { var n = document.getElementById('next'); if (n) { e.preventDefault(); n.click(); } }
  else if (S.mode === 'x' && S.picked === null && k === 'enter') { e.preventDefault(); S.picked = 1; persist(); render(); }
});

document.addEventListener('visibilitychange', function(){ if (!document.hidden && refreshDay()) render(); });
window.addEventListener('pageshow', function(){ if (refreshDay()) render(); });

// 公開ページの更新が届いても、解いている途中をそのまま続けられるようにする
var hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(function(){ return {view:view}; });
function boot(data){
  if (data && data.view === 'quiz' && S) view = 'quiz';
  else if (S && !S.done && Date.now() - (S.t || 0) < 30*60*1000) view = 'quiz';
  render();
  var m = /^#ch-([a-z0-9]+)$/.exec(location.hash || '');
  if (m && chByKey[m[1]] && !(S && !S.done)) { try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} startChapter(m[1]); }
}
window.addEventListener('pageshow', function(e){ if (S && !S.done && view !== 'quiz' && (e.persisted || Date.now() - (S.t || 0) < 30*60*1000)) { view = 'quiz'; render(); } });
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data || {});
})();
</script>
