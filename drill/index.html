<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>美容メニュー 4択ドリル</title>
<meta property="og:title" content="美容メニュー 4択ドリル">
<meta property="og:description" content="全83メニューの教材から376問（応用・Dr級）。毎日10問・間をあけた復習・説明チャレンジ（社内向け）">
<meta property="og:type" content="website">
<meta name="theme-color" content="#24507a">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* コンセプト「カルテ・コーチ」：診療ノートの清潔感に、1問ごとの手応え。
   レイアウト：スマホは1列（上に進み具合、下に親指で押す操作帯）／PCはホームを2列、出題は中央720px */
:root{
  --bg:#f5f7f9; --surface:#ffffff; --surface-2:#eef2f6; --line:#dfe5eb;
  --fg:#1d2733; --sub:#56646f; --faint:#5f6c78;
  --acc:#24507a; --acc-hover:#1c4266; --on-acc:#ffffff; --link:#24507a; --acc-soft:rgba(36,80,122,.07);
  --teal:#1f9e9a; --teal-ink:#147a76; --teal-soft:#e6f5f4; --ao:#1D7FAB;
  --on-ok:#ffffff; --on-ng:#ffffff; --on-teal:#ffffff;
  --ok:#237a52; --ok-soft:#e5f3eb; --ng:#b8432f; --ng-soft:#fbecea;
  --review:#8a5d00; --review-soft:#fff4dc;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --num:"Inter","Hiragino Sans",system-ui,sans-serif;
  --r-card:16px; --r-ctl:12px;
  --shadow:0 1px 2px rgba(20,40,60,.06),0 6px 20px rgba(20,40,60,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161d; --surface:#18212b; --surface-2:#212c38; --line:#2c3946;
  --fg:#e8eef4; --sub:#a3b3c2; --faint:#8494a3;
  --acc:#3a72a8; --acc-hover:#2f6496; --on-acc:#ffffff; --link:#8bbbe6; --acc-soft:rgba(139,187,230,.10);
  --teal:#5cc9c4; --teal-ink:#5cc9c4; --teal-soft:#16302f; --on-ok:#0e1a14; --on-ng:#2a100c; --on-teal:#0b2423; --ao:#62b6dd;
  --ok:#6fcf97; --ok-soft:#173326; --ng:#ff8a7a; --ng-soft:#3a201c;
  --review:#f0c46a; --review-soft:#352a12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#18212b; --surface-2:#212c38; --line:#2c3946;
  --fg:#e8eef4; --sub:#a3b3c2; --faint:#8494a3;
  --acc:#3a72a8; --acc-hover:#2f6496; --on-acc:#ffffff; --link:#8bbbe6; --acc-soft:rgba(139,187,230,.10);
  --teal:#5cc9c4; --teal-ink:#5cc9c4; --teal-soft:#16302f; --on-ok:#0e1a14; --on-ng:#2a100c; --on-teal:#0b2423; --ao:#62b6dd;
  --ok:#6fcf97; --ok-soft:#173326; --ng:#ff8a7a; --ng-soft:#3a201c;
  --review:#f0c46a; --review-soft:#352a12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg); color:var(--fg)}
body{font-family:var(--f); font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%}
button,a{font:inherit; color:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
button{cursor:pointer; background:none; border:0; padding:0}
button[disabled]{cursor:default; opacity:.5}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link); outline-offset:3px; border-radius:6px}
.num{font-family:var(--num); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
h1,h2,h3,.qtext,.name,.nm,.jp{font-feature-settings:"palt"}
.qtext,.choice,.verdict p,.nm,.jp,.misses summary,.xcard .name,.answer .one,.explain-entry b{word-break:keep-all; overflow-wrap:anywhere; line-break:strict}
h1,h2,h3{margin:0; line-height:1.4}
.wrap{max-width:640px; margin:0 auto; padding-inline:16px; padding-block:16px 40px; display:flex; flex-direction:column; gap:20px}
.sub{color:var(--sub); font-size:14px}
.tiny{font-size:12px; color:var(--faint)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card)}
.btn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:52px; padding:10px 16px; border-radius:var(--r-ctl); font-weight:700; font-size:16px; width:100%; text-align:center; line-height:1.4}
.btn.primary{background:var(--acc); color:var(--on-acc)}
.btn.primary:hover{background:var(--acc-hover)}
.btn.secondary{background:var(--surface); border:1.5px solid var(--line); color:var(--fg)}
.btn small{font-weight:400; font-size:13px; opacity:.85; display:block}
.btn .ico{margin-right:4px}
.btn.inline{flex-direction:row; gap:8px}
.row{display:flex; gap:10px}
.row>*{flex:1 1 0; min-width:0}
.badge{display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px; padding:0 7px; border-radius:999px; font:700 12px/1 var(--num); background:var(--review-soft); color:var(--review)}
.pill{display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--surface-2); color:var(--sub); white-space:nowrap}
.pill.lv1{background:transparent; border:1px solid var(--line)}
.pill.lv2{background:var(--acc-soft); color:var(--link); box-shadow:inset 0 0 0 1px var(--link)}
.pill.lv-a{background:transparent; color:var(--ao); box-shadow:inset 0 0 0 1.5px var(--ao)}
.pill.lv-d{background:var(--acc); color:var(--on-acc)}
.basis{margin:0; padding:10px 12px; border-left:3px solid var(--line); background:var(--surface-2); border-radius:0 10px 10px 0; font-size:14px; line-height:1.75; color:var(--fg); word-break:keep-all; overflow-wrap:anywhere; line-break:strict}
.basis .lab{display:block; font-size:12px; font-weight:700; color:var(--sub); margin-bottom:2px}
.lvsel{padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.lvsel .help{margin:0}
.ch .lvn{display:block; font-size:12px; font-weight:400; color:var(--sub); margin-top:2px; white-space:nowrap}
.lvres{display:flex; flex-wrap:wrap; gap:8px}
.lvres span{font-size:13px; padding:5px 11px; border-radius:999px; background:var(--surface-2); color:var(--sub)}
.lvres b{font-family:var(--num); color:var(--fg)}
.ico{width:22px; height:22px; flex:0 0 22px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

/* ---------- ホーム ---------- */
.brand{display:flex; align-items:center; gap:12px}
.brand .mark{width:40px; height:40px; border-radius:12px; background:var(--acc); color:var(--on-acc); display:grid; place-items:center; flex:0 0 40px}
.brand h1{font-size:20px}
.brand p{margin:0; font-size:12px; color:var(--faint); line-height:1.5}
.resume{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--r-card); background:var(--acc-soft); border:1.5px solid var(--link); text-align:left; width:100%; min-height:64px}
.resume b{display:block; font-size:16px}
.resume span{font-size:13px; color:var(--sub)}
.resume .go{margin-left:auto; font-size:24px; color:var(--link)}
.hero{padding:20px; display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow)}
.hero-top{display:flex; align-items:center; gap:18px}
.ring{position:relative; width:88px; height:88px; flex:0 0 88px}
.ring svg{width:88px; height:88px; transform:rotate(-90deg)}
.ring .v{position:absolute; inset:0; display:grid; place-items:center; text-align:center; line-height:1.15}
.ring .v b{font:800 24px/1 var(--num)}
.ring .v small{font:700 12px var(--num)}
.ring .v span{display:block; font-size:12px; color:var(--sub)}
.kpis{display:flex; flex-direction:column; gap:4px; min-width:0}
.kpis div{display:flex; align-items:baseline; gap:6px; font-size:13px; color:var(--sub); flex-wrap:wrap}
.kpis .dot{width:8px; height:8px; border-radius:50%; background:var(--teal); align-self:center; flex:0 0 8px}
.kpis b{font:700 18px/1.3 var(--num); color:var(--fg)}
.week{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--sub); flex-wrap:wrap}
.week i{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-style:normal; font-size:12px; color:var(--faint)}
.week i.on{background:var(--teal-ink); border-color:var(--teal-ink); color:var(--on-teal); font-weight:700}
.week i.today{border-color:var(--teal-ink); border-width:2px}
.week .lab{margin-left:auto}
.today-btn{align-items:flex-start; text-align:left; padding:16px 18px; min-height:76px}
.today-btn b{font-size:18px}
.today-btn span{font-size:13px; opacity:.9; font-weight:400}
.done-today{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-ctl); background:var(--teal-soft); color:var(--fg); font-size:14px}
.done-today .ck{width:28px; height:28px; border-radius:50%; background:var(--teal-ink); color:var(--on-teal); display:grid; place-items:center; font-weight:700; flex:0 0 28px}
.sec{display:flex; flex-direction:column; gap:10px}
.sec h2{font-size:16px; display:flex; align-items:center; gap:8px}
.sec h2 .tiny{font-weight:400; margin-left:auto}
.explain-entry{display:flex; align-items:center; gap:14px; padding:14px 16px; text-align:left; width:100%; min-height:72px}
.explain-entry .ic{width:44px; height:44px; border-radius:12px; background:var(--teal-soft); color:var(--teal); display:grid; place-items:center; flex:0 0 44px}
.explain-entry b{display:block; font-size:16px; line-height:1.45}
.explain-entry span{font-size:13px; color:var(--sub)}
.explain-entry .chev,.ch .chev{font-size:24px; color:var(--faint)}
.chev{color:var(--faint); font-size:22px; margin-left:auto}
.chapters{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.ch{display:grid; grid-template-columns:40px minmax(0,1fr) auto; align-items:center; gap:6px 12px; width:100%; padding:12px 12px 12px 14px; text-align:left; min-height:68px}
.ch .ic-wrap{grid-row:span 2; width:40px; height:40px; border-radius:10px; background:var(--surface-2); color:var(--link); display:grid; place-items:center}
.ch .nm{font-weight:700; font-size:15px; min-width:0; line-height:1.4}
.ch .meta{font-size:12px; color:var(--sub); white-space:nowrap; display:flex; gap:6px; align-items:center}
.ch .chev{grid-row:span 2}
.mastered{color:var(--teal-ink); font-weight:700}
.ch .r2{grid-column:2; display:flex; align-items:center; gap:10px}
.ch .r2 .bar{flex:1}
.bar{height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; display:flex}
.bar i{display:block; height:100%}
.bar .m{background:var(--teal)} .bar .p{background:var(--teal); opacity:.38} .bar .r{background:var(--review)}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--sub)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.custom summary{list-style:none; cursor:pointer; min-height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-weight:700; font-size:15px}
.custom summary::-webkit-details-marker{display:none}
.custom summary::after{content:"＋"; color:var(--faint); font-weight:400; font-size:18px}
.custom[open] summary::after{content:"−"}
.custom .in{padding:0 16px 16px; display:flex; flex-direction:column; gap:14px}
.setting{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.setting label{font-size:14px; color:var(--sub)}
.seg{display:inline-flex; border:1.5px solid var(--line); border-radius:var(--r-ctl); overflow:hidden; background:var(--surface)}
.seg button{min-width:58px; min-height:44px; padding:0 12px; font-size:15px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc); color:var(--on-acc); font-weight:700}
.help{font-size:13px; color:var(--faint); margin:-6px 0 0; line-height:1.6}
.foot{display:flex; flex-direction:column; gap:10px; font-size:13px; color:var(--sub)}
.foot .links{display:flex; flex-wrap:wrap; gap:0 16px}
.foot .links .danger{color:var(--ng)}
.foot .links button,.foot .links a{min-height:44px; display:inline-flex; align-items:center; color:var(--link); text-decoration:underline; text-underline-offset:3px; font-size:13px}
textarea{width:100%; min-height:90px; font:12px/1.5 ui-monospace,monospace; border:1.5px solid var(--line); border-radius:10px; padding:10px; background:var(--surface); color:var(--fg)}
.onboard{padding:22px 20px; display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow)}
.onboard h2{font-size:20px}
.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; counter-reset:s}
.steps li{display:grid; grid-template-columns:30px minmax(0,1fr); gap:12px; font-size:15px; counter-increment:s; line-height:1.6}
.steps li::before{content:counter(s); width:30px; height:30px; border-radius:50%; background:var(--acc-soft); color:var(--link); display:grid; place-items:center; font:700 14px var(--num)}
.steps b{display:block}
.steps .sub{font-size:13px}

/* ---------- 出題 ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; align-items:center; gap:12px; padding:6px 0; margin-top:-8px}
.xbtn{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; color:var(--sub); flex:0 0 44px}
.xbtn:hover{background:var(--surface-2)}
.dots{flex:1; display:flex; gap:4px; min-width:0}
.dots i{flex:1; height:6px; border-radius:3px; background:var(--surface-2)}
.dots i.ok{background:var(--ok)} .dots i.ng{background:var(--ng)} .dots i.cur{background:var(--acc)}
.dots i.re{background:transparent; box-shadow:inset 0 0 0 1.5px var(--review)}
.counter{font:700 14px var(--num); color:var(--sub); white-space:nowrap}
.qhead{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.streak{margin-left:auto; font-size:13px; font-weight:700; color:var(--teal-ink)}
.qtext{font-size:20px; font-weight:700; line-height:1.6; margin:0; letter-spacing:.02em}
.choices{display:flex; flex-direction:column; gap:10px}
.choice{position:relative; display:grid; grid-template-columns:34px minmax(0,1fr); gap:4px 12px; align-items:center; text-align:left; width:100%; min-height:60px; padding:12px 14px; border-radius:var(--r-ctl); border:1.5px solid var(--line); background:var(--surface); font-size:16px; line-height:1.6; letter-spacing:.01em; transition:border-color .15s, background .15s}
.choice .k{grid-row:span 2; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); font:700 14px var(--num); color:var(--sub)}
.choice:not([disabled]):hover{border-color:var(--link)}
.choice:not([disabled]):active{transform:scale(.99)}
.choice[disabled]{cursor:default; opacity:1}
.choice .tag{justify-self:start; font-size:13px; font-weight:700; padding:1px 8px; border-radius:999px; line-height:1.6}
.choice.right{border-color:var(--ok); background:var(--ok-soft)}
.choice.right .k{background:var(--ok); color:var(--on-ok)}
.choice.right .tag{background:var(--ok); color:var(--on-ok)}
.choice.wrong{border-color:var(--ng)}
.choice.wrong .k{background:var(--ng); color:var(--on-ng)}
.choice.wrong .tag{background:var(--ng-soft); color:var(--ng)}
.choice.other{color:var(--sub)}
@media (max-width:700px){
  .choice.other{min-height:44px; padding:8px 14px}
  .choice.other>span:nth-child(2){white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
  .choice.other .k{width:28px; height:28px}
}
.choice .k{position:relative}
.choice .mk{position:absolute; right:-5px; top:-5px; width:18px; height:18px; border-radius:50%; display:grid; place-items:center; background:var(--surface); box-shadow:0 0 0 1.5px currentColor}
.choice .mk svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.choice.right .mk{color:var(--ok)} .choice.wrong .mk{color:var(--ng)}
.verdict .correct{margin:0; font-size:16px; font-weight:700; line-height:1.6; color:var(--fg)}
.verdict .correct .kk{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--ok); color:var(--on-ok); font:700 13px var(--num); margin-right:6px; vertical-align:2px}
.hico{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.choice.pop .k{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.verdict{padding:16px 16px 12px; display:flex; flex-direction:column; gap:10px; border-left:4px solid var(--ok); animation:rise .25s ease-out}
.verdict.ng{border-left-color:var(--ng)}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.verdict h3{font-size:20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.verdict.ok h3{color:var(--ok)} .verdict.ng h3{color:var(--ng)}
.verdict h3 .ans{color:var(--fg); font-size:16px}
.verdict h3 .ask{flex-basis:100%; font-size:13px; font-weight:400; color:var(--sub)}
.verdict p{margin:0; font-size:15px; line-height:1.85}
.tb-link{display:flex; align-items:center; gap:10px; min-height:52px; padding:10px 12px; border-radius:10px; background:var(--acc-soft); color:var(--link); text-decoration:none; font-size:14px; font-weight:700; line-height:1.45}
.tb-link div{min-width:0}
.tb-link span{font-weight:400; color:var(--sub); display:block; font-size:13px}
.tb-link .arr{margin-left:auto; flex:0 0 auto}
.undo{align-self:flex-start; font-size:13px; color:var(--sub); text-decoration:underline; text-underline-offset:3px; min-height:44px; padding:0 4px}
.actionbar{position:sticky; bottom:0; z-index:5; background:var(--bg); border-top:1px solid var(--line); box-shadow:0 -6px 16px rgba(20,40,60,.06); padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; margin-bottom:-28px}
.actionbar .row .btn{min-height:58px}
.actionbar .row .undo-ico{flex:0 0 56px; padding:6px 0; font-size:20px; color:var(--sub)}
.actionbar .row .undo-ico small{font-size:12px}
.actionbar.idle{border-top:0; box-shadow:none; padding:0; background:transparent}
.keys{font-size:12px; color:var(--faint); text-align:center; display:none; margin:0}
@media (hover:hover) and (min-width:900px){ .keys{display:block} }

/* 説明チャレンジ */
.xcard{padding:24px 18px; display:flex; flex-direction:column; gap:10px; text-align:center; align-items:center}
.xcard .lab{font-size:13px; color:var(--sub)}
.xcard .name{font-size:26px; font-weight:700; line-height:1.4}
.xcard .yomi{font-size:14px; color:var(--faint)}
.xhint{font-size:14px; color:var(--sub); text-align:center; margin:0}
.answer{padding:16px; display:flex; flex-direction:column; gap:10px; border-left:4px solid var(--teal); animation:rise .25s ease-out}
.answer .one{font-size:17px; font-weight:700; line-height:1.75; margin:0}
.answer ol{margin:0; padding-left:1.3em; font-size:14.5px; line-height:1.8}
.rate{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.rate .btn{min-height:62px; font-size:15px; padding:8px 6px}

/* シート（中断の確認） */
.sheet-bg{position:fixed; inset:0; z-index:20; background:rgba(10,18,26,.45); display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:520px; background:var(--surface); border-radius:20px 20px 0 0; padding:22px 16px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet h3{font-size:18px}
.sheet p{margin:0 0 4px; font-size:14px; color:var(--sub)}

/* ---------- 結果 ---------- */
.result-top{padding:22px 20px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow)}
.score{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap}
.score b{font:800 56px/1 var(--num); letter-spacing:-.03em}
.score span{font:700 22px var(--num); color:var(--sub)}
.score em{font-style:normal; font-size:16px; color:var(--sub); margin-left:6px}
.rdots{display:flex; flex-wrap:wrap; gap:6px}

<script id="qdata" type="application/json">[{"id": "d-k-principles-7", "ch": "k1", "card": "k-principles", "level": "dr", "q": "あおなぎ（本厚木）に来院した人が、目の下のふくらみ・その下のみぞ・余った皮膚のたるみの3つを「1回の手術でまとめて直したい」と言う。教材に合う案内は？", "choices": ["あおなぎの切開法で受ける。まつげの下を切るので、余った皮膚もふくらみも同時に切り取れる", "あおなぎの裏ハムラにHIFUを足す。ふくらみはみぞへ移し、余った皮膚は熱で締めて減らす", "デイズのDays式裏ハムラで受ける。裏から脂肪を敷き直せば、余った皮膚の分も減らせる", "デイズで受ける。余った皮膚は切る手術でしか減らせず、あおなぎには目の下の皮膚を切る手術の掲載がない"], "answer": 3, "explain": "余った皮膚そのものは、切る手術でしか減らせない。目の下で皮膚を切るのは表ハムラと切開法で、どちらもあおなぎのサイトには掲載がないので、デイズで受けてもらう。HIFUの熱では皮膚の量は減らない。裏ハムラは皮膚を切らないので、余った皮膚は減らせない。", "basis": "余った皮膚そのものは、切る手術でしか減らせない"}, {"id": "a-k-layers-1", "ch": "k1", "card": "k-layers", "level": "apply", "q": "「たるみが気になってピコレーザーを数回受けたが、あまり変わらない」と相談された。理由と、次に考える施術の組み合わせで合うものは？", "choices": ["ピコは回数が足りないだけ → ピコをくり返す", "ピコは①の皮膚だけに作用 → HIFU", "ピコは③の膜に届きすぎる → ピーリング", "ピコは②足すの施術 → ヒアルロン酸注射"], "answer": 1, "explain": "ピコレーザーは①の皮膚だけに作用し、たるみはもっと深い層の問題。③の膜（SMAS）を熱で縮めるHIFUを考える。層が違うのでピコをくり返しても届かない。ピコは③の膜には作用せず、②足すではなく⑤肌を生まれ変わらせるの代表。", "basis": "ピコレーザーは①の皮膚だけに作用します"}, {"id": "d-k-skin-5", "ch": "k1", "card": "k-layers", "level": "dr", "q": "あおなぎ（本厚木）に来院。肌のハリより、フェイスラインのたるみをSMASから締めたい人への機械の案内で、教材と合うものは？", "choices": ["XERFは高周波でSMASまで届く機械で、あおなぎのサイトには掲載がない", "HIFUは超音波でSMASに熱を集める機械で、あおなぎのサイトには掲載がない", "ソフウェーブは超音波でSMASに熱を集める機械で、あおなぎにも掲載がある", "HIFUは超音波でSMASに熱を集める機械で、あおなぎのサイトにも掲載がある"], "answer": 3, "explain": "SMASに熱を集めるのは超音波を一点に集めるHIFUで、両院とも全顔＋顎下 ¥42,800 でのっている。XERFは高周波でハリの層〜脂肪を広く温める機械で、SMASは担当外。HIFUはあおなぎのサイトにも掲載がある。ソフウェーブは超音波でもハリの層までで、あおなぎのサイトに掲載がない。", "basis": "同じ「たるみ治療」でも、HIFUは③の膜を熱で縮め"}, {"id": "d-k-aging-3", "ch": "k1", "card": "k-aging", "level": "dr", "q": "口の横の脂肪のもたつきと、余った皮膚のたるみがある人。「今回の休みは10日で、数日つける固定バンドは人に見られたくない」「来年1か月休めるので、そのとき余った皮膚を切り取りたい」。教材に合う組み立ては？", "choices": ["今回は口の中から取るジョールファット除去、来年はフェイスリフト", "今回は皮膚を数ミリ切って吸う顔の脂肪吸引、来年はフェイスリフト", "今回は口の中から取るジョールファット除去、来年はミッドフェイスリフト", "今回は皮膚を数ミリ切って吸う顔の脂肪吸引、来年はミッドフェイスリフト"], "answer": 0, "explain": "顔の脂肪吸引は腫れが1〜2週間で、数日は固定バンドが要る。ジョールファット除去は口の中から取り、口が開けにくいのは3日〜1週間ほど。余った皮膚を切り取るのは切開リフトで、その1つがフェイスリフト（腫れは3〜4週間）。ミッドフェイスリフトは脂肪を上へ戻す手術で、皮膚は切り取らない。", "basis": "余った皮膚は切開リフトで切り取る"}, {"id": "d-k-aging-5", "ch": "k1", "card": "k-aging", "level": "dr", "q": "デイズで糸リフトを受けて2週間の人が「左だけ引きつれて凹んでいる」「全体に引き上がりが弱い」と来院した。教材に合う案内は？", "choices": ["保証で診るのは凹みと引き上がりの両方。弱い引き上がりは、ヒアルロン酸を足して補う", "保証で診るのは左の凹みのほうだけ。弱い引き上がりは、引き上げる施術を重ねて補う", "保証で診るのは左の凹みのほうだけ。弱い引き上がりは、ヒアルロン酸を足して補う", "保証で診るのは凹みと引き上がりの両方。弱い引き上がりは、引き上げる施術を重ねて補う"], "answer": 1, "explain": "糸リフトの保証は1か月で、対象は凹凸・不整・明らかな左右差。引き上げ効果の有無は保証しない。引き上がりが弱いのは下がったままの状態なので、下がったなら上げる（HIFU・糸リフト・切開リフト）。足すのは減った・くぼんだとき。", "basis": "下がったなら上げる、減ったなら足す、余ったなら減らす"}, {"id": "a-k-eye-1", "ch": "k1", "card": "k-eye", "level": "apply", "q": "目はしっかり開き、二重の線もある。それでも「上まぶたがぽってりして重たい印象」が悩みの人。原因と施術の組み合わせで合うものは？", "choices": ["挙筋がゆるんでいる → 眼瞼下垂の手術", "蒙古ひだがある → 目頭切開", "眼輪筋が厚い → 涙袋形成", "眼窩脂肪が多い → まぶたの脂肪取り"], "answer": 3, "explain": "上まぶたで眼窩脂肪が多いと厚く腫れぼったく見えるので、まぶたの脂肪取りが合う。挙筋のゆるみは目の開きの問題で、この人は目がしっかり開く。蒙古ひだは目頭のかぶさり。涙袋形成は下まつ毛の下のふくらみを作る施術で、上まぶたの厚みは減らない。", "basis": "黄色の眼窩脂肪が多いと、まぶたが厚く腫れぼったく見えます"}, {"id": "a-k-eye-2", "ch": "k1", "card": "k-eye", "level": "apply", "q": "「目と目の間が広く、ぼんやりした印象。目の横幅を内側へ広げて、目と目の距離を縮めたい」という人。合う施術は？", "choices": ["目頭切開", "目尻切開", "二重埋没法で幅を広げる", "涙袋形成"], "answer": 0, "explain": "目頭にかぶさる皮膚（蒙古ひだ）があると目頭の内側が隠れ、目と目の間が離れて見える。目頭切開はここを切って目を内側に広げる。目尻切開は外側へ広げる施術、二重埋没法は上まぶたの折り目、涙袋形成は下まつ毛の下のふくらみで、目と目の距離は縮まらない。", "basis": "蒙古ひだは目頭にかぶさる皮膚で、目頭切開はここを切って目を内側に広げます"}, {"id": "a-k-eye-3", "ch": "k1", "card": "k-eye", "level": "apply", "q": "上まぶたの部品（挙筋・瞼板・眼輪筋）と施術の結びつきについて、教材と合わないものはどれ？", "choices": ["二重埋没法では、瞼板が糸をかける土台になる", "眼瞼下垂の多くは、つなぎ直す手術で対応する", "眼瞼下垂の多くは、眼輪筋と瞼板のつながりのゆるみ", "まぶたの脂肪取りは、眼窩脂肪を減らす"], "answer": 2, "explain": "眼瞼下垂の多くは、まぶたを上げる筋肉（挙筋）と瞼板のつながりがのびてゆるんだ状態。眼輪筋は目を閉じる別の筋肉。瞼板が二重埋没法で糸をかける土台になること、つなぎ直すのが眼瞼下垂の手術であること、まぶたの脂肪取りが眼窩脂肪を減らすことは教材どおり。", "basis": "まぶたを上げる筋肉（挙筋）は、まぶたの縁にある硬い板（瞼板）につながっています"}, {"id": "d-k-eye-6", "ch": "k1", "card": "k-eye", "level": "dr", "q": "あおなぎ（本厚木）で目の下のふくらみ（目袋）を取りたい人が、「同じ日に涙袋もふっくらさせたい」「涙袋は気に入らなければ元に戻したい」と言う。教材に合う案内は？", "choices": ["目袋は局所麻酔込み¥98,000の経結膜脱脂。涙袋も中身は眼窩脂肪なので、取った脂肪を移して同じ日にふくらませる", "目袋は静脈麻酔込み¥98,000の経結膜脱脂。涙袋は中身が眼輪筋で別もの。デイズの糸の涙袋形成なら外せば戻せる", "目袋は局所麻酔込み¥98,000の経結膜脱脂。涙袋は中身が眼輪筋で別もの。デイズの糸の涙袋形成なら外せば戻せる", "目袋は静脈麻酔込み¥98,000の経結膜脱脂。涙袋も中身は眼窩脂肪なので、取った脂肪を移して同じ日にふくらませる"], "answer": 2, "explain": "目袋は前に出た眼窩脂肪で、あおなぎの経結膜脱脂は局所麻酔込み¥98,000（静脈麻酔込みは脱脂＋脂肪注入など）。涙袋は中身が眼輪筋で、目袋とは別もの。涙袋形成はあおなぎに掲載がない（デイズのみ）ので、糸で作るならデイズで受ける。裏から糸で作り、外せば元に戻せる。", "basis": "中身は目のまわりの筋肉（眼輪筋）"}, {"id": "a-k-eye2-1", "ch": "k1", "card": "k-eye2", "level": "apply", "q": "目の下のふくらみも、その下の溝も目立つ人。「脂肪を取るだけだと溝が残りそう」「顔の表面に傷は残したくない」と話している。合う施術は？", "choices": ["切らないクマ取り（経結膜脱脂）", "表ハムラ法", "裏ハムラ法", "目の下へのヒアルロン酸注射"], "answer": 2, "explain": "ふくらみの脂肪を捨てずに溝へ移して段差ごとならすのが③移すの裏ハムラ法で、まぶたの裏の結膜から入るので顔の表面に傷が出ない。脱脂は取るだけ（①）で溝が残る。表ハムラ法も③移すだが表から入り皮膚も切る。ヒアルロン酸は溝に足すだけ（②）でふくらみは残る。", "basis": "脂肪を溝へ移して段差ごとならすのが裏ハムラ法"}, {"id": "a-k-eye2-2", "ch": "k1", "card": "k-eye2", "level": "apply", "q": "二重の線はもともとあり、まぶたの厚みも気にならない。ただ、目を開けてもまぶたが十分に上がらず、眠そうに見えるのが悩みの人。合う施術は？", "choices": ["二重埋没法で線を作り直す", "二重切開法で折り目を作る", "まぶたの脂肪取りで厚みを減らす", "挙筋と瞼板のつながりを直す手術"], "answer": 3, "explain": "まぶたが十分に上がらないのは「開く力」の問題（眼瞼下垂）で、多くは挙筋と瞼板のつながりがのびてゆるんだ状態。つなぎ直す眼瞼下垂の手術が合う。埋没法・切開法は皮膚の折り目を作る施術で、線はすでにある。脂肪取りは腫れぼったさ向けで、厚みは悩みではない。", "basis": "眼瞼下垂の多くは、筋肉と硬い板のつながりがのびてゆるんだ状態で、つなぎ直すのが眼瞼下垂の手術です"}, {"id": "a-k-eye2-3", "ch": "k1", "card": "k-eye2", "level": "apply", "q": "目の下の黒っぽいクマができるしくみについて、教材の説明と合わないものはどれ？", "choices": ["ふくらみの正体は、涙袋の眼輪筋が厚くなったもの", "眼窩脂肪をおさえる膜がゆるむと、脂肪が前に出る", "ふくらみのすぐ下に溝ができ、段差が影になる", "黒っぽいクマは、色ではなく形の問題"], "answer": 0, "explain": "ふくらみの正体は、目玉のクッションの眼窩脂肪が前に押し出されたもの。眼輪筋は涙袋の中身で、クマのふくらみとは別もの。膜がゆるむと脂肪が前に出ること、すぐ下に溝ができること、色ではなく形（影）の問題であることは教材どおり。", "basis": "この脂肪をおさえている膜がゆるむと、脂肪が前に押し出されて「ふくらみ」になり"}, {"id": "a-k-eye2-4", "ch": "k1", "card": "k-eye2", "level": "apply", "q": "裏ハムラ法の「裏」の意味と、切らないクマ取りとの違いを正しく説明しているものはどれ？", "choices": ["まぶたの裏の脂肪を取る意味で、溝へ移すのは切らないクマ取り", "結膜から入るという意味で、脂肪は取らずに溝へ移す", "皮膚の裏側から入るという意味で、顔の表面に傷が出る", "目玉の裏の脂肪を扱う意味で、ふくらみは取って捨てる"], "answer": 1, "explain": "「裏」はまぶたの裏側のピンク色の粘膜（結膜）から入るという意味で、顔の表面に傷が出ない。裏ハムラ法は脂肪を溝へ移して段差ごとならす③移す。ふくらみの脂肪を取るのは切らないクマ取り（経結膜脱脂）の①減らす。", "basis": "「裏」とは、まぶたの裏側のピンク色の粘膜（結膜）から入るという意味です"}, {"id": "d-c2-03-1", "ch": "k1", "card": "k-eye2", "level": "dr", "q": "デイズで、上まぶたの皮膚のかぶさりと目の開きの弱さの両方を指摘された人に、眉下リフトの麻酔と眼瞼下垂の手術の中身を説明する。教材に合うものは？", "choices": ["眉下リフトは点滴の静脈麻酔で、眠って受ける。開きは、のびた筋肉と硬い板のつながりを縫い縮める手術", "眉下リフトは目薬＋笑気＋局所で、眠らずに受ける。開きは、のびた筋肉と硬い板のつながりを縫い縮める手術", "眉下リフトは点滴の静脈麻酔で、眠って受ける。開きは、筋肉から皮膚へのびる細い枝を作り直す手術", "眉下リフトは目薬＋笑気＋局所で、眠らずに受ける。開きは、筋肉から皮膚へのびる細い枝を作り直す手術"], "answer": 1, "explain": "デイズの眉下リフトは目薬＋笑気＋局所の麻酔で、眠らずに受ける（あおなぎの眉下切開は静脈麻酔込み）。眼瞼下垂の多くは筋肉と硬い板（瞼板）のつながりがのびてゆるんだ状態で、それを縫い縮めるのが眼瞼下垂の手術。筋肉から皮膚への細い枝は二重の折り目を作るしくみ。", "basis": "眼瞼下垂の多くは、筋肉と硬い板のつながりがのびてゆるんだ状態で、つなぎ直すのが眼瞼下垂の手術です"}, {"id": "d-k-eye-4", "ch": "k1", "card": "k-eye2", "level": "dr", "q": "「埋没で、糸を瞼板に留めるプランにしたい。二重になれば、目の開きも良くなる？」という相談。両院のプランも合わせた説明として教材に合うものは？", "choices": ["瞼板に留めると挙筋の力が皮膚まで伝わり、開きも良くなる。保証はデイズのスタンダード法が2年、あおなぎの瞼板法2点留めが1年", "二重と目の開きは別の問題で、糸で開く力は変わらない。保証はデイズのスタンダード法が2年、あおなぎの瞼板法2点留めが1年", "瞼板に留めると挙筋の力が皮膚まで伝わり、開きも良くなる。保証はデイズのスタンダード法が1年、あおなぎの瞼板法2点留めが2年", "二重と目の開きは別の問題で、糸で開く力は変わらない。保証はデイズのスタンダード法が1年、あおなぎの瞼板法2点留めが2年"], "answer": 1, "explain": "埋没の糸は、挙筋から皮膚へのびる細い枝の代わりで、皮膚の折り目を作るもの。目を開ける力は挙筋と瞼板のつながりの話で、ゆるんだつながりをつなぎ直すのは眼瞼下垂の手術（デイズのみ掲載）。瞼板に留めるのはデイズのスタンダード法（2点留め・保証2年）と、あおなぎの瞼板法2点留め（保証1年・麻酔込み）。", "basis": "「二重かどうか」と「目がしっかり開くか」は別の問題です"}, {"id": "d-k-eye2-3", "ch": "k1", "card": "k-eye2", "level": "dr", "q": "デイズで切らない目の下のクマ取り（経結膜脱脂）を受けて6週間。「ふくらみの影は消えたが、茶色っぽさが残る。保証で再手術してほしい」と言う。教材に合う案内は？", "choices": ["茶色っぽさも脂肪のふくらみが作る影なので、左右差があれば保証の再手術で脂肪を取り直すと薄くなる", "切らないクマ取りの保証は1か月で、6週間の今は期間外。茶色っぽさは保証ではなく別に医師へ相談", "切らないクマ取りの保証は色の残りが対象で、形の不整や左右差は対象外なので、茶色なら再手術できる", "茶色っぽさは色素がたまったクマで、手術が直すのは主に影。保証は不整・左右差が対象で、色は医師へ相談"], "answer": 3, "explain": "クマのうち手術で直せるのは主に影のクマで、茶クマは色素がたまったもの。切らないクマ取りの保証は1年で、不整・左右差があり医師が必要と判断した場合が対象。×脂肪の影：茶色は色素で、脂肪を取り直しても変わらない。×保証1か月：それは糸リフトなどの枠。×色の残りが対象：対象は不整・左右差。", "basis": "手術で直せるのは主に「影」のクマです"}, {"id": "d-k-principles-6", "ch": "k1", "card": "k-eye2", "level": "dr", "q": "あおなぎ（本厚木）で、目の下のみぞだけを足したい人。「みぞはなぜできるのか知りたい」「気に入らなければ元に戻したい」と言う。教材に合う説明は？", "choices": ["みぞは、前に押し出された脂肪のすぐ下にできる段差。ヒアルロン酸で足して持ち上げる", "みぞは、涙袋の中身の眼輪筋がやせてできたへこみ。ヒアルロン酸で足して持ち上げる", "みぞは、前に押し出された脂肪のすぐ下にできる段差。あおなぎの脂肪注入を単独で受けて足す", "みぞは、涙袋の中身の眼輪筋がやせてできたへこみ。あおなぎの脂肪注入を単独で受けて足す"], "answer": 0, "explain": "脂肪をおさえる膜がゆるむと、脂肪が前に押し出されてふくらみになり、そのすぐ下にみぞができる。涙袋の眼輪筋は別もの。戻したいなら、溶かして戻す方法があるヒアルロン酸。脂肪注入は溶かして戻せず、あおなぎでは脱脂・裏ハムラとのセットだけで単独のメニューはない。", "basis": "脂肪が前に押し出されて「ふくらみ」になり、そのすぐ下に「溝」ができます"}, {"id": "a-k-nose-1", "ch": "k1", "card": "k-nose", "level": "apply", "q": "鼻先が短く上を向いていて、正面から鼻の穴が見えやすいのが悩み。鼻先の位置そのものを、下向きに大きく変えたい人。合う施術は？", "choices": ["鼻尖形成", "鼻尖部軟骨移植", "隆鼻術のプロテーゼ", "鼻中隔延長"], "answer": 3, "explain": "鼻先はやわらかい軟骨なので、位置を大きく変えるには支えが要る。中央の壁（鼻中隔）に支柱を継ぎ足して鼻先を前や下へのばすのが鼻中隔延長。鼻尖形成は軟骨を糸で寄せて細く、鼻尖部軟骨移植は軟骨を足して少し高く・シャープにする。プロテーゼは骨のある鼻筋を高くする。", "basis": "支柱を継ぎ足して、鼻先を前や下へのばす"}, {"id": "a-k-nose-2", "ch": "k1", "card": "k-nose", "level": "apply", "q": "メニュー名は「部位の名前＋どうするか」。「鼻翼挙上」「鼻尖形成」「鼻中隔延長」「骨切り幅寄せ」の部位と、その中身（骨か軟骨か）の説明で、教材と合わないものは？", "choices": ["鼻翼挙上：鼻翼＝小鼻。中身は軟骨", "鼻尖形成：鼻尖＝鼻先。中身は軟骨", "鼻中隔延長：鼻中隔＝鼻の中の壁。前のほうも骨で硬い", "骨切り幅寄せ：鼻筋の上のほう。中身は骨"], "answer": 2, "explain": "鼻中隔は鼻の中を左右に分ける壁で、前のほうは軟骨（鼻中隔軟骨）。鼻先を内側から支え、鼻中隔延長はそこに支柱を継ぎ足す。鼻は「上が骨、下が軟骨」で、鼻先・小鼻は軟骨、鼻筋の上のほうは骨、は教材どおり。", "basis": "前のほうは軟骨（鼻中隔軟骨）でできていて、鼻先を内側から支える"}, {"id": "d-k-nose-3", "ch": "k1", "card": "k-nose", "level": "dr", "q": "団子鼻で鼻筋も低い人が、デイズでクローズ法の鼻尖形成を受けることになった。「鼻筋も高くしたい」と言う。鼻先の術後と、鼻筋の方法の説明として教材に合うものは？", "choices": ["鼻先の術後は数日、鼻を固定する。鼻筋は骨の上にプロテーゼをのせて高くする", "鼻先の術後は数日、鼻を固定する。鼻筋は骨を切って中央へ寄せ、高さを出す", "鼻先の術後に鼻の固定はいらない。鼻筋は骨の上にプロテーゼをのせて高くする", "鼻先の術後に鼻の固定はいらない。鼻筋は骨を切って中央へ寄せ、高さを出す"], "answer": 0, "explain": "鼻尖形成は、オープン法でもクローズ法でも腫れは1週間ほどで、数日は鼻を固定する。鼻筋の上のほうは骨なので、上に物をのせて高くする（隆鼻術のプロテーゼ）。骨を切って寄せる骨切り幅寄せは、太い鼻筋を細くする手術。", "basis": "上に物をのせて高くする（隆鼻術のプロテーゼ）"}, {"id": "a-k-fat-1", "ch": "k1", "card": "k-fat", "level": "apply", "q": "顔の下半分がふっくらして見えるのが悩み。ほおをつまんでも、皮膚のすぐ下の脂肪はあまり厚くない。「顔に傷は残したくない」という人。合う施術は？", "choices": ["顔の脂肪吸引", "脂肪溶解注射", "バッカルファット除去", "ジョールファット除去"], "answer": 2, "explain": "つまめる浅い脂肪が少ないのにふくらむなら、筋肉より深い奥の部屋（バッカルファット）が考えられる。バッカルファット除去は口の中から取るので顔に傷が出ない。顔の脂肪吸引・脂肪溶解注射は浅い脂肪が相手。ジョールファットも口の横〜あごの浅い脂肪で、奥の部屋ではない。", "basis": "ほおの奥、筋肉より深いところにある脂肪のかたまり"}, {"id": "a-k-fat-2", "ch": "k1", "card": "k-fat", "level": "apply", "q": "ほおがこけて老けて見えるのが悩みの人が「顔の脂肪を取れば若返るはず」と考えている。教材の考え方に合う案内は？", "choices": ["こけた所は④引き上げるで、糸リフトを考える", "こけた所は②足すで、脂肪注入を考える", "こけた所は①減らすで、メーラーファット除去を考える", "こけた所は⑤生まれ変わらせるで、ピーリングを考える"], "answer": 1, "explain": "こけた所・くぼんだ所には脂肪注入やヒアルロン酸注射で「足す」（②）。脂肪は支えでもあるので、取りすぎるとかえってこける。④引き上げるは下がった・ゆるんだもの向け、①減らすは下にたまった・余ったもの向け、⑤ピーリングは肌のハリの施術で、こけは戻らない。", "basis": "こけた所・くぼんだ所には脂肪注入やヒアルロン酸注射で「足し」ます"}, {"id": "a-k-fat-3", "ch": "k1", "card": "k-fat", "level": "apply", "q": "4人の所見。X＝ほうれい線の上がふくらむ、Y＝顔の下半分がふくらんで見える、Z＝フェイスラインがもたつく、W＝ほお・あご下の広い範囲がふっくら。「所見 ― 部屋 ― メニュー」で教材と合わないものは？", "choices": ["X ― ほお骨の上の浅い脂肪 ― メーラーファット除去", "Y ― 筋肉より深い奥の脂肪 ― バッカルファット除去", "W ― 広い範囲の浅い脂肪 ― 顔の脂肪吸引・脂肪溶解注射", "Z ― 口の横〜あごの深い脂肪 ― ジョールファット除去"], "answer": 3, "explain": "ジョールファットは口の横からあごの線にかけての浅い脂肪で、深い脂肪ではない。ほかより奥にある部屋はバッカルファットだけ。ほうれい線の上はメーラーファット、顔の下半分のふくらみはバッカルファット、広い範囲の浅い脂肪は吸引か溶解注射、は表どおり。", "basis": "口の横からあごの線にかけての浅い脂肪"}, {"id": "d-k-body-1", "ch": "k1", "card": "k-fat", "level": "dr", "q": "口の横〜あごのもたつきが悩みの人。「眠る麻酔は使いたくない」と言う。脂肪の場所と、ジョールファット除去の受け方として教材に合うものは？", "choices": ["口の横の、筋肉より深い脂肪。あおなぎのジョールファット除去は笑気＋局所で、眠らずに受けられる", "口の横の、皮膚に近い浅い脂肪。あおなぎのジョールファット除去は笑気＋局所で、眠らずに受けられる", "口の横の、筋肉より深い脂肪。デイズのジョールファット除去は笑気＋局所で、眠らずに受けられる", "口の横の、皮膚に近い浅い脂肪。デイズのジョールファット除去は笑気＋局所で、眠らずに受けられる"], "answer": 3, "explain": "ジョールファットは口の横からあごの線にかけての浅い脂肪で、筋肉より深いのは頬の奥のバッカルファット。デイズのジョールファット除去は笑気＋局所麻酔で、眠らずに受ける。あおなぎは静脈麻酔（点滴で眠る麻酔）込みの総額。どちらも口の中から取る。", "basis": "口の横からあごの線にかけての浅い脂肪"}, {"id": "d-k-fat-1", "ch": "k1", "card": "k-fat", "level": "dr", "q": "40代の人。ほうれい線の上に脂肪がたまってきた一方で、若いころ丸かった頬の高い所は平らになってきた。脂肪の状態と案内として教材に合うものは？", "choices": ["筋肉より奥の脂肪が下がっている。ミッドフェイスリフトで取らずに上へ戻して留める", "頬の浅い脂肪が下がっている。ミッドフェイスリフトで取らずに上へ戻して留める", "筋肉より奥の脂肪が多すぎる。メーラーファット除去で口の中から吸って減らす", "頬の浅い脂肪が多すぎる。メーラーファット除去で口の中から吸って減らす"], "answer": 1, "explain": "メーラーファットはほお骨の上にのっている浅い脂肪で、年齢とともに下がり、ほうれい線の上にたまる。高い所が平らになったのは下がったしるしなので、取らずに上へ戻して骨の膜に留めるミッドフェイスリフトが合う。除去とは向きが逆。筋肉より深いのはバッカルファット。", "basis": "ほお骨の上にのっている浅い脂肪。年齢とともに下がり、ほうれい線の上にたまる"}, {"id": "d-k-layers-2", "ch": "k1", "card": "k-fat", "level": "dr", "q": "丸顔をすっきりさせたい人。診察で「指でつまめる脂肪は少なく、ふくらみの原因は奥の脂肪」と言われた。方法と、向いている時期の説明として教材に合うものは？", "choices": ["皮膚を数ミリ切って吸う顔の脂肪吸引で奥の脂肪を取る。たるみが目立つ前の20〜30代のほうが向く", "口の中から奥の脂肪を取るバッカルファット除去。たるみが強い人ほど、取ったときの変化が大きい", "皮膚を数ミリ切って吸う顔の脂肪吸引で奥の脂肪を取る。たるみが強い人ほど、取ったときの変化が大きい", "口の中から奥の脂肪を取るバッカルファット除去。たるみが目立つ前の20〜30代のほうが向く"], "answer": 3, "explain": "つまめない奥の脂肪は、ほおの奥・筋肉より深い所のバッカルファットで、口の中から取る除去が担当。顔の脂肪吸引や溶解注射が減らすのは浅い脂肪。バッカルファット除去のおすすめは、たるみが目立つ前の20〜30代。たるみが強い人は、取ると余計にたるむことがある。", "basis": "浅い脂肪を、吸い出すか薬で減らす"}, {"id": "d-k-layers-7", "ch": "k1", "card": "k-fat", "level": "dr", "q": "もともと頬の肉が薄い人が「肌のハリを出したい。ついでにフェイスラインも引き締めたい」と言う。教材に合う案内は？", "choices": ["ハリはデイズのソフウェーブで真皮を温める。脂肪は支えでもあるので、薄い頬に減らす施術は重ねない", "ハリはあおなぎのソフウェーブで真皮を温める。脂肪は支えでもあるので、薄い頬に減らす施術は重ねない", "ハリはデイズのソフウェーブで真皮を温める。引き締めなら、脂肪溶解注射でフェイスラインだけ減らす", "ハリはあおなぎのソフウェーブで真皮を温める。引き締めなら、脂肪溶解注射でフェイスラインだけ減らす"], "answer": 0, "explain": "脂肪は支えでもあるので、取りすぎるとこける。若い顔は脂肪が少ない顔ではなく、脂肪が正しい位置にある顔。頬が薄い人に脂肪を減らす施術を重ねるのは逆向き。ソフウェーブは真皮を温めてハリを出す機械で、デイズのみ（あおなぎのサイトに掲載なし）。", "basis": "脂肪は支えでもあるので、取りすぎるとこける"}, {"id": "a-k-skin-1", "ch": "k1", "card": "k-skin", "level": "apply", "q": "シミやニキビ跡のへこみより、「肌のハリ・弾力が落ちてきた」のが悩みの人。この人の悩みの層と、それに合う代表メニューの組み合わせは？", "choices": ["真皮のハリ → 水光注射", "真皮のハリ → 光（IPL）", "表皮の色素 → 水光注射", "深い層 → ピーリング"], "answer": 0, "explain": "ハリ・弾力を作るのは真皮のコラーゲンやエラスチンで、k-skinの代表メニューの整理ではハリはピーリング・水光注射。光（IPL）は色（表皮）の代表。悩みは色素ではないので「表皮の色素」は層がずれ、「深い層」はたるみの話で肌のメニューとは別。", "basis": "ハリにはピーリングや水光注射"}, {"id": "d-k-skin-1", "ch": "k1", "card": "k-skin", "level": "dr", "q": "ニキビ跡の凹みにサブシジョンを受けた人から「直後にかえって凸凹が目立った。失敗？次はいつ受ければいい？」と聞かれた。教材に合う説明は？", "choices": ["すき間にたまった血や水分の腫れで、通常2〜3日で落ち着く。凹みは真皮の問題で、新しい組織が埋まるまで少なくとも4週間あける", "すき間にたまった血や水分の腫れで、通常2〜3日で落ち着く。凹みは表皮の問題で、ターンオーバーの4〜6週間ごとに受ける", "皮膚の下の内出血のあとで、1〜2週間かけて消えていく。凹みは真皮の問題で、新しい組織が埋まるまで少なくとも4週間あける", "皮膚の下の内出血のあとで、1〜2週間かけて消えていく。凹みは表皮の問題で、ターンオーバーの4〜6週間ごとに受ける"], "answer": 0, "explain": "直後の凸凹は、筋を切り離したすき間に血や水分が一時的にたまる腫れで、通常2〜3日で落ち着く（内出血は別で1〜2週間）。へこみは真皮の問題で、真皮は表皮のようには入れ替わらない。すき間が新しい組織で埋まる治る力が効果の本体なので、次は4週間以上あける。4〜6週間は表皮のターンオーバーの目安。", "basis": "真皮は表皮のようには入れ替わらないので、傷が真皮まで届くと跡が残りやすくなります"}, {"id": "d-k-skin-3", "ch": "k1", "card": "k-skin", "level": "dr", "q": "ソフウェーブが熱を入れる深さを、「肌の3階建て」と「顔の5層」の番号で言い表した文として、教材に合うものは？", "choices": ["3階建ての真ん中の階を温める。顔の5層では②にあたる", "3階建ての真ん中の階を温める。顔の5層では①にあたる", "3階建てのいちばん下の階を温める。顔の5層では②にあたる", "3階建てのいちばん下の階を温める。顔の5層では①にあたる"], "answer": 1, "explain": "ソフウェーブが温めるのは皮膚の浅い層（真皮）で、深さ約0.5〜2.0mm。肌は上から表皮・真皮・皮下組織の3階建てなので、真皮は真ん中の階。顔の5層では①の皮膚（表皮・真皮）に含まれ、②は浅い脂肪（皮下脂肪）。", "basis": "肌は、上から表皮・真皮・皮下組織の3階建てです"}, {"id": "d-k-skin-7", "ch": "k1", "card": "k-skin", "level": "dr", "q": "小じわとハリ不足に、肌育製剤ジュベルックのドクター手打ちを考えている人。肌のどこに働くかと、両院の料金表の書き方として教材に合うものは？", "choices": ["真皮に働き、肌が自分でコラーゲンを作るのを促す。料金表に量を書くのはデイズで、あおなぎは書いていない", "真皮に働き、肌が自分でコラーゲンを作るのを促す。料金表に量を書くのはあおなぎで、デイズは書いていない", "表皮に働き、壁紙の層にコラーゲンを足して張らせる。料金表に量を書くのはあおなぎで、デイズは書いていない", "表皮に働き、壁紙の層にコラーゲンを足して張らせる。料金表に量を書くのはデイズで、あおなぎは書いていない"], "answer": 0, "explain": "小じわ・ハリ不足は真皮の問題で、真皮はコラーゲンなどの線維がつまったハリと弾力の層。肌育製剤はふくらませず、肌自身のコラーゲンづくりを促す。手打ちの肌育は、デイズの料金表が量を書き（ジュベルック2ccなど）、あおなぎは量の表記がない。", "basis": "表皮の下の層。厚さ約2mm。コラーゲンなどの線維がつまっていて、肌のハリと弾力を作る"}, {"id": "a-k-body-1", "ch": "k1", "card": "k-body", "level": "apply", "q": "「おなかがぽっこり出ているので、脂肪吸引を受けたい」という人。ところが、おなかの肉をつまもうとしても、ほとんどつまめない。教材の説明に合う案内は？", "choices": ["身体の脂肪吸引で、出ている分を取る", "脂肪溶解注射を数回くり返して減らす", "食事・運動やメディカルダイエットを考える", "吸引と溶解注射を組み合わせて減らす"], "answer": 2, "explain": "つまめない脂肪は、筋肉の壁の内側の内臓脂肪と考えられる。脂肪吸引や脂肪溶解注射が相手にするのはつまめる皮下脂肪なので、内臓脂肪が原因なら食事・運動やメディカルダイエット（薬）の領域。吸引・溶解注射は単独でも組み合わせても内臓脂肪には届かない。", "basis": "身体の脂肪吸引や脂肪溶解注射が相手にするのはつまめる脂肪（皮下脂肪）です"}, {"id": "a-k-body-2", "ch": "k1", "card": "k-body", "level": "apply", "q": "「胸を大きくしたいが、人工物は入れたくない」という人。原理まで含めて説明したい。教材の説明に合う方法とその原理は？", "choices": ["シリコンバッグ豊胸で、原理は②足す", "乳腺の中に脂肪を入れる方法で、原理は②足す", "大胸筋の下にバッグを置く方法で、原理は④留める", "脂肪注入の豊胸で、原理は②足す"], "answer": 3, "explain": "自分の脂肪を胸に足す脂肪注入の豊胸が合い、原理は②足す。シリコンバッグ豊胸は人工物を入れるので希望に合わない。脂肪もバッグも乳腺そのものには入れない。大胸筋の下にバッグを置く方法も人工物で、原理も④ではなく②足す。", "basis": "脂肪注入の豊胸は、自分の脂肪を胸に足す方法です"}, {"id": "d-k-body-4", "ch": "k1", "card": "k-body", "level": "dr", "q": "「人工物は入れたくない。胸を3カップ大きくしたい」という人に、デイズの脂肪豊胸を説明する。教材に合うものは？", "choices": ["脂肪は乳腺そのものの中に入れて足す。大きくできるのは1〜2カップまでで、3カップなら袋の方法", "脂肪は乳腺そのものには入れずに足す。大きくできるのは1〜2カップまでで、3カップなら袋の方法", "脂肪は乳腺そのものには入れずに足す。人工物なしでも、3カップまでなら脂肪だけで大きくできる", "脂肪は乳腺そのものの中に入れて足す。人工物なしでも、3カップまでなら脂肪だけで大きくできる"], "answer": 1, "explain": "豊胸は「②足す」で、バッグは乳腺より奥に置き、脂肪注入は自分の脂肪を足す。どちらも乳腺そのものには入れない。脂肪豊胸は人工物を使わないが、大きくできるのは1〜2カップまでで、それ以上を希望する人には袋を使う方法が案内される。", "basis": "豊胸のバッグや脂肪は、乳腺そのものには入れない"}, {"id": "d-k-inject-1", "ch": "k1", "card": "k-body", "level": "dr", "q": "「おなかがぽっこり出ているのに、指でつまめる脂肪は少ない。食欲もおさえられない」という人に、デイズのメディカルダイエットを案内する。教材に合うものは？", "choices": ["スタンダードで足りる。食欲にはオルリファストが働き、つまめない脂肪にも脂肪溶解注射5回が直接効く", "プレミアムが合う。食欲にはGLP-1注射3本が働き、つまめない脂肪にも脂肪溶解注射5回が直接効く", "スタンダードで足りる。食欲にはオルリファストが働き、つまめない脂肪は注射でなく食事指導と飲み薬が担う", "プレミアムが合う。食欲にはGLP-1注射3本が働き、つまめない脂肪は注射でなく食事指導と飲み薬が担う"], "answer": 3, "explain": "指でつまめない、筋肉の壁の内側の脂肪が内臓脂肪。脂肪溶解注射が相手にするのはつまめる皮下脂肪で、内臓脂肪はコースの食事療法と飲み薬で対策する。オルリファストは食欲ではなく、食べた脂肪の約30%を吸収させない薬（日本では未承認）。食欲に働くGLP-1注射3本が入るのはプレミアムだけ。", "basis": "身体の脂肪吸引や脂肪溶解注射が相手にするのはつまめる脂肪（皮下脂肪）です"}, {"id": "a-k-aging-1", "ch": "k1", "card": "quiz-k1", "level": "apply", "q": "たるみの相談で「とにかく脂肪を取りたい」と言われた。教材の考え方で、脂肪を「減らす」方向が合うのはどの状態か？", "choices": ["ほおの脂肪が減って、くぼんで見える", "靭帯がゆるみ、ほおが下がって見える", "口の横〜あごに脂肪がたまって見える", "ほおの上がこけて、影ができて見える"], "answer": 2, "explain": "下にたまった・余ったものは①減らすで、口の横〜あごならジョールファット除去が代表。減った・くぼんだ所やこけた所は②足す、下がった・ゆるんだものは④引き上げるが合う。原因が違うのに脂肪を取ると、支えが減ってこけることがある。", "basis": "下にたまった・余ったものは「減らす」"}, {"id": "a-cat-k2-1", "ch": "k2", "card": "cat-k2", "level": "apply", "q": "基礎編②の内容を、社外に配るチラシに使いたい。教材の扱いに従うと、社外に出す前に医師の確認が要る記載はどれ？", "choices": ["あおなぎは、術後の再診料が期限なく無料", "デイズのモニター価格は、医師の審査で決まる", "静脈麻酔は、眠っていても自分で呼吸はしている", "あおなぎは、価格キャンペーンを行わない"], "answer": 2, "explain": "基礎編②の1〜5（手段・麻酔・ダウンタイム・注入・機械）は公式サイトの記載ではなく一般的な知識で、社外に出す前に医師の確認を受ける。静脈麻酔の説明は2（麻酔）。再診料・キャンペーンは7（2院の違い）、モニターの審査は6（料金表）で、どちらも公式サイトに基づく。（cat-k2）", "basis": "1〜5は公式サイトの記載ではなく、一般的な知識をまとめたものです"}, {"id": "d-k-aging-4", "ch": "k2", "card": "k-types", "level": "dr", "q": "ほおのたるみで「3年はもたせたい。でも休みは2週間しか取れない」というお客様。リフトの選び方の説明として合うものは？", "choices": ["3年を満たすのはミッドフェイスリフト（5〜10年ほど）で、腫れ・内出血は2〜3週間で休みと重なる", "3年を満たすのは切開リフト（5〜10年ほど）だが、腫れ・内出血は3〜4週間で休みとぶつかる", "3年を満たすのは糸リフト（5〜10年ほど）で、腫れ・内出血も1週間程度なので2週間の休みで足りる", "3年を満たすのは切開リフト（5〜10年ほど）で、腫れ・内出血は1週間程度なので2週間の休みで足りる"], "answer": 1, "explain": "切開リフトは効果5〜10年ほどだが、腫れ・内出血は3〜4週間で2週間の休みとぶつかる。糸リフトは腫れ1週間程度だが効果は1〜2年ほどで3年に届かない。×ミッドフェイスリフト：効果の年数は記載がない。×糸リフト5〜10年：1〜2年ほど。×切開リフト1週間程度：3〜4週間。", "basis": "「切らない施術」は軽いぶん、効果は小さめで、くり返しが前提"}, {"id": "d-k-types-1", "ch": "k2", "card": "k-types", "level": "dr", "q": "デイズで糸リフトを毎年受けてきたお客様。「1回で長くもたせたい。ほおの余った皮膚も減らしたい」。今の糸リフトと比べながら案内するとき、合うものは？", "choices": ["デイズのフェイスリフトへ。今の糸リフトの効果は最長6か月ほど", "デイズのミッドフェイスリフトへ。今の糸リフトの効果は1〜2年ほど", "デイズのフェイスリフトへ。今の糸リフトの効果は1〜2年ほど", "デイズのミッドフェイスリフトへ。今の糸リフトの効果は最長6か月ほど"], "answer": 2, "explain": "余った皮膚を切り取れるのはフェイスリフトなどの切開リフトで、ミッドフェイスリフトは皮膚を切り取らない。糸リフトの効果は1〜2年ほど（糸により約6か月〜2年）で、重い施術ほど1回で長く続く。×ミッドフェイスリフト：皮膚は減らせない。×最長6か月：糸リフトは1〜2年ほど。", "basis": "重い施術ほど1回で長く続く（そのぶん腫れる期間と料金も大きい）"}, {"id": "a-k-anes-1", "ch": "k2", "card": "k-anes", "level": "apply", "q": "二重埋没を希望する患者が「局所麻酔の注射がこわい。でも眠るのは嫌で、食事を抜く準備もしたくない」と話す。教材の麻酔の説明に合う提案は？", "choices": ["局所麻酔の注射の前に、静脈麻酔を足す", "局所麻酔の注射の前に、笑気麻酔を足す", "局所麻酔の代わりに、全身麻酔で受ける", "局所麻酔の代わりに、ブロック麻酔を打つ"], "answer": 1, "explain": "笑気麻酔は局所麻酔の注射の前に、リラックスのために吸うガス。ぼんやりして不安がやわらぐが眠りはせず、注射そのものはなくならない。静脈麻酔は眠る麻酔、全身麻酔は完全に眠る麻酔で、どちらも食事を抜くなどの準備が要る。ブロック麻酔は局所麻酔の仲間で、これも注射。", "basis": "局所麻酔の注射の前に、リラックスのために（二重埋没、糸リフトなど）"}, {"id": "d-k-anes-1", "ch": "k2", "card": "k-anes", "level": "dr", "q": "デイズで鼻の骨切り幅寄せを希望する患者。「眠って受けたい」「麻酔代込みの見積もりを今日知りたい」「あおなぎの方が近い」と話す。教材に合う案内は？", "choices": ["静脈麻酔の場面なので呼吸の管理はなく、麻酔代は¥50,000と今日伝えられる", "あおなぎは麻酔代込みの総額なので、近いあおなぎで今日総額を出せる", "全身麻酔の場面で、¥300,000は施術料金に含まれると今日伝えられる", "全身麻酔の場面で、¥300,000が含まれるかは院に確認。鼻はあおなぎに掲載がない"], "answer": 3, "explain": "骨を切る手術は全身麻酔（完全に眠り、呼吸も管理）の場面。オプション表の全身麻酔¥300,000が施術料金に含まれるかはサイトに記載がなく院に確認。静脈麻酔の場面とする案は取り違え。鼻の施術はあおなぎに掲載がない。含まれると今日伝える案は記載がない。", "basis": "切開リフト、鼻の骨を切る手術など大きな手術で"}, {"id": "d-k-anes-3", "ch": "k2", "card": "k-anes", "level": "dr", "q": "目の下〜頬の手術を比べているお客様。「眠らずに受けたい。食事を抜く準備もしたくない」。デイズの表ハムラとミッドフェイスリフトの、麻酔の読み方として合うものは？", "choices": ["表ハムラは麻酔の種類の記載がなく院に確認。ミッドフェイスリフトは静脈＋局所で、食事を抜く準備が要る", "表ハムラは麻酔の種類の記載がなく院に確認。ミッドフェイスリフトは局所だけで、起きたまま受けられる", "表ハムラは笑気＋局所で、起きたまま受けられる。ミッドフェイスリフトは静脈＋局所で、食事を抜く準備が要る", "表ハムラは笑気＋局所で、起きたまま受けられる。ミッドフェイスリフトは局所だけで、起きたまま受けられる"], "answer": 0, "explain": "麻酔欄に静脈・全身とあれば眠って受ける手術で、食事を抜くなどの準備が要る。ミッドフェイスリフトは静脈＋局所。表ハムラはサイトに麻酔の種類の記載がないので院に確認。×笑気＋局所：切開法による目の下のたるみ取りの麻酔。×局所だけ：ミッドフェイスは静脈麻酔も使う。", "basis": "静脈・全身 とあれば「眠って受ける手術（食事を抜くなどの準備が必要）」"}, {"id": "a-k-dt-1", "ch": "k2", "card": "k-dt", "level": "apply", "q": "切って縫う手術から3週間の患者が「朝起きると手術した所がふくらんでいて、夕方には軽くなる」と相談。教材の一般的な経過で、いちばん当てはまるのは？", "choices": ["腫れ：2〜3日目がピークで、1〜2週間で大きく引く", "内出血：青紫から黄色になり、1〜2週間で消える", "傷あと：赤からピンクになり、半年〜1年で落ち着く", "むくみ：数週間〜1か月ほどかけて少しずつ取れる"], "answer": 3, "explain": "術後3週間で、朝に強く夕方に軽くなるふくらみは、腫れのピークが過ぎたあとに残るむくみ。数週間〜1か月ほどで少しずつ取れる。腫れは1〜2週間で大きく引く時期を過ぎている。内出血はあざの色の変化でふくらみではない。傷あとは切った線の色の変化。", "basis": "腫れのピークが過ぎたあとに残る、水っぽいふくらみ。朝に強く、夕方に軽くなりやすい"}, {"id": "a-k-inject-1", "ch": "k2", "card": "k-inject", "level": "apply", "q": "患者「ほおのこけた所をふくらませたい。何度も通うより、1回で長く残したい。脂肪を取る場所に小さな傷ができるのはかまわない」。教材の注入の表から、希望にいちばん合うのは？", "choices": ["脂肪注入：根づいた分が長く残り、傷の条件も合うから", "ヒアルロン酸：溶かす薬があり、仕上がりをやり直せるから", "ヒアルロン酸：体に吸収されにくく、1回で長く残せるから", "肌育製剤：コラーゲンづくりを促し、こけをふくらませるから"], "answer": 0, "explain": "脂肪注入は自分の脂肪を移す方法で、根づいた分は長く残る。脂肪を取る場所に小さな傷ができるが、患者はそれをかまわないと言っている。ヒアルロン酸はやり直しがきく点は事実だが、半年〜1年ほどで吸収されるので「長く残したい」に合わない。肌育製剤はふくらませずに肌を育てる。", "basis": "根づいた分は長く残る。一部は吸収される"}, {"id": "d-c5-13-3", "ch": "k2", "card": "k-inject", "level": "dr", "q": "二の腕を細くしたいお客様。診察で、太さの主な原因は皮下脂肪だった。「注射で、あおなぎで受けたい」。案内として合うものは？", "choices": ["腕ボトックスは筋肉の動きを弱める薬で、皮下脂肪には合わない。脂肪溶解注射はデイズだけ", "腕ボトックスは筋肉の動きを弱める薬で、皮下脂肪には合わない。脂肪溶解注射はあおなぎにもある", "腕ボトックスで皮下脂肪の分も細くなり、原因に合う。脂肪溶解注射はデイズだけ", "腕ボトックスで皮下脂肪の分も細くなり、原因に合う。脂肪溶解注射はあおなぎにもある"], "answer": 0, "explain": "ボトックスは筋肉の動きを弱める薬で、脂肪を減らす薬ではない。薬で脂肪を溶かすのは脂肪溶解注射で、あおなぎに掲載がなくデイズだけ（BNLS 1cc¥5,000、数回くり返す）。×ボトックスで脂肪が減る：筋肉に効く薬。×あおなぎにもある：掲載なし。", "basis": "筋肉の動きを弱める（表情じわ・エラ）。汗を止めるのにも使う"}, {"id": "d-c6-11-1", "ch": "k2", "card": "k-inject", "level": "dr", "q": "サブシジョンの1回目にヒアルロン酸も入れたデイズのお客様。3週間たって「ふくらみすぎが気になる」。教材に合う案内は？", "choices": ["吸収は1〜2か月ほどなので医師に相談。デイズのビトラーゼ（＊溶かす薬）は1cc¥33,000", "吸収は半年〜1年ほどなので医師に相談。デイズのビトラーゼ（＊溶かす薬）は1cc¥33,000", "吸収は1〜2か月ほどなので医師に相談。デイズのビトラーゼ（＊溶かす薬）は1cc¥30,000", "吸収は半年〜1年ほどなので医師に相談。デイズのビトラーゼ（＊溶かす薬）は1cc¥30,000"], "answer": 3, "explain": "ヒアルロン酸は半年〜1年ほどで体に吸収され、溶かす薬があるのでやり直しがきく。ビトラーゼ（＊一般に溶かす薬の商品名）はデイズ1cc¥30,000。×1〜2か月：吸収はもっと長い。×¥33,000：あおなぎの金額。", "basis": "半年〜1年ほどで体に吸収される（かたさ・場所で差）"}, {"id": "d-k-aging-2", "ch": "k2", "card": "k-inject", "level": "dr", "q": "ほおの上がこけてきて、口の横〜あごには脂肪がたまってきたお客様。「どちらもあおなぎで受けたい」。案内として合うものは？", "choices": ["上のこけは脂肪注入で足す。下のジョールファットは静脈麻酔込みで眠って受ける", "上のこけは脂肪注入で足す。下のジョールファットは局所麻酔込みで眠らずに受ける", "上のこけはボリューマで足す。下のジョールファットは静脈麻酔込みで眠って受ける", "上のこけはメーラーファット除去で減らす。下のジョールファットは局所麻酔込みで眠らずに受ける"], "answer": 2, "explain": "減った・くぼんだ所は足し、下にたまった所は減らす。あおなぎで足すならヒアルロン酸（ボリューマ¥49,800）。あおなぎのジョールファットは静脈麻酔込みの¥98,000。×脂肪注入：あおなぎに単独のメニューがない。×局所麻酔込み：局所込みはあおなぎの脱脂。×メーラーで減らす：こけた所をさらに減らす。", "basis": "ヒアルロン酸・脂肪＝足す"}, {"id": "d-k-principles-2", "ch": "k2", "card": "k-inject", "level": "dr", "q": "「ほおのくぼみを、できるだけ長くもたせたい。あおなぎで受けたい」というお客様。案内として合うものは？", "choices": ["あおなぎのボリューマ¥49,800で足す。根づいた分が長く残るので、1回で長くもつ", "あおなぎのボリューマ¥49,800で足す。半年〜1年ほどで吸収されるので、くり返して保つ", "あおなぎで脂肪注入を単独で受ける。根づいた分が長く残るので、1回で長くもつ", "あおなぎで脂肪注入を単独で受ける。半年〜1年ほどで吸収されるので、くり返して保つ"], "answer": 1, "explain": "くぼみに足すのはヒアルロン酸か脂肪注入だが、あおなぎに脂肪注入だけのメニューは掲載がない。あおなぎのボリューマは¥49,800で、ヒアルロン酸は半年〜1年ほどで吸収されるので、もたせるにはくり返す。×脂肪注入を単独で：あおなぎに掲載なし。×根づいて長く残る：脂肪注入の性質。", "basis": "半年〜1年ほどで体に吸収される（かたさ・場所で差）"}, {"id": "d-k-skin-2", "ch": "k2", "card": "k-inject", "level": "dr", "q": "「小じわとハリ不足が気になる。ふくらませた感じは嫌。注射の麻酔はこわい。あおなぎで受けたい」という患者。条件に合う提案は？", "choices": ["あおなぎの手打ちの肌育製剤。ふくらませずに肌を育て、表面麻酔込みで何回かくり返す", "あおなぎのヒアルロン酸。溶かす薬があるので、ふくらみすぎても安心して小じわを埋められる", "あおなぎのダーマペン4。針で小さな穴を開け、肌が治る力でハリを少しずつ出していく", "あおなぎのボトックス。肌自身のコラーゲンづくりを促して、ハリを内側から育てていく"], "answer": 0, "explain": "肌育製剤はふくらませず、肌自身のコラーゲンづくりを促し、ゆっくり効いて何回かくり返す前提。あおなぎの手打ちは表面麻酔込み。ヒアルロン酸はふくらませる材料で希望に合わない。ダーマペン4はあおなぎに掲載がない。ボトックスは筋肉の動きを弱める薬で、肌を育てるものではない。", "basis": "ふくらませるのではなく、肌自身のコラーゲンづくりを促す"}, {"id": "a-k-energy-1", "ch": "k2", "card": "k-energy", "level": "apply", "q": "「頬のシミ（茶色）と、赤ら顔（血管の赤）の両方が気になる。肌の浅い所に、1種類の機械でまとめて当てたい」という相談。教材の「エネルギーの種類と届く深さ」の表で、両方に反応すると説明されているのは？", "choices": ["ルメッカ（光・IPL）", "ディスカバリーピコ（レーザー）", "ニードルRF（針＋高周波）", "ソフウェーブ（超音波）"], "answer": 0, "explain": "光（IPL）はいろいろな色がまざった幅広い光で、茶色（シミ）と赤（血管）に反応し、肌の表面〜ハリの層の浅い所に届く。ピコ（レーザー）は1色だけの強い光で、ねらった色素だけに反応させやすい。ニードルRFはハリの層〜脂肪を温め、ソフウェーブは超音波でハリの層をねらう。", "basis": "カメラのフラッシュのような幅広い光。茶色（シミ）と赤（血管）に反応する"}, {"id": "d-k-energy-1", "ch": "k2", "card": "k-energy", "level": "dr", "q": "ニキビ跡のへこみを「熱の力も借りて」治したいお客様。「デイズで、まず3回分をまとめて申し込みたい」。案内として合うものは？", "choices": ["XERFで、3回¥119,400の料金がある", "ニードルRFで、回数の設定はなく1回¥39,800ずつ", "ニードルRFで、3回¥119,400の料金がある", "XERFで、回数の設定はなく1回¥48,800ずつ"], "answer": 2, "explain": "ニキビ跡のへこみ（真皮）に使うのはダーマペン4やニードルRFで、熱も使うのは針＋高周波のニードルRF。デイズは1回¥39,800、3回¥119,400、5回¥189,050。XERFは針を使わない高周波で、ハリの層〜脂肪を広く温める引き上げ向きの機械。×回数の設定なし：ニードルRFには3回・5回がある。", "basis": "刺した針の先から熱を出す。表面を守って奥だけ温める"}, {"id": "d-k-energy-2", "ch": "k2", "card": "k-energy", "level": "dr", "q": "デイズで「肌の浅い層のハリ」と「SMASからの引き上げ」を1日で受けたいお客様。麻酔クリームを塗って待つ時間は取れない。組み合わせとして合うものは？", "choices": ["XERFの頬300ショット¥48,800に、ハイフシャワー全顔¥42,800を足す", "ソフウェーブ両頬80ショット¥46,800に、HIFU（頬＋顎下）の追加¥29,800を足す", "ソフウェーブ両頬80ショット¥46,800に、ハイフシャワー全顔¥42,800を足す", "XERFの頬300ショット¥48,800に、HIFU（頬＋顎下）の追加¥29,800を足す"], "answer": 3, "explain": "XERFは高周波でハリの層を温め、麻酔は不要。HIFU（頬＋顎下）の追加¥29,800でSMASまで届く。×ソフウェーブ：麻酔クリームを塗る（時間に麻酔の時間を含む）。×ハイフシャワー：深さ2.0mm用の部品で浅い層だけに打つので、SMASの引き上げには当たらない。", "basis": "電気を流して、通り道をじんわり温める（電熱線が熱くなるのと同じ）"}, {"id": "d-k-layers-4", "ch": "k2", "card": "k-energy", "level": "dr", "q": "60代のお客様。「たるんで余った皮膚が気になるが、切らずに治したい」。層と機械の説明として合うものは？", "choices": ["余った皮膚は切る手術でしか減らせない。切らずにSMASへ届く打ち方はHIFUのドット", "余った皮膚は切る手術でしか減らせない。切らずにSMASへ届く打ち方はハイフシャワー", "余った皮膚もソフウェーブで減らせる。切らずにSMASへ届く打ち方はHIFUのドット", "余った皮膚もソフウェーブで減らせる。切らずにSMASへ届く打ち方はハイフシャワー"], "answer": 0, "explain": "余った皮膚そのものは切る手術でしか減らせない。切らないなら、HIFUのドットモードで筋肉の膜（SMAS）を点で温め、膜を縮めて引き上げる。×ソフウェーブで皮膚が減る：浅い真皮を温めてハリを出す機械。×ハイフシャワー：深さ2.0mm用の部品で浅い層だけに打つ。", "basis": "ハリの層（ソフウェーブ）／支える膜 SMAS（HIFU）"}, {"id": "d-k-layers-5", "ch": "k2", "card": "k-energy", "level": "dr", "q": "フェイスラインの脂肪のもたつきが気になるお客様。「針を刺して中から熱を入れる施術を、デイズの本厚木院で受けたい」。案内として合うものは？", "choices": ["XERFで、新宿院限定。本厚木院では受けられない", "モフィウス8バーストで、本厚木院でも新宿院でも受けられる", "XERFで、本厚木院でも新宿院でも受けられる", "モフィウス8バーストで、新宿院限定。本厚木院では受けられない"], "answer": 3, "explain": "針を刺して先から熱を出すのは針＋高周波で、脂肪の層まで届くのはモフィウス8バースト。デイズの新宿院限定なので本厚木院では受けられない。XERFも真皮〜脂肪に届くが、針を使わずに電気を流して温める高周波の機械。×XERF：針を使わない。×本厚木院でも：新宿院限定。", "basis": "ニードルRF、ブレッシング、モフィウス8（脂肪まで）"}, {"id": "d-k-skin-6", "ch": "k2", "card": "k-energy", "level": "dr", "q": "あおなぎ（本厚木）で、頬のシミと赤み、フェイスラインのたるみの引き上げを相談された。悩みごとの機械の割り当てとして、教材に合うものは？", "choices": ["シミと赤みはルメッカ、たるみはHIFUのドット", "シミと赤みはピコトーニング、たるみはHIFUのドット", "シミと赤みはルメッカ、たるみはハイフシャワー", "シミと赤みはピコトーニング、たるみはハイフシャワー"], "answer": 0, "explain": "IPLのルメッカは茶色（シミ）と赤（血管）の両方に反応する。ピコは色素を細かく砕くレーザーで、赤みはピコの説明にない。HIFUのドットは筋肉の膜（SMAS）を点で約65℃にしてたるみを引き上げる打ち方で、ハイフシャワーは浅い層だけに打つハリ向けの打ち方。どれもあおなぎにある。", "basis": "茶色（シミ）と赤（血管）に反応する"}, {"id": "a-c2-01-2", "ch": "k2", "card": "k-price", "level": "apply", "q": "経結膜脱脂を希望するお客様。顔写真の撮影やSNSへの掲載には協力できないという。料金の案内として教材に合うものは？", "choices": ["デイズのモニター価格は、撮影に協力できなくても医師の審査に通れば選べる", "あおなぎの経結膜脱脂は麻酔代が別で、デイズと同じモニター価格もある", "デイズなら通常価格で案内する。モニター価格は撮影・掲載への協力が条件", "あおなぎの脱脂＋脂肪注入は、局所麻酔込みの総額で表示されている"], "answer": 2, "explain": "デイズのモニター価格は、撮影への協力やSNS・WEBへの掲載などが条件で、さらに医師の審査がある（基礎編②）。協力できない人はデイズなら通常価格。あおなぎは麻酔代・薬代込みの総額で、モニター価格の掲載はない。あおなぎの脱脂＋脂肪注入は静脈麻酔込みのセット料金。", "basis": "「症例モニター」になる人の価格。条件は4つ：①写真・動画の撮影に協力できる"}, {"id": "a-c4-09-2", "ch": "k2", "card": "k-price", "level": "apply", "q": "デイズで糸リフトを受けて3週間。「引き上がりが思ったより弱い」「左右で明らかに差がある」の2つの相談。保証制度に沿った案内は？", "choices": ["2つとも保証の対象なので、すぐに再施術を受けられる", "左右差は対象になりうるが、引き上げの弱さは対象外", "引き上げの弱さは対象になるが、左右差は対象外", "糸リフトには保証がないので、どちらも有料になる"], "answer": 1, "explain": "デイズの保証制度で糸リフトは1か月。対象は凹凸・不整・明らかな左右差で、医師が必要と判断すれば再施術を受けられる。「引き上げ効果の有無」は保証しないと明記されている。他：引き上げの弱さは対象外／対象が逆／保証は1か月ある。", "basis": "糸リフトの「引き上げ効果の有無」は保証しない"}, {"id": "a-k-price-1", "ch": "k2", "card": "k-price", "level": "apply", "q": "デイズでモニター価格を希望する患者が「写真の撮影とアンケートには協力するが、SNSやWEBに写真が出るのは困る」と言う。教材に合う説明は？", "choices": ["撮影とアンケートの2つを満たせば、モニター価格の対象になる", "掲載なしでも、医師の審査に通ればモニター価格の対象になる", "SNS・WEBへの掲載の条件を満たさず、モニター価格の対象外", "モニターの希望は、施術後のアンケートのときに伝えればよい"], "answer": 2, "explain": "モニター価格の条件は①撮影②施術内容によっては2回以上来院③SNSやWEB媒体への掲載④アンケートの4つ。医師の診察・審査はその上で行われ、希望する公開範囲も審査に影響するが、掲載そのものができないと条件③を満たさない。希望は予約のときかカウンセリングのときに伝える。", "basis": "SNSやWEB媒体への写真・動画の掲載ができる"}, {"id": "d-c2-02-1", "ch": "k2", "card": "k-price", "level": "dr", "q": "あおなぎの「裏ハムラ＋脂肪注入」（¥458,000）を見たお客様。「同じ内容をデイズで受けたい。顔の写真を撮られるのは困る」。料金の案内として合うものは？", "choices": ["裏ハムラはモニター¥198,000。脂肪注入は、注入部位の料金だけを足す", "裏ハムラは通常¥348,000。脂肪注入は、採取・作成と注入部位の両方の料金を足す", "裏ハムラはモニター¥198,000。脂肪注入は、採取・作成と注入部位の両方の料金を足す", "裏ハムラは通常¥348,000。脂肪注入は、注入部位の料金だけを足す"], "answer": 1, "explain": "デイズにクマのセット料金はなく、脂肪注入は別メニューの料金で足す。脂肪注入の料金表は2段がまえで、採取・作成と注入部位の両方がかかる。モニターの条件①は写真・動画の撮影への協力なので、撮影できないなら裏ハムラは通常¥348,000。×モニター¥198,000：条件①。×注入部位だけ：採取・作成もかかる。", "basis": "写真・動画の撮影に協力できる"}, {"id": "d-c2-05-1", "ch": "k2", "card": "k-price", "level": "dr", "q": "「まぶたが重い」お客様。診察で、皮膚の余りと、まぶたを上げる筋肉の力の低下の両方が見つかった。「デイズで治したい。一度に払えないので分割にしたい」。案内として合うものは？", "choices": ["眉下リフトと眼瞼下垂手術の両方を。支払いは現金・カードのほか、医療ローンも使える", "眉下リフトと眼瞼下垂手術の両方を。支払いは現金・デビット・カードだけで、医療ローンはない", "眉下リフトだけで、上げる力も戻る。支払いは現金・カードのほか、医療ローンも使える", "眉下リフトだけで、上げる力も戻る。支払いは現金・デビット・カードだけで、医療ローンはない"], "answer": 0, "explain": "皮膚の余りは眉下リフト、上げる力の低下は眼瞼下垂手術で、眉下リフトは余った皮膚を取る手術なので筋肉の問題は直らない。デイズの支払いは現金・デビット・クレジットカード・医療ローン。×眉下リフトだけ：開く力は戻らない。×医療ローンはない：支払い方法にある。", "basis": "支払いは現金・デビット・クレジットカード・医療ローン。"}, {"id": "d-c2-08-2", "ch": "k2", "card": "k-price", "level": "dr", "q": "「口角を上げたい。まずあおなぎでアラガンの注射を試し、2年後にデイズで手術へ進みたい。写真のSNS掲載はできない」というお客様。案内として合うものは？", "choices": [" ,000で。切開法は傷が残るが、埋没法よりやり直しやすいので向いている", "エタニティクロス法をモニター¥189,000で。切開法は傷が残るが、埋没法よりやり直しやすいので向いている"], "answer": 1, "explain": "幅の変更・左右差の1年保証はスタンダード法以外のプランにつき、その中でいちばん安いのはエタニティクロス法（モニター¥189,000、審査あり）。スタンダード法は¥98,000と安いが、幅の変更の保証はない。切開法は元に戻せず、幅の変更ができないこともあるので、あとで幅を変えたくなりそうな人には向かない。やり直しやすいのは埋没法の方。", "basis": "スタンダード法以外は、幅の変更・左右差の修正も各1年保証。"}, {"id": "a-c1-02-1", "ch": "eye", "card": "c1-02", "level": "apply", "q": "埋没法が2回取れ、まぶたも厚い。1週間の強い腫れは受け入れられ、あとで幅を変えるつもりもない。教材に合う提案は？", "choices": ["二重切開法だけを提案する", "二重切開法に脂肪取りを足して提案する", "同じ埋没法をもう一度くり返す", "切らない眼瞼下垂を提案する"], "answer": 0, "explain": "何度も取れた・厚いまぶたは切開法の対象。切開法は余分な皮膚・脂肪も同時に取れるので、脂肪取りを別に足す必要はない（サイト明記）。×脂肪取りを足す：工程が重なる。×埋没法をくり返す：何度も取れた・戻したくない人は切開法、と全体像の表にある。×切らない眼瞼下垂：開きの施術で、折り目は作らない。", "basis": "余分な皮膚・脂肪も同時に取れる。だからまぶたの脂肪取りを別に足す必要はない。"}, {"id": "d-k-eye-5", "ch": "eye", "card": "c1-02", "level": "dr", "q": "デイズで二重切開法を受けて8か月のお客様。「両目とも幅を少し広げたい。直したあとに左右差が出たら、また保証で直せるようにしたい」。保証の扱いと直し方として合うものは？", "choices": ["切開の保証1年は形の乱れ・左右差に加えて幅の変更も対象なので、8か月なら保証で広げられ、直したあとの左右差も同じ保証で直せる", "幅の変更は切開の保証の対象に挙がっておらず、広げる場合も再び切開が要るので、二重切開法をモニター¥440,000で受け直す", "幅の変更は切開の保証の対象に挙がっておらず、広げる向きは埋没で直せ、スタンダード法¥121,000でも左右差の修正は1年保証", "幅の変更は切開の保証の対象に挙がっておらず、広げる向きは埋没で直せ、左右差も1年保証のエタニティクロス法¥231,000で"], "answer": 3, "explain": "切開の保証は形の乱れ・左右差が対象で、幅の変更は挙がっていない。広げる向きなら埋没法か切開法で直せ、再び切開が要るのは狭めるとき。埋没で左右差の修正保証（1年）がつくのはスタンダード法以外で、スタンダード法の保証は糸が取れたときの2年だけ（幅の変更・左右差の修正はつかない）。", "basis": "修正は方向で難しさが違う。幅を広げたいなら埋没法か切開法で直せるが、狭くしたいなら再び切開が必要。"}, {"id": "a-c1-03-1", "ch": "eye", "card": "c1-03", "level": "apply", "q": "まぶたが厚く、アイプチの二重が定着しにくい。「皮膚を長く切る手術は避けたい」というお客様に、教材の考え方で合うのは？", "choices": ["二重切開法に、まぶたの脂肪取りも足す", "二重埋没法だけで、幅を広めに取っておく", "二重埋没法に、まぶたの脂肪取りを足す", "切らない眼瞼下垂で、まぶたを薄くする"], "answer": 2, "explain": "厚いまぶた＋二重は「埋没法＋脂肪取り」か「切開法」の二択。長く切りたくないなら、数mmの穴から脂肪を抜き、埋没法と同時に行う。×切開法＋脂肪取り：切開法は脂肪も取るので足す必要がない。×埋没法だけで広め：厚いまぶたで幅を広く取ると取れやすい。×切らない眼瞼下垂：変えるのは開きで、厚みではない。", "basis": "単独ではなく、ふつうは二重埋没法と同時に行う"}, {"id": "d-c1-03-1", "ch": "eye", "card": "c1-03", "level": "dr", "q": "45歳のお客様。年々まぶたの上の皮膚が重くかぶさって、二重の線が隠れてきた。今の二重の形は変えたくない。眠って受けたい。院・メニュー・条件の組み合わせとして合うものは？", "choices": ["あおなぎの眉下切開¥298,000。静脈麻酔込みの総額で、保証は6か月", "あおなぎの眉下切開¥298,000。静脈麻酔込みの総額で、保証は1年", "あおなぎの埋没¥59,800に、まぶたの脂肪取りを足して軽くする", "デイズの切らない眼瞼下垂¥200,000で、かぶさる皮膚ごと持ち上げる"], "answer": 0, "explain": "まぶたの形を変えずに皮膚のたるみを取るのは眉下リフト（あおなぎでは眉下切開）。あおなぎの¥298,000は静脈麻酔込みの総額で、保証は6か月。×保証1年：1年はデイズの眉下リフト。×脂肪取り：あおなぎになく、原因が皮膚なら変化が小さい（＊）。×切らない眼瞼下垂：開きを上げる施術で、余った皮膚は切る手術でしか減らせない。", "basis": "眉の下の皮膚のたるみが気になる人は「眉下リフト」（まぶたの形を変えずにたるみを取る）。"}, {"id": "d-c1-06-2", "ch": "eye", "card": "c1-03", "level": "dr", "q": "4年前にデイズでエタニティクロス法を受けたお客様。糸が取れて線が消えた。「まぶたも厚くなってきたので、掛け直しと同じ日に脂肪取りも受けたい」。案内として合うものは？", "choices": ["保証は2年なので切れていて、掛け直しは別料金。脂肪取りは同じ日にでき、¥150,000は保証の再施術とは別の料金", "保証は5年なので期間内で、掛け直しは医師の判断。脂肪取りは同じ日にはできず、別の日に¥150,000で受ける", "保証は2年なので切れていて、掛け直しは別料金。脂肪取りは同じ日にはできず、別の日に¥150,000で受ける", "保証は5年なので期間内で、掛け直しは医師の判断。脂肪取りは同じ日にでき、¥150,000は保証の再施術とは別の料金"], "answer": 3, "explain": "エタニティクロス法の保証は5年で、糸が取れたときは医師が必要と判断すれば再施術。2年はスタンダード法の保証。脂肪取りはふつう二重埋没法と同時に行うメニューで、保証の対象に挙がっていない別メニュー（¥150,000）。", "basis": "単独ではなく、ふつうは二重埋没法と同時に行う。"}, {"id": "d-k-eye2-1", "ch": "eye", "card": "c1-03", "level": "dr", "q": "上まぶたが厚いお客様が、あおなぎの¥59,800の埋没を見て来院。「脂肪も取って、埋没と同じ日に済ませたい。写真の掲載もOKで、できるだけ安く」。院・組み合わせ・保証の案内として合うものは？", "choices": ["デイズで、スタンダード法モニター¥98,000（保証2年）に脂肪取り¥150,000を同時に", "あおなぎで、瞼板法2点留め¥59,800（保証2年）に、脂肪取りも同時に足して受ける", "デイズで、スタンダード法モニター¥98,000（保証1年）に脂肪取り¥150,000を同時に", "あおなぎで、瞼板法2点留め¥59,800（保証1年）に、脂肪取りも同時に足して受ける"], "answer": 0, "explain": "脂肪取りはあおなぎで取り扱いがないので、脂肪も取るならデイズ。デイズでいちばん安い埋没はスタンダード法（モニター¥98,000、審査あり）で、保証は2年。1年はあおなぎの埋没の保証（どの術式も1年で料金に込み）。脂肪取りはモニター価格の記載がなく¥150,000。", "basis": "取り扱いなし（2026年10月時点のサイトに掲載なし）"}, {"id": "d-c1-04-1", "ch": "eye", "card": "c1-04", "level": "dr", "q": "2か月前に他院でおでこにボトックスを打ち、そのあとまぶたが下がってきたお客様。「しわの効き目は3〜6か月と聞いたから、あと1か月で治るはず。次のおでこはデイズのアラガンで」。見通しと次回の料金の案内として合うものは？", "choices": ["下がりもしわの効き目と同じく3〜6か月ほどで切れ、あと1か月ほどで戻る見込み。次回のおでこのアラガンは¥8,800", "下がりは半年〜1年ほどで自然に改善するとされ、しわの効き目とは目安が別。次回のおでこのアラガンは¥8,800", "下がりもしわの効き目と同じく3〜6か月ほどで切れ、あと1か月ほどで戻る見込み。次回のおでこのアラガンは¥11,000", "下がりは半年〜1年ほどで自然に改善するとされ、しわの効き目とは目安が別。次回のおでこのアラガンは¥11,000"], "answer": 3, "explain": "ボトックスのあとの下がりは半年〜1年ほどで自然に改善するとされ、しわの効き目（3〜6か月ほど）とは目安が違う。おでこのしわのアラガンはデイズ・あおなぎとも¥11,000で、¥8,800は眉間や目尻などの料金。", "basis": "おでこや目のまわりのボトックス注射のあとに一時的に下がることもある（半年〜1年ほどで自然に改善）。"}, {"id": "d-c1-09-1", "ch": "eye", "card": "c1-04", "level": "dr", "q": "二重の線がなく、診察で両目とも軽い下垂と言われたお客様。「切らずに二重と開きの両方を良くしたい。写真の掲載はOKで、費用はできるだけ抑えたい」。デイズでの組み合わせと料金として合うものは？", "choices": ["エタニティクロス法をモニター¥98,000に、切らない眼瞼下垂は両側¥200,000（モニター価格の記載なし）", "スタンダード法をモニター¥98,000に、切らない眼瞼下垂は両側をモニター価格¥140,000（審査あり）", "エタニティクロス法をモニター¥98,000に、切らない眼瞼下垂は両側をモニター価格¥140,000（審査あり）", "スタンダード法をモニター¥98,000に、切らない眼瞼下垂は両側¥200,000（モニター価格の記載なし）"], "answer": 3, "explain": "埋没は折り目だけで開きは変わらないので、切らない眼瞼下垂を合わせる。モニター¥98,000（審査あり）はスタンダード法で、エタニティクロス法のモニターは¥189,000。切らない眼瞼下垂は両側¥200,000でモニター価格の記載がなく、¥140,000は片側の料金。", "basis": "保険は使えない（デイズの眼瞼下垂治療はすべて自由診療）。モニター価格の記載なし。"}, {"id": "d-quiz-k1-2", "ch": "eye", "card": "c1-04", "level": "dr", "q": "1年半前にデイズでエタニティクロス法を受けたお客様。糸が取れて線が消え、片目だけ開きも弱く、診察で軽い下垂と言われた。「保証の掛け直しで、開きもいっしょに直したい」。案内として合うものは？", "choices": ["掛け直しに下垂修正の手技を足せば、開きの改善も保証の対象になる。片目だけなので、手術の前に眼科などの受診を案内する", "線の掛け直しは保証の対象だが、開きの改善は対象に挙がっていない。片目だけなので、手術の前に眼科などの受診を案内する", "掛け直しに下垂修正の手技を足せば、開きの改善も保証の対象になる。軽い下垂なので、片目でもそのまま切らない眼瞼下垂の予約へ", "線の掛け直しは保証の対象だが、開きの改善は対象に挙がっていない。軽い下垂なので、片目でもそのまま切らない眼瞼下垂の予約へ"], "answer": 1, "explain": "保証は糸が取れたときの線の再施術（医師が判断）で、開きの改善は対象に挙がっていない。埋没に下垂修正の手技を加える方法はあるが、保証とは別の話。片目だけの下垂は、手術の前に眼科などの受診を案内する（＊）。", "basis": "急に始まった／夕方だけ悪いなど時間で変わる／片目だけ／物が二重に見える、に当てはまる人には、手術の前に眼科などの受診を案内する"}, {"id": "a-c1-05-1", "ch": "eye", "card": "c1-05", "level": "apply", "q": "長年ハードコンタクトを使い、眉を上げないと目が開かず肩こりもある。診察で、切らない方法では足りないと言われ、二重にもしたい。合うのは？", "choices": ["切らない眼瞼下垂（両側）", "二重切開法で折り目を作る", "二重埋没法＋まぶたの脂肪取り", "眼瞼下垂（眼瞼挙筋前転術）"], "answer": 3, "explain": "眼瞼挙筋前転術は、のびた筋肉の先の膜を瞼板に縫い縮める本格的な開きの手術。切らない方法で足りない下垂にも対応し、二重切開と同じ線を切るので二重にもなる。×切らない眼瞼下垂：向くのは軽い〜中くらいまで。×二重切開法・埋没法：作るのは折り目で、開きは変わらない。", "basis": "二重も同時にできる。二重切開と同じ線を切って行うので、仕上がりは二重まぶたになる。"}, {"id": "d-c1-02-1", "ch": "eye", "card": "c1-05", "level": "dr", "q": "デイズで眼瞼下垂の手術（前転術）を受けたお客様。二重の幅に左右差が出て、「広い方を埋没で狭めて、狭い方に合わせてほしい」。調整の方向と直し方の案内として合うものは？", "choices": ["広い方を狭めて揃える。狭める向きでも、ご希望の埋没法で直せる", "狭い方を広げて揃える。広げる向きなら、埋没法か切開法で直せる", "広い方を狭めて揃える。狭める向きなので、もう一度切開しないと直せない", "狭い方を広げて揃える。広げる向きでも、もう一度切開しないと直せない"], "answer": 1, "explain": "前転術で二重の幅に左右差が出たら、狭い方を広げて調整する。二重の修正は方向で難しさが違い、広げる向きなら埋没法か切開法で直せるが、狭める向きは再び切開が要る。広い方を埋没で狭めるご希望には、そのままでは沿えない。", "basis": "二重の幅に左右差が出た場合は、狭い方を広げて調整する。"}, {"id": "d-c1-04-2", "ch": "eye", "card": "c1-05", "level": "dr", "q": "デイズで前転術を受けて3週間のお客様。「目が閉じきらず、乾く。今日このまま再手術してほしい」。考えられる状態と、再施術の時期の案内として合うものは？", "choices": ["縮め方が足りない低矯正の可能性がある。再施術は目元の原則どおり1か月以降で、今日は診察まで", "縮めすぎた過矯正の可能性がある。再施術は目元の原則どおり1か月以降で、今日は診察まで", "縮め方が足りない低矯正の可能性がある。再施術は切らない眼瞼下垂と同じく、原則半年たってから", "縮めすぎた過矯正の可能性がある。再施術は切らない眼瞼下垂と同じく、原則半年たってから"], "answer": 1, "explain": "閉じにくく乾くのは、縮めすぎた過矯正の特徴（＊）。低矯正は開きが弱いままの状態。目元の再施術は原則1か月以降で、診察は保証の有無に関わらずいつでもでき、保証の対象かは医師が判断する。半年は切らない眼瞼下垂のページの個別の記載。", "basis": "縮め方が足りず開きが弱いまま（低矯正）、縮めすぎて目が閉じにくくなる（過矯正）があり、後者は目が乾きやすくなる"}, {"id": "d-c1-05-1", "ch": "eye", "card": "c1-05", "level": "dr", "q": "診察で重めの下垂と言われ、二重もほしいお客様。写真の掲載はOKで、費用はできるだけ抑えたい。デイズでの施術・金額・モニターの扱いとして合うものは？", "choices": ["二重切開法モニター¥440,000に、切らない眼瞼下垂¥200,000を同じ日に足す。モニターは医師の審査で決まる", "前転術モニター¥628,000に、埋没スタンダード法モニター¥98,000を足して二重を作る。モニターは審査で決まる", "前転術モニター¥628,000の1回で、開きと二重の両方ができる。モニターになれるかは医師の審査で決まる", "前転術モニター¥628,000の1回で、開きも二重も作れる。写真の掲載を承諾した時点でモニター価格に決まる"], "answer": 2, "explain": "前転術は二重切開と同じ線を切るので、開きと二重が1回でできる（モニター¥628,000）。モニターは撮影・掲載などの条件に加え、医師の診察・審査で決まる。×切開法＋切らない眼瞼下垂：切開法に膜を縫い縮める工程はなく、切らない方法は重度に足りない。×埋没を足す：二重は同時にできる。×承諾で決まる：審査がある。", "basis": "二重も同時にできる。二重切開と同じ線を切って行うので、仕上がりは二重まぶたになる。"}, {"id": "d-c1-05-2", "ch": "eye", "card": "c1-05", "level": "dr", "q": "デイズで前転術を受けるお客様。「痛みがこわいので、できるだけ楽に受けたい。どんな麻酔になるのか、笑気麻酔がどういうものかも知りたい」。案内として合うものは？", "choices": ["約1時間の長めの手術なので、点滴の静脈麻酔で眠って受けるのが基本。笑気を使えば、うとうと眠った状態のまま受けられる", "途中で体を起こして開きと左右差を確かめるので、意識のある局所麻酔が基本。笑気を使えば、うとうと眠った状態のまま受けられる", "途中で体を起こして開きと左右差を確かめるので、意識のある局所麻酔が基本。笑気は眠らずにぼんやりし、吸うのをやめるとすぐ覚める", "約1時間の長めの手術なので、点滴の静脈麻酔で眠って受けるのが基本。笑気は眠らずにぼんやりし、吸うのをやめるとすぐ覚める"], "answer": 2, "explain": "前転術は一般に、途中で体を起こして目の開きと左右差を確かめながら調整するので、眠らせる麻酔ではなく意識のある局所麻酔が基本（＊）。笑気は吸うガスで、お酒に酔ったようにぼんやりするが眠りはせず、吸うのをやめるとすぐ覚める。うとうと眠った状態にするのは点滴の静脈麻酔。", "basis": "途中で体を起こして目の開き具合と左右差を確かめながら調整する"}, {"id": "a-c1-06-1", "ch": "eye", "card": "c1-06", "level": "apply", "q": "あおなぎで目頭切開を相談したお客様。診察で「ひだが下に伸びるタイプ」と言われ、保証と所要時間を気にしている。教材でこのタイプに向くとされる術式と、あおなぎの条件の組み合わせは？", "choices": ["目頭切開Z法：保証6か月・約35分・局所麻酔", "リドレープ法：保証1年・約45分・局所麻酔", "リドレープ法：保証6か月・約45分・局所麻酔", "リドレープ法：保証6か月・約35分・静脈麻酔込み"], "answer": 2, "explain": "リドレープ法は皮膚を切り取らずに、ひだの余った皮膚を移動させる方法で、下に伸びるタイプのひだに向く。あおなぎでは保証6か月・約45分・局所麻酔（笑気込み）。×Z法：三角の皮膚を入れ替える別の術式。×保証1年：デイズの目頭切開の保証。×静脈麻酔込み：あおなぎの目尻切開の条件。", "basis": "下に伸びるタイプのひだに向く"}, {"id": "d-c1-06-3", "ch": "eye", "card": "c1-06", "level": "dr", "q": "デイズで目頭切開を受けて2か月のお客様。「思ったより寄って見えるので戻したい。保証期間内だから無料ですよね」。戻し方・保証・時期の案内として合うものは？", "choices": ["保証1年の期間内で、目元の再施術の時期（1か月以降）も過ぎているので、戻す再手術は無料で受けられる", "皮膚を切り取らないZ法なので、半年ほどで自然に元の目頭へ戻る。再手術はせず、それまで様子を見る", "自然には戻らず、戻すには再手術が要る。保証1年の対象は不整・左右差で、時期（1か月以降）は満たすが医師の判断になる", "戻すには再手術が要り、保証の対象かは医師が判断する。ただし目元の再施術は原則半年以降なので、あと4か月待つ"], "answer": 2, "explain": "サイトは戻せるとしつつ、戻したい場合は再施術が必要と書く（自然には戻らない）。保証1年の対象は不整・左右差で、見え方の好みは挙がっていない。目元の再施術は原則1か月以降。×無料で戻せる：保証の対象は不整・左右差。×半年で自然に戻る：半年は傷の赤みが引く目安（＊）。×半年以降：目元は1か月以降。", "basis": "つまり自然に戻ることはなく、戻すにはもう一度手術がいる。"}, {"id": "a-c1-07-1", "ch": "eye", "card": "c1-07", "level": "apply", "q": "二重の線は埋没法で安定している。目と目の間が近く、蒙古ひだのかぶさりで二重の幅がせまく見える。開きは診察で問題ないと言われた。デイズで次に考えるのは？", "choices": ["目頭切開（デイズ）", "目上切開（デイズ）", "二重切開法（デイズ）", "切らない眼瞼下垂（両側）"], "answer": 1, "explain": "目上切開は目頭の「上」を切り、目と目の距離を変えずに縦に広げる。ひだのせいで二重の幅がせまい人が対象で、埋没法との組み合わせも多い。×目頭切開：距離が縮み、近い人には勧めない。×二重切開法：折り目を作る手術で、折り目はすでに安定している。×切らない眼瞼下垂：開きの施術で、開きは問題なし。", "basis": "ひだのせいで二重の幅がせまい"}, {"id": "d-c1-06-1", "ch": "eye", "card": "c1-07", "level": "dr", "q": "目と目の間が30mmで、蒙古ひだが強いお客様。写真の掲載はOK。「目を大きくしたい」。デイズで合うメニューと価格の案内として合うものは？", "choices": ["目上切開をモニター¥395,000で。目と目の距離を変えずに、目を縦に広げられる", "目頭切開をモニター¥395,000で。30mmは理想の間隔の範囲なので、内側へ広げてよい", "目上切開をモニター¥295,000で。目と目の距離を変えずに、目を縦に広げられる", "目頭切開をモニター¥295,000で。30mmは理想の間隔の範囲なので、内側へ広げてよい"], "answer": 0, "explain": "理想の間隔は33〜35mmほどで、30mm以下だと寄り目の印象になるので、距離を縮める目頭切開は勧めない。目頭の上を切って距離を変えずに縦へ広げる目上切開（両側モニター¥395,000）が受け皿。¥295,000はデイズの目頭切開のモニター価格。", "basis": "目と目が近い人の受け皿。目頭切開だと寄り目に見えそうな人でも、目を大きく見せられる。"}, {"id": "d-c1-07-1", "ch": "eye", "card": "c1-07", "level": "dr", "q": "蒙古ひだが強く、おでこの力で目を開けているお客様。診察で両目とも軽い下垂と言われた。「目上切開を受けたい。もし戻ったら、やり直しもしたい」。デイズでの組み合わせと、やり直しの時期の案内として合うものは？", "choices": ["開きは切る眼瞼下垂（前転術）を合わせる。目上切開のやり直しは、そのページの記載どおり原則半年たってから", "開きは切らない眼瞼下垂を合わせる。目上切開も目元の手術なので、やり直しは1か月たてばできる", "開きは切らない眼瞼下垂を合わせる。目上切開のやり直しは、そのページの記載どおり原則半年たってから", "開きは切る眼瞼下垂（前転術）を合わせる。目上切開も目元の手術なので、やり直しは1か月たてばできる"], "answer": 2, "explain": "下垂がある人は皮膚を切っても根本は変わらないので、開きの施術を合わせる。軽い〜中くらいなら切らない眼瞼下垂で、前転術は重い場合や切らない方法で足りない場合。目上切開のページは、やり直しを個別に「原則として半年たってから」と書いている（1か月以降は保証制度ページにある目元の一般の原則）。", "basis": "やり直し（再施術）は、原則として半年たってから。"}, {"id": "a-c1-08-1", "ch": "eye", "card": "c1-08", "level": "apply", "q": "目尻切開を希望。目尻を引っぱっても隠れた白目がほとんどないが、「大きく変えたい」と言う。教材に合う対応は？", "choices": ["目尻のすぐ外側は骨なので、目尻靱帯移動を勧めておく", "余白が少ないと効果が出にくい傾向を、先に伝えておく", "余白が少ない人ほど後戻りしにくいので、大きく変わると伝える", "グラマラスラインを足して、横幅を外へ広げる方法を伝える"], "answer": 1, "explain": "サイトは、目尻を引っぱって白目が1.5mm以上あると効果が高い傾向と書く。余白が少ないと見た目があまり変わらない（＊一般知識）ので、先に伝える。×靱帯移動：デイズでの内容はサイトに説明がない。×後戻り：余白と後戻りの記載はなく、効果は出にくい。×グラマラス：下まぶたを下へ下げる施術。", "basis": "目尻を引っぱって白目が1.5mm以上あると効果が高い傾向"}, {"id": "a-c1-08-2", "ch": "eye", "card": "c1-08", "level": "apply", "q": "あおなぎ（本厚木）で「目と目が近いが、目を大きくしたい」と相談された。あおなぎのサイトに掲載がある中で、まず考えるのは？", "choices": ["目尻切開", "目上切開", "目頭切開Z法", "涙袋形成"], "answer": 0, "explain": "目と目が近い人には目上切開か目尻切開を考えるが、目上切開はあおなぎのサイトに掲載がない。目尻切開は外へ広げるので距離が縮まらない。×目上切開：デイズのみ。×目頭切開Z法：内側へ広げ、目と目の距離が縮む。×涙袋形成：あおなぎに掲載がなく、目のふちも広げない。", "basis": "目と目が近くて目頭切開が向かない人が、横幅を広げる方法としても案内される"}, {"id": "d-c1-08-1", "ch": "eye", "card": "c1-08", "level": "dr", "q": "つり目が悩みのお客様。目尻を引っぱると白目が2mmほど隠れている。「目尻切開とグラマラスライン形成を一緒に受けて、タレ目にしつつ目全体を大きく見せたい」。見通しと、下まぶたを下げる場所の案内として合うものは？", "choices": ["隠れた白目が3mmあれば効果が高い傾向で、2mmでは出にくい。下まぶたは目尻側をメインに下げる", "隠れた白目が1.5mmあれば効果が高い傾向で、2mmなら出やすい。下まぶたは目尻側をメインに下げる", "隠れた白目が3mmあれば効果が高い傾向で、2mmでは出にくい。下まぶたは目尻側と黒目の下を下げる", "隠れた白目が1.5mmあれば効果が高い傾向で、2mmなら出やすい。下まぶたは目尻側と黒目の下を下げる"], "answer": 3, "explain": "目尻切開は、目尻を引っぱって白目が1.5mm以上かくれている人は効果が高い傾向なので、2mmなら出やすい。下まぶたは、目尻側と黒目の下を下げると大きなタレ目になる。目尻側をメインに下げるのはタレ目の強調で、黒目の下をメインに下げると縦に長い目元。", "basis": "目尻を引っぱったとき、白目が1.5mm以上かくれている人は効果が高い傾向。"}, {"id": "a-c1-09-1", "ch": "eye", "card": "c1-09", "level": "apply", "q": "デイズでつり目をやわらげたい。「表に傷は残したくないが、糸だけだと戻りやすいのは心配」というお客様に合う方法は？", "choices": ["グラマラスライン形成の埋没", "グラマラスライン形成の表切開", "目尻切開で、目尻を外へ広げる", "グラマラスライン形成の裏切開"], "answer": 3, "explain": "裏切開はまぶたの裏側（結膜）を切るので、表に傷がなく抜糸もない。埋没だと戻りやすい人に向く。×埋没：糸だけなので元に戻りやすい。×表切開：まつげの際の皮膚を切るので表に傷ができる。×目尻切開：つり目には向くが、皮膚を切るので傷あとが残る。", "basis": "自然に下げたい人、埋没だと戻りやすい人に"}, {"id": "d-c1-07-2", "ch": "eye", "card": "c1-09", "level": "dr", "q": "デイズでタレ目形成の裏切開を受けるお客様。「痛みがこわいので、眠っている間に終わらせたい」。麻酔の案内として合うものは？", "choices": ["デイズのタレ目形成は目薬＋笑気＋局所で眠らない形。眠りたいなら静脈麻酔を相談し、オプション表では¥50,000", "デイズの裏切開は局所＋静脈麻酔が基本の形で、眠ったまま受けられる。オプション表の静脈麻酔は¥8,800", "デイズのタレ目形成は目薬＋笑気＋局所で眠らない形。眠りたいなら静脈麻酔を相談し、オプション表では¥8,800", "デイズの裏切開は局所＋静脈麻酔が基本の形で、眠ったまま受けられる。オプション表の静脈麻酔は¥50,000"], "answer": 0, "explain": "デイズのタレ目形成の麻酔は目薬＋笑気＋局所で眠らない形（静脈麻酔つきはあおなぎの切開）。眠るならオプション表の静脈麻酔¥50,000を相談し、使えるか・込みかは院に確認する。¥8,800は笑気麻酔の料金。", "basis": "目薬＋笑気＋局所（眠らない）"}, {"id": "d-c1-09-2", "ch": "eye", "card": "c1-09", "level": "dr", "q": "つり目が悩みで、もともと黒目の下に白目が少し見えているお客様。「目尻切開とタレ目形成を同じ日に受けて、目を大きくしたい」。デザインの方針として合うものは？", "choices": ["つり目が強いのでタレ目はしっかり下げ、目尻切開も極端に切ると黒目の下に白目が出るので切りすぎない", "タレ目の下げる量は医師が慎重に判断し、目尻切開も極端に切ると黒目の下に白目が出るので切りすぎない", "タレ目の下げる量は医師が慎重に判断し、目尻切開は外へ広げるだけで黒目の下には響かないので大きめでよい", "つり目が強いのでタレ目はしっかり下げ、目尻切開は外へ広げるだけで黒目の下には響かないので大きめでよい"], "answer": 1, "explain": "もともと黒目の下に白目が見えている人は、下まぶたを下げると症状が悪くなる方向に働くため、下げる量は慎重に判断する（＊）。目尻切開も、極端に切ると黒目の下に白目が見える状態（下三白眼）になるので、切りすぎない。", "basis": "もともと黒目の下に白目が見えている人、年齢で下まぶたがゆるんでいる人は、症状が悪くなる方向に働くため慎重に判断する"}, {"id": "d-c1-09-3", "ch": "eye", "card": "c1-09", "level": "dr", "q": "デイズでタレ目形成（裏切開）と目尻切開を同じ日に受けて10か月のお客様。「目尻側が戻ってきた。両方とも保証で、今度はしっかり下げたいので表切開で」。保証の扱いとして合うものは？", "choices": ["タレ目は1年以内の申告で再施術1回、表切開に変えるなら差額が要る。目尻切開の保証は不整・左右差が対象で、後戻りは挙がっていない", "タレ目は1年以内の申告で再施術1回、表切開に変えるなら差額が要る。目尻切開も同じく1年以内の申告で、麻酔代だけで再施術1回", "タレ目は1年以内の申告で、裏切開から表切開への変更も麻酔代だけ。目尻切開の保証は不整・左右差が対象で、後戻りは挙がっていない", "デイズの目元の切開の保証は、あおなぎの切開と同じく6か月。10か月たっているので、タレ目も目尻切開も保証の期間を過ぎている"], "answer": 0, "explain": "タレ目形成は施術日から1年以内の申告で、麻酔代のみで再施術1回。裏切開のあと表切開になる場合は差額が要る。目尻切開は「その他の目元の手術」の保証1年で、対象は不整・左右差。×目尻切開も麻酔代だけ：タレ目だけのきまり。×変更も麻酔代だけ：差額が要る。×6か月：デイズは1年で、6か月はあおなぎの切開。", "basis": "保証は施術日から1年以内の申告で1回、負担は麻酔代のみ（再施術は原則1か月以降。裏切開のあと表切開になる場合などは差額が必要）。"}, {"id": "a-c1-10-1", "ch": "eye", "card": "c1-10", "level": "apply", "q": "涙袋形成（縫合法）を希望するお客様に「1か月半後に結婚式がある」と言われた。日程について教材に合う伝え方は？", "choices": ["目立つ腫れは約1週間で引くので、式の2週間前までに受ければよい", "腫れのピークは1〜2週間なので、式の1か月前に受ければ間に合う", "完全に安定するのは1〜3か月なので、式の日から逆算して決める", "合わなければ糸を外して戻せるので、日程は気にしなくてよい"], "answer": 2, "explain": "目立つ腫れは約1週間で引くが、完全に安定するのは1〜3か月。イベントの前は、安定までの期間から逆算して日程を決める。×2週間前：なじむ途中で、安定はもっと先。×ピーク1〜2週間：涙袋のピークは2〜3日目（1〜2週間は二重切開法）。×糸を外せる：戻せることと、式までに安定するかは別の話。", "basis": "イベントの前に受けるなら、安定までの期間から逆算して日程を決める"}, {"id": "d-c1-10-1", "ch": "eye", "card": "c1-10", "level": "dr", "q": "目の下のふくらみが目立つお客様。本厚木在住で「あおなぎで涙袋を作って、ふくらみも目立たなくしたい」。ふくらみの正体と、受けられるメニューの案内として合うものは？", "choices": ["眼窩脂肪のふくらみなので、あおなぎで経結膜脱脂¥98,000を受け、同じ日に涙袋形成も足せる", "眼窩脂肪のふくらみで涙袋とは別。涙袋だけ足すと2段になりうる。脱脂はあおなぎに¥98,000、涙袋形成はあおなぎにない", "ゆるんだ眼輪筋のふくらみなので、脂肪を取っても減らない。デイズの涙袋形成¥327,800で上に足して隠す", "眼窩脂肪のふくらみで涙袋とは別。あおなぎの経結膜脱脂¥98,000は表の皮膚を切って取り、涙袋形成はデイズで受ける"], "answer": 1, "explain": "目の下のふくらみ（目袋）は前に押し出された眼窩脂肪で、涙袋の中身の眼輪筋とは別。目袋がある人が涙袋だけ足すと2段で目立つことがある（＊）。脂肪を取る経結膜脱脂はあおなぎに¥98,000で、涙袋形成はあおなぎにない。×同じ日に涙袋：あおなぎにない。×眼輪筋：ふくらみは脂肪。×表の皮膚：結膜（裏）から取る。", "basis": "目の下のふくらみがある人が涙袋を足すと、ふくらみが2段になってかえって目立つことがある"}, {"id": "d-cat-1-1", "ch": "eye", "card": "c1-10", "level": "dr", "q": "デイズで糸の涙袋形成を受けて2週間のお客様。「もう少しボリュームがほしいので、ヒアルロン酸を足したい。入れすぎたら、やり直しはきくの？」。入れられる時期と、やり直しがきくかの案内として合うものは？", "choices": ["糸とは別の施術なので、今日からでも入れられる。ヒアルロン酸は溶かす薬があり、入れすぎ・左右差は溶かして直せる", "手術部分が落ち着くまで1〜3か月あけてから入れる。ヒアルロン酸も脂肪注入と同じく、根づいた分は残り溶かして戻せない", "手術部分が落ち着くまで1〜3か月あけてから入れる。ヒアルロン酸は溶かす薬があり、入れすぎ・左右差は溶かして直せる", "糸とは別の施術なので、今日からでも入れられる。ヒアルロン酸も脂肪注入と同じく、根づいた分は残り溶かして戻せない"], "answer": 2, "explain": "涙袋形成のあとのヒアルロン酸は、手術部分が落ち着くまで1〜3か月あけてからがすすめられている。ヒアルロン酸には溶かす薬があり、入れすぎ・左右差のときは溶かせるので、やり直しがきく。根づいた分が長く残るのは、自分の脂肪を移す脂肪注入。", "basis": "この施術のあとにヒアルロン酸を入れることもできる。ただし手術部分が落ち着くまで1〜3か月あけてからがすすめられている。"}, {"id": "d-c2-01-3", "ch": "kuma", "card": "map-2", "level": "dr", "q": "裏ハムラを考えているお客様。目の下のふくらみとみぞに加えて、青っぽく透けて見える部分もある。「1週間後に人と会う予定がある。青っぽさも裏ハムラで消える？」と聞く。教材に合う説明は？", "choices": ["外出は、抜糸がある1週間後までは控える。青っぽい透けは、サイトでは脂肪注入やスネコスなどの領域", "外出は数日で可能（サングラスやマスクで隠す）。青っぽい透けは、サイトでは脂肪注入やスネコスなどの領域", "外出は数日で可能（サングラスやマスクで隠す）。青っぽい透けも、段差がならされれば裏ハムラで消える", "外出は、抜糸がある1週間後までは控える。青っぽい透けも、段差がならされれば裏ハムラで消える"], "answer": 1, "explain": "裏ハムラは表に傷がなく、外出は数日で可能（サングラスやマスクで隠す）。4つの手術が直すのは基本的に黒クマ（ふくらみとみぞの影）で、皮膚が薄く下が透ける青クマには、サイトは脂肪注入・スネコス・ヒアルロン酸注射を挙げる。×1週間後まで控える：表ハムラ・切開法の抜糸の時期。×裏ハムラで消える：青クマは影ではなく透け。", "basis": "脱脂・ハムラ・切開の4つの手術が直すのは、基本的に黒クマ（ふくらみとみぞ）です。"}, {"id": "a-c2-01-1", "ch": "kuma", "card": "c2-01", "level": "apply", "q": "目の下のふくらみが悩みの20代。下のみぞや皮膚のたるみ・しわはほとんどない。顔の表に傷を残したくなく、時間と料金もなるべく抑えたい。合う施術と理由の組み合わせは？", "choices": ["裏ハムラ法：裏から入り、前に出た脂肪を下のみぞへ移して留めるから", "表ハムラ法：まつげの下から入り、脂肪を敷き直して皮膚も切り取るから", "脱脂＋脂肪注入：脂肪を取ったあと、太ももの脂肪をみぞに注入するから", "経結膜脱脂：まぶたの裏の粘膜を数mm切り、前に出た脂肪を取り出すから"], "answer": 3, "explain": "悩みはふくらみだけなので、裏の粘膜から脂肪を取り出す経結膜脱脂で足り、表に傷も残らない。理由はどれも各施術の正しい説明で、条件に合うかで決まる。裏ハムラ＝みぞを埋めるぶん時間が長く料金も高い。表ハムラ＝まつげの下に傷が残る。脂肪注入＝みぞを埋めるためのもので、みぞがない人には要らない。", "basis": "皮膚を切らない。下まぶたの内側の粘膜を数mm切るだけなので、顔の表に傷が残らない。"}, {"id": "a-map-2b-2", "ch": "kuma", "card": "c2-01", "level": "apply", "q": "目の下のふくらみがあり、その下のみぞもすでに深い患者。経結膜脱脂だけでなく、ハムラ法や脂肪注入が検討される理由として正しいものは？", "choices": ["脱脂で脂肪を減らすほどみぞも浅くなるが、深いみぞは一度では足りないから", "ふくらみだけ減らすと、みぞがかえって目立つことがあり、埋める方法が要るから", "深いみぞは皮膚が薄くて透ける青クマなので、皮膚を厚くする方法が要るから", "みぞは皮膚のたるみなので、皮膚を張って消す切開法を足す必要があるから"], "answer": 1, "explain": "脱脂が直せるのはふくらみだけで、みぞには触らない。みぞが深い人はふくらみだけ減らすとかえって目立つことがあり、脂肪を敷き直すハムラか、別の脂肪を足す脂肪注入で埋める。×脱脂でみぞも浅くなる：脱脂はみぞを浅くしない。×青クマ：青クマは透けで、みぞの影は黒クマ。×切開法を足す：切開法は皮膚を張ってもみぞは残る。", "basis": "ふくらみだけ減らすと、みぞがかえって目立つことがある。"}, {"id": "d-map-2-2", "ch": "kuma", "card": "c2-01", "level": "dr", "q": "デイズで切らないクマ取り（経結膜脱脂）を受けて10日目のお客様。「左右差があるし、片方は脂肪が戻ってきた気がする。今日やり直してほしい」と言う。経過の説明と、今日できることの案内が、どちらも教材に合うものは？", "choices": ["取った脂肪はほぼ戻らないが、1年ほどでまたたるんでくることが多い。今日も診察はでき、医師が必要と判断すれば再施術は原則1か月以降", "取った脂肪はほぼ戻らないが、年齢とともにまたたるむことはある。今日診察し、医師が必要と判断すれば保証で今日やり直せる", "取った脂肪はほぼ戻らないが、年齢とともにまたたるむことはある。今日も診察はでき、医師が必要と判断すれば再施術は原則1か月以降", "取った脂肪はほぼ戻らないが、1年ほどでまたたるんでくることが多い。今日診察し、医師が必要と判断すれば保証で今日やり直せる"], "answer": 2, "explain": "脱脂で取った脂肪はほぼ戻らないが、年齢とともにまたたるむことはある。腫れは1〜2週間続くこともあり、10日目の差は経過の途中のことがある。診察はいつでもでき、目元の再施術は原則1か月以降で医師が必要と判断した場合。×1年ほどで：サイトは時期を示していない。×今日やり直せる：目元は原則1か月以降。", "basis": "取った脂肪はほぼ戻らない。ただし年齢とともに、またたるんでくることはある。"}, {"id": "a-c2-02-1", "ch": "kuma", "card": "c2-02", "level": "apply", "q": "目の下のふくらみとみぞの両方が気になる。皮膚のたるみは少なく、顔の表に傷を残したくない。太ももから脂肪を採るのも避けたい。候補になるのは？", "choices": ["裏ハムラ法", "経結膜脱脂＋脂肪注入", "表ハムラ法", "経結膜脱脂だけ"], "answer": 0, "explain": "裏ハムラは裏から入り、前に出た脂肪をそのまま下のみぞへ移すので、表に傷がなく太ももから脂肪を採らずに済む。脱脂＋脂肪注入は太ももの脂肪を使い、表ハムラはまつげの下に傷ができ、脱脂だけではみぞが残る。", "basis": "脂肪注入がいらないことが多い。自分の目の下の脂肪でみぞを埋めるので、太ももなどから脂肪を採らずに済む。"}, {"id": "d-c2-01-1", "ch": "kuma", "card": "c2-02", "level": "dr", "q": "あおなぎで裏ハムラ（¥298,000）を検討中のお客様。「目の下の脂肪は手術でどう扱うのか、表示の料金に何が入っていて、あとで追加がかかるのかを知りたい」と言う。手術の中身と料金の説明がそろって教材に合う案内は？", "choices": ["取り出した脂肪を、注射でみぞへ入れ直す。総額に麻酔代・薬代・抜糸代が入り、再診料もかからない", "前に出た脂肪をみぞへ移し、糸で縫って留める。総額に麻酔代・薬代・抜糸代が入り、再診料もかからない", "前に出た脂肪をみぞへ移し、糸で縫って留める。総額は麻酔代・薬代までで、抜糸代と再診料は別にかかる", "取り出した脂肪を、注射でみぞへ入れ直す。総額は麻酔代・薬代までで、抜糸代と再診料は別にかかる"], "answer": 1, "explain": "裏ハムラは前に出た脂肪を捨てずに下のみぞへ移し、糸で縫って固定する（必要なら一部を減らす）。あおなぎの表示は総額で、麻酔代・薬代・抜糸代・針代を含み、再診料もかからない。×注射で入れ直す：注射で足すのは脂肪注入のやり方。×抜糸代・再診料は別：抜糸代は総額に入り、再診料はかからない。", "basis": "前に出た脂肪を下のみぞへ移して糸で留める。"}, {"id": "d-c2-01-2", "ch": "kuma", "card": "c2-02", "level": "dr", "q": "目の下のふくらみとみぞが深いお客様。「眠る麻酔は使いたくない」「表に傷は残したくない」「顔写真をSNSやWEBに出すのは困る」と言う。デイズ・あおなぎの中から、教材に沿って案内する施術と料金は？", "choices": ["デイズの裏ハムラをモニター価格¥198,000で。撮影に協力すれば、掲載はしなくてよい", "あおなぎの裏ハムラを¥298,000で。局所麻酔込みの総額で、起きたまま受けられる", "デイズの切らないクマ取りを通常価格¥255,000で。ふくらみを取ればみぞも浅くなる", "デイズの裏ハムラを通常価格¥348,000で。掲載が条件のモニター価格¥198,000は使えない"], "answer": 3, "explain": "みぞが深く、表に傷なし・眠らないなら、局所麻酔のデイズ裏ハムラ。モニターは撮影・来院・SNSやWEBへの掲載・アンケートが条件で、掲載できない人は通常価格。×撮影だけ：掲載も条件の1つ。×あおなぎ：静脈麻酔込みで眠る。×切らないクマ取り：脱脂だけではみぞは残る。", "basis": "あおなぎ：眠る麻酔（静脈麻酔）込みの総額。"}, {"id": "d-quiz-2-1", "ch": "kuma", "card": "c2-02", "level": "dr", "q": "「目の下のふくらみとみぞを一度に直したい。表に傷は残したくない。眠って受けたい」というお客様が、裏ハムラの総額をデイズとあおなぎで比べたいという。教材に合う案内は？", "choices": ["デイズ：¥348,000に、笑気麻酔¥8,800を足せば眠って受けられる／あおなぎ：¥298,000で静脈麻酔まで込み", "デイズ：Days式¥498,000を選べば静脈麻酔が料金に含まれる／あおなぎ：¥298,000の総額に静脈麻酔も入る", "デイズ：¥348,000に静脈麻酔¥50,000が別にかかるか院に確認／あおなぎ：¥298,000で静脈麻酔込みの総額", "デイズ：¥348,000で、眠る麻酔を付けられるかは院に確かめる／あおなぎ：¥298,000に静脈麻酔¥50,000を足す"], "answer": 2, "explain": "デイズの裏ハムラは麻酔欄が局所麻酔で、眠るならオプション表の静脈麻酔¥50,000。どの施術に含まれるかは記載がなく院に確認。あおなぎは静脈麻酔込みの総額。×笑気：ぼんやりするが眠らない。×Days式：違いはサイトに記載なし。×あおなぎに¥50,000：麻酔代は総額に含まれる。", "basis": "デイズ：「裏ハムラ」と「Days式 裏ハムラ」の2プラン。麻酔は局所麻酔と書かれている。"}, {"id": "a-c2-03-1", "ch": "kuma", "card": "c2-03", "level": "apply", "q": "表ハムラ法を受ける予定のお客様が、術後の予定を立てたいという。表ハムラ法の案内として教材に合うものは？", "choices": ["表に傷が出ないので、腫れのピークを過ぎれば数日で外出できる", "1週間後に抜糸。腫れ・内出血は2〜3週間ほどで落ち着く", "1週間後に抜糸。腫れのピークは1〜2週間、完成までは1〜3か月", "1週間後に抜糸。入浴は当日から、軽い運動も3日後からできる"], "answer": 1, "explain": "表ハムラはまつげのすぐ下を切るので1週間後に抜糸があり、腫れ・内出血は2〜3週間ほどで落ち着く。Q&Aには短い期間の記載もあるが、教材は長いほう（2〜3週間）で案内するとしている。「表に傷なし・数日で外出」は裏ハムラ。「ピーク1〜2週間・完成1〜3か月」は切開法。表ハムラの入浴は翌日以降、軽い運動は1週間後から。", "basis": "時間もダウンタイムも長め。両目で約120分。1週間後に抜糸があり、腫れは2〜3週間ほどで落ち着く。"}, {"id": "d-c2-02-2", "ch": "kuma", "card": "c2-03", "level": "dr", "q": "下まぶたを指で下に引いて離すと、戻りが遅いお客様。ふくらみとみぞがあり、皮膚の余りはわずか。「表ハムラで皮膚もきっちり取りたい。外反が出たら保証ですぐ直せる？」と聞く。教材に合う説明は？", "choices": ["余りがわずかでも、張りが弱い人は表から切るほうが外反が起きにくい傾向。外反が出ても、危険なら医師が再施術を断ることがある", "余りがわずかなら表から切る利点は小さく、表は外反が起きやすい傾向。目元の再施術は原則半年以降なので、外反が出ても半年は待つ", "余りがわずかでも、張りが弱い人は表から切るほうが外反が起きにくい傾向。目元の再施術は原則半年以降なので、外反が出ても半年は待つ", "余りがわずかなら表から切る利点は小さく、表は外反が起きやすい傾向。外反が出ても、危険なら医師が再施術を断ることがある"], "answer": 3, "explain": "指で引いて戻りが遅いのは下まぶたの張りが弱いサインで、脂肪を下へ移す手術では慎重な判断が要るとされる。皮膚の余りが少なければ表から切る利点は小さく、表から入る方法は外反が起きやすい傾向。保証の対象になる場合でも、危険なら医師は再施術を断ることがある。×外反が起きにくい：逆の傾向。×半年以降：目元は原則1か月以降。", "basis": "皮膚の余りがほとんどない人は、表から切る利点が小さく、裏ハムラで足りることがある。"}, {"id": "d-c2-04-1", "ch": "kuma", "card": "c2-03", "level": "dr", "q": "あおなぎで「裏ハムラ＋脂肪注入（¥458,000）」を検討中のお客様。話を聞くと、みぞに加えて皮膚のたるみも取りたい、保証の長さと手術時間も比べたいという。教材に合う案内は？", "choices": ["デイズの切開法：余った皮膚を切り取り、脂肪もみぞへ移す。あおなぎのセットは所要時間約70分と記載があり、保証期間は院に確認する", "デイズの表ハムラ：脂肪をみぞへ敷き直し、余った皮膚も切り取る。あおなぎのセットは所要時間約70分と記載があり、保証期間は院に確認する", "デイズの表ハムラ：脂肪をみぞへ敷き直し、余った皮膚も切り取る。あおなぎのセットは保証期間・所要時間とも記載がなく、院に確認する", "デイズの切開法：余った皮膚を切り取り、脂肪もみぞへ移す。あおなぎのセットは保証期間・所要時間とも記載がなく、院に確認する"], "answer": 2, "explain": "みぞと皮膚のたるみを一度に直すのはデイズの表ハムラで、あおなぎには掲載がない。あおなぎのクマの4項目は保証期間・所要時間の記載がサイトになく、比べるには院に確認する。×切開法：脂肪をみぞへ移す説明はサイトにない。×約70分：あおなぎの眉下切開の記載。", "basis": "まつげのすぐ下の皮膚を切って入り、脂肪を下のみぞへ敷き直し、余った皮膚も切り取る、目の下の総合手術。"}, {"id": "d-map-2b-1", "ch": "kuma", "card": "c2-03", "level": "dr", "q": "まつげの下を切ることは受け入れている2人。Aさん「みぞが深く、皮膚もたるんでいる。眠って受けられるか知りたい」。Bさん「目袋と皮膚のたるみが主で、みぞは浅い。仕上がるまでの期間を知りたい」。それぞれに合う手術の説明として、教材に合う組み合わせは？", "choices": ["Aさん：麻酔は局所と記載があり、眠るなら静脈麻酔を付けられるか院に確認／Bさん：腫れのピークは1〜2週間で、完成までは1〜3か月", "Aさん：麻酔の種類はサイトに記載がなく、眠れるかどうかは院に確認／Bさん：腫れのピークは2〜3日で、1〜2週間続くこともある", "Aさん：麻酔は局所と記載があり、眠るなら静脈麻酔を付けられるか院に確認／Bさん：腫れのピークは2〜3日で、1〜2週間続くこともある", "Aさん：麻酔の種類はサイトに記載がなく、眠れるかどうかは院に確認／Bさん：腫れのピークは1〜2週間で、完成までは1〜3か月"], "answer": 3, "explain": "みぞも埋めて皮膚も切るAさんは表ハムラで、麻酔の種類はサイトに記載がない。目袋と皮膚が主でみぞは浅いBさんは切開法で、腫れのピーク1〜2週間・完成まで1〜3か月。×局所と記載：裏ハムラの表記。×ピーク2〜3日・1〜2週間続くことも：脱脂の経過。", "basis": "麻酔の種類も記載なし。"}, {"id": "a-c2-04-1", "ch": "kuma", "card": "c2-04", "level": "apply", "q": "目袋が目立つ男性。以前ヒアルロン酸注射と切らないクマ取りを受けたが、しわ・たるみが残っている。みぞはあまり気にならない。合う施術は？", "choices": ["スネコスを月1回続ける", "切開法による目の下のたるみ取り", "経結膜脱脂をもう一度受ける", "裏ハムラ法で脂肪を移す"], "answer": 1, "explain": "切開法は下まつげの下を切り、余った皮膚と目袋のもとの脂肪を切り取る。サイトも「ヒアルロン酸注射や切らないクマ取りを受けても、しわ・たるみが気になる」人を、向いている人に挙げている。スネコスや脱脂では皮膚を減らせず、裏ハムラも皮膚は切り取らない。", "basis": "皮膚そのものを減らせる。切らない方法では取れない皮膚のたるみ・しわ・目袋に対応する。切らないクマ取りやヒアルロン酸注射でも気になる人向け。"}, {"id": "a-c2-05-1", "ch": "kuma", "card": "c2-05", "level": "apply", "q": "上まぶたのたるみで眉下の手術を検討中。眠っているあいだに終わる麻酔で受けたく、麻酔代込みの金額で知りたい。教材に合う案内は？", "choices": ["デイズの眉下リフト：静脈麻酔込みの通常価格", "デイズの眉下リフト：局所麻酔込みの総額表示", "あおなぎの眉下切開：静脈麻酔込みの総額表示", "あおなぎの眉下切開：局所麻酔だけの総額表示"], "answer": 2, "explain": "あおなぎの眉下切開は静脈麻酔（点滴で眠る麻酔）込みの総額で、抜糸・再診なども含まれる。デイズは麻酔が目薬＋笑気＋局所で眠らず、料金は通常／モニターの2本立てで、麻酔などは別のオプション表（基礎編②）。総額表示はあおなぎの見せ方。", "basis": "名前は「眉下切開」。眠る麻酔（静脈麻酔）込みの総額で、6か月保証つき。"}, {"id": "d-c2-05-2", "ch": "kuma", "card": "c2-05", "level": "dr", "q": "あおなぎに通院中のお客様。コンタクトレンズを15年使っていて「黒目にまぶたがかかって目が開きにくい。上まぶたの皮膚もかぶさっている。できればあおなぎで両方直したい。仕事は何日くらい休めばいい？」と言う。教材に合う案内は？", "choices": ["眉下切開の職場復帰は術後3〜5日が目安。開きにくさは眼瞼下垂の手術の領域で、あおなぎには掲載がない", "眉下切開の職場復帰は約1か月後が目安。開きにくさは、あおなぎの眼瞼下垂の手術で続けて直せる", "眉下切開の職場復帰は術後3〜5日が目安。開きにくさは、あおなぎの眼瞼下垂の手術で続けて直せる", "眉下切開の職場復帰は約1か月後が目安。開きにくさは眼瞼下垂の手術の領域で、あおなぎには掲載がない"], "answer": 0, "explain": "皮膚のかぶさりはあおなぎの眉下切開で減らせ、サイトの目安は職場復帰が術後3〜5日。コンタクトの長期使用などで起きる開きにくさは眼瞼下垂で、眉下の手術では筋肉の問題は直らず、眼瞼下垂の手術はあおなぎのサイトに掲載がない。×約1か月後：運動・飲酒の目安。×あおなぎの眼瞼下垂：掲載なし。", "basis": "運動・飲酒は約1か月後、職場復帰は術後3〜5日"}, {"id": "d-cat-2-1", "ch": "kuma", "card": "c2-05", "level": "dr", "q": "「眠って受けたい。保証は1年ほしい。術後3週間で左右差が出たらどうなるか知りたい」というお客様に、デイズの眉下リフトを案内する。説明として教材に合うものは？", "choices": ["眠るには笑気麻酔¥8,800を足す。3週間で左右差が出ても、保証の再施術は術後1か月以降", "Days式眉下リフトなら静脈麻酔が込み。3週間で左右差が出ても、保証の再施術は術後1か月以降", "静脈麻酔¥50,000を付けられるか院に確認。左右差が出たときの保証の再施術は、術後1か月以降から", "静脈麻酔¥50,000が付くかは院に確かめる。左右差が出たときの保証の再施術は、術後半年以降から"], "answer": 2, "explain": "デイズの眉下リフトは麻酔欄が目薬＋笑気＋局所で、眠るならオプション表の静脈麻酔¥50,000（含まれるかは院に確認）。保証は1年、目元の再施術は原則1か月以降。×笑気：ぼんやりするが眠らない。×Days式：中身はサイトに記載なし。×半年以降：目元以外のきまり。", "basis": "デイズ：通常とDays式の2プラン。麻酔は目薬＋笑気＋局所（眠らない）。"}, {"id": "a-c2-06-1", "ch": "kuma", "card": "c2-06", "level": "apply", "q": "スネコスを受けたお客様から翌日「まだ何も変わらない」と連絡があった。教材に合う案内は？", "choices": ["10〜14日後ごろから変わり、約1か月でキメが上がる", "直後にハリが出て、6か月〜1年続く。追加の注射を検討する", "腫れのピークの2〜3日を過ぎれば、ふくらみが出て完成する", "6か月〜1年かけて吸収されたあとで、はじめて効果が出る"], "answer": 0, "explain": "スネコスは材料を渡して肌に繊維を作らせる治療なので効果はゆっくりで、10〜14日後ごろから水分量が増え、約1か月後にキメ・ツヤ・弾力が上がる。直後のハリと6か月〜1年の持続はベビーコラーゲンの特徴。スネコスはふくらませる注射ではなく、効果は吸収を待たず10〜14日後ごろから出はじめる。", "basis": "効果はゆっくり出る。10〜14日後ごろから肌の水分量が増え、約1か月後にキメ・ツヤ・弾力が上がる。"}, {"id": "a-c2-06-2", "ch": "kuma", "card": "c2-06", "level": "apply", "q": "スネコスについて、教材の説明と合わないものは？", "choices": ["固めたヒアルロン酸で、深い凹みを下から押し上げる", "打てる場所は額・眉間・頬などで、上まぶたは除く", "妊娠中・授乳中の人は受けられない", "最初の月は週1回、その後は月1回ほどがすすめられる"], "answer": 0, "explain": "スネコスのヒアルロン酸は固めていない（非架橋）ので形は作らず、肌質を上げる役目。固めのジェルで下から押し上げるのは形を作るヒアルロン酸注射。打てる場所、妊娠中・授乳中は不可、最初の月は週1回という点は教材どおり。", "basis": "スネコスのヒアルロン酸は固めていないので、形は作らず、肌質を上げる役目。"}, {"id": "a-map-2-1", "ch": "kuma", "card": "c2-06", "level": "apply", "q": "青クマ（薄い皮膚から下の筋肉や血管が透ける）が主な悩みのお客様。サイトの説明に沿う施術と理由の組み合わせは？", "choices": ["経結膜脱脂：前に出た脂肪を取り出し、透けて見えるもとを減らすから", "スネコス：ハリと弾力が出て、薄くて下が透ける皮膚に効果が期待できるから", "表ハムラ法：余った皮膚を切り取ることで、透けて見える血管ごと取り除くから", "切開法：余った皮膚を切り取り、薄い皮膚を張って透けを消すから"], "answer": 1, "explain": "青クマは皮膚が薄く下の筋肉や血管が透ける「皮膚の質」の問題で、サイトはスネコスがハリと弾力で青クマに効果が期待できるとする。脱脂・ハムラ・切開は「ふくらみとみぞ（形）」を直す手術で、基本的に黒クマ向け。脱脂は脂肪を取るだけ、表ハムラ・切開法が切り取るのは余った皮膚で、血管を取る手術ではない。", "basis": "ハリと弾力が出ることで、皮膚が薄くて下が透ける「青クマ」と、ハリがなくなってたるむ「影クマ」に効果が期待できる、としている。"}, {"id": "a-c2-07-1", "ch": "kuma", "card": "c2-07", "level": "apply", "q": "クマを目立たなくしたいが、ダウンタイムが取れず、切るのにも抵抗がある。ベビーコラーゲンのページで、サイトがこういう人向けに併用を紹介している組み合わせは？", "choices": ["スネコス × 切らない目の下のクマ取り", "ベビーコラーゲン × スネコス", "ベビーコラーゲン × 切らない目の下のクマ取り", "ヒアルロン酸注射 × スネコス"], "answer": 2, "explain": "ベビーコラーゲンのページでサイトが紹介しているのは「ベビーコラーゲン × 切らない目の下のクマ取り」。切開法のほうが大きく改善できるが、ダウンタイムが取れない・切るのに抵抗がある人はこの併用でクマを目立たなくできる、としている。ベビーコラーゲンのページが紹介している組み合わせはこれ1つで、スネコスやヒアルロン酸注射との併用は教材に記載がない。", "basis": "サイトが紹介しているのは「ベビーコラーゲン × 切らない目の下のクマ取り」。"}, {"id": "d-c2-07-1", "ch": "kuma", "card": "c2-07", "level": "dr", "q": "目元のちりめんジワにハリを出したいお客様。3週間後に撮影があり「受けるのは撮影にできるだけ近い日がいい。でも撮影の日に内出血が残るのは困る」と言う。教材に合う提案は？", "choices": ["撮影の10日前に、ベビーコラーゲンを受ける", "撮影の3日前に、ベビーコラーゲンを受ける", "撮影の10日前に、スネコスを受ける", "撮影の3週間前の今日、ベビーコラーゲンを受ける"], "answer": 3, "explain": "ベビーコラーゲンは直後からハリが出るが、目元は針で内出血が出ることがあり、消えるまで1〜2週間かかる。撮影の日に残さないには2週間より前に受ける必要があり、候補では今日だけが合う。×10日前・3日前：内出血が残るおそれがある。×スネコス：弾力が上がるのは約1か月後。", "basis": "目元は細い血管が多いので、針が当たると内出血が出ることがある。"}, {"id": "a-c2-08-1", "ch": "kuma", "card": "c2-08", "level": "apply", "q": "下がった口角を上げたいが、仕事を休めず、まわりにも知られたくない。サイトの説明に沿った案内は？", "choices": ["口角挙上の外側法：傷は皮膚の表に残るが、効果は半永久", "M字リップ形成：唇の内側を切るが、傷はほぼわからなくなる", "口角挙上の全層法：傷は口の中側にもできるが、打ち直しはいらない", "ヒアルロン酸・ボトックスの注入法：傷は小さいが、効果は半年〜1年"], "answer": 3, "explain": "仕事を休めない・知られたくない人に、サイトは注入法（ヒアルロン酸・ボトックス）をすすめている。傷が小さくダウンタイムも短いが、効果は半年〜1年で続けるには定期的に受ける。外側法・全層法・M字リップの説明はどれも正しいが、手術なのでダウンタイムは1週間程度あり、1週間後に抜糸もある。", "basis": "仕事を休めない、まわりに知られたくない人には、サイトも「注入法」（ヒアルロン酸・ボトックス）をすすめている。"}, {"id": "d-c2-08-1", "ch": "kuma", "card": "c2-08", "level": "dr", "q": "口元の手術を考える2人。Aさん「上唇が厚いので量を減らしたい。形もM字にしたい。手術は何分くらい？」。Bさん「口角を上げつつ、口の横幅も整えたい。術後2週間でジムに戻りたい」。方法は最終的に診察で医師が決めるとして、検討される手術と説明の組み合わせとして教材に合うものは？", "choices": ["Aさん＝口唇縮小：約1時間／Bさん＝口角挙上の全層法：運動は2〜3週間控える", "Aさん＝M字リップ形成：約30分／Bさん＝口角挙上の全層法：運動は2〜3週間控える", "Aさん＝口唇縮小：約1時間／Bさん＝口角挙上の外側法：運動は抜糸の翌日から", "Aさん＝M字リップ形成：約30分／Bさん＝口角挙上の外側法：運動は抜糸の翌日から"], "answer": 0, "explain": "厚い唇の量を減らすのは口唇縮小で、切り取るデザインでM字にもでき、時間は約1時間。口の横幅の調整には全層法が検討され（最終的には診察で医師が判断）、運動は2〜3週間控える。×M字リップ形成：唇の形を作る手術で、厚い唇なら口唇縮小が入口。×外側法：変化を出しやすい方法。×抜糸の翌日：口まわりのメイクの目安。", "basis": "口角の位置や、口の横幅を調整したいときに検討される"}, {"id": "a-c2-09-1", "ch": "kuma", "card": "c2-09", "level": "apply", "q": "唇が一直線で、M字リップを試してみたい。ただ、気に入らなければ元に戻せる方法がいいというお客様。合うのは？", "choices": ["切る方法のM字リップ形成", "口唇縮小で、M字型にデザインする", "口角挙上で、口角の位置を上げる", "ヒアルロン酸注射でM字を作る"], "answer": 3, "explain": "ヒアルロン酸注射でM字を作る方法は、足りない部分にふくらみを足すだけで切らず、溶かして戻せる。切るM字リップ形成は半永久、口唇縮小は元に戻せず、口角挙上も切って留め直す手術で効果は半永久。", "basis": "足りない部分にヒアルロン酸を注射して、上唇がM字に見えるようにふくらみを足す。切らないので気軽で、溶かすこともできる。"}, {"id": "d-c2-09-1", "ch": "kuma", "card": "c2-09", "level": "dr", "q": "「唇は薄め。M字の唇にしたいが、気に入らなければ戻せる方法がいい。あおなぎに通っているので、そちらで受けたい」というお客様。何で作り、料金の目安と持ちはどうか。教材に合うものは？", "choices": ["あおなぎのヒアルロン酸注射（ボルベラなら¥55,000・XC／1cc表記）。半年〜1年ほどで吸収される", "あおなぎのヒアルロン酸注射（ボルベラなら¥49,800・量の表記なし）。切る方法と同じく半永久に残る", "あおなぎのM字リップ形成（切る方法・通常¥330,000）。唇の内側を切り、効果は半永久に残る", "あおなぎのヒアルロン酸注射（ボルベラなら¥49,800・量の表記なし）。半年〜1年ほどで吸収される"], "answer": 3, "explain": "戻せるのは切らないヒアルロン酸（溶かせる）。あおなぎにM字リップ形成はないがヒアルロン酸注射はあり、ボルベラは¥49,800・量の表記なし（使う製剤は院で確認）。持ちは半年〜1
