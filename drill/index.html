い」というお客様。教材に沿った案内は？", "choices": ["ルメッカは調整して日焼け直後も受けられる。脱毛の機械はアレキサンドライトで、日焼け肌はやけどのおそれ", "ルメッカは日焼け直後は受けられない。脱毛の機械はアレキサンドライトで、日焼け肌はやけどのおそれ", "ルメッカは調整して日焼け直後も受けられる。脱毛の機械はダイオードで、多少の日焼け肌にも対応と説明", "ルメッカは日焼け直後は受けられない。脱毛の機械はダイオードで、多少の日焼け肌にも対応と説明"], "answer": 3, "explain": "ルメッカはサイトに、日焼け直後は受けられないとある。デイズの脱毛は808nmのダイオードレーザーで、うぶ毛や多少の日焼け肌にも対応できると説明（当日は医師が肌を診て決める）。×調整して受けられる：日焼け直後は不可。×アレキサンドライト：日焼け肌でやけどのおそれがある別の種類。", "basis": "光に過敏な体質（光過敏症）／日焼け直後。"}, {"id": "d-c6-14-1", "ch": "skin", "card": "c6-01", "level": "dr", "q": "ペースメーカーを付けている新宿院のお客様。「くすみ・毛穴・ハリをまとめて整えたい」。ペースメーカーは医師に申告して最終判断してもらう前提で、記載として教材に合うのは？", "choices": ["インモードのForma：料金表は新宿院。受けられない条件の記載にペースメーカーはない", "ルメッカピーク：料金表は新宿院。受けられない条件の記載にペースメーカーはない", "カスタマイザーIPL：料金表は新宿院。受けられない条件の記載にペースメーカーはない", "ブレッシング：料金表は新宿・銀座・本厚木。受けられない条件の記載にペースメーカーがある"], "answer": 1, "explain": "ルメッカは料金表が新宿院で、受けられない条件（妊娠中・授乳中、炎症、光過敏症、日焼け直後）にペースメーカーはない。×Forma：サイトにペースメーカー不可とある。×ブレッシング：サイトの記載にはなく、＊高周波の機械は一般に不可。×カスタマイザーIPL：料金表は本厚木院。", "basis": "妊娠中・授乳中／皮膚に炎症がある／光に過敏な体質"}, {"id": "d-c6-19-2", "ch": "skin", "card": "c6-01", "level": "dr", "q": "「3か月後の結婚式までに、顔全体のそばかすと赤ら顔、それに頬の肝斑も整えたい。仕事は休めない」というお客様。教材に合う計画は？", "choices": ["そばかすと赤みはルメッカを4週間に1回。肝斑はピコトーニング", "そばかすと赤みはルメッカを2週間に1回。肝斑はピコトーニング", "そばかすと赤みはルメッカを4週間に1回。肝斑はピコスポット", "そばかすと赤みはルメッカを2週間に1回。肝斑はピコスポット"], "answer": 0, "explain": "ルメッカは茶色と赤の両方に反応し、4週間に1回で3〜5回が目安、メイクは当日から。肝斑には弱く広く当てるピコトーニングで、出力をおさえて肝斑が濃くなるリスクをおさえるとされ、当日からメイク可。×2週間に1回：4週間に1回。×ピコスポット：シミ1個ずつを強く当てる方法。", "basis": "光が茶色（メラニン）と赤（血管）の両方に反応するので、顔全体をまとめて整えられる"}, {"id": "a-c6-02-2", "ch": "skin", "card": "c6-02", "level": "apply", "q": "「カスタマイザーIPLは、あおなぎのほうがデイズより安いからあおなぎで受けたい」というお客様。教材の記載に沿った案内は？", "choices": ["当てる範囲が同じかはサイトからわからないので、内容を確認する", "あおなぎは総額表示なので、デイズより必ずお得になると案内する", "あおなぎも背中のメニューがあるので、背中もまとめてすすめる", "ルメッカピークもあおなぎが安いので、そちらもあわせて案内する"], "answer": 0, "explain": "あおなぎのカスタマイザーIPLは1回 ¥9,800 のみ掲載で、デイズの全顔1回（¥14,000）より安いが、当てる範囲が同じかはサイトからわからない。総額表示でも中身が同じとは限らない。あおなぎに背中の掲載はなく、ルメッカピークの1回は2院で同額。", "basis": "当てる範囲が同じかどうかはサイトからはわからない"}, {"id": "d-c6-18-3", "ch": "skin", "card": "c6-02", "level": "dr", "q": "デイズ本厚木院に通うお客様。「背中のくすみに光を当てたい。内側からも飲み薬でケアしたい」。教材に沿った説明は？", "choices": ["背中は料金表が本厚木院のカスタマイザーIPL。内服は毎日続けて実感まで3か月〜半年", "背中は料金表が本厚木院のカスタマイザーIPL。内服は毎日続けて実感まで2〜3か月", "背中は料金表が本厚木院のルメッカの背中上部。内服は毎日続けて実感まで3か月〜半年", "背中は料金表が本厚木院のルメッカの背中上部。内服は毎日続けて実感まで2〜3か月"], "answer": 0, "explain": "カスタマイザーIPLは料金表が本厚木院で、背中のメニューもある（ルメッカの料金表は新宿院）。内服は毎日続けて3か月〜半年で実感しやすくなる。×ルメッカ：料金表は新宿院。×2〜3か月：ドクターズコスメの実感の目安。", "basis": "カスタマイザーIPLは調整の細かさが売りで料金表は本厚木院"}, {"id": "a-c6-03-1", "ch": "skin", "card": "c6-03", "level": "apply", "q": "「頬に左右対称に広がる、境目のぼんやりした茶色いシミが気になる。ニキビ跡も少しある。3日後に人と会うので、かさぶたや1週間続く赤みは困る」。ディスカバリーピコで受けるなら、当て方は？", "choices": ["トーニング", "フラクショナル", "スポット", "ルビーフラクショナル"], "answer": 0, "explain": "頬に左右対称・境目がぼんやりは肝斑の特徴で、肝斑・くすみに向くのはトーニング（ダウンタイムなし、洗顔・メイクは当日から）。フラクショナルはニキビ跡向けだが、赤み・ざらつきが約1週間。スポットはかさぶたが出る。ルビーフラクショナルは向く悩みの説明がない。", "basis": "くすみ、肝斑、炎症のあとの色残り、毛穴の開き"}, {"id": "a-quiz-6-1", "ch": "skin", "card": "c6-03", "level": "apply", "q": "この章の内容として、誤っているものはどれ？", "choices": ["ほくろは細胞のかたまりなので、物として取る", "脱毛のレーザーは、いま育っている毛に効く", "細い血管の赤みはピコスポットの担当", "光（IPL）は顔全体に広く、まとめて当てる"], "answer": 2, "explain": "赤み（細い血管）は光（IPL）の担当で、ピコのページに赤みは書かれていない。ピコスポットは濃いシミ1個を狙って強く当てるもの。光は顔全体に広く当て、ほくろは色を持つ細胞のかたまりなので取りのぞく。脱毛は育っている毛に効くので、何回も通う。", "basis": "赤み（血管）はピコのページには書かれておらず、光の担当。"}, {"id": "d-c6-03-1", "ch": "skin", "card": "c6-03", "level": "dr", "q": "デイズでピコスポットを受けたいお客様。「顔に5mm以内のシミが10個、10mm以内が5個。取り放題とどちらが安い？ 支払いは医療ローンも使える？」。教材に沿った案内は？", "choices": ["1個ずつの合計は取り放題¥108,000を超える。支払いは現金かカードで、医療ローンはない", "1個ずつの合計は取り放題¥108,000を超える。支払いは医療ローンも使えるとサイトにある", "1個ずつの合計は取り放題¥108,000に届かない。支払いは医療ローンも使えるとサイトにある", "1個ずつの合計は取り放題¥108,000に届かない。支払いは現金かカードで、医療ローンはない"], "answer": 2, "explain": "1個ずつは5mm以内¥5,500、10mm以内¥8,800で、10個と5個を足しても取り放題の¥108,000に届かない。デイズの支払いは現金・デビット・クレジットカード・医療ローンとサイトにある。×合計が超える：届かない。×医療ローンはない：使える。", "basis": "スポットは1個単位と顔取り放題 ¥108,000。"}, {"id": "d-c6-10-2", "ch": "skin", "card": "c6-03", "level": "dr", "q": "「ニキビ跡のへこみを針なしで治したい。何回くらい通う？ 回数をまとめた料金はある？」というお客様。キュアジェットとピコフラクショナル ライトの説明として教材に合うのは？", "choices": ["キュアジェットのニキビ跡は3〜6回が目安。デイズのピコフラクショナル ライトは5回コースがある", "キュアジェットのニキビ跡は3回前後が目安。デイズのピコフラクショナル ライトは5回コースがある", "キュアジェットのニキビ跡は3〜6回が目安。デイズのピコフラクショナル ライトは1回の料金だけ", "キュアジェットのニキビ跡は3回前後が目安。デイズのピコフラクショナル ライトは1回の料金だけ"], "answer": 1, "explain": "キュアジェットはニキビ跡なら3回前後が目安（ハリ・ツヤは1回でも）。デイズのピコフラクショナルには3回・5回コースがあり、ライトは5回¥71,250（あおなぎは1回料金のみ）。×3〜6回：サブシジョン・ニードルRFの目安。×1回の料金だけ：8月以降にコースが追加。", "basis": "トーニング・フラクショナルに3回／5回コースあり（8月以降に追加）。"}, {"id": "d-c6-12-2", "ch": "skin", "card": "c6-03", "level": "dr", "q": "「ニキビ跡の凹みを治したい。今日の17時に受けて、明日の朝8時にはメイクして出勤する」というお客様。今日受けるデイズのメニューとして教材に合うものは？", "choices": ["ダーマペン4。ニキビ跡・でこぼこ肌に向き、メイクは翌朝からできる", "ヴェルベットスキン。合わせるピールは直後からメイクできて翌朝に間に合う", "ピコフラクショナル。ニキビ跡の凹みに向き、洗顔もメイクも翌日からできる", "ピコトーニング。ニキビ跡の凹みに向き、洗顔もメイクも当日からできる"], "answer": 2, "explain": "ディスカバリーピコのフラクショナルはニキビ跡（へこみ）向きで、洗顔もメイクも翌日から。トーニングの対象はくすみ・肝斑・毛穴で、凹みは入っていない。ダーマペン4はメイク24時間後からで、翌朝8時には間に合わない。ヴェルベットスキンはダーマペン4にピールを重ねるメニューなので、ピールが直後からメイクOKでも針の制限が残る。", "basis": "洗顔もメイクも翌日から（当日は顔を避けてシャワー）"}, {"id": "d-c6-13-1", "ch": "skin", "card": "c6-03", "level": "dr", "q": "本厚木院のお客様。医師の所見は「鼻まわりに、洗っても取れない茶色い色づきと、毛穴の開きの両方がある」。当日からメイクしたい。教材に合う案内は？", "choices": ["ハイドラジェントル：本厚木院の料金表にあり、熱で開きを引き締め、直後からメイクできる", "ダーマペン4：本厚木院の料金表にあり、針で開きを引き締め、6時間後からメイクできる", "ピコトーニング：本厚木院の料金表にあり、レーザーで色残りと開きに当て、当日からメイクできる", "カスタマイザーIPL：本厚木院の料金表にあり、向く悩みに毛穴の開きがあり、直後からメイクできる"], "answer": 2, "explain": "ピコトーニングは料金表が新宿院・本厚木院で、くすみ・色残り・毛穴の開きに向き、洗顔・メイクは当日から（＊洗っても取れない色づきや開きには光・レーザーなどが合う）。×熱で引き締め：ハイドラジェントルは熱も針も使わない。×6時間後：ダーマペン4のメイクは24時間後から。×毛穴の開き：カスタマイザーIPLの向く悩みにない。", "basis": "くすみ、肝斑、炎症のあとの色残り、毛穴の開き"}, {"id": "a-c6-04-1", "ch": "skin", "card": "c6-04", "level": "apply", "q": "あおなぎで「リジュランiを水光注射で入れたい」と相談された。あおなぎの料金表に合う案内は？", "choices": ["ブレッシングの薬の変更で受けられる", "ハイコックスで受けられる", "ハイコックスにボトックス追加を付ければ受けられる", "Dr.手打ちで受けられる"], "answer": 3, "explain": "あおなぎの水光注射は機械と手打ちの2通りで、リジュランiは手打ちの欄だけ（ハイコックスは「―」）。ボトックス追加はハイコックスの希望時の追加で、薬は変わらない。ブレッシングで替えられる薬にリジュランは無い。なおデイズでは、手打ちの肌育製剤の表にある。", "basis": "リジュランiとジャルプロ プロスーパーハイドロは手打ちだけに載っている。"}, {"id": "d-map-6c-2", "ch": "skin", "card": "c6-04", "level": "dr", "q": "「ジュベルックの水光注射を受けたい。デイズの機械（ハイコックス）と、あおなぎの医師の手打ちで迷っている」と言われた。料金表の読み方として教材に合うのは？", "choices": ["デイズは塗る麻酔のリドカインクリーム¥3,000が必ず加わる。あおなぎのジュベルックは機械も手打ちも同じ料金", "デイズは麻酔代が料金に含まれるかサイトに記載がなく院に確認。あおなぎのジュベルックは機械も手打ちも同じ料金", "デイズは麻酔代が料金に含まれるかサイトに記載がなく院に確認。あおなぎのジュベルックは手打ちのほうが機械より高い", "デイズは塗る麻酔のリドカインクリーム¥3,000が必ず加わる。あおなぎのジュベルックは手打ちのほうが機械より高い"], "answer": 1, "explain": "デイズは麻酔などがオプション表にもあるが、どの施術でどの麻酔代が料金に含まれるかは記載がなく、院に確認する。あおなぎは同じ薬なら機械でも手打ちでも同じ料金（ジュベルックはどちらも¥32,000）。×必ず加わる：記載なし。×手打ちが高い：同額。", "basis": "あおなぎでは、同じ薬なら機械でも手打ちでも同じ料金。"}, {"id": "a-c6-05-1", "ch": "skin", "card": "c6-05", "level": "apply", "q": "「ニキビ跡のへこみと、頬の肝斑の両方を1つの施術でケアしたい。赤みが2〜3日なら仕事に行けるが、皮むけや針のあとが1週間続くのは困る」。デイズで合うのは？", "choices": ["ニードルRF", "モフィウス8バースト", "ピコトーニング", "ダーマペン4"], "answer": 0, "explain": "ニードルRFはニキビ跡のへこみ・肝斑に対応し、赤みは2〜3日（日常生活に支障なし、と記載）。ダーマペン4は皮むけが1週間ほどで、肝斑は向く悩みに挙がっていない。モフィウス8は針のあとが1週間ほど。ピコトーニングは肝斑向けだが、へこみはフラクショナルの担当。", "basis": "ニキビ跡のへこみ／肝斑／毛穴の開き・くすみ"}, {"id": "d-c6-05-1", "ch": "skin", "card": "c6-05", "level": "dr", "q": "デイズ本厚木院に通うお客様。「ニキビ跡と毛穴の開きを、針と熱の施術で整えたい。成分のアレルギーが心配なので、薬は入れたくない」。教材に合うのは？", "choices": ["ブレッシング：本厚木院の料金表にあり、針と熱だけで薬は入れない", "ダーマペン4：本厚木院の料金表にあり、針と熱だけで薬は入れない", "ニードルRF：本厚木院の料金表にあり、針と熱だけで薬は入れない", "モフィウス8バースト：本厚木院の料金表にあり、針と熱だけで薬は入れない"], "answer": 2, "explain": "ニードルRFは針の先から熱を出す施術で薬は入れず、料金表は新宿院・本厚木院。×ブレッシング：基本の薬がトラネキサム酸で、同じ針から薬も入れる。×ダーマペン4：針だけで熱は出ない。×モフィウス8バースト：新宿院限定。", "basis": "1回・3回・5回の料金。新宿院・本厚木院。"}, {"id": "d-c6-11-2", "ch": "skin", "card": "c6-05", "level": "dr", "q": "「ニキビ跡の凹みを治したい。ニードルRFとサブシジョンで迷っている。効果の出方と、施術直後の様子を知りたい」というお客様。教材に合う説明は？", "choices": ["ニードルRFは実感が1〜3か月後に多い。サブシジョン直後の凸凹は通常2〜3日で落ち着く", "ニードルRFは実感が1〜3か月後に多い。サブシジョン直後の凸凹は1〜2か月ほど続く", "ニードルRFは実感が2週間〜1か月ほど。サブシジョン直後の凸凹は通常2〜3日で落ち着く", "ニードルRFは実感が2週間〜1か月ほど。サブシジョン直後の凸凹は1〜2か月ほど続く"], "answer": 0, "explain": "ニードルRFは効果がゆっくりで、実感は1〜3か月後が多い。サブシジョンは直後にかえって凸凹が目立つことがあるが、通常2〜3日で落ち着く。×2週間〜1か月：キュアジェットのハリ・ツヤの時期。×1〜2か月続く：キュアジェットでニキビ跡が変わり始める時期。", "basis": "効果はゆっくり。実感は1〜3か月後が多い。"}, {"id": "a-c6-06-1", "ch": "skin", "card": "c6-06", "level": "apply", "q": "デイズの表で「ブレッシング ¥41,800」と「薬をプルリアルに変更 +¥36,800」を見たお客様が、あおなぎの表で同じ内容を探したい。どの欄を見ればよい？", "choices": ["プルリアルの行の1200shotの欄", "プルリアルの行の400shotの欄", "トラネキサム酸の行の400shotの欄", "トラネキサム酸の行の1200shotの欄"], "answer": 1, "explain": "デイズの基本の「ブレッシング」はショット数の記載がないが、料金はあおなぎの400shotと同額。あおなぎは「薬ごとの総額」で表示するので、プルリアルの行の400shotを見る。1200shotはデイズの「1200ショット」にあたり、トラネキサム酸の行は薬を替えない場合。", "basis": "デイズは「ブレッシング」と「ブレッシング 1200ショット」の2段階で、基本のほうのショット数は書かれていない（料金はあおなぎの400shotと同額）。"}, {"id": "d-c6-16-2", "ch": "skin", "card": "c6-06", "level": "dr", "q": "デイズでジュベルックを顔に入れたいお客様。「ブレッシングと水光注射（ハイコックス）で迷っている。施術の時間はどのくらい？」。教材に合う説明は？", "choices": ["時間はブレッシングも水光注射も、どちらも60分ほど", "時間はブレッシングが顔全体で約90分、水光注射が60分ほど", "時間はブレッシングが顔全体で60分ほど、水光注射が約90分", "時間はブレッシングも水光注射も、どちらも約90分"], "answer": 1, "explain": "ブレッシングは塗る麻酔のあと施術し、顔全体で約90分。水光注射（ハイコックス）は60分ほど。どちらも塗る麻酔を使い、メイクは翌日から。×入れ替え・同じ時間：施術時間は違う。", "basis": "塗る麻酔のあと、肌をきれいにして施術（顔全体で約90分）。"}, {"id": "d-cat-6-2", "ch": "skin", "card": "c6-06", "level": "dr", "q": "デイズ銀座院にしか通えないお客様。「肌の凹凸と毛穴の開きを針＋熱で整えたい。ブレッシングとニードルRFで迷っている」。料金表の院の表記として教材に合うのは？", "choices": ["ブレッシングの料金表には銀座院がある。ニードルRFの料金表は新宿院・本厚木院", "ブレッシングの料金表は新宿院・本厚木院。ニードルRFの料金表には銀座院がある", "ブレッシングの料金表は新宿院・本厚木院。ニードルRFの料金表も新宿院・本厚木院", "ブレッシングの料金表には銀座院がある。ニードルRFの料金表にも銀座院がある"], "answer": 0, "explain": "ブレッシングの料金表は新宿・銀座・本厚木で、銀座院でも受けられる（間隔は4週間ごと）。ニードルRFの料金表は新宿院・本厚木院で、銀座院の表記はない。×ブレッシングが新宿・本厚木だけ：銀座もある。×ニードルRFに銀座院：新宿院・本厚木院。", "basis": "税込／新宿・銀座・本厚木"}, {"id": "a-c6-07-1", "ch": "skin", "card": "c6-07", "level": "apply", "q": "あおなぎに来院したお客様が「針は怖い。でもニキビ跡のへこみの原因をほぐしたい」という。教材に合う案内は？", "choices": ["あおなぎのサブシジョンを案内する", "あおなぎのe-coolを案内する", "あおなぎのキュアジェットを案内する", "デイズ新宿院のキュアジェットを案内する"], "answer": 3, "explain": "針を使わず空気の圧力で、へこみの原因の固まりをほぐすのはキュアジェット。新宿院限定で、あおなぎは取り扱いなしなので、デイズ新宿院を案内する。あおなぎにもあるサブシジョンは針で切り離す治療。e-coolは電気で成分を入れる施術で、固まりをほぐす働きはない。", "basis": "新宿院だけのメニュー。料金は「薬の種類 × 当てる範囲の広さ × 回数」で決まる。"}, {"id": "d-c6-07-1", "ch": "skin", "card": "c6-07", "level": "dr", "q": "新宿院のお客様。「両頬のニキビ跡。キュアジェット（コンタクトモード・ジュベルック）とサブシジョンで迷っている」。デイズでの2つの説明として教材に合うのは？", "choices": ["キュアジェットの両頬は小範囲で1回¥39,600／サブシジョンの2回目は4週間はあける", "キュアジェットの両頬は中範囲で1回¥46,600／サブシジョンの2回目は2週間はあける", "キュアジェットの両頬は小範囲で1回¥39,600／サブシジョンの2回目は2週間はあける", "キュアジェットの両頬は中範囲で1回¥46,600／サブシジョンの2回目は4週間はあける"], "answer": 3, "explain": "キュアジェットの範囲は、両頬が中範囲（片頬は小範囲）で、ジュベルック1回¥46,600。サブシジョンは3〜6回が目安で、2回目以降は4週間以上あける。×小範囲¥39,600：片頬の区分。×2週間：4週間以上。", "basis": "中範囲：額、両こめかみ、両頬、口のまわり、フェイスライン"}, {"id": "d-c6-07-2", "ch": "skin", "card": "c6-07", "level": "dr", "q": "頬に肝斑とニキビ跡のへこみがあり、針は使いたくないお客様。「へこみはキュアジェット、肝斑はピコトーニングで考えている」。施術した日の夜に人と会う。教材に合う案内は？", "choices": ["キュアジェットのリスクに肝斑の悪化はなく、そのまま候補。ピコトーニングは洗顔・メイクとも翌日から", "キュアジェットのリスクに肝斑の悪化はなく、そのまま候補。ピコトーニングは洗顔・メイクとも当日から", "キュアジェットはリスクに肝斑の悪化があり医師に相談。ピコトーニングは洗顔・メイクとも翌日から", "キュアジェットはリスクに肝斑の悪化があり医師に相談。ピコトーニングは洗顔・メイクとも当日から"], "answer": 3, "explain": "キュアジェットはリスクに肝斑の悪化（まれ）が挙がり、肝斑がある人は医師に相談。ピコトーニングは肝斑にも使え、ダウンタイムなしで洗顔・メイクは当日から。×悪化はない：挙がっている。×翌日から：スポット・フラクショナルの扱い。", "basis": "色素沈着（色が残る）・肝斑の悪化：まれ"}, {"id": "a-c6-08-1", "ch": "skin", "card": "c6-08", "level": "apply", "q": "「あご下の脂肪をすっきりさせたい。針は使いたくないし、施術直後から洗顔・メイクもしたい」。合うのは？", "choices": ["インモードのForma", "インモードのMiniFx", "モフィウス8バースト", "ダーマペン4"], "answer": 1, "explain": "MiniFxは針を使わず、肌を吸い上げて脂肪の層を温める先端で、直後から洗顔・メイクができる。この章では、あご下の脂肪はMiniFx、Formaは小ジワ・ハリの担当と書き分けている（基礎編②の表は高周波をまとめて書いている）。モフィウス8は針を刺し、メイクは24時間後から。ダーマペン4は熱を使わない針の施術。", "basis": "深さで役割が違う。MiniFx＝脂肪の層（あご下・フェイスラインをすっきり）、Forma＝表面〜ハリの層（小ジワ・ハリ）。"}, {"id": "a-map-6b-1", "ch": "skin", "card": "c6-08", "level": "apply", "q": "「針は大丈夫で、針のあとが出てもいい。表面は傷めずに、脂肪の層までより深く強く熱を届けて、フェイスラインを締めたい」。いちばん合うのは？", "choices": ["インモードのMiniFx", "ダーマペン4", "モフィウス8バースト", "ニードルRF"], "answer": 2, "explain": "脂肪の層まで熱が届くのはモフィウス8とMiniFx。そのうち針を刺して中から熱を出し、より深く強く届くのはモフィウス8（麻酔が必要で針のあとも出る）。MiniFxは外から当てる先端。ニードルRFはハリの層まで、ダーマペン4は熱を出さない針だけの施術。", "basis": "インモードリフトは「外から」当てる。モフィウス8バーストは針を刺して「中から」熱を出すので、より深く強く届くが、麻酔が必要で針のあとも出る。"}, {"id": "a-map-6b-3", "ch": "skin", "card": "c6-08", "level": "apply", "q": "インモードのMiniFxは、針を使わず肌の外から当てるのに、脂肪の層の脂肪細胞まで熱を届けられる。その理由として教材の説明に合うのは？", "choices": ["肌の表面を約43℃まで均一に温め続けるから", "肌を吸い上げながら高周波を当てるから", "24本の針を刺し、針の先から熱を出すから", "針の先端だけに電気を流し、表面を守るから"], "answer": 1, "explain": "MiniFxは肌を吸い上げながら高周波を当て、脂肪の細胞に熱でダメージを与えて量を減らす。約43℃で均一に温めるのはForma（ハリの層のコラーゲンを縮める）。24本の針はモフィウス8、先端だけに電気が流れる針はニードルRFの説明で、どちらも針で中から熱を出す方式。", "basis": "肌を吸い上げながら高周波を当て、脂肪の細胞に熱でダメージを与えて脂肪の量を減らし"}, {"id": "d-c6-08-1", "ch": "skin", "card": "c6-08", "level": "dr", "q": "新宿院のお客様。「あご下と首すじを熱で引き締めたい。インモードリフティングとモフィウス8バーストで、首の扱いを知りたい」。料金表の記載に合うのは？", "choices": ["インモードリフティングの首すじはFormaのみ。モフィウス8バーストの首追加は¥10,900", "インモードリフティングの首すじはMiniFxのみ。モフィウス8バーストの首追加は¥10,900", "インモードリフティングの首すじはFormaのみ。モフィウス8バーストの首追加は¥11,800", "インモードリフティングの首すじはMiniFxのみ。モフィウス8バーストの首追加は¥11,800"], "answer": 0, "explain": "インモードリフティングは頬＋あご下＋首すじで、首すじはFormaのみ（MiniFxは頬＋あご下）。モフィウス8バーストは目から下＋あご下が基本で、首追加は¥10,900。×MiniFxのみ：首すじはForma。×¥11,800：ブレッシングの首追加。", "basis": "頬＋あご下＋首すじ（首すじはFormaのみ）"}, {"id": "d-c6-08-3", "ch": "skin", "card": "c6-08", "level": "dr", "q": "新宿院のお客様。「顔全体のシミと赤ら顔、口の横からあごの線にかけてのもたつきを、まとめて整えたい。施術した日の夜にメイクして出かける」。合うのは？", "choices": ["Forma＋ルメッカ＋モフィウス8バーストのセット¥92,000。どれもメイクは当日から", "ルメッカピーク（全顔）＋MiniFx。どちらもメイクは当日から", "ルメッカピーク（全顔）＋ニードルRF（脂肪の層まで届く）。メイクは当日から", "ルメッカピーク（全顔）＋ブレッシング。どちらもメイクは当日から"], "answer": 1, "explain": "口の横からあごの線のもたつきは浅い脂肪（ジョールファット）。脂肪の層を外から温めるMiniFxと、シミ・赤みに反応するルメッカは、どちらもメイク当日から。×セット：モフィウス8のメイクは24時間後から。×ニードルRF：ハリの層が中心。×ブレッシング：メイクは当日ではなく翌日から。脂肪の層に届く記載もない。", "basis": "MiniFx＝脂肪の層（あご下・フェイスラインをすっきり）"}, {"id": "d-c6-09-1", "ch": "skin", "card": "c6-08", "level": "dr", "q": "新宿院のお客様。「あご下の脂肪を熱で減らしたい。施術の日の夜はメイクして会食に出る。3回をできるだけ早く終えたい」。合う機械と、3回目の時期の説明として教材に合うものは？", "choices": ["MiniFx。2〜4週間に1回なので、3回目は最短で初回の4週間後", "MiniFx。4〜8週間おきなので、3回目は最短で初回の8週間後", "モフィウス8バースト。2〜4週間に1回なので、3回目は最短で初回の4週間後", "モフィウス8バースト。4〜8週間おきなので、3回目は最短で初回の8週間後"], "answer": 0, "explain": "どちらも新宿院で、あご下の脂肪の層を温める。モフィウス8バーストは針で中から温めるため、メイクは24時間後からで当日の夜に間に合わない。MiniFxは針を使わず、施術直後から洗顔・メイクができる。間隔はMiniFxが2〜4週間に1回（3〜6回が目安）、モフィウス8バーストは4〜8週間おきに3回。", "basis": "施術直後から洗顔・メイクができる"}, {"id": "a-c6-09-1", "ch": "skin", "card": "c6-09", "level": "apply", "q": "モフィウス8バーストを受けた日の夜、「メイクを落として普通に洗顔してもいい？」と聞かれた。教材に合う答えは？", "choices": ["当日は洗顔も控え、顔のシャワーは24時間後から", "6時間は洗顔も控えて、メイクは24時間後から", "洗顔とシャワーは12時間後から、メイクは翌日が推奨", "直後から洗顔もメイクもでき、シャワーも当日から"], "answer": 0, "explain": "モフィウス8は針で中から温めるため、当日はメイク・洗顔・入浴を控え、メイクと顔のシャワーは24時間後から。直後からOKは針を使わないインモードリフト、12時間後・メイク翌日推奨はキュアジェット、6時間控えるのはダーマペン4の説明。", "basis": "当日はメイク・洗顔・入浴を控える。メイクと顔のシャワーは24時間後から。"}, {"id": "a-c6-10-1", "ch": "skin", "card": "c6-10", "level": "apply", "q": "「ニキビ跡と毛穴をなんとかしたい。針は平気。ただ予算はおさえて、長く続けたい」。まず候補になるのは？", "choices": ["ニードルRF", "サブシジョン", "モフィウス8バースト", "ダーマペン4"], "answer": 3, "explain": "針3つの並びで、ダーマペン4は熱を使わないぶん引き締めの働きはないが、手ごろで続けやすい（1回 ¥15,000）。ニードルRFは ¥39,800、モフィウス8は ¥55,000。サブシジョンは面積ごとの料金で、局所麻酔をして筋を切る治療。", "basis": "熱を使わないぶん引き締めの働きはないが、手ごろで続けやすい。"}, {"id": "a-c6-10-2", "ch": "skin", "card": "c6-10", "level": "apply", "q": "ヴェルベットスキンの説明として、誤っているものはどれ？", "choices": ["TCAがハリの層を刺激して、コラーゲンを作らせる", "針であけた穴に薬を塗るので、成分が奥まで届く", "コウジ酸（5％配合）がくすみに働く", "ダーマペン4とミラノリピールを同じ日に行う"], "answer": 3, "explain": "ヴェルベットスキンはダーマペン4とマッサージピール（コラーゲンピール）を同じ日に行うメニューで、ミラノリピールではない。針の穴が成分の通り道になり、刺激少なめのピールの成分（TCA・コウジ酸）が奥まで届く。料金表のセットは皮むけの強いミラノリピールではない。他の3つはサイトの説明どおり。", "basis": "ダーマペン4と「マッサージピール（コラーゲンピール）」を同じ日に行うメニュー。"}, {"id": "a-c6-11-1", "ch": "skin", "card": "c6-11", "level": "apply", "q": "「注射の麻酔が苦手。サブシジョンは2院とも同じ金額と聞いたので、麻酔の書き方で院を選びたい」。2院の記載に合う説明は？", "choices": ["デイズは表面麻酔、あおなぎは局所麻酔込みと表記", "2院とも局所麻酔で、麻酔代は料金に込みと表記", "デイズは局所麻酔、あおなぎは表面麻酔込みと表記", "2院とも麻酔なしで、針を使わない治療と表記"], "answer": 2, "explain": "サブシジョンは4サイズとも2院で同額。デイズのページは局所麻酔（注射の麻酔）、あおなぎは料金表に「表面麻酔込み」（塗る麻酔）と書き方が違う。2つ目はその逆。デイズの麻酔代の扱いはサイトに記載がない。針（カニューレ）で筋を切る治療なので、麻酔なしは誤り。", "basis": "麻酔の書き方が違う：デイズは「局所麻酔」、あおなぎは料金表に「表面麻酔込み」（表面麻酔）。"}, {"id": "d-c6-07-3", "ch": "skin", "card": "c6-11", "level": "dr", "q": "「左頬にローリング型の凹みが3cm四方。サブシジョンを受けたい。デイズで回数をまとめて安くできるか、あおなぎで受けると施術代のほかに費用がかかるかを知りたい」。教材に合う案内は？", "choices": ["デイズには3回コースがあり、1回分が安くなる。あおなぎは再診料が別にかかる", "デイズは通常価格のみで、回数のコースはない。あおなぎは再診料が別にかかる", "デイズには3回コースがあり、1回分が安くなる。あおなぎは初診料・再診料もない", "デイズは通常価格のみで、回数のコースはない。あおなぎは初診料・再診料もない"], "answer": 3, "explain": "サブシジョンのデイズの料金表は通常価格のみで、3cm×3cmは¥46,800（両院同額、回数の目安は3〜6回）。あおなぎは麻酔代も含む総額で、初診料・再診料・診察料もない。×3回コース：デイズは通常価格のみ。×再診料が別：再診料は期限なく無料。", "basis": "あおなぎは麻酔代が料金に含まれる。"}, {"id": "d-c6-11-3", "ch": "skin", "card": "c6-11", "level": "dr", "q": "デイズにもあおなぎにも通えるお客様。「ローリング型のニキビ跡。注射の麻酔は苦手。あおなぎのサブシジョンと、新宿院のキュアジェットの麻酔の扱いを知りたい」。教材に合う案内は？", "choices": ["あおなぎのサブシジョンは麻酔代が別にかかる。キュアジェットは麻酔の記載がない", "あおなぎのサブシジョンは麻酔代が別にかかる。キュアジェットは塗る麻酔を使う", "あおなぎのサブシジョンは麻酔代が料金に含まれる。キュアジェットは麻酔の記載がない", "あおなぎのサブシジョンは麻酔代が料金に含まれる。キュアジェットは塗る麻酔を使う"], "answer": 3, "explain": "あおなぎのサブシジョンは料金表に「表面麻酔込み」とあり、麻酔代が料金に含まれる（デイズは局所麻酔＝注射）。キュアジェットは針を使わない施術だが、麻酔は塗る麻酔（表面麻酔クリーム）を使う。×別にかかる：総額表示。×記載がない：それはe-cool。", "basis": "あおなぎは麻酔代が料金に含まれる。"}, {"id": "a-c6-12-1", "ch": "skin", "card": "c6-12", "level": "apply", "q": "出産後、おなかの妊娠線が気になるお客様。切らずに、肌の施術で改善したいという。この章で合うのは？", "choices": ["ピーリング（コラーゲンピール等）", "白玉点滴（全身のくすみ）", "ハイドラジェントル（毛穴そうじ）", "カスタマイザーIPL（背中）"], "answer": 0, "explain": "ピーリングは顔だけでなく、体の妊娠線・肉割れにも使うとされる。ハイドラジェントルは毛穴のつまりを取る施術、白玉点滴は全身のくすみ・シミ予防が目的、カスタマイザーIPLの背中は光でシミ・赤みなどをケアするもの。", "basis": "くり返して育てる施術。2〜4週間に1回のペースで続ける。顔だけでなく、体の妊娠線・肉割れにも使う。"}, {"id": "a-c6-12-2", "ch": "skin", "card": "c6-12", "level": "apply", "q": "ピーリングの薬の中身について、誤っているものはどれ？", "choices": ["ミラノリピールはTCAを含む計5種類の酸を配合", "コラーゲンピールは酸が濃く、皮むけが起きやすい", "コウジ酸はコラーゲンピールに入る美白成分", "TCAは真皮の深い所で線維芽細胞を刺激する"], "answer": 1, "explain": "皮むけが起きやすいのは、酸が少し濃いミラノリピール。コラーゲンピールは刺激が少なめ。TCAは真皮で線維芽細胞を刺激し、コウジ酸はコラーゲンピールの美白成分、ミラノリピールはTCAとラクトビオン酸など計5種類の酸を配合。", "basis": "コラーゲンピールは刺激が少なめ。ミラノリピールは酸が少し濃く、皮むけが起きやすい代わりに肌の入れ替わりを強く促す。"}, {"id": "a-c6-13-1", "ch": "skin", "card": "c6-13", "level": "apply", "q": "「鼻の黒ずみ（角栓）が気になる。痛いのとダウンタイムは避けたい」。デイズで合う組み合わせは？", "choices": ["ミラノリピール＋ダーマペン4", "ニードルRF＋ジュベルック", "ルメッカピーク＋内服", "ハイドラジェントル＋ポアレス"], "answer": 3, "explain": "ポアレスは鼻の角栓を先に薬でやわらかくしておくハイドラジェントルの追加メニューで、痛み・ダウンタイムはほぼない。ルメッカと内服は色の悩み向け、ニードルRFは毛穴の「開き」やニキビ跡に針で働く。ダーマペン4も針で赤みが出る。", "basis": "鼻の毛穴につまった角栓を、先に薬でやわらかくして浮かせておく追加メニュー。"}, {"id": "a-c6-13-2", "ch": "skin", "card": "c6-13", "level": "apply", "q": "デイズでハイドラジェントル（1回）を受けてきたお客様が、引っ越しであおなぎに通いたいという。あおなぎの料金表について教材に合う案内は？", "choices": ["1回・3回・5回が載っていて、デイズの通常価格と同額", "1回の料金だけが載っていて、デイズの通常1回より安い", "ポアレスの追加も載っていて、総額で表示されている", "1回の料金だけが載っていて、デイズの通常1回と同額"], "answer": 1, "explain": "あおなぎのハイドラジェントルは1回 ¥9,800 のみ掲載で、デイズの通常1回 ¥16,800 より安い。回数コースやポアレスは載っていない。同じ肌の施術でも、ルメッカやe-coolのように2院で同額のものと、ハイドラジェントルやカスタマイザーIPLのように違うものがある。", "basis": "1回の料金のみ掲載。回数コースやポアレスの掲載なし"}, {"id": "a-c6-14-1", "ch": "skin", "card": "c6-14", "level": "apply", "q": "ピコフラクショナルのあと、赤み・ほてりを早く落ち着かせるケアを足したい。そのための機能がサイトに書かれているのは？", "choices": ["ハイドラジェントル", "ルメッカピーク", "e-cool", "コラーゲンピール"], "answer": 2, "explain": "e-coolには−5〜−10℃で冷やす機能があり、フラクショナルレーザーなどの後の赤み・ほてりを落ち着かせるとサイトに記載。ハイドラジェントルは痛み・ダウンタイムがほぼない毛穴そうじ、コラーゲンピールは刺激少なめの酸の施術で、冷やす機能の記載はない。ルメッカの「冷やしながら」は照射中の痛みの話。", "basis": "冷やす機能がある。−5〜−10℃で冷やしながら入れられるので、レーザーなどの後の赤み・ほてりを落ち着かせるケアにも使う。"}, {"id": "a-map-6b-2", "ch": "skin", "card": "c6-14", "level": "apply", "q": "「電気」を使う機械の説明として、誤っているものはどれ？", "choices": ["インモードは針なしで高周波の熱を外から当てる", "e-coolの電気は肌の中に熱を起こして引き締める", "ニードルRFは針の先から高周波の熱を出す", "RFは電気の力で肌の中に熱を起こすもの"], "answer": 1, "explain": "同じ電気でも、e-coolの電気は成分の通り道を開けるためのもので、熱で引き締める機械ではない。RF（高周波）は電気で肌の中に熱を起こすもので、インモードは外から、ニードルRFは針の先から、その熱を届ける。", "basis": "e-coolの電気は、成分の通り道を開けるためのもの"}, {"id": "d-c6-04-2", "ch": "skin", "card": "c6-14", "level": "dr", "q": "乾燥とくすみが気になるデイズのお客様。「当日からメイクできる施術を続けたい。e-coolとハイドラジェントルは、どのくらいの間隔で通えばいい？」。教材に合う案内は？", "choices": ["e-coolは1か月に1回。ハイドラジェントルは最初の2〜3回を2週間おき、その後は月1回", "e-coolは2週間に1回。ハイドラジェントルは最初の5回を2週間おき、その後は月1回", "e-coolは2週間に1回。ハイドラジェントルは最初の2〜3回を2週間おき、その後は月1回", "e-coolは1か月に1回。ハイドラジェントルは最初の5回を2週間おき、その後は月1回"], "answer": 2, "explain": "e-coolは効果をすぐ感じられるが続くのは2週間ほどで、2週間に1回が目安。ハイドラジェントルは最初の2〜3回だけ2週間おきで、その後は月1回（回数の目安は5回程度）。×1か月に1回：ダーマペン4の間隔。×最初の5回：5回は回数の目安。", "basis": "続くのは2週間ほど。2週間に1回が目安。"}, {"id": "d-map-6c-1", "ch": "skin", "card": "c6-14", "level": "dr", "q": "ペースメーカーを付けているデイズのお客様。「針を使わずに美容成分を肌に入れたい。ハリ・ツヤの変化はいつごろ出る？」。e-coolとキュアジェットの案内として教材に合うのは？", "choices": ["e-coolはペースメーカーの人は受けられないとサイトにある。キュアジェットのハリ・ツヤは1〜3か月後から", "e-coolの受けられない条件にペースメーカーは書かれていない。キュアジェットのハリ・ツヤは2週間〜1か月ほどで", "e-coolはペースメーカーの人は受けられないとサイトにある。キュアジェットのハリ・ツヤは2週間〜1か月ほどで", "e-coolの受けられない条件にペースメーカーは書かれていない。キュアジェットのハリ・ツヤは1〜3か月後から"], "answer": 2, "explain": "e-coolの受けられない条件は、妊娠中・ペースメーカー・施術する所の感染で、ペースメーカーの人は受けられない。キュアジェットのハリ・ツヤの変化は2週間〜1か月ほど（ニキビ跡は1〜2か月ほど）。×書かれていない：載っている。×1〜3か月後：ニードルRFの実感の時期。", "basis": "ペースメーカーを付けている／施術する所に細菌感染やヘルペスなどがある"}, {"id": "a-c6-15-1", "ch": "skin", "card": "c6-15", "level": "apply", "q": "「頬の、大きめで盛り上がり、根が深いほくろを取りたい。できるだけ再発しにくい方法がいい。抜糸の通院はかまわない」。デイズで合う方法は？", "choices": ["ピコスポット", "切開法", "ピコフラクショナル", "くりぬき法"], "answer": 1, "explain": "大きい・盛り上がっている・根が深いほくろは、まわりの組織ごと切り取って縫う切開法で、再発が少ない（1週間後に抜糸）。くりぬき法は小さめ向けで、縫わずに治す方法。ピコのスポット・フラクショナルはシミの色や肌質への当て方で、ほくろは光で砕かず物として取る。", "basis": "取り方は大きさと深さで決まる。小さめは電気メスで丸くくり抜く。大きい・盛り上がっている・根が深いものは切って縫う。"}, {"id": "d-c6-15-1", "ch": "skin", "card": "c6-15", "level": "dr", "q": "「直径7mm、ふちがギザギザで、最近大きくなってきたほくろと、その近くの5mm以内の濃いシミ1個を取りたい」というデイズのお客様。教材に沿った案内は？", "choices": ["ほくろは診察のうえ、くりぬき法で取れば検査に出せるとされる（＊）。シミはピコスポット1個¥8,800", "ほくろは診察のうえ、切開法で取れば検査に出せるとされる（＊）。シミはピコスポット1個¥8,800", "ほくろは診察のうえ、くりぬき法で取れば検査に出せるとされる（＊）。シミはピコスポット1個¥5,500", "ほくろは診察のうえ、切開法で取れば検査に出せるとされる（＊）。シミはピコスポット1個¥5,500"], "answer": 3, "explain": "＊ふちがギザギザ・直径6mm以上・大きくなってきたは悪性を疑う目安。電気メスやレーザーで焼いて取ると検査用の組織が残らず、疑わしいものは切り取って検査に出すのが基本とされる。シミ1個はピコスポットで、5mm以内は¥5,500。×くりぬき法：電気メスで焼く。×¥8,800：10mm以内。", "basis": "疑わしいものは、切り取って検査に出すのが基本とされる"}, {"id": "a-c6-16-1", "ch": "skin", "card": "c6-16", "level": "apply", "q": "手術・ニキビ・シミの相談が続いた日。内服の案内として、教材の記載どおりにできるのはどれ？", "choices": ["4週間に手術が2回ある人に、最後の手術のあとでシンエック", "妊活中の人に、重いニキビ用としてイソトレチノイン", "キクのアレルギーがある人に、手術の前からシンエック", "授乳中の人に、シミ用として美肌内服のセット"], "answer": 0, "explain": "シンエックは、4週間のうちに手術を複数受ける場合は最後の手術のあとに飲むとサイトに記載。キクのアレルギーがある人は飲めない。イソトレチノインは妊活中も不可。美容内服はぜんぶ、妊娠中・授乳中には処方しない。", "basis": "4週間のうちに手術を複数受ける場合は、最後の手術のあとに飲む。"}, {"id": "d-c6-16-1", "ch": "skin", "card": "c6-16", "level": "dr", "q": "妊活中（妊娠・授乳はしていない）のお客様。「ニキビは飲み薬で、肌の明るさは家で塗る物でケアしたい」。教材に沿った案内は？", "choices": ["ニキビ内服のビタミン3種も妊活中は処方しない。ミラミンはハイドロキノン配合で明るい肌の印象へ", "妊活中も不可と書かれているのはイソトレチノインだけ。ミラミンはビタミンC配合で明るい肌の印象へ", "妊活中も不可と書かれているのはイソトレチノインだけ。ミラミンはハイドロキノン配合で明るい肌の印象へ", "ニキビ内服のビタミン3種も妊活中は処方しない。ミラミンはビタミンC配合で明るい肌の印象へ"], "answer": 2, "explain": "内服は妊娠中・授乳中は処方しないが、妊活中も不可と書かれているのはイソトレチノインだけ（ニキビ内服はシナール・ピドキサール・リボフラビン）。ミラミンはハイドロキノン配合で「明るい肌の印象へ」。＊化粧品の扱いなので、薬のように効くと受け取られる説明はしない。×ビタミン配合：シーセラムなど。", "basis": "妊娠中・授乳中（美容内服ぜんぶ）。イソトレチノインは妊活中も不可。"}, {"id": "d-c6-18-1", "ch": "skin", "card": "c6-16", "level": "dr", "q": "「白玉点滴を受けたい。ピルを飲んでいる。点滴の日に気をつけることと、内側から飲む薬の注意も知りたい」というお客様。教材に沿った案内は？", "choices": ["白玉点滴の当日は点滴の前に食事を抜いて来院する。ピルを飲んでいる人が必ず申告するのはシナール（＊）", "白玉点滴の当日は点滴の前に食事を抜いて来院する。ピルを飲んでいる人が必ず申告するのはトラネキサム酸（＊）", "白玉点滴の当日は食事制限なしで、多量の飲酒は控える。ピルを飲んでいる人が必ず申告するのはシナール（＊）", "白玉点滴の当日は食事制限なしで、多量の飲酒は控える。ピルを飲んでいる人が必ず申告するのはトラネキサム酸（＊）"], "answer": 3, "explain": "白玉点滴は食事制限なしで、多量の飲酒・長風呂・激しい運動は控える。＊トラネキサム酸はもともと出血を止める薬で、ピルを飲んでいる人や血栓ができたことがある人は必ず医師に申告する。×食事を抜く：眠る麻酔の準備。×シナール：申告の記載はトラネキサム酸。", "basis": "ピルを飲んでいる人は、必ず医師に申告する必要がある"}, {"id": "d-c6-17-1", "ch": "skin", "card": "c6-17", "level": "dr", "q": "授乳中のお客様。「くすみが気になるので、ピコトーニングと、家で塗るゼオスキンを組み合わせたい」と言う。教材に沿った案内は？", "choices": ["ピコは授乳中だと受けられない可能性がある。塗る物はハイドロキノン配合のミラミンとスキンブライセラム0.25を避ける", "ピコは授乳中でも問題なく受けられる。塗る物はレチノール配合のRCクリームとスキンブライセラム0.25を避ける", "ピコは授乳中でも問題なく受けられる。塗る物はビタミンC配合のシーセラムとRCクリームを避ける", "ピコは授乳中だと受けられない可能性がある。塗る物はレチノール配合のRCクリームとスキンブライセラム0.25を避ける"], "answer": 3, "explain": "ピコのページは授乳中を「受けられない可能性がある」に挙げている。ゼオスキンのRCクリームとスキンブライセラム0.25はレチノール配合で、レチノールは妊娠中・授乳中は避けるのが通例（＊一般知識）。ミラミン（ハイドロキノン）とシーセラムには、レチノールの記載がない。", "basis": "使い始めに赤み・皮むけ・ひりつきが出やすい。妊娠中・授乳中は避けるのが通例"}, {"id": "d-c6-17-2", "ch": "skin", "card": "c6-17", "level": "dr", "q": "「家でも続けたい。ドクターズコスメと内服は、市販品とどう違う？ どのくらいで実感できる？」と聞かれた。教材に沿った説明は？", "choices": ["コスメは市販品より成分が濃く効果も強いとサイトにある。内服は実感まで2〜3か月", "コスメは効果は市販品と大きな差はないとサイトにある。内服は実感まで2〜3か月", "コスメは効果は市販品と大きな差はないとサイトにある。内服は実感まで3か月〜半年", "コスメは市販品より成分が濃く効果も強いとサイトにある。内服は実感まで3か月〜半年"], "answer": 2, "explain": "ドクターズコスメは、効果は市販品と大きな差はなく、成分や品質の安全面・信頼度で優れるとサイト自身が説明し、実感は2〜3か月が目安。内服は医療用の薬で、毎日続けて3か月〜半年で実感しやすい。×成分が濃い：市販のサプリより濃いのは内服の説明。×2〜3か月：コスメの目安。", "basis": "効果は市販品と大きな差はない"}, {"id": "a-c6-18-1", "ch": "skin", "card": "c6-18", "level": "apply", "q": "「お酒をよく飲む。顔だけでなく体や白目のくすみも気になる。家で毎日薬を飲むのは続かない」。合うのは？", "choices": ["e-cool", "ルメッカピーク", "白玉点滴", "美肌内服"], "answer": 2, "explain": "白玉点滴はグルタチオンを血管に入れて全身に届け、白目のくすみにも期待でき、肝臓の働きも助けるのでお酒を飲む人にもすすめている。美肌内服は家で毎日飲む。ルメッカとe-coolは顔などに外から当てる施術。", "basis": "顔だけでなく全身に届く。体や白目のくすみにも期待できる、とサイトは説明。肝臓の働きも助けるので、お酒やタバコをたしなむ人にもすすめている。"}, {"id": "d-c6-18-2", "ch": "skin", "card": "c6-18", "level": "dr", "q": "「白玉点滴もイソトレチノインも、国が認めた薬だから安心ですよね」と言われた。教材に沿った説明は？", "choices": ["グルタチオンの注射薬は日本で承認されたものがない（＊）。イソトレチノインは未承認で、医師の責任で処方（＊）", "グルタチオンの注射薬は承認されているが、効能に美白はない（＊）。イソトレチノインは未承認なのでデイズでは出せない（＊）", "グルタチオンの注射薬は承認されているが、効能に美白はない（＊）。イソトレチノインは未承認で、医師の責任で処方（＊）", "グルタチオンの注射薬は日本で承認されたものがない（＊）。イソトレチノインは未承認なのでデイズでは出せない（＊）"], "answer": 2, "explain": "＊日本で承認されているグルタチオン注射薬の効能に美白は含まれず、白玉点滴は承認の範囲の外の自由診療。＊イソトレチノインは日本で未承認だが、医師の責任で処方される（デイズの料金表に1錠¥540）。×承認されたものがない：承認薬はある。×デイズでは出せない：料金表にある。", "basis": "日本で承認されているグルタチオン注射薬の効能は、薬物中毒・慢性の肝臓病・湿疹やじんましんなどで"}, {"id": "d-c6-03-2", "ch": "skin", "card": "c6-19", "level": "dr", "q": "「腕の肘下に40㎠のタトゥーがある。タトゥーは消したい。肘下の脱毛もしたい」というお客様。デイズの料金表で教材に合う案内は？", "choices": ["肘下の脱毛はSパーツで1回¥12,500。タトゥー除去は40㎠なら1回¥65,780", "肘下の脱毛はLパーツで1回¥15,000。タトゥー除去は40㎠なら1回¥65,780", "肘下の脱毛はLパーツで1回¥15,000。タトゥー除去は40㎠なら1回¥76,780", "肘下の脱毛はSパーツで1回¥12,500。タトゥー除去は40㎠なら1回¥76,780"], "answer": 1, "explain": "肘下はLパーツで1回¥15,000。タトゥー除去は面積で決まり、40㎠は30〜50㎠未満の¥65,780で、数回の治療が必要。＊タトゥーの上は色に反応してやけどするので、脱毛は対象外・延期になる。×Sパーツ：ワキ・うなじなど。×¥76,780：50〜100㎠未満。", "basis": "Lパーツ（背中上・背中下・顔・膝下・膝上・肘上・肘下）"}, {"id": "d-c6-15-2", "ch": "skin", "card": "c6-19", "level": "dr", "q": "女性のお客様。「ワキの脱毛と、においの手術（吸引シェービング法）を考えている。脱毛は何回くらい通う？ 手術はどう切る？」。デイズでの説明として教材に合うのは？", "choices": ["脱毛は5回ほどで実感する人が多い。吸引シェービング法は約1cm切り、細い管で汗腺を吸い取る", "脱毛は5回ほどで実感する人が多い。吸引シェービング法は約3〜4cm切り、ハサミで汗腺を切り取る", "脱毛は3回ほどで実感する人が多い。吸引シェービング法は約3〜4cm切り、ハサミで汗腺を切り取る", "脱毛は3回ほどで実感する人が多い。吸引シェービング法は約1cm切り、細い管で汗腺を吸い取る"], "answer": 0, "explain": "脱毛は1回では終わらず、約1.5〜2か月おきに通い、5回ほどで実感する人が多い。吸引シェービング法は約1cm切った所から細い管（カニューレ）で汗腺を吸い取る。×3回ほど：モフィウス8バーストの回数。×約3〜4cm・ハサミ：剪除法のやり方。", "basis": "約1.5〜2か月おき（顔は1か月おき）に通い、5回ほどで実感する人が多い"}, {"id": "d-c6-19-1", "ch": "skin", "card": "c6-19", "level": "dr", "q": "女性のお客様。「VIOセットを5回と、ワキも5回受けたい。ワキはにおいも気になる。においのもとは何？」。デイズの料金表と教材に沿った案内は？", "choices": ["ワキはSパーツで5回¥56,250。においのもとはアポクリン汗腺", "ワキはLパーツで5回¥67,500。においのもとはエクリン汗腺", "ワキはSパーツで5回¥56,250。においのもとはエクリン汗腺", "ワキはLパーツで5回¥67,500。においのもとはアポクリン汗腺"], "answer": 0, "explain": "ワキ（脇）はSパーツで5回¥56,250（VIOセットは5回¥90,000）。におい（ワキガ）のもとはアポクリン汗腺で、量が多い汗（多汗症）はエクリン汗腺。×Lパーツ¥67,500：背中・顔など。×エクリン汗腺：汗の量のほう。", "basis": "Sパーツ（手の甲・Vライン・I・O・うなじ・脇）"}, {"id": "a-c6-19-1", "ch": "skin", "card": "c6-20", "level": "apply", "q": "「ワキの毛を減らせば、においも汗も消えるはず」と医療脱毛を希望するお客様。教材に合う案内は？", "choices": ["においには、脱毛を1か月おきに続けることを案内する", "毛は脱毛、においや汗はワキ汗治療と分けて案内する", "においには、アポクリン汗腺に効く脱毛を案内する", "汗の量には、エクリン汗腺を取る剪除法を案内する"], "answer": 1, "explain": "医療脱毛は毛を減らすもので、汗腺には働かない。におい・汗はワキ汗治療と分けて案内する。教材では、手術（吸引シェービング法・剪除法）は「においの汗腺（アポクリン）を取る」治療と説明され、汗の量（エクリン汗腺）に教材が挙げるのはボトックス。脱毛の間隔は、においや汗とは関係ない。", "basis": "同じワキの施術でも、医療脱毛は毛を減らすもので、汗腺には働かない。"}, {"id": "a-c6-20-1", "ch": "skin", "card": "c6-20", "level": "apply", "q": "「においはあまり気にならないが、ワキの汗の量が多い。通っているあおなぎで受けたい」。教材に合う案内は？", "choices": ["あおなぎで多汗症のボトックス注射", "あおなぎで吸引シェービング法の手術", "あおなぎでワキの医療脱毛", "あおなぎで剪除法の手術"], "answer": 0, "explain": "汗の量（多汗症）はエクリン汗腺が原因で、ボトックス注射は汗を出す指令を弱める。あおなぎは多汗症のボトックスのみで、手術（吸引シェービング法・剪除法）はデイズだけ。医療脱毛は毛を減らすもので汗腺には働かず、あおなぎに掲載もない。", "basis": "あおなぎは多汗症のボトックス注射のみ。金額はデイズと同じ"}, {"id": "a-c6-20-2", "ch": "skin", "card": "c6-20", "level": "apply", "q": "ワキ汗治療の説明として、誤っているものはどれ？", "choices": ["剪除法はワキのシワに沿って約3〜4cm切る", "脇ボトックスで、においも軽くなるとされる", "ワキガはアポクリン汗腺、多汗症はエクリン汗腺", "吸引シェービング法は、ワキを7日間固定する"], "answer": 3, "explain": "固定は吸引シェービング法が1日、剪除法が7日間。剪除法は約3〜4cm切り皮膚を裏返して汗腺を切り取るため出血しやすく、固定が長い。腫れ・内出血が長引く人は当日に肩を動かしていることが多い。におい＝アポクリン、汗の量＝エクリン。脇ボトックスはにおいも軽くなるとされる。", "basis": "ワキの固定は吸引シェービング法が1日、剪除法が7日間"}, {"id": "d-c6-20-2", "ch": "skin", "card": "c6-20", "level": "dr", "q": "「10か月前に剪除法をモニター価格で受けた。においが少し戻ってきた。診てもらえる？ もう一度手術するなら、ワキの固定は何日？」というお客様。デイズでの案内として教材に合うのは？", "choices": ["保証の対象外なら診察も受けられない。剪除法の固定は1日", "診察は保証の有無に関わらずいつでもできる。剪除法の固定は1日", "診察は保証の有無に関わらずいつでもできる。剪除法の固定は7日間", "保証の対象外なら診察も受けられない。剪除法の固定は7日間"], "answer": 2, "explain": "デイズは、診察・相談は保証の有無に関わらずいつでもできる（再手術は原則、手術日から半年以降）。剪除法は約3〜4cm切り、ワキを7日間固定する。×診察も受けられない：いつでもできる。×固定1日：吸引シェービング法の日数。", "basis": "ワキの固定は吸引シェービング法が1日、剪除法が7日間"}]</script>

<script id="mdata" type="application/json">[{"id": "c1-01", "ch": "eye", "name": "二重整形（二重埋没法）", "yomi": "ふたえせいけい（ふたえ まいぼつほう）", "one": "まぶたを切らずに、細い糸でまぶたの中を1〜数か所留めて、二重の「折り目」を作る施術。", "pts": ["切らずに糸で留めるだけ。両目10〜20分で終わり、その日に帰れる。抜糸もいらない。", "作るのは「折り目」だけ。目の開きそのものは変わらない。開きを良くしたい人は眼瞼下垂の施術が別にある。", "糸がゆるむと元に戻ることがある。だからデイズのプランは、糸の留め方（留める点の数など）がしっかりするほど「戻ったときの保証」が長くなり、料金も上がる。"]}, {"id": "c1-02", "ch": "eye", "name": "二重切開法", "yomi": "ふたえ せっかいほう", "one": "まぶたの皮膚を切って中を縫い、取れにくい二重の折り目を作る手術。余分な皮膚や脂肪も一緒に取れる。", "pts": ["切って作るので戻りにくい。埋没法が何度も取れた人、まぶたが厚い人、幅の広い二重にしたい人の選択肢。", "余分な皮膚・脂肪も同時に取れる。だからまぶたの脂肪取りを別に足す必要はない。", "代わりに、休みと傷あとが必要。腫れのピークは1〜2週間。元に戻すことはできない。"]}, {"id": "c1-03", "ch": "eye", "name": "まぶたの脂肪取り", "yomi": "まぶたの しぼうとり", "one": "厚ぼったい上まぶたの奥の脂肪を、数mmの小さな穴から取り出して、まぶたを薄くする施術。", "pts": ["二重の「下準備」のメニュー。単独ではなく、ふつうは二重埋没法と同時に行う。", "切るのは数mmだけ。約10分で終わり、傷は小さいので縫わない（抜糸なし）。", "取りすぎると、くぼむ。まぶたの脂肪は年齢とともに減るので、将来を考えて量を決める。"]}, {"id": "c1-04", "ch": "eye", "name": "切らない眼瞼下垂", "yomi": "きらない がんけんかすい", "one": "皮膚を切らず、まぶたを上げる筋肉を糸でまぶたのふちに結び直して、目の開きを良くする施術。", "pts": ["変わるのは「開き」。二重の線を作る埋没法とは目的が別で、まぶたのふち自体が上がる。", "切らないので回復が早い。当日帰宅、メイクは翌日から。表に傷あとはほぼ出ない。", "効くのは軽い〜中くらいまで。重い場合は、切る手術（眼瞼下垂）が必要になる。"]}, {"id": "c1-05", "ch": "eye", "name": "眼瞼下垂（眼瞼挙筋前転術）", "yomi": "がんけんかすい（がんけん きょきん ぜんてんじゅつ）", "one": "上まぶたを切り、のびてゆるんだ「まぶたを上げる筋肉の先」を縫い縮めて、目の開きを良くする手術。", "pts": ["目元でいちばん本格的な「開き」の手術。切らない方法では足りない下垂にも対応でき、効果は半永久的。", "二重も同時にできる。二重切開と同じ線を切って行うので、仕上がりは二重まぶたになる。", "腫れは長め。ピークは1〜2週間、抜糸は1週間後。傷あとは3か月ほどで白く目立ちにくくなる。"]}, {"id": "c1-06", "ch": "eye", "name": "目頭切開", "yomi": "めがしら せっかい", "one": "目頭にかぶさっている皮膚のひだを切って整え、目を内側（鼻側）に広げる手術。", "pts": ["目が「内側」に広がる。隠れていた白目と目頭のピンクの部分が出る。埋没法だけでは難しい平行型の二重も作りやすくなる。", "目と目の距離が縮まる。だから、もともと目と目が近い人には勧めない（目上切開や目尻切開を考える）。", "効果は半永久。ただし切るので、白い線のような傷あとは残る。"]}, {"id": "c1-07", "ch": "eye", "name": "目上切開", "yomi": "めうえ せっかい", "one": "目頭の「上」の皮膚を切ってつっぱりを取り、目と目の距離は変えずに、目を縦に広げる手術。", "pts": ["目頭切開の「縦」版。切るのは目頭の先ではなく、その上。だから目と目の距離は縮まらない。", "目と目が近い人の受け皿。目頭切開だと寄り目に見えそうな人でも、目を大きく見せられる。", "運動は1か月後から。抜糸は7日後。傷の赤みが目立ちにくくなるまで3か月ほどかかる。"]}, {"id": "c1-08", "ch": "eye", "name": "目尻切開", "yomi": "めじり せっかい", "one": "目尻（目の外側の端）を切って外へ広げ、目の横幅を大きくする手術。", "pts": ["目が「外側」に広がる。白目が増え、つり目・切れ長の印象がやわらぐ。目と目が近い人でも受けられる。", "効果の出やすさに条件がある。目尻を引っぱったとき、白目が1.5mm以上かくれている人は効果が高い傾向。", "戻ることがある。切った所がくっついて元に戻ろうとするため。タレ目形成との併用も多い。"]}, {"id": "c1-09", "ch": "eye", "name": "グラマラスライン形成（タレ目形成）", "yomi": "ぐらまらすらいん けいせい（たれめ けいせい）", "one": "目尻側の下まぶたを少し下げて白目の見える範囲を広げ、やさしいタレ目に見せる施術。", "pts": ["目を「下」に広げる。目尻側の下まぶたを下げて白目を増やし、つり目のきつさをやわらげる。目が縦に大きく見える。", "方法は3つ。持ちと腫れが段階的に変わる。糸だけで留める（戻りやすい）→ 裏側を切る（表に傷なし）→ 表の皮膚を切る（効果が一番大きく半永久）。", "下げすぎのリスクがある。赤い粘膜が見える・黒目の下に白目が出る・目が閉じにくい・ドライアイなど、下まぶたを触る施術ならではの注意点がある。"]}, {"id": "c1-10", "ch": "eye", "name": "涙袋形成", "yomi": "なみだぶくろ けいせい", "one": "下まつげのすぐ下のぷっくりしたふくらみ（涙袋）を糸で作り、いつでも見えるようにする施術。", "pts": ["目の開きは変えず、ふくらみを作る。涙袋があると目が大きく見え、顔の中央（中顔面）が短く見える。左右差の調整にも使う。", "切らずに、裏側から糸で作る。二重の埋没法と似たしくみ。表に傷が残らず、好みに合わなければ糸を外して元に戻せる。", "持ちは半年〜数年。時間がたつと糸がゆるんだり取れたりすることがある。仕上がりが安定するまで1〜3か月かかる。"]}, {"id": "c2-01", "ch": "kuma", "name": "目の下の切らないクマ・たるみ取り（経結膜脱脂）", "yomi": "めのしたの きらない くま・たるみとり（けいけつまく だっし）", "one": "下まぶたの裏側から、前にはみ出した脂肪を取り出して、目の下のふくらみを平らにする手術。", "pts": ["皮膚を切らない。下まぶたの内側の粘膜を数mm切るだけなので、顔の表に傷が残らない。", "直せるのは「ふくらみ」だけ。下のみぞや皮膚のたるみには触らない。みぞには脂肪注入を足すプランがある。", "取った脂肪はほぼ戻らない。ただし年齢とともに、またたるんでくることはある。"]}, {"id": "c2-02", "ch": "kuma", "name": "裏ハムラ法（クマ取り）", "yomi": "うらハムラほう", "one": "まぶたの裏から入り、前に出た脂肪を取らずに下のみぞへ移して留め、ふくらみとみぞを同時にならす手術。", "pts": ["脂肪を捨てずに使う。前に出た脂肪を下のみぞへ移して糸で留める。ふくらみとみぞが同時に平らになる。", "入口は裏。表に傷なし。まぶたの裏の粘膜を数mm切るだけ。皮膚は切らないので、しわへの効果は表ハムラより限定的。", "脂肪注入がいらないことが多い。自分の目の下の脂肪でみぞを埋めるので、太ももなどから脂肪を採らずに済む。"]}, {"id": "c2-03", "ch": "kuma", "name": "表ハムラ法（クマ取り）", "yomi": "おもてハムラほう", "one": "まつげのすぐ下の皮膚を切って入り、脂肪を下のみぞへ敷き直し、余った皮膚も切り取る、目の下の総合手術。", "pts": ["ふくらみ・みぞ・しわを一度に。脂肪を敷き直し、余った皮膚も切り取る。クマ取りの手術4つの中で、直せる範囲がいちばん広い。", "入口は表。まつげのすぐ下を切るので細い傷ができる。数か月は赤みがあるが、最終的にはほとんど目立たなくなる。", "時間もダウンタイムも長め。両目で約120分。1週間後に抜糸があり、腫れは2〜3週間ほどで落ち着く。"]}, {"id": "c2-04", "ch": "kuma", "name": "切開法による目の下のたるみ取り", "yomi": "せっかいほうによる めのしたの たるみとり（下眼瞼除皺術）", "one": "下まつげのすぐ下の皮膚を切り、余ってたるんだ皮膚と、ふくらみのもとの脂肪を切り取る手術。", "pts": ["皮膚そのものを減らせる。切らない方法では取れない皮膚のたるみ・しわ・目袋に対応する。切らないクマ取りやヒアルロン酸注射でも気になる人向け。", "脂肪は必要なら取る。たるみの原因が脂肪なら一緒に切り取る。目のまわりの筋肉がゆるんでいれば、上へ引き上げることもある。", "腫れが長い。ピークは1〜2週間、完成まで1〜3か月。傷はまつげの際で、1週間後に抜糸する。"]}, {"id": "c2-05", "ch": "kuma", "name": "眉下リフト（眉下切開）", "yomi": "まゆしたリフト（まゆした せっかい）", "one": "眉毛のすぐ下で余った皮膚を切り取って縫い、上まぶたのたるみを引き上げる手術。", "pts": ["この章で唯一「目の上」の施術。上まぶたにかぶさった皮膚を減らす。目のきわは切らないので、目元の印象が自然なまま。", "傷は眉の下のラインに隠す。眉毛の下ぎりぎりを切る。赤みは1か月ほど、3か月ほどで白く目立たなくなる。", "おでこのしわにも関係する。まぶたが重いと、眉を持ち上げて見るくせがつき、おでこに深いしわができる。そのもとを減らせる。"]}, {"id": "c2-06", "ch": "kuma", "name": "しわ取り再生注射（スネコス）", "yomi": "しわとり さいせいちゅうしゃ", "one": "ヒアルロン酸とアミノ酸を注射して、肌が自分でハリの成分を作るのを後押しする治療。", "pts": ["ふくらませる注射ではない。肌の中の「繊維を作る細胞」を刺激して、ハリのもと（コラーゲンとエラスチン）を自分で作らせる。", "効果はゆっくり出る。10〜14日後ごろから肌の水分量が増え、約1か月後にキメ・ツヤ・弾力が上がる。", "続けて受けるのが基本。1回でも実感できるが、最初の月は週1回、その後は月1回ほどがすすめられている。"]}, {"id": "c2-07", "ch": "kuma", "name": "ベビーコラーゲン", "yomi": "べびーこらーげん", "one": "赤ちゃんの肌に多い種類のコラーゲンを、目元の細かいしわのすぐ下に注射して、しわとハリを改善する治療。", "pts": ["コラーゲンそのものを入れる。ヒトの胎盤由来で、赤ちゃんの肌に多い「Ⅲ型コラーゲン」が入っている。入れてすぐハリを感じる人がほとんど。", "目元の細かいしわが得意。ヒアルロン酸では治療が難しかった、皮膚が薄い所の「ちりめんジワ」に使う。", "効果は6か月〜1年。体に吸収されるので永久ではない。定期的に受けると長持ちしやすい。"]}, {"id": "c2-08", "ch": "kuma", "name": "口角挙上（口角リフト）", "yomi": "こうかく きょじょう", "one": "下がった口角（口の両はし）を、切って縫うことで上向きに整える手術。", "pts": ["2つの方法を使い分ける。口角の外側の皮膚を切り取る「外側法」と、口角そのものを移す「全層法」。どちらにするかは診察で医師が決める。", "効果は半永久。ヒアルロン酸やボトックスの注射（半年〜1年）と違い、打ち直しがいらない。", "傷あとはゼロにはならない。外側法は皮膚の表に、全層法は口角から口の中にかけて傷ができる。時間とともに目立ちにくくなる。"]}, {"id": "c2-09", "ch": "kuma", "name": "M字リップ形成", "yomi": "えむじ リップ けいせい", "one": "上唇の内側を左右で少し切り取って縫い、一直線の唇をメリハリのあるM字の形にする手術。", "pts": ["切るのは唇の内側。上唇の内側（粘膜側）を左右でひし形に切り取って縫う。傷は治れば目立たない。", "効果は半永久。同じページには、切らずにヒアルロン酸注射でM字を作る方法も載っている（こちらは溶かして戻せる）。", "約30分で終わる。1週間後に抜糸。口の開け閉めの違和感は1か月ほどでなくなる。"]}, {"id": "c2-10", "ch": "kuma", "name": "口唇縮小（スマートリップ）", "yomi": "こうしん しゅくしょう", "one": "唇の内側を切り取って縫い、厚ぼったい唇を薄く小さくする手術。切るのは口の中側なので傷は外から見えない。", "pts": ["切るのは唇の内側。口の中側の粘膜と、その下の組織（粘膜下組織）を切り取って縫う。傷は隠れて外から見えない。", "上だけ・下だけ・上下どちらも。希望と唇の状態で決める。切り取るデザインで、M字型にもアヒル口にもできる。約1時間。", "元には戻せない。唇は年をとると自然に薄くなるので、将来のことも考えて決めるよう、サイトも注意している。"]}, {"id": "c3-01", "ch": "nose", "name": "鼻尖形成", "yomi": "びせんけいせい", "one": "鼻先の中の軟骨を糸で寄せて、丸い「団子鼻」を細くすっきりさせる手術。", "pts": ["足さずに、今ある軟骨を寄せて細くする。鼻先の形・向き・高さを調整できる。", "切り方は2種類。オープン法は細かく作れる（傷は穴の間の柱に）。クローズ法は穴の中だけで傷が見えない。", "軟骨を足す手術と一緒に行うことが多い。耳の軟骨の移植や鼻中隔延長と組み合わせて全体を整える。"]}, {"id": "c3-02", "ch": "nose", "name": "鼻尖部軟骨移植", "yomi": "びせんぶ なんこついしょく", "one": "自分の耳の軟骨を少し採って鼻先に重ね、鼻先を少し高く・シャープにする手術。", "pts": ["材料は自分の耳の軟骨。人工物を使わないので、アレルギーの心配がなく、見た目も触り心地も自然（サイト記載）。", "変化は「少し」。鼻先を少し整えたい、一番高い位置を少し下げたい人向け。大きく伸ばすなら鼻中隔延長。", "根づけば一生そのまま。そのかわり、やり直しても完全に元の状態には戻せない。"]}, {"id": "c3-03", "ch": "nose", "name": "鼻中隔延長", "yomi": "びちゅうかく えんちょう", "one": "鼻の中の支柱に軟骨を継ぎ足して、鼻先を前に出したり、下に向けたりする手術。", "pts": ["鼻先の「高さ」と「向き」を両方変えられる。短い鼻・上向きの鼻・低い鼻に。変化は大きくも控えめにもできる。", "継ぎ足す軟骨は選べる。多くは耳の軟骨。伸ばせる長さは「耳 → 鼻の中 → あばら」の順に長くなる。", "「切らない鼻中隔延長」は別物。溶ける糸を鼻先から入れる方法で、持続は約1年。"]}, {"id": "c3-04", "ch": "nose", "name": "鼻柱下降", "yomi": "びちゅう かこう", "one": "左右の鼻の穴の間にある「柱」に耳の軟骨を足して、柱を下に伸ばす手術。", "pts": ["動かすのは「柱」だけ。正面から鼻の穴が目立ちにくくなり、鼻が長く見える。鼻先を細くする手術ではない。", "横顔の「鼻と上唇の角度」が整う。このページでは理想を「およそ100°」としている（猫手術のページは別の数字。下の注意を参照）。", "材料は自分の耳の軟骨。効果は半永久的に続く（サイトQ&A）。"]}, {"id": "c3-05", "ch": "nose", "name": "隆鼻術（シリコンプロテーゼ）", "yomi": "りゅうびじゅつ", "one": "鼻の穴の中からシリコン製の細い棒を入れて、鼻の付け根から鼻筋を高くする手術。", "pts": ["担当は鼻筋（上半分）だけ。鼻先の形は変わらないので、鼻先のメニューと組み合わせることが多い。", "一人ひとりに合わせて削る。I型という棒を、0.1mm単位で削って形を合わせる（サイト記載）。", "人工物なので「感染」に注意。術後1か月は歯の治療も避ける。あとから取り出し・入れ替えはできる。"]}, {"id": "c3-06", "ch": "nose", "name": "小鼻縮小", "yomi": "こばな しゅくしょう（鼻翼縮小）", "one": "小鼻の皮膚を切り取って縫い縮め、鼻の横幅や鼻の穴を小さくする手術。", "pts": ["悩みで切る場所が変わる。穴が大きい→内側法、小鼻が張り出す→外側法、両方→内側＋外側。", "切らない方法（糸）もある。傷は針穴だけで、糸を抜けば戻せる。ただし変化は小〜中くらい。", "鼻先を細くする手術とは同時にできない。鼻先の血のめぐりが不安定になる可能性があるため、期間をあけて行う（サイト記載）。"]}, {"id": "c3-07", "ch": "nose", "name": "鼻翼挙上", "yomi": "びよく きょじょう", "one": "小鼻の上の皮膚を三日月形に切り取って縫い寄せ、下がった小鼻を持ち上げる手術。", "pts": ["小鼻の「位置」を上げる手術。横幅を縮める小鼻縮小とは目的が違う（横ではなく縦）。", "上げられるのは1〜2mmほど。安全と仕上がりのバランスから、この程度が適切とされる。", "傷は小鼻の外側のみぞに重なる。時間とともにほとんどわからなくなる。"]}, {"id": "c3-08", "ch": "nose", "name": "貴族手術", "yomi": "きぞくしゅじゅつ（鼻翼基部形成 びよくきぶけいせい）", "one": "小鼻の横のくぼみを口の中から底上げし、ほうれい線の影を浅くする手術。", "pts": ["鼻を高くする手術ではない。さわるのは小鼻の横の土台（鼻翼基部）。「貴族」は韓国での呼び名 Nobility Surgery（気品のある口元にする手術）の訳。", "入れる物は4種類から選ぶ。人工の詰め物（プロテーゼ）・自分の脂肪・あばらの軟骨・ヒアルロン酸。値段と長持ちの度合いが違う。", "切るのは口の中。顔の表面に傷が出にくい。ヒアルロン酸だけは切らずに注射で済むが、1〜2年で吸収される。"]}, {"id": "c3-09", "ch": "nose", "name": "猫手術", "yomi": "ねこしゅじゅつ（鼻唇角矯正 びしんかくきょうせい／Cカール形成）", "one": "鼻の穴の間の柱の根元に耳の軟骨を入れ、鼻と上くちびるの角度を整える手術。猫の鼻にするわけではない。", "pts": ["鼻先も鼻筋も触らない。さわるのは鼻の穴の間の柱（鼻柱）の根元だけ。「猫」は鼻と口の段差が少ない猫の横顔をイメージした、韓国発の呼び名とされる。", "ねらいは横顔の角度。鼻と上くちびるが作る角度（鼻唇角）がひらき、鼻の下が短く見える。このページは「東洋人はおおよそ90〜95°が美しく見える」としている（鼻柱下降のページは別の数字。下の注意を参照）。", "入れるのは自分の耳の軟骨。入れ替えなどの手入れは基本いらない。ただし軟骨が少し縮んで、効果が控えめに感じられることがある。"]}, {"id": "c3-10", "ch": "nose", "name": "骨切り幅寄せ", "yomi": "ほねきり はばよせ（鼻骨骨切り幅寄せ術）", "one": "鼻の上半分の骨に切れ込みを入れ、左右から中央へ寄せて、太い鼻筋を細くまっすぐにする手術。", "pts": ["動かすのは骨そのもの。対象は鼻の上半分の骨（鼻骨）だけ。鼻先は変わらないので、鼻尖形成などと組み合わせることが多い。", "負担の大きい手術。この章で唯一の全身麻酔で、ギプス固定が約3週間、腫れ・内出血が引くまで2週間〜1か月。", "鼻の通りが悪くなることがある。手術前にCTで鼻の中の広さを確認し、狭い人には鼻炎の手術を一緒に行うことをすすめている。"]}, {"id": "c3-11", "ch": "nose", "name": "わし鼻修正", "yomi": "わしばな しゅうせい（ハンプ切除）", "one": "横から見た鼻筋の出っ張り（骨のこぶ）を、鼻の穴の中から削って、まっすぐなラインにする手術。", "pts": ["削るだけなので軽い。約30分、固定は2日間。同じ「骨をさわる」手術でも、骨切り幅寄せや斜鼻修正（ギプス3週間）よりずっと負担が小さい。", "傷は鼻の穴の中。鼻の内側を数mm切るだけなので、外から見える傷はできない。", "削ったら戻せない。効果は半永久。軽度〜中度の出っ張りなら、削らずにヒアルロン酸やプロテーゼでなだらかにする方法もある。"]}, {"id": "c3-12", "ch": "nose", "name": "斜鼻修正", "yomi": "しゃび しゅうせい", "one": "正面から見て曲がっている鼻筋を、骨を切って位置を直し（必要なら軟骨も整え）、まっすぐにする手術。", "pts": ["曲がりの原因は3タイプ。骨だけ／軟骨だけ／骨と軟骨の両方。どこが原因かで手術の中身が変わるので、事前のCT撮影が必須。", "中身は「骨を切って動かす」手術。骨切り幅寄せと同じ技術で、目的が「細く」ではなく「まっすぐ」。ギプス固定は3週間。", "しばらく鼻がつまりやすい。鼻の中の粘膜が腫れるため。3〜6か月かけて通りは戻っていく。軽い曲がりならプロテーゼやヒアルロン酸で済むこともある。"]}, {"id": "c3-13", "ch": "nose", "name": "鼻孔縁挙上", "yomi": "びこうえん きょじょう", "one": "垂れ下がった鼻の穴のふちの皮膚を切り取って、ふちのカーブを上げ、小鼻をすっきり見せる手術。", "pts": ["名前を分解すると中身がわかる。鼻孔縁＝鼻の穴のふち、挙上＝持ち上げる。何かを足すのではなく、垂れた分の皮膚を切り取る。", "傷はふちと重なる。ふちに沿って縫うので目立ちにくい。赤みは1か月ほど、3か月ほどで白くわかりにくくなる。", "切り取るので基本的に戻らない。そのぶん、どれだけ上げるか（鼻の穴の見え方）を事前によく確認する。"]}, {"id": "c3-14", "ch": "nose", "name": "人中短縮（リップリフト）", "yomi": "じんちゅう たんしゅく", "one": "鼻のすぐ下の皮膚を数mm切り取って縫い縮め、鼻とくちびるの距離を実際に短くする手術。", "pts": ["人中＝鼻の下からくちびるまでの部分。ここの皮膚を切り取るので、距離が実際に短くなる。効果は基本的に半永久。", "別名「リップリフト」。縫い縮めるときに上くちびるが引き上げられ、くちびるに立体的な厚みが出る。", "顔の正面に傷ができる手術。鼻の穴のすぐ下のきわ（鼻孔底）に沿って切り、鼻の影に隠す。赤みは1か月ほど、白くなるまで3か月ほど。"]}, {"id": "c4-01", "ch": "lift", "name": "脂肪注入（ナノファット2.0）", "yomi": "しぼうちゅうにゅう", "one": "自分の太ももから取った脂肪を、顔のくぼみやシワに少しずつ入れて、ふっくらさせる施術。", "pts": ["材料は自分の脂肪。自分の細胞なので、体が異物としてはねのける反応が起きにくい。", "残るのは入れた量の30〜70％。根づいた分（定着）は長く残るが、どれだけ残るかは人による。", "元に戻すのは難しい。ヒアルロン酸のように「溶かしてやり直す」ことができない。"]}, {"id": "c4-02", "ch": "lift", "name": "脂肪吸引注射", "yomi": "しぼうきゅういん ちゅうしゃ", "one": "名前は「注射」でも薬は入れない。ごく細い針で顔の脂肪をじかに吸い出す、小さな脂肪吸引。", "pts": ["薬は入れない。針で脂肪を吸い出すだけ。薬で溶かす脂肪溶解注射とは、名前が似ているだけの別もの。", "1回・約20分で終わる。圧迫バンドがいらないので、仕事を休まない人も多い。", "脂肪が減ると、皮膚が余る。そのぶんシワやたるみが目立つことがある、とサイトも書いている。"]}, {"id": "c4-03", "ch": "lift", "name": "顔の脂肪吸引", "yomi": "かおの しぼうきゅういん", "one": "皮膚を数ミリ切って細い管を入れ、頬やあご下の脂肪を吸い出す、1回で終わる小顔の手術。", "pts": ["脂肪の細胞そのものを取る。ダイエットは細胞が小さくなるだけで数は同じ。吸引は数を減らすので、リバウンドしにくい。", "腫れ・内出血が1〜2週間。数日は固定バンドも必要で、まわりに気づかれやすい期間がある。", "たくさん取るのが目的ではない。取りすぎると痩せこけて見えるので、丸みを残して形をつくる。"]}, {"id": "c4-04", "ch": "lift", "name": "脂肪溶解注射", "yomi": "しぼうようかい ちゅうしゃ", "one": "脂肪を溶かす薬を注射して、数回かけて少しずつ脂肪を減らす、切らない施術。", "pts": ["薬を「入れる」注射。針で脂肪を「吸い出す」脂肪吸引注射とは、向きが逆の別メニュー。", "手軽だが、1回では終わらない。1回5〜15分で、翌日から仕事や学校に行ける。回数の目安は3〜6回。", "何にでも効くわけではない。口の横に垂れた脂肪（ジョールファット）は「ダイエットや顔痩せ注射を施しても効果が現れにくい」と、ジョールファット除去のページに書かれている。"]}, {"id": "c4-05", "ch": "lift", "name": "ジョールファット除去", "yomi": "じょーるふぁっと じょきょ", "one": "口の横からフェイスラインに垂れた脂肪を、口の中から取りのぞいて、口元のもたつきをなくす手術。", "pts": ["切るのは口の中だけ。口角の内側を約5mm切るので、顔の表面に傷が出ない。溶ける糸で縫うので抜糸もいらない。", "取った脂肪は再生しない。だから効果は半永久的。逆に言うと、取りすぎても元に戻せない。", "取りすぎると頬がこける。サイトもリスクとして明記している。どれだけ取るかの見きわめが大事。"]}, {"id": "c4-06", "ch": "lift", "name": "メーラーファット除去", "yomi": "めーらーふぁっと じょきょ", "one": "ほうれい線の上にのっている頬の脂肪を、口の中から細い管で吸い出して減らす手術。", "pts": ["口の中から、細い管で吸う。口角の内側に小さな傷を作るだけなので、外からは見えない。抜糸もいらない。", "ねらいは、ほうれい線と「笑ったときの頬のふくらみ」。早めに取ると将来のたるみ予防にもなる、とサイトは説明している。", "同じ脂肪を「取らずに上へ戻す」メニューもある（ミッドフェイスリフト）。脂肪が「多い」のか「下がった」のかで、合う向きが逆になる。"]}, {"id": "c4-07", "ch": "lift", "name": "バッカルファット除去", "yomi": "ばっかるふぁっと じょきょ", "one": "頬の奥にある脂肪のかたまりを、口の中を小さく切って取り出し、フェイスラインをすっきりさせる手術。", "pts": ["顔に傷ができない。切るのは口の中だけなので、洗顔もメイクも当日からできる。溶ける糸で縫うので抜糸もいらない。", "1回で終わり、効果は半永久的。取った脂肪は再生しない。サイトのおすすめは、たるみが目立つ前の20〜30代。", "合わない人が受けると逆効果。たるみが強い人や、たるみの原因がバッカルファット以外にある人は、取ると余計にたるむことがある、とサイトも書いている。"]}, {"id": "c4-08", "ch": "lift", "name": "ミッドフェイスリフト", "yomi": "みっどふぇいすりふと（中顔面リフト）", "one": "下がった頬の脂肪を上へ戻し、糸で骨の表面の膜に留めて、目の下〜頬を若返らせる手術。", "pts": ["脂肪を取らずに「戻す」。同じ頬の脂肪を扱うメーラーファット除去とは向きが逆。こけた人・へこんだ人向け。", "ねらいは目の下〜頬（中顔面）。あご下や首のたるみには、別にペリカン手術や切開リフト（ネックリフト）がある。", "まぶたの裏から入るので、顔に傷が出ない。そのかわり白目が2〜3週間赤くなることがある。"]}, {"id": "c4-09", "ch": "lift", "name": "糸リフト", "yomi": "いとりふと（スレッドリフト）", "one": "溶ける糸を針で頬の中に通し、下がった頬やフェイスラインを引っぱり上げる、切らないリフト。", "pts": ["切らずに、糸で物理的に引っぱる。20〜30分で終わり、傷は針穴だけ。当日からメイクも入浴もできる。", "糸は溶ける。効果は1〜2年ほど。糸の種類で引き上げる力・もち・料金が変わる。", "デイズの料金は「1本あたり」。フェイスラインなら左右3本ずつが目安なので、本数とセットで考える。"]}, {"id": "c4-10", "ch": "lift", "name": "ペリカン手術", "yomi": "ぺりかんしゅじゅつ（広頸筋しばり・コルセットリフト）", "one": "あごの下を小さく切り、左右に開いてゆるんだ首の筋肉を中央に寄せて縫い、二重あごを締め直す手術。", "pts": ["ねらうのは脂肪ではなく「筋肉」。首の前をおおう薄い筋肉のゆるみを、縫って締め直す。", "脂肪が原因なら脂肪吸引、筋肉が原因ならペリカン手術。両方なら組み合わせる、とサイトが明記している。", "あご下〜首まわりが対象。機械や糸リフトで効果が出なかった人の「次の段」（サイトの対象にも「HIFUや糸リフトで効果が得られなかった方」とある）。"]}, {"id": "c4-11", "ch": "lift", "name": "切開リフト（フェイスリフト）", "yomi": "せっかいりふと", "one": "耳のまわりを切って皮膚の奥の膜ごと引き上げ、余った皮膚を切り取る、たるみ治療でいちばん強い手術。", "pts": ["余った皮膚そのものを切り取れる唯一の方法。機械も糸も、皮膚の量は減らせない。", "効果は5〜10年ほど。そのかわり全身麻酔で4〜5時間、腫れは3〜4週間と、負担はいちばん大きい。", "リスクも重い。顔の神経のまひ、皮膚の壊死など、機械や糸にはないリスクがある。"]}, {"id": "c4-12", "ch": "lift", "name": "ソフウェーブ", "yomi": "そふうぇーぶ", "one": "超音波で皮膚の浅い層だけを温め、ハリを出して、小じわと軽いたるみをケアする機械。", "pts": ["温めるのは皮膚の浅い層（真皮）。深さ約0.5〜2.0mm。HIFUより浅く、ハリ・小じわが得意。", "休みはほぼいらない。赤みは数時間〜数日。施術の直後からメイクできる。", "頬がこけやすい人にも向く。サイトは「HIFUのあと頬がこけた方」「顔の脂肪が少ない方」にすすめている。"]}, {"id": "c4-13", "ch": "lift", "name": "XERF（ザーフ）", "yomi": "ざーふ", "one": "2種類の高周波（電気の熱）で、皮膚の浅い層から脂肪の奥までを温めて引き締める機械。", "pts": ["3つの機械の中で唯一の「高周波」。モードを切りかえて、真皮から脂肪の奥まで深さを選べる。", "麻酔なしで受けられる。冷やしながら打つので熱さ・痛みはほとんどなく、当日からメイクできる。", "受けられない条件が多い。体の中に金属がある人、心臓に持病がある人、歯の矯正中の人などは受けられないことがある。"]}, {"id": "c4-14", "ch": "lift", "name": "ウルトラセルZi（HIFU）", "yomi": "うるとらせる じー（ハイフ）", "one": "超音波を1点に集め、皮膚の奥にある「筋肉の膜」を熱で縮めて、切らずに顔を引き上げる機械。", "pts": ["3つの機械でいちばん深い所に届く。ねらうのは筋肉の膜（SMAS）。だから「引き上げ」が得意。", "打ち方は3種類。点で打つドット（たるみ）、線で打つリニア（あご下など）、浅い層だけのハイフシャワー（ハリ）。", "効果は数か月。サイトのQ&Aでは「最長6か月ほど」。3か月〜半年ごとにくり返すのが前提。"]}, {"id": "c4-15", "ch": "lift", "name": "ヒアルロン酸注射", "yomi": "ひあるろんさん ちゅうしゃ", "one": "水分をたっぷり含むゼリー状のヒアルロン酸を注射で入れ、へこみを持ち上げたり、形を作ったりする施術。", "pts": ["「足して」ふくらませる。注射は5分ほど。当日からメイクも入浴もできる。", "場所によって硬さを使い分ける。目の下や唇はやわらかいもの、鼻やあごは形が出るかためのもの。", "少しずつ吸収される。1回目のもちは半年〜1年ほど。気に入らなければ溶かして戻す方法がある。"]}, {"id": "c4-16", "ch": "lift", "name": "ボトックス", "yomi": "ぼとっくす（ボツリヌストキシン注射）", "one": "筋肉の動きを弱める薬を注射して、表情じわを目立たなくしたり、エラの筋肉を細くしたりする施術。", "pts": ["何も足さない。筋肉の動きを弱めるだけ。ふくらませるヒアルロン酸（② 足す）とは考え方が逆で、この章の分類では5つの原理の外の「動きを止める」に入る。", "使い道は3つ。表情じわを出にくくする／エラなどの筋肉を細くする／汗を抑える。", "効果は一時的。しわへの効果は3〜6か月ほど。薬は2種類あり、どちらを選ぶかで料金が大きく変わる。"]}, {"id": "c5-01", "ch": "body", "name": "ハイブリッド豊胸", "yomi": "はいぶりっど ほうきょう", "one": "人工の袋で胸の大きさを出し、その上に自分の脂肪を足して、袋の輪郭をかくす豊胸。", "pts": ["袋と脂肪のいいとこ取り。袋で確実に大きくし、脂肪で自然な形とやわらかさを足す。やせ型の人ほど向いている。", "脂肪を吸う所も細くなる。脂肪は基本的に内ももから取る。ただし公式は「極端にやせることはない」と説明。", "この章でいちばん大がかり。4〜5時間かかり、内出血や痛みが1〜3週間続くことがある。"]}, {"id": "c5-02", "ch": "body", "name": "シリコンバッグ豊胸", "yomi": "しりこんばっぐ ほうきょう", "one": "ワキを数センチ切って胸の中にすき間を作り、シリコンの袋を入れて胸を大きくする手術。", "pts": ["体質に関係なく大きくできる。脂肪注入は人によって効果に差が出るが、袋は入れたぶんだけ確実。やせ型で脂肪が取れない人にも向く。", "入れる深さが3通りある。乳腺の下・筋肉の下・筋肉の膜の下。もとの胸の大きさや希望で医師が選ぶ。", "料金に袋の代金は入っていない。表の金額は手術の料金。袋（バッグ）の代金は、大きさと種類によって別にかかる。"]}, {"id": "c5-03", "ch": "body", "name": "豊胸術・脂肪幹細胞注入（脂肪豊胸）", "yomi": "ほうきょうじゅつ・しぼうかんさいぼうちゅうにゅう", "one": "お腹や太ももの脂肪を吸い取り、きれいにしてから胸に注射で移す、人工物を使わない豊胸。", "pts": ["入れるのは自分の脂肪だけ。人工物を使わないので、さわり心地がやわらかく、アレルギーの心配もない。", "「やせる」と「大きくする」が同時。脂肪を吸った所は細くなる。ただし脂肪を吸う料金は別にかかる。", "大きくできるのは1〜2カップまで。それ以上を希望する人は、袋を使う方法が案内される。"]}, {"id": "c5-04", "ch": "body", "name": "モントゴメリー線（乳輪のぶつぶつ）除去", "yomi": "もんとごめりーせん じょきょ", "one": "乳輪（胸の先の色のついた輪）にある小さなぶつぶつを、1個ずつ切り取って縫う手術。", "pts": ["ぶつぶつは病気ではない。正体は、乳輪の乾燥をふせぐ「あぶらを出す腺」。大きくて目立つ人が、見た目のために取る。", "1個いくら、の料金。取りたい個数をカウンセリングで決める。数が多いほど総額が上がる。", "取っても授乳はできる。公式は「健康や授乳機能に影響を与えない」と説明している。"]}, {"id": "c5-05", "ch": "body", "name": "副乳除去", "yomi": "ふくにゅう じょきょ", "one": "わきなどに残っている「余分な乳房の組織（副乳）」を、切って取りのぞく手術。", "pts": ["副乳は病気ではない。生まれる前に消えるはずだった乳房のなごり。放っておいても害はないが、見た目や妊娠時の腫れ・痛みで取る人がいる。", "切って、組織ごと取る。切ることで組織を完全に取りのぞけるので、きれいに無くせると説明されている。", "傷あとは少し残る可能性がある。30分ほどの手術で、そのまま帰れる。糸は7日後に抜く。"]}, {"id": "c5-06", "ch": "body", "name": "乳首を小さくする・乳頭縮小術", "yomi": "にゅうとう しゅくしょうじゅつ", "one": "大きい・長い乳頭（胸の先の突起）の一部を切り取って縫い、細く・低く整える手術。", "pts": ["「細く」「低く」「両方」の3通り。どこが気になるかで切り方が決まり、料金も変わる。", "母乳の通り道を残すかどうかで料金が変わる。料金表は「乳管温存」とそうでないものに分かれている。", "たばこは厳禁。血のめぐりが悪いと、乳頭の一部や全体が死んでしまう（壊死）ことがある。"]}, {"id": "c5-07", "ch": "body", "name": "陥没乳頭術", "yomi": "かんぼつ にゅうとうじゅつ", "one": "内側にへこんで埋もれている乳頭（胸の先の突起）を、切開して外に出す手術。", "pts": ["見た目だけの問題ではない。へこみに汚れがたまり、ばい菌が増えて、胸の中で炎症（乳腺炎・乳管炎）を起こしやすい。男女共通。", "出産の予定がある人は、その前に。授乳のときに困らないよう、公式は出産前の手術をすすめている。", "入浴は1か月ほどがまん。胸まわりの小さな手術の中では、制限の期間がいちばん長い。"]}, {"id": "c5-08", "ch": "body", "name": "乳輪を小さくする・乳輪縮小術", "yomi": "にゅうりん しゅくしょうじゅつ", "one": "乳輪（胸の先の色のついた輪）の一部を輪の形に切り取って縫い、輪を小さくする手術。", "pts": ["最大で50%小さくできる。輪が小さくなるとバランスが整い、胸そのものが大きく見える効果もある。", "授乳には影響しない。母乳の通り道（乳管）を傷つけずに行う、と説明されている。", "一度切ると元には戻せない。また、豊胸と同じ日にはできない（豊胸は術後1か月以降）。"]}, {"id": "c5-09", "ch": "body", "name": "婦人科形成", "yomi": "ふじんか けいせい", "one": "デリケートゾーン（女性器）の大きさ・形・たるみを、余分な皮膚を切り取って整える手術の総称。", "pts": ["4つの手術の総称。小陰唇・副皮・クリトリスの皮・大陰唇のうち、どこを整えるかで手術名が決まる。", "見た目だけが目的ではない。こすれる痛み・蒸れ・においなど、毎日の不快感を減らすために受ける人も多い。", "担当は女性だけ。元産婦人科専門医などの女性医師が担当し、スタッフも全員女性が対応する。"]}, {"id": "c5-10", "ch": "body", "name": "脂肪吸引注射", "yomi": "しぼうきゅういん ちゅうしゃ（顔の章にも掲載）", "one": "極細の針を刺して、皮膚の下の脂肪をそのまま吸い出す、小さな脂肪吸引。", "pts": ["名前は「注射」でも、やることは「吸引」。薬を入れて溶かす脂肪溶解注射とは逆で、脂肪を吸い出す。", "公式の説明は「顔」が対象。小顔・二重あご向けのメニュー。体の部分やせは身体の脂肪吸引を案内する。", "あとが楽。腫れは1〜2週間あるが、おさえるバンドは不要。仕事を休まない人も多い。"]}, {"id": "c5-11", "ch": "body", "name": "身体の脂肪吸引", "yomi": "からだの しぼうきゅういん", "one": "小さな穴から細い管を入れて、お腹や太ももなどの脂肪を直接吸い出す手術。", "pts": ["痩身の中でいちばん効果が大きく、いちばん負担も大きい。1回で終わるかわりに、強い腫れが約1週間、包帯で約2日押さえる。", "脂肪の細胞の「数」が減る。だからリバウンドしにくい。ただし不摂生を続けると太ることはある。", "料金は「1部位いくら」の均一制。ほとんどの部位が同じ値段。腰・副乳だけ別の値段で、広い範囲はセットがある。"]}, {"id": "c5-12", "ch": "body", "name": "脂肪溶解注射（ボディ）", "yomi": "しぼうようかい ちゅうしゃ（顔の章にも掲載）", "one": "脂肪を溶かす薬を注射して、やせにくい部分の脂肪を何回かに分けて減らす施術。", "pts": ["顔の章の脂肪溶解注射と同じメニュー。お腹・二の腕など、ダイエットしてもやせにくい部分にも使う。", "薬を「入れる」注射。脂肪を「吸い出す」脂肪吸引注射・脂肪吸引とは向きが逆。手軽なぶん、3〜6回通う。", "料金は1ccいくら。総額は「使う量×回数」で決まる。食事指導や飲み薬とセットにしたのがメディカルダイエット。"]}, {"id": "c5-13", "ch": "body", "name": "メディカルダイエット", "yomi": "めでぃかる だいえっと（医療のダイエットコース）", "one": "脂肪を溶かす注射に、飲み薬・食事指導（と食欲をおさえる注射）を組み合わせたダイエットコース。", "pts": ["中身は4つのセット。脂肪溶解注射5回＋飲み薬（オルリファスト）1か月分＋食事指導とスムージー。プレミアムはさらにGLP-1注射3本。", "体に入る量もおさえる。注射は「いまある脂肪」、飲み薬は「食べた脂肪の吸収」、GLP-1は「食欲」に働く。", "ダウンタイムはほぼなし。ただし飲み薬で油もれ・油っぽい便などが出ることがある。20歳未満・妊娠中などは受けられない。"]}, {"id": "c6-01", "ch": "skin", "name": "ルメッカピーク（IPL）", "yomi": "るめっかぴーく（あいぴーえる）＝光でシミ・赤みを薄くする", "one": "強い光を顔全体に当てて、シミの色と赤みのもとだけを熱で壊し、薄くしていく光の施術。", "pts": ["シミと赤みを1台で。光が茶色（メラニン）と赤（血管）の両方に反応するので、顔全体をまとめて整えられる。", "シミは一度「濃く」なる。失敗ではなく、壊れた色が表面に出てきた合図。1〜2週間で自然に剥がれる。", "1回で終わりではない。4週間に1回のペースで3〜5回が目安。3回・5回のコース料金がある。"]}, {"id": "c6-02", "ch": "skin", "name": "カスタマイザーIPL", "yomi": "かすたまいざー あいぴーえる＝肌に合わせて調整できる光の施術", "one": "光の「色」をその人の肌と悩みに合わせて調整し、シミ・くすみ・赤み・ニキビ跡をまとめてケアする光の施術。", "pts": ["ルメッカと同じ「光」の仲間。違いは、6種類のフィルターと細かな調整で、肌と悩みに合わせて光を作り分けられること。", "日本人の肌に合わせた設計。やけどなどのリスクをおさえながら、色のもと（メラニン）と細い血管に働きかける、とサイトは説明。", "休みがいらない。肌への負担が少なく、施術直後からメイクして帰れる。顔のほか背中のメニューもある。"]}, {"id": "c6-03", "ch": "skin", "name": "ディスカバリーピコ", "yomi": "でぃすかばりーぴこ＝ピコレーザー（シミ・くすみ・肌質・タトゥー）", "one": "ごく一瞬だけ光るレーザーの衝撃で、シミの色のもとを細かく砕く機械。当て方が3通りある。", "pts": ["1台で3つの当て方。トーニング（弱く広く）／スポット（1個を強く）／フラクショナル（点々と奥へ）。悩みで使い分ける別メニュー。", "肝斑にも使える。出力をおさえ、当たる時間をごく短くしたことで、肝斑（かんぱん）が濃くなるリスクをおさえられる、とサイトは説明。", "シミ以外にも。タトゥー（入れ墨）の除去にも対応。8色に対応できるとしている。"]}, {"id": "c6-04", "ch": "skin", "name": "水光注射（ハイコックス）", "yomi": "すいこうちゅうしゃ＝美容成分を細い針で顔全体に入れる", "one": "うるおい・ハリのもとになる美容成分を、専用の機械の細い針で、顔全体に同じ深さで均一に入れる施術。", "pts": ["「水光」は韓国語から。「水のように光る肌」という意味（ムルグァンピプ）。ハイコックスは、その注入に使う機械の名前。", "メニュー名＝入れる薬の名前。料金表のジュベルック・プルリアルなどは薬（製剤）の名前。機械は同じで、中身と値段が変わる。", "針を使うので跡が出る。針のあと・内出血・小さなふくらみが数日〜1週間。最初は2〜3週間に1回のペースがすすめられている。"]}, {"id": "c6-05", "ch": "skin", "name": "ニードルRF", "yomi": "にーどる あーるえふ＝細い針の先から熱を出す", "one": "とても細い針を肌に刺し、針の先から熱を出して、肌の奥の「ハリを作る層」だけを温める施術。", "pts": ["名前を分解すると中身がわかる。ニードル＝針、RF＝高周波（電気の力で起こす熱）。「針の先から熱を出す機械」という意味。", "ねらいは「ハリを作る層」。熱の刺激でコラーゲンなどの繊維が増え、ニキビ跡・毛穴・小じわ・肝斑に対応する、とサイトは説明。", "効果はゆっくり。実感は1〜3か月後が多い。4〜6週間ごとに3〜6回がすすめられている。"]}, {"id": "c6-06", "ch": "skin", "name": "ブレッシング", "yomi": "ぶれっしんぐ＝斜めの針から「熱」と「薬」を同時に入れる", "one": "細い針を斜めに刺して針先から熱を出し、同じ針から美容成分も入れる、「針＋熱＋薬」の施術。", "pts": ["「針＋熱」に「薬」を足したもの。ニードルRFと同じく針先から熱（高周波）を出すが、同じ針から薬も入れられるのが違い。", "針を斜めに刺すのが特徴。肌の表面に大きな負担をかけずに奥へ届く、とサイトは説明（世界初の「傾斜ニードル」と紹介）。", "値段は「ショット数」と「薬」で決まる。基本の薬はトラネキサム酸。薬を替えると追加料金がかかる。"]}, {"id": "c6-07", "ch": "skin", "name": "キュアジェット", "yomi": "きゅあじぇっと＝針を使わず、空気の圧力で薬を届ける", "one": "針を使わず、空気の圧力で美容成分を肌の奥へ届け、ニキビ跡のへこみの原因もほぐす施術。", "pts": ["針を使わない「入れる」施術。細く速い噴射（ジェット）の力で、美容成分を肌の深い層まで届ける。注射より痛みが少ない、とサイトは説明。", "得意はニキビ跡のへこみ。へこみは、肌の奥で固まった組織が表面を下に引っぱってできる。それを空気の力でほぐす。", "新宿院だけのメニュー。料金は「薬の種類 × 当てる範囲の広さ × 回数」で決まる。"]}, {"id": "c6-08", "ch": "skin", "name": "インモードリフト（Forma／MiniFx）", "yomi": "いんもーどりふと（ふぉーま／みに えふえっくす）＝外から熱で引き締める", "one": "針を使わず、肌の外から高周波の熱を当てて、あご下の脂肪を減らし、肌を引き締める施術。", "pts": ["インモードは会社（機械シリーズ）の名前。FormaとMiniFxは、その機械に付ける2種類の先端の名前。2つを組み合わせた施術を「インモードリフティング」と呼ぶ。", "針を使わない。高周波の熱を肌の外から当てるだけ。施術直後から洗顔・メイクができる。", "深さで役割が違う。MiniFx＝脂肪の層（あご下・フェイスラインをすっきり）、Forma＝表面〜ハリの層（小ジワ・ハリ）。"]}, {"id": "c6-09", "ch": "skin", "name": "モフィウス8バースト", "yomi": "もふぃうす えいと ばーすと＝針＋熱を、脂肪の層まで深く", "one": "24本の細い針を刺し、針から熱を出して、ハリの層から脂肪の層までを引き締める「針＋熱」の施術。", "pts": ["「針＋熱」の中でいちばん深い。ハリの層だけでなく脂肪の層まで熱が届く。だからフェイスライン・二重あごも対象になる。", "表面は守る設計。針の先と、針と機械の頭の間から熱が流れ、肌の表面を傷めずに深い所だけを温める、とサイトは説明。", "効果はゆっくり、回数は3回。1〜3か月かけて引き締まる。4〜8週間おきに3回、その後は半年〜1年ごとのメンテナンスがすすめられている。"]}, {"id": "c6-10", "ch": "skin", "name": "ダーマペン4", "yomi": "だーまぺん ふぉー＝細い針で小さな穴をあけ、肌の治る力を引き出す", "one": "髪の毛より細い針で肌に小さな穴をたくさんあけ、肌が治ろうとする力でハリを作らせる施術。", "pts": ["「針だけ」の施術。熱も電気も使わない。ニードルRFやモフィウス8バーストとの違いは、針の先から熱が出ないこと。", "穴は美容成分の通り道にもなる。薬と組み合わせたメニュー（ヴェルベットスキンなど）がある。", "続けて受けるもの。1回でも変化を感じることはあるが、回数を重ねるほど実感しやすい。目安は1か月に1回。"]}, {"id": "c6-11", "ch": "skin", "name": "サブシジョン", "yomi": "さぶしじょん", "one": "ニキビ跡の凹みを下に引っ張っている硬い筋を、針で切り離して持ち上げる治療。", "pts": ["凹みの「原因」を切る治療。肌の奥の硬い筋（線維）が皮膚を引き込んでいるので、それを針で切り離す。", "1回では終わらない。3〜6回が目安で、2回目以降は4週間以上あける。直後はかえって凸凹が目立つこともある。", "料金は「面積」で決まる。2cm四方〜5cm四方の4サイズ。デイズとあおなぎで同じ金額。"]}, {"id": "c6-12", "ch": "skin", "name": "ピーリング（コラーゲンピール／ミラノリピール）", "yomi": "ぴーりんぐ", "one": "酸の薬を肌に塗って、古い角質の入れ替わりを促し、肌の奥のコラーゲンを増やす施術。", "pts": ["塗るだけの施術。酸の薬を塗ってなじませる。針も機械も使わず、15〜30分で終わる。", "薬は2種類。コラーゲンピールは刺激が少なめ。ミラノリピールは酸が少し濃く、皮むけが起きやすい代わりに肌の入れ替わりを強く促す。", "くり返して育てる施術。2〜4週間に1回のペースで続ける。顔だけでなく、体の妊娠線・肉割れにも使う。"]}, {"id": "c6-13", "ch": "skin", "name": "ハイドラジェントル", "yomi": "はいどらじぇんとる", "one": "薬液をまぜた水の流れで毛穴の汚れを洗い、同時に吸い取る「毛穴そうじ」の施術。", "pts": ["水の流れで洗う「毛穴そうじ」。熱も針も使わない。うずを巻く水流に薬液をのせ、汚れを浮かせて吸い取る。", "1回で3つのケア。クレンジング → ピーリング → 美容液導入を、約30分でまとめて行う。", "痛みもダウンタイムもほぼない。直後からメイクできる。月1回のお手入れとして続けるタイプの施術。"]}, {"id": "c6-14", "ch": "skin", "name": "e-cool（エレクトロポレーション）", "yomi": "いーくーる（えれくとろぽれーしょん）", "one": "電気の力で肌の表面に一時的なすき間を作り、針を使わずに美容成分を奥へ入れる施術。", "pts": ["針を使わない「導入」。電気で肌の表面に一時的なすき間を作り、ビタミンCなどの美容成分を奥へ入れる。痛みはピリピリする程度。", "冷やす機能がある。−5〜−10℃で冷やしながら入れられるので、レーザーなどの後の赤み・ほてりを落ち着かせるケアにも使う。", "続けて効かせるタイプ。効果はすぐ感じられるが、続くのは2週間ほど。2週間に1回が目安。"]}, {"id": "c6-15", "ch": "skin", "name": "ほくろ除去・いぼ除去", "yomi": "ほくろじょきょ・いぼじょきょ", "one": "ほくろ・いぼを、電気メスで丸くくり抜くか、切って縫うかして取りのぞく施術。", "pts": ["「消す」のではなく「取る」。ほくろは色を持つ細胞のかたまりなので、シミのように光で砕くのではなく、物として取りのぞく。", "取り方は大きさと深さで決まる。小さめは電気メスで丸くくり抜く。大きい・盛り上がっている・根が深いものは切って縫う。", "料金は1mmあたり。大きさで金額が決まるので、カウンセリングで大きさを測る。まれに悪性のこともあるため、まず医師が診る。"]}, {"id": "c6-16", "ch": "skin", "name": "内服", "yomi": "ないふく（飲み薬）", "one": "シミやニキビに、体の内側から効かせる医療用の飲み薬。悩みに合わせて組み合わせる。", "pts": ["薬であって、サプリではない。美肌用・ニキビ用の内服は医療用の薬なので、市販のサプリより成分が濃い。そのぶん医師の診察を受けて処方される。", "悩みで組み合わせが決まる。シミ・くすみには「美肌内服」、ニキビには「ニキビ内服」の3種セット。肝斑にはトラネキサム酸が中心。", "すぐには変わらない。3か月〜半年、毎日続けて実感しやすくなる。妊娠中・授乳中は処方しない。"]}, {"id": "c6-17", "ch": "skin", "name": "ドクターズコスメ", "yomi": "どくたーずこすめ", "one": "医療機関だけで買える化粧品。治療のあとや毎日の肌の手入れに、家で使う。", "pts": ["院内の施術の「続き」を家でやる道具。洗顔料・化粧水・美容液・クリーム・日焼け止め・サプリまで、4ブランド22品を扱う。", "医師に選んでもらう。肌に合わないと肌荒れすることがあるため、肌の状態を見て組み合わせを決める。", "魔法の薬ではない。サイト自身が「効果は市販品と大きな差はない。成分や品質の安全面・信頼度で優れる」と説明している。実感は2〜3か月が目安。"]}, {"id": "c6-18", "ch": "skin", "name": "白玉点滴", "yomi": "しらたまてんてき", "one": "美白成分グルタチオンを点滴で血管に入れ、全身のくすみ・シミ予防をねらう美容点滴。", "pts": ["主成分はグルタチオン。シミのもと（メラニン）が作られるのをおさえる成分を、点滴で血管に直接入れる。", "顔だけでなく全身に届く。体や白目のくすみにも期待できる、とサイトは説明。肝臓の働きも助けるので、お酒やタバコをたしなむ人にもすすめている。", "続けて受ける前提。初めての人だと、効果が続くのは数日〜1週間ほど。量は3段階で、多いほど高い。"]}, {"id": "c6-19", "ch": "skin", "name": "医療脱毛", "yomi": "いりょうだつもう", "one": "レーザーの熱で、毛を作る組織を壊して、毛を生えにくくする施術。", "pts": ["光が「黒い色」にだけ反応する。毛の黒い色（メラニン）がレーザーを吸って熱くなり、その熱で毛を作る組織を壊す。", "1回では終わらない。毛には生えかわりの周期があるので、約1.5〜2か月おき（顔は1か月おき）に通い、5回ほどで実感する人が多い。", "デイズの機械は「痛みが少なめ・肌を選びにくい」タイプ。ダイオードレーザーで、うぶ毛や、多少の日焼け肌にも対応できると説明している。"]}, {"id": "c6-20", "ch": "skin", "name": "ワキ汗治療", "yomi": "わきあせちりょう（ワキガ・多汗症）", "one": "ワキのにおい・汗のもとになる汗腺を、手術で取りのぞくか、注射で働きを止める治療。", "pts": ["「におい」と「汗の量」は別の悩み。におい（ワキガ）はアポクリン汗腺、量が多い汗（多汗症）はエクリン汗腺が原因。", "手術は「取る」ので長く続く。傷が小さい吸引シェービング法と、重い症状向けに大きく切る剪除法の2種類。術後はワキを固定して安静にする。", "注射は「止める」ので手軽だが期限つき。ボトックスは切らずに受けられるが、数か月で効果が切れる。"]}]</script>
<script>
(function(){
"use strict";
var Q = JSON.parse(document.getElementById('qdata').textContent);
var CH = JSON.parse(document.getElementById('cdata').textContent);
var MENUS = JSON.parse(document.getElementById('mdata').textContent);
var TEXTBOOK = "https://huchida-sys.github.io/beauty-menu-study/guide/";
var byId = {}; Q.forEach(function(q){ byId[q.id] = q; });
var mById = {}; MENUS.forEach(function(m){ mById[m.id] = m; });
var chByKey = {}; CH.forEach(function(c){ chByKey[c.key] = c; });
var INTERVAL = [0, 1, 3, 7, 21];        // 箱ごとの次の出題までの日数（ライトナー方式）
var MASTER = 3;                          // 日を変えて3回続けて正解（箱3以上）＝定着
var K = 'beauty-drill-v3', KS = K + '-session';     // v3＝応用／Dr級に作り直した問題（旧 v2 の成績とは混ぜない）
var LV = [[0, '両方'], ['apply', '応用'], ['dr', 'Dr級']];
var LVN = {apply:'応用', dr:'Dr級'};

// ---------- 日付 ----------
function ymd(d){ d = d || new Date(); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function addDays(s, n){ var p = s.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate()+n); return ymd(d); }
var TODAY = ymd();
function refreshDay(){ var t = ymd(); if (t !== TODAY) { TODAY = t; return true; } return false; }

// ---------- 保存（この端末のブラウザ。使えない環境でも動く） ----------
function load(k, def){ try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch(e){ return def; } }
function store(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
var db = load(K, null);
if (!db || !db.s) {
  db = {s:{}, x:{}, days:[], pref:{size:10, level:0}};
  var v2 = load('beauty-drill-v2', null);           // 旧版からは「問題数」の設定だけ引き継ぐ（問題が全部入れ替わったため成績は引き継がない）
  if (v2 && v2.pref && [5, 10, 20].indexOf(v2.pref.size) >= 0) db.pref.size = v2.pref.size;
}
function fixPref(){ db.x = db.x || {}; db.days = db.days || []; db.pref = db.pref || {size:10, level:0};
  if ([5, 10, 20].indexOf(db.pref.size) < 0) db.pref.size = 10;
  if (!LV.some(function(x){ return x[0] === db.pref.level; })) db.pref.level = 0; }
fixPref();
function save(){ store(K, db); }

// ---------- 記憶の箱 ----------
function rec(box, id, result){          // result: 'sure' | 'unsure' | 'wrong'
  var s = box[id] || {n:0, c:0, last:null, box:0, due:null, d:null, g:0};
  var prev = JSON.parse(JSON.stringify(s));
  s.n++;
  if (result === 'wrong') { s.last = 0; s.box = 1; s.due = addDays(TODAY, 1); s.g = 0; }
  else {
    s.c++; s.last = 1;
    if (result === 'unsure') { s.g = 1; if (s.box < 1) s.box = 1; s.due = addDays(TODAY, 1); }
    else { s.g = 0; if (s.d !== TODAY || s.box === 0) s.box = Math.min(s.box + 1, 4); s.due = addDays(TODAY, Math.max(1, INTERVAL[s.box])); }
  }
  s.d = TODAY; box[id] = s;
  if (db.days.indexOf(TODAY) < 0) { db.days.push(TODAY); db.days = db.days.slice(-60); }
  save(); return prev;
}
function isDue(st){ return !!(st && st.due && st.due <= TODAY); }
function mastered(st){ return !!(st && st.box >= MASTER && st.last === 1 && !st.g); }
function counts(){
  var seen = 0, mas = 0, due = 0, xok = 0, xdue = 0;
  Q.forEach(function(q){ var s = db.s[q.id]; if (!s) return; seen++; if (mastered(s)) mas++; if (isDue(s)) due++; });
  MENUS.forEach(function(m){ var s = db.x[m.id]; if (!s) return; if (s.last === 1 && !s.g) xok++; if (isDue(s)) xdue++; });
  return {seen:seen, mas:mas, due:due, xok:xok, xdue:xdue};
}
function chapterCounts(key){
  var qs = Q.filter(function(q){ return q.ch === key && lvOK(q); }), m = 0, p = 0, r = 0, lv = {apply:{n:0, m:0}, dr:{n:0, m:0}};
  Q.forEach(function(q){ if (q.ch !== key || !lv[q.level]) return; lv[q.level].n++; if (mastered(db.s[q.id])) lv[q.level].m++; });
  qs.forEach(function(q){ var s = db.s[q.id]; if (!s) return; if (mastered(s)) m++; else if (isDue(s) || s.last === 0) r++; else p++; });
  return {n:qs.length, m:m, p:p, r:r, lv:lv};
}
function lvTotal(l){ return Q.filter(function(q){ return q.level === l; }).length; }
function dueTomorrow(){ var t = addDays(TODAY, 1); return Q.filter(function(q){ var s = db.s[q.id]; return s && s.due && s.due <= t; }).length; }

// ---------- 出題の選び方 ----------
function shuffle(a){ a = a.slice(); for (var i = a.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function lv1Passed(card){ return Q.some(function(q){ var s = db.s[q.id]; return q.card === card && q.level === 'apply' && s && s.c > 0; }); }
function hasLv1(card){ return Q.some(function(q){ return q.card === card && q.level === 'apply'; }); }
function spread(list){   // カードごとに教材の順で1問ずつ順番に取り（1周目＝各カードの1問目）、さらに同じカードの問題は間を3問以上あける（前の解説が次の答えにならないように）
  var groups = [], gi = {}, src = [], out = [], r, g;
  list.forEach(function(q){ if (!(q.card in gi)) { gi[q.card] = groups.length; groups.push([]); } groups[gi[q.card]].push(q); });
  for (r = 0; ; r++) { var any = false; for (g = 0; g < groups.length; g++) if (groups[g][r]) { src.push(groups[g][r]); any = true; } if (!any) break; }
  while (src.length) {
    var recent = out.slice(-3).map(function(q){ return q.card; }), k = 0;
    while (k < src.length && recent.indexOf(src[k].card) >= 0) k++;
    if (k === src.length) k = 0;
    out.push(src.splice(k, 1)[0]);
  }
  return out;
}
function newPool(filter, noGate){   // まだ解いていない問題を教材の順に（同じカードは続けない）。Dr級は、同じカードの応用に1問正解してから
  if (db.pref.level === 'dr') noGate = true;
  return spread(Q.filter(function(q){ return !db.s[q.id] && (!filter || filter(q)) && (noGate || q.level !== 'dr' || !hasLv1(q.card) || lv1Passed(q.card)); }));
}
function duePool(filter){   // 復習の期限が来た問題を、期限の古い順に
  return Q.filter(function(q){ return isDue(db.s[q.id]) && (!filter || filter(q)); })
          .sort(function(a, b){ var x = db.s[a.id].due, y = db.s[b.id].due; return x < y ? -1 : x > y ? 1 : 0; });
}
function todayPlan(){
  var size = db.pref.size || 10, dueAll = duePool(lvOK);   // 今日の問題にも「難しさ」を効かせる
  var due = dueAll.slice(0, Math.max(0, size - 3)), fresh = newPool(lvOK).slice(0, size - due.length);
  if (due.length + fresh.length < size) due = dueAll.slice(0, size - fresh.length);
  return {due:due, fresh:fresh};
}
function introLv(){ return db.pref.level === 'dr' ? 'dr' : 'apply'; }   // はじめての5問の難しさ（「両方」「応用」は応用）
function lvOK(q){ return !db.pref.level || q.level === db.pref.level; }

// ---------- セッション（1問ごとに保存。24時間以内なら続きから） ----------
var S = load(KS, null);
if (S && (S.done || Date.now() - (S.t || 0) > 48*3600*1000 || !S.items || S.items.some(function(it){ return S.mode === 'x' ? !mById[it.id] : !byId[it.id]; }))) { S = null; store(KS, null); }
var view = 'home', sheet = null, ui = {};
function persist(){ if (S && !S.done) { S.t = Date.now(); store(KS, S); } else store(KS, null); }
function begin(mode, ids, label, kind, norecord, force){
  if (S && !S.done && !force && view === 'home') { ui.pending = [mode, ids, label, kind, norecord]; sheet = 'discard'; render(); return; }
  ids = ids.filter(function(v, i, a){ return a.indexOf(v) === i; });
  if (!ids.length) return;
  var c = counts();
  S = {mode:mode, kind:kind, label:label, norecord:!!norecord, items:ids.map(function(id){ return {id:id, order:shuffle([0,1,2,3])}; }),
       i:0, picked:null, res:[], prev:null, requeued:0, streak:0, day:TODAY, before:{mas:c.mas, seen:c.seen}, t:Date.now()};
  persist(); go('quiz');
}
function go(v){
  view = v; sheet = null;
  try { if (v !== 'home') history.pushState({v:v}, ''); } catch(e){}
  render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', function(){
  if (sheet) { sheet = null; if (view === 'quiz' && S && !S.done) { try { history.pushState({v:'quiz'}, ''); } catch(e){} } render(); return; }
  if (view === 'quiz' && S && !S.done) { sheet = 'quit'; try { history.pushState({v:'quiz'}, ''); } catch(e){} render(); return; }
  if (S && S.done) S = null;
  view = 'home'; render();
});

// ---------- 小物 ----------
// 日本語を文節の切れ目でだけ折り返すための <wbr> を入れる（句読点・カッコ・助詞のあと）
function jb(t){
  var e = esc(t);
  e = e.replace(/([、。・／！？」』）】〉：])/g, '$1<wbr>');
  e = e.replace(/([「『（【〈])/g, '<wbr>$1');
  e = e.replace(/(から|まで|より|では|には|とは|でも|ので|ため|は|が|を|に|で|と|も|へ|や|の|か|て)(?=[^\u3040-\u309f<、。・）」』！？ー〜…])/g, '$1<wbr>');
  return e;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function chName(k){ return chByKey[k] ? chByKey[k].name : ''; }
function cardTitle(q){ var c = chByKey[q.ch]; return c && c.cards[q.card] || ''; }
function tbLink(card, title, chapter){
  return '<a class="tb-link" href="' + TEXTBOOK + '#' + encodeURIComponent(card) + '" target="kyozai">' + icon('book') +
         '<div>教材で読み直す<span>' + esc(chapter ? chapter + '「' + title + '」' : title) + '</span></div><span class="arr">↗</span></a>';
}

function icon(n, size){ return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"' + (size ? ' style="width:' + size + 'px;height:' + size + 'px;flex-basis:' + size + 'px"' : '') + '>' + (ICONS[n] || '') + '</svg>'; }
function ring(p, seen){
  function arc(r, w, v, op){ var c = 2*Math.PI*r; return '<circle cx="44" cy="44" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="' + w + '"/>' +
    (v > 0 ? '<circle cx="44" cy="44" r="' + r + '" fill="none" stroke="var(--teal)" stroke-opacity="' + op + '" stroke-width="' + w + '" stroke-linecap="round" stroke-dasharray="' + Math.max(0.01, c*v).toFixed(1) + ' ' + c.toFixed(1) + '"/>' : ''); }
  return '<svg viewBox="0 0 88 88" aria-hidden="true">' + arc(40, 5, seen, .38) + arc(32, 8, p, 1) + '</svg>';
}
function weekDots(){
  var out = '', names = ['日','月','火','水','木','金','土'], n = 0;
  for (var k = 6; k >= 0; k--) {
    var d = addDays(TODAY, -k), on = db.days.indexOf(d) >= 0; if (on) n++;
    var p = d.split('-'); var dow = new Date(+p[0], +p[1]-1, +p[2]).getDay();
    out += '<i class="' + (on ? 'on' : '') + (k === 0 ? ' today' : '') + '">' + names[dow] + '</i>';
  }
  return '<div class="week" role="img" aria-label="この7日で学習した日は' + n + '日">' + out + '<span class="lab">この7日で <b class="num" style="color:var(--fg)">' + n + '</b>日</span></div>';
}

  CH.forEach(function(ch){
