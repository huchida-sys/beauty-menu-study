<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>美容メニュー 4択ドリル</title>
<meta property="og:title" content="美容メニュー 4択ドリル">
<meta property="og:description" content="全83メニューの教材から296問。毎日10問・間をあけた復習・説明チャレンジ（社内向け）">
<meta property="og:type" content="website">
<meta name="theme-color" content="#24507a">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* コンセプト「カルテ・コーチ」：診療ノートの清潔感に、1問ごとの手応え。
   レイアウト：スマホは1列（上に進み具合、下に親指で押す操作帯）／PCはホームを2列、出題は中央720px */
:root{
  --bg:#f5f7f9; --surface:#ffffff; --surface-2:#eef2f6; --line:#dfe5eb;
  --fg:#1d2733; --sub:#56646f; --faint:#5f6c78;
  --acc:#24507a; --acc-hover:#1c4266; --on-acc:#ffffff; --link:#24507a; --acc-soft:rgba(36,80,122,.07);
  --teal:#1f9e9a; --teal-ink:#147a76; --teal-soft:#e6f5f4; --ao:#1D7FAB;
  --on-ok:#ffffff; --on-ng:#ffffff; --on-teal:#ffffff;
  --ok:#237a52; --ok-soft:#e5f3eb; --ng:#b8432f; --ng-soft:#fbecea;
  --review:#8a5d00; --review-soft:#fff4dc;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --num:"Inter","Hiragino Sans",system-ui,sans-serif;
  --r-card:16px; --r-ctl:12px;
  --shadow:0 1px 2px rgba(20,40,60,.06),0 6px 20px rgba(20,40,60,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161d; --surface:#18212b; --surface-2:#212c38; --line:#2c3946;
  --fg:#e8eef4; --sub:#a3b3c2; --faint:#8494a3;
  --acc:#3a72a8; --acc-hover:#2f6496; --on-acc:#ffffff; --link:#8bbbe6; --acc-soft:rgba(139,187,230,.10);
  --teal:#5cc9c4; --teal-ink:#5cc9c4; --teal-soft:#16302f; --on-ok:#0e1a14; --on-ng:#2a100c; --on-teal:#0b2423; --ao:#62b6dd;
  --ok:#6fcf97; --ok-soft:#173326; --ng:#ff8a7a; --ng-soft:#3a201c;
  --review:#f0c46a; --review-soft:#352a12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#18212b; --surface-2:#212c38; --line:#2c3946;
  --fg:#e8eef4; --sub:#a3b3c2; --faint:#8494a3;
  --acc:#3a72a8; --acc-hover:#2f6496; --on-acc:#ffffff; --link:#8bbbe6; --acc-soft:rgba(139,187,230,.10);
  --teal:#5cc9c4; --teal-ink:#5cc9c4; --teal-soft:#16302f; --on-ok:#0e1a14; --on-ng:#2a100c; --on-teal:#0b2423; --ao:#62b6dd;
  --ok:#6fcf97; --ok-soft:#173326; --ng:#ff8a7a; --ng-soft:#3a201c;
  --review:#f0c46a; --review-soft:#352a12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg); color:var(--fg)}
body{font-family:var(--f); font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%}
button,a{font:inherit; color:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
button{cursor:pointer; background:none; border:0; padding:0}
button[disabled]{cursor:default; opacity:.5}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link); outline-offset:3px; border-radius:6px}
.num{font-family:var(--num); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
h1,h2,h3,.qtext,.name,.nm,.jp{font-feature-settings:"palt"}
.qtext,.choice,.verdict p,.nm,.jp,.misses summary,.xcard .name,.answer .one,.explain-entry b{word-break:keep-all; overflow-wrap:anywhere; line-break:strict}
h1,h2,h3{margin:0; line-height:1.4}
.wrap{max-width:640px; margin:0 auto; padding-inline:16px; padding-block:16px 40px; display:flex; flex-direction:column; gap:20px}
.sub{color:var(--sub); font-size:14px}
.tiny{font-size:12px; color:var(--faint)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card)}
.btn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:52px; padding:10px 16px; border-radius:var(--r-ctl); font-weight:700; font-size:16px; width:100%; text-align:center; line-height:1.4}
.btn.primary{background:var(--acc); color:var(--on-acc)}
.btn.primary:hover{background:var(--acc-hover)}
.btn.secondary{background:var(--surface); border:1.5px solid var(--line); color:var(--fg)}
.btn small{font-weight:400; font-size:13px; opacity:.85; display:block}
.btn .ico{margin-right:4px}
.btn.inline{flex-direction:row; gap:8px}
.row{display:flex; gap:10px}
.row>*{flex:1 1 0; min-width:0}
.badge{display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px; padding:0 7px; border-radius:999px; font:700 12px/1 var(--num); background:var(--review-soft); color:var(--review)}
.pill{display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--surface-2); color:var(--sub); white-space:nowrap}
.pill.lv1{background:transparent; border:1px solid var(--line)}
.pill.lv2{background:var(--acc-soft); color:var(--link); box-shadow:inset 0 0 0 1px var(--link)}
.ico{width:22px; height:22px; flex:0 0 22px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

/* ---------- ホーム ---------- */
.brand{display:flex; align-items:center; gap:12px}
.brand .mark{width:40px; height:40px; border-radius:12px; background:var(--acc); color:var(--on-acc); display:grid; place-items:center; flex:0 0 40px}
.brand h1{font-size:20px}
.brand p{margin:0; font-size:12px; color:var(--faint); line-height:1.5}
.resume{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--r-card); background:var(--acc-soft); border:1.5px solid var(--link); text-align:left; width:100%; min-height:64px}
.resume b{display:block; font-size:16px}
.resume span{font-size:13px; color:var(--sub)}
.resume .go{margin-left:auto; font-size:24px; color:var(--link)}
.hero{padding:20px; display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow)}
.hero-top{display:flex; align-items:center; gap:18px}
.ring{position:relative; width:88px; height:88px; flex:0 0 88px}
.ring svg{width:88px; height:88px; transform:rotate(-90deg)}
.ring .v{position:absolute; inset:0; display:grid; place-items:center; text-align:center; line-height:1.15}
.ring .v b{font:800 24px/1 var(--num)}
.ring .v small{font:700 12px var(--num)}
.ring .v span{display:block; font-size:11px; color:var(--sub)}
.kpis{display:flex; flex-direction:column; gap:4px; min-width:0}
.kpis div{display:flex; align-items:baseline; gap:6px; font-size:13px; color:var(--sub); flex-wrap:wrap}
.kpis .dot{width:8px; height:8px; border-radius:50%; background:var(--teal); align-self:center; flex:0 0 8px}
.kpis b{font:700 18px/1.3 var(--num); color:var(--fg)}
.week{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--sub); flex-wrap:wrap}
.week i{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-style:normal; font-size:11px; color:var(--faint)}
.week i.on{background:var(--teal-ink); border-color:var(--teal-ink); color:var(--on-teal); font-weight:700}
.week i.today{border-color:var(--teal-ink); border-width:2px}
.week .lab{margin-left:auto}
.today-btn{align-items:flex-start; text-align:left; padding:16px 18px; min-height:76px}
.today-btn b{font-size:18px}
.today-btn span{font-size:13px; opacity:.9; font-weight:400}
.done-today{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-ctl); background:var(--teal-soft); color:var(--fg); font-size:14px}
.done-today .ck{width:28px; height:28px; border-radius:50%; background:var(--teal-ink); color:var(--on-teal); display:grid; place-items:center; font-weight:700; flex:0 0 28px}
.sec{display:flex; flex-direction:column; gap:10px}
.sec h2{font-size:16px; display:flex; align-items:center; gap:8px}
.sec h2 .tiny{font-weight:400; margin-left:auto}
.explain-entry{display:flex; align-items:center; gap:14px; padding:14px 16px; text-align:left; width:100%; min-height:72px}
.explain-entry .ic{width:44px; height:44px; border-radius:12px; background:var(--teal-soft); color:var(--teal); display:grid; place-items:center; flex:0 0 44px}
.explain-entry b{display:block; font-size:16px; line-height:1.45}
.explain-entry span{font-size:13px; color:var(--sub)}
.explain-entry .chev,.ch .chev{font-size:24px; color:var(--faint)}
.chev{color:var(--faint); font-size:22px; margin-left:auto}
.chapters{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.ch{display:grid; grid-template-columns:40px minmax(0,1fr) auto; align-items:center; gap:6px 12px; width:100%; padding:12px 12px 12px 14px; text-align:left; min-height:68px}
.ch .ic-wrap{grid-row:span 2; width:40px; height:40px; border-radius:10px; background:var(--surface-2); color:var(--link); display:grid; place-items:center}
.ch .nm{font-weight:700; font-size:15px; min-width:0; line-height:1.4}
.ch .meta{font-size:12px; color:var(--sub); white-space:nowrap; display:flex; gap:6px; align-items:center}
.ch .chev{grid-row:span 2}
.mastered{color:var(--teal-ink); font-weight:700}
.ch .r2{grid-column:2; display:flex; align-items:center; gap:10px}
.ch .r2 .bar{flex:1}
.bar{height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; display:flex}
.bar i{display:block; height:100%}
.bar .m{background:var(--teal)} .bar .p{background:var(--teal); opacity:.38} .bar .r{background:var(--review)}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--sub)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.custom summary{list-style:none; cursor:pointer; min-height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-weight:700; font-size:15px}
.custom summary::-webkit-details-marker{display:none}
.custom summary::after{content:"＋"; color:var(--faint); font-weight:400; font-size:18px}
.custom[open] summary::after{content:"−"}
.custom .in{padding:0 16px 16px; display:flex; flex-direction:column; gap:14px}
.setting{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.setting label{font-size:14px; color:var(--sub)}
.seg{display:inline-flex; border:1.5px solid var(--line); border-radius:var(--r-ctl); overflow:hidden; background:var(--surface)}
.seg button{min-width:58px; min-height:44px; padding:0 12px; font-size:15px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--acc); color:var(--on-acc); font-weight:700}
.help{font-size:13px; color:var(--faint); margin:-6px 0 0; line-height:1.6}
.foot{display:flex; flex-direction:column; gap:10px; font-size:13px; color:var(--sub)}
.foot .links{display:flex; flex-wrap:wrap; gap:0 16px}
.foot .links .danger{color:var(--ng)}
.foot .links button,.foot .links a{min-height:44px; display:inline-flex; align-items:center; color:var(--link); text-decoration:underline; text-underline-offset:3px; font-size:13px}
textarea{width:100%; min-height:90px; font:12px/1.5 ui-monospace,monospace; border:1.5px solid var(--line); border-radius:10px; padding:10px; background:var(--surface); color:var(--fg)}
.onboard{padding:22px 20px; display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow)}
.onboard h2{font-size:20px}
.steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; counter-reset:s}
.steps li{display:grid; grid-template-columns:30px minmax(0,1fr); gap:12px; font-size:15px; counter-increment:s; line-height:1.6}
.steps li::before{content:counter(s); width:30px; height:30px; border-radius:50%; background:var(--acc-soft); color:var(--link); display:grid; place-items:center; font:700 14px var(--num)}
.steps b{display:block}
.steps .sub{font-size:13px}

/* ---------- 出題 ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; align-items:center; gap:12px; padding:6px 0; margin-top:-8px}
.xbtn{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; color:var(--sub); flex:0 0 44px}
.xbtn:hover{background:var(--surface-2)}
.dots{flex:1; display:flex; gap:4px; min-width:0}
.dots i{flex:1; height:6px; border-radius:3px; background:var(--surface-2)}
.dots i.ok{background:var(--ok)} .dots i.ng{background:var(--ng)} .dots i.cur{background:var(--acc)}
.dots i.re{background:transparent; box-shadow:inset 0 0 0 1.5px var(--review)}
.counter{font:700 14px var(--num); color:var(--sub); white-space:nowrap}
.qhead{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.streak{margin-left:auto; font-size:13px; font-weight:700; color:var(--teal-ink)}
.qtext{font-size:20px; font-weight:700; line-height:1.6; margin:0; letter-spacing:.02em}
.choices{display:flex; flex-direction:column; gap:10px}
.choice{position:relative; display:grid; grid-template-columns:34px minmax(0,1fr); gap:4px 12px; align-items:center; text-align:left; width:100%; min-height:60px; padding:12px 14px; border-radius:var(--r-ctl); border:1.5px solid var(--line); background:var(--surface); font-size:16px; line-height:1.6; letter-spacing:.01em; transition:border-color .15s, background .15s}
.choice .k{grid-row:span 2; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); font:700 14px var(--num); color:var(--sub)}
.choice:not([disabled]):hover{border-color:var(--link)}
.choice:not([disabled]):active{transform:scale(.99)}
.choice[disabled]{cursor:default; opacity:1}
.choice .tag{justify-self:start; font-size:13px; font-weight:700; padding:1px 8px; border-radius:999px; line-height:1.6}
.choice.right{border-color:var(--ok); background:var(--ok-soft)}
.choice.right .k{background:var(--ok); color:var(--on-ok)}
.choice.right .tag{background:var(--ok); color:var(--on-ok)}
.choice.wrong{border-color:var(--ng)}
.choice.wrong .k{background:var(--ng); color:var(--on-ng)}
.choice.wrong .tag{background:var(--ng-soft); color:var(--ng)}
.choice.other{color:var(--sub)}
@media (max-width:700px){
  .choice.other{min-height:44px; padding:8px 14px}
  .choice.other>span:nth-child(2){white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
  .choice.other .k{width:28px; height:28px}
}
.choice .k{position:relative}
.choice .mk{position:absolute; right:-5px; top:-5px; width:18px; height:18px; border-radius:50%; display:grid; place-items:center; background:var(--surface); box-shadow:0 0 0 1.5px currentColor}
.choice .mk svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.choice.right .mk{color:var(--ok)} .choice.wrong .mk{color:var(--ng)}
.verdict .correct{margin:0; font-size:16px; font-weight:700; line-height:1.6; color:var(--fg)}
.verdict .correct .kk{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--ok); color:var(--on-ok); font:700 13px var(--num); margin-right:6px; vertical-align:2px}
.hico{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.choice.pop .k{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.verdict{padding:16px 16px 12px; display:flex; flex-direction:column; gap:10px; border-left:4px solid var(--ok); animation:rise .25s ease-out}
.verdict.ng{border-left-color:var(--ng)}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.verdict h3{font-size:20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.verdict.ok h3{color:var(--ok)} .verdict.ng h3{color:var(--ng)}
.verdict h3 .ans{color:var(--fg); font-size:16px}
.verdict h3 .ask{flex-basis:100%; font-size:13px; font-weight:400; color:var(--sub)}
.verdict p{margin:0; font-size:15px; line-height:1.85}
.tb-link{display:flex; align-items:center; gap:10px; min-height:52px; padding:10px 12px; border-radius:10px; background:var(--acc-soft); color:var(--link); text-decoration:none; font-size:14px; font-weight:700; line-height:1.45}
.tb-link div{min-width:0}
.tb-link span{font-weight:400; color:var(--sub); display:block; font-size:13px}
.tb-link .arr{margin-left:auto; flex:0 0 auto}
.undo{align-self:flex-start; font-size:13px; color:var(--sub); text-decoration:underline; text-underline-offset:3px; min-height:44px; padding:0 4px}
.actionbar{position:sticky; bottom:0; z-index:5; background:var(--bg); border-top:1px solid var(--line); box-shadow:0 -6px 16px rgba(20,40,60,.06); padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; margin-bottom:-28px}
.actionbar .row .btn{min-height:58px}
.actionbar .row .undo-ico{flex:0 0 56px; padding:6px 0; font-size:20px; color:var(--sub)}
.actionbar .row .undo-ico small{font-size:11px}
.actionbar.idle{border-top:0; box-shadow:none; padding:0; background:transparent}
.keys{font-size:12px; color:var(--faint); text-align:center; display:none; margin:0}
@media (hover:hover) and (min-width:900px){ .keys{display:block} }

/* 説明チャレンジ */
.xcard{padding:24px 18px; display:flex; flex-direction:column; gap:10px; text-align:center; align-items:center}
.xcard .lab{font-size:13px; color:var(--sub)}
.xcard .name{font-size:26px; font-weight:700; line-height:1.4}
.xcard .yomi{font-size:14px; color:var(--faint)}
.xhint{font-size:14px; color:var(--sub); text-align:center; margin:0}
.answer{padding:16px; display:flex; flex-direction:column; gap:10px; border-left:4px solid var(--teal); animation:rise .25s ease-out}
.answer .one{font-size:17px; font-weight:700; line-height:1.75; margin:0}
.answer ol{margin:0; padding-left:1.3em; font-size:14.5px; line-height:1.8}
.rate{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.rate .btn{min-height:62px; font-size:15px; padding:8px 6px}

/* シート（中断の確認） */
.sheet-bg{position:fixed; inset:0; z-index:20; background:rgba(10,18,26,.45); display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:520px; background:var(--surface); border-radius:20px 20px 0 0; padding:22px 16px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet h3{font-size:18px}
.sheet p{margin:0 0 4px; font-size:14px; color:var(--sub)}

/* ---------- 結果 ---------- */
.result-top{padding:22px 20px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow)}
.score{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap}
.score b{font:800 56px/1 var(--num); letter-spacing:-.03em}
.score span{font:700 22px var(--num); color:var(--sub)}
.score em{font-style:normal; font-size:16px; color:var(--sub); margin-left:6px}
.rdots{display:flex; flex-wrap:wrap; gap:6px}
.rdots i{width:14px; height:14px; border-radius:50%; background:var(--ok)}
.rdots i.ng{background:transparent; box-shadow:inset 0 0 0 2px var(--ng)}
.rdots i.un{background:var(--ok); opacity:.45}
.delta{display:flex; flex-wrap:wrap; gap:8px}
.delta span{font-size:13px; padding:5px 11px; border-radius:999px; background:var(--surface-2); color:var(--sub)}
.delta b{font-family:var(--num); color:var(--fg)}
.msg{margin:0; font-size:15px; line-height:1.8}
.misses{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.misses details{padding:12px 14px}
.misses summary{list-style:none; cursor:pointer; font-weight:700; font-size:15px; line-height:1.6; position:relative; padding-right:26px}
.misses summary::after{content:"＋"; position:absolute; right:0; top:0; color:var(--faint); font-weight:400}
.misses details[open] summary::after{content:"−"}
.misses summary::-webkit-details-marker{display:none}

<script id="qdata" type="application/json">[{"id": "k-aging-1", "ch": "k1", "card": "k-aging", "level": 1, "q": "年齢を重ねて顔の中で起きる変化として、教材にあるのは？", "choices": ["骨が太くなって前に出る", "脂肪が上へ移動する", "皮膚が厚くなる", "骨がやせ、靭帯がゆるむ"], "answer": 3, "explain": "たるみは、骨がやせる・脂肪が下がる／減る・靭帯がゆるむ・皮膚がのびて薄くなる、の4つの変化が重なって起きる。骨が太くなるわけではない。"}, {"id": "k-aging-2", "ch": "k1", "card": "k-aging", "level": 2, "q": "顔の中身が「減った・くぼんだ」ときに使う原理は？", "choices": ["②足す（ヒアルロン酸注射・脂肪注入）", "①減らす（顔の脂肪吸引）", "④引き上げる（HIFU・糸リフト）", "⑤肌を生まれ変わらせる（ピコレーザー）"], "answer": 0, "explain": "下がったなら上げる、減ったなら足す、余ったなら減らす。くぼみにはヒアルロン酸注射や脂肪注入で「足す」。減ったのに脂肪を取ると逆効果。"}, {"id": "k-aging-3", "ch": "k1", "card": "k-aging", "level": 1, "q": "年齢を重ねると、顔の下半分はどう見えやすくなる？", "choices": ["Vの形になる", "丸く小さくなる", "四角く見える", "細長くなる"], "answer": 2, "explain": "ほおのクッション（脂肪）が下がると、上はくぼみ、下はもたつく。重心がVの形から四角へ変わり、顔の下半分が四角く見えるようになる。"}, {"id": "k-body-1", "ch": "k1", "card": "k-body", "level": 1, "q": "脂肪吸引で取れる脂肪はどれ？", "choices": ["内臓脂肪（筋肉の壁の内側）", "皮下脂肪と内臓脂肪の両方", "皮下脂肪（つまめる脂肪）", "おなかの脂肪は吸引では取れない"], "answer": 2, "explain": "脂肪吸引で取れるのは、皮膚のすぐ下のつまめる脂肪（皮下脂肪）だけ。内臓脂肪は筋肉の壁の内側にあり、吸引の管を入れる場所ではないので取れない。"}, {"id": "k-body-2", "ch": "k1", "card": "k-body", "level": 1, "q": "豊胸のバッグや脂肪について正しいのは？", "choices": ["乳腺の中に入れる", "肋骨の内側に入れる", "内臓脂肪の層に入れる", "乳腺そのものには入れない"], "answer": 3, "explain": "豊胸は乳腺そのものには入れない。シリコンバッグは乳腺より奥（乳腺の下や大胸筋の下など）に置き、脂肪注入では脂肪の層などに自分の脂肪を足す。"}, {"id": "k-body-3", "ch": "k1", "card": "k-body", "level": 2, "q": "シリコンバッグ豊胸と脂肪注入の豊胸は、5つの原理ではどれにあたる？", "choices": ["どちらも②足す", "バッグは②足す、脂肪注入は③移す", "どちらも④引き上げる", "バッグは④引き上げる、脂肪注入は②足す"], "answer": 0, "explain": "どちらも胸に物を入れてふくらませるので原理は「②足す」。③移すは、目の下の脂肪をすぐ下のみぞへ動かすように同じ場所の中で位置を変えること。脂肪注入は別の場所から取って胸に足す。"}, {"id": "k-eye-1", "ch": "k1", "card": "k-eye", "level": 1, "q": "目頭切開で切るのはどこ？", "choices": ["涙袋のふくらみ", "二重のラインの皮膚", "目尻にある皮膚", "目頭にかぶさる皮膚"], "answer": 3, "explain": "蒙古ひだは目頭にかぶさる皮膚のひだ。目頭切開はここを切って、目を内側に広げる。涙袋や二重のラインとは別の場所で、目尻側を広げるのは目尻切開。"}, {"id": "k-eye-2", "ch": "k1", "card": "k-eye", "level": 2, "q": "涙袋について正しいのは？", "choices": ["クマの原因の「目の下のふくらみ」とは別もの", "クマのふくらみと同じもの", "目玉のクッションの脂肪が前に出たもの", "上まぶたにあるふくらみ"], "answer": 0, "explain": "涙袋は下まつ毛のすぐ下の小さなふくらみで、中身は目のまわりの筋肉（眼輪筋）。目玉のクッションの脂肪が前に出てできるクマのふくらみとは別もの。"}, {"id": "k-eye-3", "ch": "k1", "card": "k-eye", "level": 1, "q": "上まぶたで、目を開ける筋肉はどれ？", "choices": ["眼輪筋", "挙筋", "瞼板", "SMAS"], "answer": 1, "explain": "目を開けるのは挙筋で、その力を硬い板（瞼板）が受ける。眼輪筋は目を閉じる筋肉、瞼板は筋肉ではなくまぶたの縁の芯、SMASは顔の筋肉の膜。"}, {"id": "k-eye2-1", "ch": "k1", "card": "k-eye2", "level": 2, "q": "眼瞼下垂（がんけんかすい）は、何の問題？", "choices": ["皮膚の折り目（二重かどうか）の問題", "脂肪のふくらみと溝の段差の問題", "皮膚から血管が透ける問題", "まぶたを開く力の問題"], "answer": 3, "explain": "二重は皮膚の「折り目」の話、眼瞼下垂は上げる筋肉の力が伝わらない「開く力」の話。原因が別なので、メニューも別。段差の影はクマの話。"}, {"id": "k-eye2-2", "ch": "k1", "card": "k-eye2", "level": 2, "q": "二重埋没法は、二重の人にある何の代わりを糸で作る？", "choices": ["目を上げる筋肉からの細い枝", "まぶたの中の硬い板（瞼板）", "目玉のクッションの脂肪", "目頭にかぶさる蒙古ひだ"], "answer": 0, "explain": "二重の人は、上げる筋肉から皮膚へ細い枝がのびていて、目を開けると皮膚が奥へ引きこまれる。埋没法はこの枝の代わりを糸で、切開法は切って縫って作る。"}, {"id": "k-eye2-3", "ch": "k1", "card": "k-eye2", "level": 2, "q": "切らないクマ取り（経結膜脱脂）と裏ハムラ法の違いは？", "choices": ["脱脂は脂肪を溝へ移し、裏ハムラは脂肪を取る", "脱脂はふくらみの脂肪を取り、裏ハムラは脂肪を溝へ移す", "脱脂は顔の皮膚を切り、裏ハムラは注射で溶かす", "どちらも溝にヒアルロン酸を足す"], "answer": 1, "explain": "ふくらみの脂肪を取るのが切らないクマ取り（経結膜脱脂）で、原理は「減らす」。脂肪を溝へ移して段差ごとならすのが裏ハムラ法で、原理は「移す」。"}, {"id": "k-eye2-4", "ch": "k1", "card": "k-eye2", "level": 1, "q": "目の下の「黒っぽいクマ」の正体は？", "choices": ["色素がたまったもの", "薄い皮膚から血管が透けたもの", "ふくらみと溝の段差が作る影", "涙袋のふくらみ"], "answer": 2, "explain": "黒っぽいクマは、色ではなく形の問題。脂肪のふくらみと、そのすぐ下の溝の段差が影をつくる。色素がたまったものは茶クマ、血管が透けるものは青クマ。"}, {"id": "k-fat-1", "ch": "k1", "card": "k-fat", "level": 1, "q": "バッカルファットはどこにある脂肪？", "choices": ["ほお骨の上の浅い所", "口の横からあごの線", "ほおの筋肉より深い所", "あごの下から首の前"], "answer": 2, "explain": "バッカルファットは、ほおの奥の筋肉より深い所にある脂肪のかたまり。ほお骨の上の浅い脂肪はメーラーファット、口の横〜あごはジョールファット。"}, {"id": "k-fat-2", "ch": "k1", "card": "k-fat", "level": 2, "q": "バッカルファット除去で顔に傷が出ないのはなぜ？", "choices": ["注射で溶かすから", "吸い出す管がとても細いから", "機械の熱で減らすから", "口の中から取るから"], "answer": 3, "explain": "バッカルファットは筋肉より奥の深い脂肪なので、口の中を小さく切って取り出す。そのため顔の表面には傷が出ない。浅い脂肪は吸い出すことが多い。"}, {"id": "k-fat-3", "ch": "k1", "card": "k-fat", "level": 1, "q": "教材でいう「若い顔」とは？", "choices": ["脂肪ができるだけ少ない顔", "脂肪が正しい位置にある顔", "脂肪がたっぷり多い顔", "皮膚が厚くて丈夫な顔"], "answer": 1, "explain": "脂肪は丸みと支えでもあり、取りすぎるとこけて老けて見える。若い顔は脂肪が少ない顔ではなく、脂肪が正しい位置にある顔。だから足すメニューもある。"}, {"id": "k-layers-1", "ch": "k1", "card": "k-layers", "level": 1, "q": "顔の5層を表面から数えたとき、3番目の層は？", "choices": ["浅い脂肪（皮下脂肪）", "靭帯と深い脂肪", "筋肉とその膜（SMAS）", "骨"], "answer": 2, "explain": "顔は表面から「皮膚→浅い脂肪→筋肉の膜（SMAS）→靭帯と深い脂肪→骨」の5層。3番目は筋肉とそれを包む膜（SMAS）。"}, {"id": "k-layers-2", "ch": "k1", "card": "k-layers", "level": 1, "q": "SMAS（スマス）とは何？", "choices": ["骨と皮膚をつなぐロープ（靭帯）", "皮膚のすぐ下のクッションの脂肪", "肌のハリを作る真皮の線維", "表情筋どうしをつなぐ薄くて丈夫な膜"], "answer": 3, "explain": "SMASは顔の筋肉（表情筋）を包んでつなぐ薄くて丈夫な膜。たるみ治療で「引き上げる土台」になる層。ロープ役は靭帯で、別もの。"}, {"id": "k-layers-3", "ch": "k1", "card": "k-layers", "level": 2, "q": "同じ「たるみ治療」でも、HIFUは顔のどの層にどう働く？", "choices": ["①の皮膚だけに作用する", "③の筋肉の膜を熱で縮める", "②の浅い脂肪を吸い出す", "③の膜ごと切って引き上げて留める"], "answer": 1, "explain": "HIFUは③の膜（SMAS）を熱で縮める。③の膜ごと切って引き上げて留めるのは切開リフト、①の皮膚だけに作用するのはピコレーザー。"}, {"id": "k-layers-4", "ch": "k1", "card": "k-layers", "level": 1, "q": "顔の深い層が主に決めるものは？", "choices": ["肌の質感", "肌の色（シミ）", "顔の形・たるみ", "毛穴の大きさ"], "answer": 2, "explain": "浅い層は肌の質感、深い層は顔の形・たるみを決める。だから、同じ顔の施術でもメニューごとにねらう層が違う。色やシミは浅い層の話。"}, {"id": "k-nose-1", "ch": "k1", "card": "k-nose", "level": 1, "q": "鼻のメニュー名に出てくる「鼻尖（びせん）」はどこ？", "choices": ["鼻先", "鼻筋", "小鼻", "鼻の付け根"], "answer": 0, "explain": "鼻尖は鼻先のことで、中身はやわらかい軟骨。鼻筋は鼻背（びはい）、小鼻は鼻翼（びよく）、鼻の付け根は鼻根（びこん）という。メニュー名によく出る言葉。"}, {"id": "k-nose-2", "ch": "k1", "card": "k-nose", "level": 2, "q": "鼻先は形を変えやすいと言われるのはなぜ？", "choices": ["中身が硬い骨だから", "中身がやわらかい軟骨だから", "中身が脂肪だけだから", "もともとプロテーゼが入っているから"], "answer": 1, "explain": "鼻は上が骨、下が軟骨。鼻先は軟骨なので形を変えやすいが、高さや向きを保つには支えが要る。硬い骨なのは鼻筋の上のほうだけ。"}, {"id": "k-principles-1", "ch": "k1", "card": "k-principles", "level": 2, "q": "顔の中の、余った皮膚そのものを減らせるのはどの方法？", "choices": ["切る手術", "HIFU（機械の熱）", "糸リフト", "ヒアルロン酸注射"], "answer": 0, "explain": "「引き上げる・締める」の中でも、余った皮膚そのものを減らせるのは切る手術だけ。HIFUや糸は引き上げ・引き締めで、皮膚を取りのぞくわけではない。"}, {"id": "k-principles-2", "ch": "k1", "card": "k-principles", "level": 1, "q": "同じ悩みにメニューが何種類もあるのはなぜ？", "choices": ["院ごとに得意な施術が違うから", "原因が違えば使う原理が違うから", "料金の幅を広げるため", "メニュー名が流行で変わるから"], "answer": 1, "explain": "たとえば目の下のクマには、取る・足す・移す・引き上げるの4つの答えがある。原因が違えば、使う原理（5つのうちのどれか）が違うから。"}, {"id": "k-skin-1", "ch": "k1", "card": "k-skin", "level": 1, "q": "肌の3層のうち、ハリと弾力の本体はどれ？", "choices": ["表皮", "皮下組織", "真皮", "角質"], "answer": 2, "explain": "真皮は厚さ約2mmで、コラーゲンなどの線維がつまったハリと弾力の本体。表皮は体を守るバリア、皮下組織は脂肪の層でクッションと保温の役目。"}, {"id": "k-skin-2", "ch": "k1", "card": "k-skin", "level": 2, "q": "傷が真皮まで届くと跡が残りやすいのはなぜ？", "choices": ["真皮に色素を作る細胞があるから", "真皮は脂肪の層だから", "真皮はいちばん外側のバリアだから", "真皮は表皮のようには入れ替わらないから"], "answer": 3, "explain": "表皮はターンオーバーで入れ替わるが、真皮はそうならない。だから傷が真皮まで届くと跡が残りやすい。色素を作る細胞は表皮の下。"}, {"id": "k-skin-3", "ch": "k1", "card": "k-skin", "level": 2, "q": "たるみに、ピコレーザーやダーマペンなど肌のメニューとは別のメニューが要るのはなぜ？", "choices": ["皮膚より深い層がゆるんだ問題だから", "表皮に色素がたまった問題だから", "真皮がへこんだ問題だから", "毛穴が開いた問題だから"], "answer": 0, "explain": "肌のメニューが届くのは主に表皮と真皮。たるみは皮膚より深い層がゆるんだ問題なので、HIFU・糸リフト・切開リフトなど別のメニューになる。"}, {"id": "k-anes-1", "ch": "k2", "card": "k-anes", "level": 1, "q": "笑気麻酔を使うと、どんな状態になる？", "choices": ["完全に眠り、呼吸も機械で管理する", "点滴でうとうと眠る", "お酒に酔ったようにぼんやりする", "意識ははっきりで、その場所の痛みだけ消える"], "answer": 2, "explain": "笑気麻酔は鼻から吸うガスで、お酒に酔ったようにぼんやりする。眠りはせず、吸うのをやめるとすぐ覚める。局所麻酔の注射の前のリラックスに使う。"}, {"id": "k-anes-2", "ch": "k2", "card": "k-anes", "level": 1, "q": "静脈麻酔はどんな麻酔？", "choices": ["点滴で薬を入れ、うとうと眠る", "鼻からガスを吸ってぼんやりする", "塗ったり貼ったりする", "その場所だけに注射する"], "answer": 0, "explain": "静脈麻酔は点滴で薬を入れて眠る麻酔で、自分で呼吸はしている。ガスでぼんやりは笑気、塗る・貼るは表面麻酔、注射は局所麻酔。"}, {"id": "k-anes-3", "ch": "k2", "card": "k-anes", "level": 2, "q": "メニューカードの麻酔欄に「局所」とだけあったら、どう読む？", "choices": ["眠って受ける手術で、食事を抜く準備が要る", "起きたまま受ける施術で、その日に帰れることが多い", "麻酔をまったく使わない施術", "全身が眠る大きな手術"], "answer": 1, "explain": "「局所」とだけあれば、起きたまま受ける施術（その日に帰れることが多い）。静脈・全身とあれば、眠って受ける手術で、食事を抜くなどの準備が必要。"}, {"id": "k-anes-4", "ch": "k2", "card": "k-anes", "level": 1, "q": "水光注射やニードルRFの前によく使う、塗る・貼るタイプの麻酔は？", "choices": ["局所麻酔", "点眼麻酔", "表面麻酔", "静脈麻酔"], "answer": 2, "explain": "表面麻酔は麻酔クリームや麻酔テープで、皮膚の表面の感覚をにぶくする。針を使う肌の施術の前に使う。局所麻酔は注射、点眼麻酔は目薬の麻酔。"}, {"id": "k-brands-1", "ch": "k2", "card": "k-brands", "level": 1, "q": "あおなぎの表示価格について正しいのは？", "choices": ["施術代だけで、麻酔代は別にかかる", "麻酔代・薬代・抜糸代・針代を含む総額", "モニター価格で表示している", "初診料が別にかかる"], "answer": 1, "explain": "あおなぎは総額表示で、麻酔代・薬代・抜糸代・針代を含み、初診料・再診料・診察料もない。追加がかかるのは、本人が希望したときだけ。"}, {"id": "k-brands-2", "ch": "k2", "card": "k-brands", "level": 1, "q": "あおなぎで、希望の施術が合うか（適応）を判断するのは誰？", "choices": ["専門のカウンセラー", "受付スタッフ", "医師", "看護師"], "answer": 2, "explain": "あおなぎにはカウンセラーがいない。医師が診察して、希望の施術が合うか（適応）を判断する。カウンセラーが要望を聞くのはデイズ。"}, {"id": "k-brands-3", "ch": "k2", "card": "k-brands", "level": 2, "q": "デイズとあおなぎで同じメニューの料金を並べるとき、大切な見方は？", "choices": ["数字だけを横に並べて安いほうを選ぶ", "モニター価格どうしで比べる", "メニュー名が同じなら中身も同じとして比べる", "何が含まれているか・保証は何年かをセットで見る"], "answer": 3, "explain": "同じメニュー名でも、中身と条件は同じとは限らない。料金を並べるときは「何が含まれているか」「保証は何年か」を必ずセットで見る。"}, {"id": "k-brands-4", "ch": "k2", "card": "k-brands", "level": 1, "q": "あおなぎの公式サイトに掲載がないメニューは？", "choices": ["二重", "豊胸", "ボトックス", "糸リフト"], "answer": 1, "explain": "あおなぎは二重・目元・クマ・糸リフト・小顔・ヒアルロン酸・ボトックス・皮膚科にしぼっていて、鼻・豊胸・切開リフトなどは掲載なし。"}, {"id": "k-dt-1", "ch": "k2", "card": "k-dt", "level": 1, "q": "「ダウンタイム」とは何？", "choices": ["施術を受けている最中にかかる時間", "予約してから施術を受けるまでの待ち時間", "麻酔が効いていて動けない時間", "施術後、見た目や生活が元に戻るまでの期間"], "answer": 3, "explain": "ダウンタイムは、施術のあと見た目や生活が元に戻るまでの期間。お客様は「いつから仕事に行けるか・人に会えるか」を気にする。"}, {"id": "k-dt-2", "ch": "k2", "card": "k-dt", "level": 1, "q": "基礎編の一般的な目安では、腫れがいちばん強くなる（ピーク）のはいつ頃？", "choices": ["当日だけ", "2〜3日目", "1か月後", "半年後"], "answer": 1, "explain": "一般的な目安では2〜3日目がピークで、1〜2週間で大きく引く。ただし施術によって違い、切る手術のカードには「1〜2週間」腫れが続くと書かれているものもある。"}, {"id": "k-dt-3", "ch": "k2", "card": "k-dt", "level": 2, "q": "抜糸がいらないのは、どんな施術？", "choices": ["切って縫う手術（目頭切開など）", "傷あとが半年〜1年かけて落ち着く手術", "糸を中に残す施術（二重埋没など）", "腫れが2〜3日目にピークになる手術"], "answer": 2, "explain": "抜糸は、縫った糸を傷がくっついたあとで取ること（およそ1週間前後に行う）。二重埋没のように糸を中に残す施術では、抜糸は不要。"}, {"id": "k-dt-4", "ch": "k2", "card": "k-dt", "level": 2, "q": "入浴・運動・飲酒が、あとから解禁されることが多いのはなぜ？", "choices": ["傷あとの色が濃くなってしまうから", "麻酔が効かなくなってしまうから", "抜糸ができなくなってしまうから", "血のめぐりを良くして腫れを強めるから"], "answer": 3, "explain": "入浴・運動・飲酒は血のめぐりを良くして腫れを強めるので、あとから解禁されることが多い。何日後からOKかは施術ごとに違い、カードに書かれている。"}, {"id": "k-energy-1", "ch": "k2", "card": "k-energy", "level": 1, "q": "機械のエネルギーが届く深さが「浅い」とき、主な目的は？", "choices": ["ハリ", "シミなどの色", "たるみ", "脂肪を減らす"], "answer": 1, "explain": "機械は届く深さで目的が決まる。浅い＝色（シミ）、中くらい＝ハリ、深い＝たるみ。たとえばIPLは浅い層のシミ・赤みに使う。"}, {"id": "k-energy-2", "ch": "k2", "card": "k-energy", "level": 2, "q": "光（IPL）とレーザー（ピコ）の違いは？", "choices": ["IPLは1色だけの光、ピコは幅広い光", "IPLは超音波で奥の一点に熱を集める", "ピコは針の先から熱を出す", "ピコは1色だけの強い光を一瞬当てて色素を砕く"], "answer": 3, "explain": "IPLはカメラのフラッシュのような幅広い光で、茶色と赤に反応する。ピコ（レーザー）は1色だけの強い光をごく一瞬当てて、色素を細かく砕く。"}, {"id": "k-energy-3", "ch": "k2", "card": "k-energy", "level": 1, "q": "初めて聞く機械の名前に出会ったら、何を確かめればいい？", "choices": ["エネルギーの種類と届く深さ", "商品名とメーカーの名前", "1回の料金と必要な回数", "発売された年と作った国"], "answer": 0, "explain": "商品名は覚えなくてよい。何のエネルギー（光・レーザー・針・高周波・超音波）か、どの層まで届くかを聞けば、目的の見当がつく。"}, {"id": "k-energy-4", "ch": "k2", "card": "k-energy", "level": 2, "q": "超音波（HIFUなど）の熱の作り方の特徴は？", "choices": ["電気を流して、通り道を広くじんわり温める", "表面を素通りして、奥の一点に熱を集める", "刺した針の先から熱を出す", "茶色と赤に反応して熱になる"], "answer": 1, "explain": "超音波だけは表面を素通りして、虫めがねで日光を集めるように奥の一点に熱を集める。電気でじんわり温めるのは高周波、針の先から熱を出すのは針＋高周波。"}, {"id": "k-inject-1", "ch": "k2", "card": "k-inject", "level": 2, "q": "ボトックスが向いているのは、どんなしわ？", "choices": ["表情を動かしたときに出るしわ", "へこみ・みぞのような深いしわ", "肌のハリ不足による小じわ", "脂肪がたるんでできる線"], "answer": 0, "explain": "ボトックスは筋肉の動きを弱める薬で、ふくらませる力はない。動かしたときに出るしわ向き。へこみ・みぞを埋めるのはヒアルロン酸などの「足す」注入。"}, {"id": "k-inject-2", "ch": "k2", "card": "k-inject", "level": 1, "q": "ヒアルロン酸注入の効果は、どのくらい続く？", "choices": ["数日で消える", "一生残る", "半年〜1年ほどで体に吸収される", "根づいた分がずっと残る"], "answer": 2, "explain": "ヒアルロン酸は半年〜1年ほどで体に吸収される（かたさ・場所で差がある）。根づいた分が長く残るのは脂肪注入、数か月で切れるのはボトックス。"}, {"id": "k-inject-3", "ch": "k2", "card": "k-inject", "level": 1, "q": "スネコス・リジュランなどの「肌育製剤」は何をする？", "choices": ["ゼリー状の材料でふくらませる", "筋肉の動きを弱める", "脂肪を溶かして減らす", "肌が自分でコラーゲンを作る働きを促す"], "answer": 3, "explain": "肌育製剤はふくらませるのではなく、肌が自分でコラーゲンを作る働きを促す。ゆっくり効き、何回かくり返すのが前提。商品名は覚えなくてよい。"}, {"id": "k-inject-4", "ch": "k2", "card": "k-inject", "level": 2, "q": "脂肪溶解注射と脂肪吸引をくらべると？", "choices": ["脂肪溶解注射のほうがずっと軽いが、変化も小さい", "脂肪溶解注射のほうが1回の変化が大きい", "1回で脂肪吸引と同じだけ減る", "脂肪溶解注射は手術に近い"], "answer": 0, "explain": "脂肪溶解注射は薬で脂肪を溶かす方法。脂肪吸引よりずっと軽いが、1回の変化は小さく、数回くり返して少しずつ減らす。手術に近いのは脂肪注入。"}, {"id": "k-price-1", "ch": "k2", "card": "k-price", "level": 1, "q": "デイズの料金表の見せ方は？", "choices": ["表示価格＝お支払い総額の1本", "会員価格と非会員価格", "通常価格とモニター価格の2本立て", "平日価格と休日価格"], "answer": 2, "explain": "デイズは「通常価格／モニター価格」の2本立てで、麻酔などは別のオプション表にも料金がある。表示価格＝お支払い総額の1本で見せるのは、あおなぎ。"}, {"id": "k-price-2", "ch": "k2", "card": "k-price", "level": 2, "q": "デイズの「モニター価格」で受けるための条件に入っているのは？", "choices": ["写真・動画をSNSやWEBに出せること", "初めて来院する人であること", "3回コースを申し込むこと", "カウンセラーの推薦があること"], "answer": 0, "explain": "条件は撮影協力・2回以上の来院（施術による）・SNSやWEBへの掲載・アンケート協力の4つ。なれるかは医師の診察・審査で決まる。"}, {"id": "k-types-1", "ch": "k2", "card": "k-types", "level": 1, "q": "施術の5つの手段のうち、いちばん「重い」のは？", "choices": ["糸", "手術", "注射・注入", "機械をあてる"], "answer": 1, "explain": "軽い順に、飲み薬・点滴・塗り薬→機械をあてる→注射・注入→糸→手術（切る）。いちばん重いのは手術で、1回で長く続くが負担も大きい。"}, {"id": "k-types-2", "ch": "k2", "card": "k-types", "level": 2, "q": "軽い施術と重い施術の、通い方の違いは？", "choices": ["軽いほど1回で長く続き、重いほど何度も通う", "軽いほど1回の料金が高い", "重いほど腫れる期間が短い", "軽いほど何度も通い、重いほど1回で長く続く"], "answer": 3, "explain": "軽い施術ほど何度も通い、重い施術ほど1回で長く続く。そのぶん重い施術は、腫れる期間（ダウンタイム）も1回の料金も大きくなる。"}, {"id": "k-types-3", "ch": "k2", "card": "k-types", "level": 1, "q": "美容皮膚科は、主にどんな診療？", "choices": ["切らずに、機械・注射・薬で肌を整える", "メスや糸で顔や体の形を変える", "麻酔だけを専門に行う", "体の脂肪吸引を中心に行う"], "answer": 0, "explain": "美容外科は形を変える（切る・糸）、美容皮膚科は肌を整える（機械・注射・薬）。デイズにもあおなぎにも両方のメニューがある。"}, {"id": "k-types-4", "ch": "k2", "card": "k-types", "level": 1, "q": "「糸」の手段に入る施術はどれ？", "choices": ["ヒアルロン酸・ボトックス", "二重埋没・糸リフト", "HIFU・ピコ", "目頭切開・顔の脂肪吸引"], "answer": 1, "explain": "糸は、切らずに糸で留める・引き上げる手段で、例は二重埋没と糸リフト。ヒアルロン酸は注射、HIFUは機械、目頭切開は手術。"}, {"id": "c1-01-1", "ch": "eye", "card": "c1-01", "level": 1, "q": "二重埋没法は、どうやって二重の折り目を作る？", "choices": ["まぶたの皮膚を切って中を縫う", "まぶたの奥の脂肪を抜いて薄くする", "まぶたを切らずに、細い糸でまぶたの中を留める", "まぶたを上げる筋肉を縫い縮める"], "answer": 2, "explain": "埋没法は切らずに、細い糸でまぶたの中を1〜数か所留めて折り目を作る。皮膚を切って縫うのは切開法、脂肪を抜くのはまぶたの脂肪取り。"}, {"id": "c1-01-2", "ch": "eye", "card": "c1-01", "level": 1, "q": "二重埋没法を受けると、目の開きそのものはどうなる？", "choices": ["強くなる（まぶたのふちが上がる）", "変わらない（作るのは折り目だけ）", "目頭側だけ開くようになる", "下まぶたが下がって縦に開く"], "answer": 1, "explain": "埋没法が作るのは上まぶたの「折り目」だけで、目の開きそのものは変わらない。開きを良くしたい人には眼瞼下垂の施術が別にある。"}, {"id": "c1-01-3", "ch": "eye", "card": "c1-01", "level": 2, "q": "二重埋没法の「保証」について、デイズとあおなぎの違いで正しいのは？", "choices": ["デイズは留め方で保証の長さと料金が変わり、あおなぎは一律1年で料金込み", "両院とも保証は一律1年で、料金も同じ", "デイズは一律1年、あおなぎは留め方で保証の長さが変わる", "両院とも保証はなく、取れたら別料金で再施術"], "answer": 0, "explain": "デイズは留め方がしっかりするほど保証が長く（2年〜永久）料金も上がる。あおなぎは保証がどれも1年で料金に含まれ、保証の長さで値段を変えない。"}, {"id": "c1-01-4", "ch": "eye", "card": "c1-01", "level": 2, "q": "二重埋没法と切らない眼瞼下垂は、どちらも糸を使う。違いは？", "choices": ["埋没法は「開き」を良くし、眼瞼下垂は「折り目」を作る", "埋没法は「折り目」を作り、眼瞼下垂は「まぶたの開き」を良くする", "埋没法は下まぶた、眼瞼下垂は上まぶたの施術", "目的は同じで、違うのは糸の本数だけ"], "answer": 1, "explain": "どちらも糸を使うが目的が別。埋没法は上まぶたに折り目を作るだけ。切らない眼瞼下垂は、まぶたを上げる筋肉を糸で結び直して、まぶたの開きを良くする。"}, {"id": "c1-02-1", "ch": "eye", "card": "c1-02", "level": 1, "q": "「埋没法が何度も取れた」「まぶたが厚い」人の選択肢になるメニューは？", "choices": ["二重切開法", "涙袋形成", "目尻切開", "切らない眼瞼下垂"], "answer": 0, "explain": "二重切開法は皮膚を切って中を縫うので戻りにくい。埋没法が何度も取れた人、まぶたが厚い人、幅の広い二重にしたい人の選択肢になる。"}, {"id": "c1-02-2", "ch": "eye", "card": "c1-02", "level": 1, "q": "二重切開法を受ける人に、まぶたの脂肪取りも足す必要はある？", "choices": ["ある（必ず同じ日に足す）", "ある（切開の1か月後に足す）", "ある（埋没法と一緒に足す）", "ない（切開法の中で余分な脂肪も取れる）"], "answer": 3, "explain": "切開法は余分な皮膚・脂肪も同時に取れるので、まぶたの脂肪取りを別に足す必要はない。脂肪取りは、ふつう埋没法と同時に行う下準備のメニュー。"}, {"id": "c1-02-3", "ch": "eye", "card": "c1-02", "level": 2, "q": "二重切開法を埋没法と比べたときの特徴として正しいのは？", "choices": ["傷あとが残らず、やり直しやすい", "切らないので両目10〜20分で終わる", "傷あとが残り元に戻せないが、取れにくい", "糸だけで留めるので、ゆるむと戻る"], "answer": 2, "explain": "切開法は皮膚を切って中を縫うので、傷あとが残って元に戻せないかわりに、取れにくい。傷あとがなくやり直しやすいが、取れることがあるのは埋没法の特徴。"}, {"id": "c1-03-1", "ch": "eye", "card": "c1-03", "level": 1, "q": "まぶたの脂肪取りは、ふつうどの施術と同時に行う？", "choices": ["二重切開法", "目頭切開", "涙袋形成", "二重埋没法"], "answer": 3, "explain": "まぶたの脂肪取りは二重の「下準備」のメニューで、ふつうは二重埋没法と同時に行う。切開法は手術の中で脂肪も取れるので足す必要はない。"}, {"id": "c1-03-2", "ch": "eye", "card": "c1-03", "level": 1, "q": "まぶたの脂肪取りで、脂肪を取りすぎるとどうなる？", "choices": ["目と目の距離が縮まる", "まぶたがくぼむ", "下まぶたが外へめくれる", "目尻がくっついて元に戻る"], "answer": 1, "explain": "取りすぎると、まぶたがくぼんでこけた印象になる。まぶたの脂肪は年齢とともに減るので、将来を考えて量を決める。だから少なめに取るのが基本。"}, {"id": "c1-04-1", "ch": "eye", "card": "c1-04", "level": 1, "q": "切らない眼瞼下垂は、何を良くする施術？", "choices": ["二重の折り目", "目の開き", "涙袋のふくらみ", "目の横幅"], "answer": 1, "explain": "切らない眼瞼下垂は、まぶたを上げる筋肉を糸でまぶたのふちに結び直して、目の開きを良くする。二重の折り目を作る埋没法とは目的が別。"}, {"id": "c1-04-2", "ch": "eye", "card": "c1-04", "level": 1, "q": "切らない眼瞼下垂が効くのは、どのくらいの重さの下垂まで？", "choices": ["重い場合だけ", "重さに関係なく同じように効く", "軽い〜中くらいまで", "下垂がない人だけ"], "answer": 2, "explain": "切らない眼瞼下垂が効くのは軽い〜中くらいまで。重い場合は、上まぶたの皮膚を切って筋肉の膜を縫い縮める、眼瞼下垂の手術が必要になる。"}, {"id": "c1-04-3", "ch": "eye", "card": "c1-04", "level": 2, "q": "眼瞼下垂の相談で、手術の前に眼科などの受診を案内すべき人は？", "choices": ["二重の幅をもっと広げたい人", "涙袋をはっきりさせたい人", "急に始まった・物が二重に見える人", "目と目の距離が近いのが気になる人"], "answer": 2, "explain": "眼瞼下垂は脳や神経の病気が原因のこともある。急に始まった、時間で変わる、片目だけ、物が二重に見える人には、手術の前に眼科などの受診を案内する。"}, {"id": "c1-04-4", "ch": "eye", "card": "c1-04", "level": 2, "q": "切らない眼瞼下垂と比べた、切る眼瞼下垂の手術の特徴は？", "choices": ["糸で留めるだけで、表に傷が出ない", "効果は長く続くが、腫れが長く傷あとが残る", "折り目を作るだけで、開きは変わらない", "効果は半年ほどで、定期的に受ける"], "answer": 1, "explain": "切る手術は皮膚を切って筋肉の膜を直接縫い縮めるので、効果が長く続きやすい。そのぶん腫れのピークが1〜2週間と長く、傷あとが残る。"}, {"id": "c1-05-1", "ch": "eye", "card": "c1-05", "level": 1, "q": "眼瞼下垂の手術（眼瞼挙筋前転術）で行うことは？", "choices": ["目頭にかぶさる皮膚のひだを切る", "のびてゆるんだ筋肉の先を縫い縮める", "糸だけで皮膚と硬い板をつなぐ", "眉の下の皮膚を切り取る"], "answer": 1, "explain": "上まぶたを切り、のびてゆるんだ「まぶたを上げる筋肉の先」を縫い縮めて開きを良くする。ひだを切るのは目頭切開、糸だけで留めるのは埋没法。"}, {"id": "c1-05-2", "ch": "eye", "card": "c1-05", "level": 1, "q": "切る眼瞼下垂の手術を受けると、仕上がりのまぶたはどうなる？", "choices": ["一重のままになる", "涙袋ができる", "二重まぶたにもなる", "目尻が下がってタレ目になる"], "answer": 2, "explain": "眼瞼下垂の手術は二重切開と同じ線を切って行う。だから目の開きが良くなるだけでなく、仕上がりは二重まぶたになる。一重のままにはならない。"}, {"id": "c1-06-1", "ch": "eye", "card": "c1-06", "level": 1, "q": "目頭切開は、目をどちらへ広げる手術？", "choices": ["外側（耳側）", "上（縦）", "下", "内側（鼻側）"], "answer": 3, "explain": "目頭切開は、目頭にかぶさる皮膚のひだを切って整え、目を内側（鼻側）に広げる。外側は目尻切開、上は目上切開、下はグラマラスライン形成。"}, {"id": "c1-06-2", "ch": "eye", "card": "c1-06", "level": 2, "q": "目頭切開を勧めないのは、どんな人？", "choices": ["目頭の蒙古ひだが強い人", "もともと目と目の距離が近い人", "平行二重のラインにしたい人", "目をもっと大きくしたい人"], "answer": 1, "explain": "目頭切開は目と目の距離が縮まるので、もともと目と目が近い人には勧めない（目上切開や目尻切開を考える）。ほかの3つは向いている人。"}, {"id": "c1-06-3", "ch": "eye", "card": "c1-06", "level": 1, "q": "目頭にかぶさって、目頭のピンクの部分や白目を隠す皮膚の張り出しを何という？", "choices": ["涙丘", "蒙古ひだ", "眼輪筋", "目袋"], "answer": 1, "explain": "目頭にある皮膚の張り出しが蒙古ひだ。日本人に多い。涙丘は目頭のピンクの部分、眼輪筋は目を閉じる筋肉、目袋は目の下のふくらみ。"}, {"id": "c1-07-1", "ch": "eye", "card": "c1-07", "level": 1, "q": "目上切開は、目をどのように広げる手術？", "choices": ["目頭の上を切って縦に広げ、目と目の距離は変えない", "目頭の先を切って内側に広げ、距離を縮める", "目尻を切って横幅を広げる", "下まぶたを下げてタレ目にする"], "answer": 0, "explain": "目上切開は目頭の「上」の皮膚を切ってつっぱりを取り、目と目の距離は変えずに縦に広げる。内側に広げて距離が縮まるのは目頭切開。"}, {"id": "c1-07-2", "ch": "eye", "card": "c1-07", "level": 2, "q": "寄り目に見えるのが心配な人に向くのは？", "choices": ["目頭切開（距離を縮めて内側に広げる）", "目頭切開（縦に広げる）", "目上切開（距離を変えずに縦に広げる）", "目上切開（目頭の先を切って内側に広げる）"], "answer": 2, "explain": "目頭切開は内側に広げて目と目の距離を縮めるので離れ目の人向き。目上切開は目頭の「上」を切って縦に広げ、距離は変えないので寄り目が心配な人向き。"}, {"id": "c1-08-1", "ch": "eye", "card": "c1-08", "level": 1, "q": "目尻切開は、目のどこを広げる手術？", "choices": ["目頭側（鼻側へ）", "下まぶた（下へ）", "上まぶたの折り目", "目の横幅（外側へ）"], "answer": 3, "explain": "目尻切開は目尻（目の外側の端）を切って外へ広げ、目の横幅を大きくする。白目が増え、つり目・切れ長の印象がやわらぐ。目と目が近い人でも受けられる。"}, {"id": "c1-08-2", "ch": "eye", "card": "c1-08", "level": 1, "q": "目尻切開の効果が出やすいのは、どんな人？", "choices": ["目尻の奥にかくれた白目の余白がある人", "目頭の蒙古ひだが強く張っている人", "上まぶたの皮膚や脂肪が厚い人", "目の下に脂肪のふくらみがある人"], "answer": 0, "explain": "目尻の奥にかくれた白目の余白がある人ほど広がりがはっきり出る（目安は引っぱって1.5mm以上）。目尻のすぐ外側は骨なので、余白が少ないと変化は小さい。"}, {"id": "c1-08-3", "ch": "eye", "card": "c1-08", "level": 2, "q": "目尻切開の麻酔について、あおなぎの特徴は？", "choices": ["麻酔代は料金とは別にかかる", "眠る麻酔（静脈麻酔）が料金に含まれる", "目薬の麻酔だけで行う", "眠る麻酔は使わない（目薬＋笑気＋局所）"], "answer": 1, "explain": "あおなぎの目尻切開は、眠る麻酔（静脈麻酔）と笑気麻酔も料金に含まれ、追加料金なし。デイズは目薬＋笑気＋局所で、眠らない。"}, {"id": "c1-09-1", "ch": "eye", "card": "c1-09", "level": 1, "q": "グラマラスライン形成（タレ目形成）は、どんな施術？", "choices": ["下まつげの下にふくらみを作る", "目尻側の下まぶたを下げて白目を増やす", "目尻を外へ切って横幅を広げる", "目の下の脂肪を裏から取り出す"], "answer": 1, "explain": "グラマラスライン形成は、目尻側の下まぶたを少し下げて白目を増やし、やさしいタレ目に見せる。ふくらみを作るのは涙袋形成、横に広げるのは目尻切開。"}, {"id": "c1-09-2", "ch": "eye", "card": "c1-09", "level": 2, "q": "デイズのグラマラスライン形成の3つの方法のうち、効果が一番大きく半永久なのは？", "choices": ["表切開（まつげの際の皮膚を切る）", "裏切開（まぶたの裏側を切る）", "埋没（糸だけで留める）", "どの方法も持ちは同じ"], "answer": 0, "explain": "持ちと腫れは段階的に変わる。糸だけの埋没は戻りやすく、裏切開は表に傷なし、まつげの際の皮膚を切る表切開が効果が一番大きく半永久。"}, {"id": "c1-09-3", "ch": "eye", "card": "c1-09", "level": 1, "q": "グラマラスライン形成ならではのリスクとして、教材にあるのは？", "choices": ["目と目の距離が縮まってしまう", "上まぶたがくぼんでしまう", "二重の線が消えてしまう", "下げすぎて赤い粘膜が見える"], "answer": 3, "explain": "下まぶたを下げすぎると、赤い粘膜が見える・黒目の下に白目が出る・目が閉じにくい・ドライアイなどが起こりうる。下まぶたを触る施術ならではの注意点。"}, {"id": "c1-10-1", "ch": "eye", "card": "c1-10", "level": 1, "q": "デイズの涙袋形成（縫合法）は、どうやって涙袋を作る？", "choices": ["下まぶたの皮膚を切って脂肪を足す", "目の下の脂肪をみぞへ移して留める", "目尻を外へ切って広げる", "まぶたの裏から糸を通してくびれを作る"], "answer": 3, "explain": "涙袋形成は、まぶたの裏側から糸を通してふくらみの下に「くびれ」を作り、目を囲む筋肉の部分をぷっくり見せる。中身を足すわけではない。"}, {"id": "c1-10-2", "ch": "eye", "card": "c1-10", "level": 2, "q": "涙袋形成とグラマラスライン形成の違いは？", "choices": ["涙袋形成はふちを下げ、グラマラスはふくらみを作る", "どちらも下まぶたのふちを下げる施術", "どちらもヒアルロン酸を注射する施術", "涙袋形成はふちを動かさずふくらみを作り、グラマラスはふちを下げる"], "answer": 3, "explain": "グラマラスライン形成は下まぶたのふちを下げて目の開きを広げる。涙袋形成はふちを動かさず、ふくらみを作るだけ。2つは同じ日に受けることもできる。"}, {"id": "map-1-1", "ch": "eye", "card": "map-1", "level": 1, "q": "目元の10メニューを覚えるとき、教材がすすめる分け方は？", "choices": ["値段が高いか安いか", "人気があるかどうか", "麻酔が眠るか眠らないか", "目のどこをどの向きに変えるか"], "answer": 3, "explain": "教材は、値段や人気ではなく「目のどこを、どちら向きに変えるか」で覚えるのが近道としている。折り目を作る・開きを強くする・ふちを広げるの3つに分かれる。"}, {"id": "map-1-2", "ch": "eye", "card": "map-1", "level": 2, "q": "「眉を上げないと目が開かない」と言うお客様に、まず考えるメニューは？", "choices": ["二重埋没法／二重切開法", "切らない眼瞼下垂／眼瞼下垂", "目頭切開", "涙袋形成"], "answer": 1, "explain": "目の開きが弱い悩みには眼瞼下垂の施術を考える。軽い〜中くらいは切らない眼瞼下垂、重いと切る眼瞼下垂。二重の施術では開きは変わらない。"}, {"id": "map-1-3", "ch": "eye", "card": "map-1", "level": 2, "q": "目と目の距離が近いけれど、目を大きくしたい人に考えるメニューは？", "choices": ["目頭切開", "目上切開・目尻切開", "目頭切開・目上切開", "目頭切開・目尻切開"], "answer": 1, "explain": "目と目が近い人には、距離を変えずに縦に広げる目上切開か、外に広げる目尻切開を考える。目頭切開は距離が縮まるので勧めない。"}, {"id": "map-1-4", "ch": "eye", "card": "map-1", "level": 1, "q": "目のふちを「下」へ広げるメニューはどれ？", "choices": ["目尻切開", "タレ目形成", "目上切開", "目頭切開"], "answer": 1, "explain": "下へ広げるのはグラマラスライン形成（タレ目形成）。目頭切開は内側、目上切開は上（縦）、目尻切開は外側（耳側）へ広げるメニュー。"}, {"id": "c2-01-1", "ch": "kuma", "card": "c2-01", "level": 1, "q": "経結膜脱脂（切らないクマ取り）は、脂肪をどこから取り出す？", "choices": ["下まぶたの裏側から", "まつげのすぐ下の皮膚を切って", "眉毛のすぐ下を切って", "取り出さず注射で溶かす"], "answer": 0, "explain": "経結膜脱脂は、下まぶたの裏側の粘膜を数mm切って、前にはみ出した脂肪を取り出す。皮膚を切らないので顔の表に傷が残らない。"}, {"id": "c2-01-2", "ch": "kuma", "card": "c2-01", "level": 1, "q": "経結膜脱脂で直せるのは？", "choices": ["目の下のふくらみ", "ふくらみの下のみぞ", "皮膚のたるみ・しわ", "上まぶたのたるみ"], "answer": 0, "explain": "脱脂で直せるのは「ふくらみ」だけで、下のみぞや皮膚のたるみには触らない。みぞも気になる人には、脂肪注入を足すプランや裏ハムラがある。"}, {"id": "c2-01-3", "ch": "kuma", "card": "c2-01", "level": 1, "q": "経結膜脱脂の料金の表示で、あおなぎの特徴は？", "choices": ["通常価格とモニター価格の2本立て", "麻酔代は別に請求する", "麻酔代・薬代込みの総額で表示している", "保証の長さで値段が変わる"], "answer": 2, "explain": "あおなぎは麻酔代・薬代込みの総額表示で、脱脂＋脂肪注入は静脈麻酔込みのセット料金。通常価格とモニター価格の2本立てはデイズ。"}, {"id": "c2-02-1", "ch": "kuma", "card": "c2-02", "level": 1, "q": "裏ハムラ法は、前に出た目の下の脂肪をどうする手術？", "choices": ["取らずに下のみぞへ移して留める", "外へ取り出すだけ", "注射で溶かす", "太ももから採った脂肪を足す"], "answer": 0, "explain": "裏ハムラは、まぶたの裏から入り、前に出た脂肪を取らずに下のみぞへ移して糸で留める。ふくらみとみぞが同時に平らになる。外へ取り出すだけなのは脱脂。"}, {"id": "c2-02-2", "ch": "kuma", "card": "c2-02", "level": 2, "q": "経結膜脱脂と裏ハムラ法の、一番の違いは？", "choices": ["入口（まぶたの裏か、まつげの下か）", "脂肪の行き先（外へ出すか、みぞへ移すか）", "表に傷が残るかどうか", "皮膚のたるみを切り取るかどうか"], "answer": 1, "explain": "入口はどちらも「まぶたの裏」で、表に傷は残らず皮膚も切らない。違いは脂肪の行き先で、脱脂は外へ出し、裏ハムラは下のみぞへ敷き直す。"}, {"id": "c2-02-3", "ch": "kuma", "card": "c2-02", "level": 2, "q": "裏ハムラ法が向かないのは、どんな人？", "choices": ["ふくらみとみぞの両方が気になる人", "皮膚に傷をつけたくない人", "ダウンタイムをなるべく短くしたい人", "皮膚のたるみ・しわが主な悩みの人"], "answer": 3, "explain": "裏ハムラは皮膚を切り取らないので、しわの改善効果は表ハムラより限定的。皮膚のたるみ・しわが主な悩みの人には向かない。ほかの3つは向いている人。"}, {"id": "c2-02-4", "ch": "kuma", "card": "c2-02", "level": 2, "q": "裏ハムラ法と表ハムラ法、どちらにするかの分かれ目は？", "choices": ["皮膚が余っているかどうか", "脂肪を敷き直すかどうか", "みぞがあるかどうか", "クマの色が青か茶か"], "answer": 0, "explain": "脂肪を下へ敷き直すのはどちらも同じ。表ハムラはまつげの下の皮膚を切って入るので、余った皮膚も切り取れる。分かれ目は皮膚が余っているかどうか。"}, {"id": "c2-03-1", "ch": "kuma", "card": "c2-03", "level": 1, "q": "表ハムラ法の入口（切る所）はどこ？", "choices": ["まつげのすぐ下の皮膚", "まぶたの裏の粘膜", "眉毛のすぐ下", "目尻の外側"], "answer": 0, "explain": "表ハムラはまつげのすぐ下の皮膚を切って入り、脂肪を下のみぞへ敷き直し、余った皮膚も切り取る。まぶたの裏から入るのは脱脂と裏ハムラ。"}, {"id": "c2-03-2", "ch": "kuma", "card": "c2-03", "level": 1, "q": "クマ取りの手術4つの中で、直せる範囲がいちばん広いのは？", "choices": ["裏ハムラ法", "表ハムラ法", "経結膜脱脂", "切開法（目の下のたるみ取り）"], "answer": 1, "explain": "表ハムラは脂肪を敷き直し、余った皮膚も切り取るので、ふくらみ・みぞ・しわを一度に直せる。4つの中で直せる範囲がいちばん広い。"}, {"id": "c2-04-1", "ch": "kuma", "card": "c2-04", "level": 1, "q": "切開法による目の下のたるみ取りで、切り取るものは？", "choices": ["脂肪だけ（皮膚は切らない）", "何も取らず、脂肪を下のみぞへ移す", "余ってたるんだ皮膚と、ふくらみのもとの脂肪", "眉の下の余った皮膚"], "answer": 2, "explain": "切開法は下まつげのすぐ下の皮膚を切り、余ってたるんだ皮膚と、ふくらみのもとの脂肪を切り取る。脂肪をみぞへ移すのはハムラ法。"}, {"id": "c2-04-2", "ch": "kuma", "card": "c2-04", "level": 2, "q": "「みぞまで直したい人」と「皮膚のたるみと目袋が主な人」。合う手術の組み合わせは？", "choices": ["みぞ＝切開法／たるみと目袋＝表ハムラ法", "みぞ＝経結膜脱脂／たるみと目袋＝裏ハムラ法", "みぞ＝経結膜脱脂／たるみと目袋＝経結膜脱脂", "みぞ＝表ハムラ法／たるみと目袋＝切開法"], "answer": 3, "explain": "どちらもまつげの下を切るが、表ハムラは脂肪をみぞへ敷き直す。切開法は皮膚と脂肪を切り取る方法で、みぞを埋める説明はない。"}, {"id": "c2-05-1", "ch": "kuma", "card": "c2-05", "level": 1, "q": "眉下リフトは、どこの皮膚を切り取る手術？", "choices": ["眉毛のすぐ下", "まつげのすぐ下", "二重の線の上", "目頭の上"], "answer": 0, "explain": "眉下リフトは眉毛のすぐ下で余った皮膚を切り取って縫い、上まぶたのたるみを引き上げる。目のきわは切らないので、目元の印象は自然なまま。"}, {"id": "c2-05-2", "ch": "kuma", "card": "c2-05", "level": 2, "q": "「まぶたが重い」原因と、合う手術の組み合わせで正しいのは？", "choices": ["皮膚が余ってかぶさる＝眼瞼下垂の手術／筋肉の力が落ちる＝眉下リフト", "どちらの原因も眉下リフトで直る", "どちらの原因も涙袋形成で直る", "皮膚が余ってかぶさる＝眉下リフト／筋肉の力が落ちる＝眼瞼下垂の手術"], "answer": 3, "explain": "皮膚が余ってかぶさっているなら眉下リフト、まぶたを上げる筋肉の力が落ちているなら眼瞼下垂の手術。眉下リフトでは筋肉の問題は直らない。"}, {"id": "c2-06-1", "ch": "kuma", "card": "c2-06", "level": 1, "q": "しわ取り再生注射（スネコス）は、どんな注射？", "choices": ["固めのジェルで凹みを下から押し上げる", "肌の細胞を刺激して、ハリの繊維を自分で作らせる", "コラーゲンそのものを入れて、すぐハリを出す", "脂肪を溶かして目の下を平らにする"], "answer": 1, "explain": "スネコスはふくらませる注射ではなく、アミノ酸とヒアルロン酸で繊維を作る細胞を刺激し、ハリのもとを自分で作らせる。効果はゆっくり出る。"}, {"id": "c2-06-2", "ch": "kuma", "card": "c2-06", "level": 2, "q": "スネコスとベビーコラーゲンの違いで正しいのは？", "choices": ["スネコスはすぐ効き、ベビーコラーゲンは約1か月かかる", "どちらも固めのジェルを入れて形を作る", "スネコスは手術、ベビーコラーゲンは注射", "スネコスはゆっくり効き、ベビーコラーゲンはすぐ効く"], "answer": 3, "explain": "スネコスは材料を渡して肌に作らせるので効果はゆっくり（約1か月）。ベビーコラーゲンはコラーゲンそのものを入れるので、すぐハリが出る。"}, {"id": "c2-07-1", "ch": "kuma", "card": "c2-07", "level": 1, "q": "ベビーコラーゲンが得意とするのは？", "choices": ["目の下の脂肪のふくらみ", "深い凹みを大きく埋めること", "目元の細かいちりめんジワ", "上まぶたの皮膚のたるみ"], "answer": 2, "explain": "ベビーコラーゲンは、ヒアルロン酸では難しかった皮膚が薄い所のちりめんジワに使う。大きく体積を足す注射ではないので、深い凹みには力不足。"}, {"id": "c2-08-1", "ch": "kuma", "card": "c2-08", "level": 1, "q": "口角挙上（口角リフト）は、口元の何を変える手術？", "choices": ["上唇の「形」をM字にする", "唇の「厚み」を減らす", "口角の「位置」を上げる", "鼻の下の長さを短くする"], "answer": 2, "explain": "口角挙上は口角の「位置」を上げる手術。上唇の形をM字にするのはM字リップ形成、厚みを減らすのは口唇縮小、鼻の下を短くするのは人中短縮。"}, {"id": "c2-08-2", "ch": "kuma", "card": "c2-08", "level": 2, "q": "口角挙上の手術を、ヒアルロン酸やボトックスの注射と比べた特徴は？", "choices": ["効果が半永久で、打ち直しがいらない", "傷あとが一切残らない", "注射よりダウンタイムが短い", "効果は半年〜1年で、定期的に受ける"], "answer": 0, "explain": "口角挙上は効果が半永久で、半年〜1年ごとの打ち直しがいらない。そのかわり傷あとはゼロにはならず、ダウンタイムも注射より長い。"}, {"id": "c2-09-1", "ch": "kuma", "card": "c2-09", "level": 1, "q": "M字リップ形成は、どこを切る手術？", "choices": ["口角の外側の皮膚を切り取る", "唇全体の内側を切り取って厚みを減らす", "上唇の内側を左右で切り取って縫う", "鼻の下を切って短くする"], "answer": 2, "explain": "M字リップ形成は上唇の内側を左右で少し切り取って縫い、一直線の唇をM字にする。唇全体の量（厚み）を減らすのは口唇縮小、口角の外側を切るのは口角挙上。"}, {"id": "c2-10-1", "ch": "kuma", "card": "c2-10", "level": 1, "q": "口唇縮小（スマートリップ）は、どんな手術？", "choices": ["唇の内側を切り取り、厚ぼったい唇を薄く小さくする", "唇にヒアルロン酸を入れてふっくらさせる", "口角を切って上へ移す", "上唇の左右だけを切ってM字にする"], "answer": 0, "explain": "口唇縮小は唇の内側を切り取って縫い、厚ぼったい唇を薄く小さくする。切るのは口の中側なので、傷は外から見えない。M字にするのはM字リップ形成。"}, {"id": "c2-10-2", "ch": "kuma", "card": "c2-10", "level": 1, "q": "口唇縮小を考えているお客様に、必ず伝えたいことは？", "choices": ["元には戻せず、唇は年をとると自然に薄くなる", "糸を抜けば、いつでも元に戻せる", "効果は半年〜1年で、打ち直しが必要", "傷は唇の外側に目立って残る"], "answer": 0, "explain": "口唇縮小は一度切り取ると元に戻せない。唇は年をとると自然に薄くなるので、今の厚さを基準に減らしすぎないよう、将来も考えて決める。"}, {"id": "c2-10-3", "ch": "kuma", "card": "c2-10", "level": 2, "q": "口元の3つの手術を区別する組み合わせで正しいのは？", "choices": ["位置を上げる＝M字リップ／形を作る＝口唇縮小／量を減らす＝口角挙上", "位置を上げる＝口唇縮小／形を作る＝口角挙上／量を減らす＝M字リップ", "位置を上げる＝口角挙上／形を作る＝M字リップ／量を減らす＝口唇縮小", "位置を上げる＝口角挙上／形を作る＝口唇縮小／量を減らす＝M字リップ"], "answer": 2, "explain": "口角挙上は口角の位置を上げ、M字リップ形成は上唇の形をM字にし、口唇縮小は唇の量（厚み）を減らす。この3語で区別すると覚えやすい。"}, {"id": "map-2-1", "ch": "kuma", "card": "map-2", "level": 1, "q": "いちばん多い「黒クマ」の正体は？", "choices": ["紫外線などによる色素沈着", "薄い皮膚から血管が透けたもの", "前に出た脂肪のふくらみの下にできる影", "内出血のあざ"], "answer": 2, "explain": "目玉の下のクッションの脂肪が前に押し出されてふくらみ、その下にみぞができる。この段差の影が黒クマで、色がついているわけではない。"}, {"id": "map-2-2", "ch": "kuma", "card": "map-2", "level": 1, "q": "「青クマ」の正体として、教材にあるのは？", "choices": ["皮膚が薄く、下の筋肉や血管が透けたもの", "ふくらみの下にできる影", "目をこする刺激による色素沈着", "涙袋のふくらみ"], "answer": 0, "explain": "目の下は皮膚が薄いので、下の筋肉や血管が透けて青クマになる。血行不良も原因。ふくらみの下の影は黒クマ、皮膚の色素沈着は茶クマ。"}, {"id": "map-2-3", "ch": "kuma", "card": "map-2", "level": 2, "q": "顔を上に向けたり、光の当たり方を変えたりすると薄く見えるクマは？", "choices": ["青クマ", "茶クマ", "青クマと茶クマ", "黒クマ"], "answer": 3, "explain": "黒クマは色ではなく、ふくらみとみぞの段差がつくる影なので、顔の向きや光の当たり方で薄く見える。青クマ・茶クマは向きを変えても消えない。"}, {"id": "map-2b-1", "ch": "kuma", "card": "map-2b", "level": 1, "q": "クマ取りの手術4つを見分ける「2つの質問」は？", "choices": ["脂肪を取るか足すか／麻酔が局所か静脈か", "皮膚を切るか糸で留めるか／上まぶたか下まぶたか", "脂肪を取るか溶かすか／クマが黒か青か", "脂肪を取るか敷き直すか／まぶたの裏から入るか皮膚を切るか"], "answer": 3, "explain": "質問1は前に出た脂肪を取るのか、下のみぞへ敷き直すのか。質問2はまぶたの裏から入るのか、まつげの下の皮膚を切るのか。この組み合わせで4つになる。"}, {"id": "map-2b-2", "ch": "kuma", "card": "map-2b", "level": 2, "q": "「表から入って脂肪を敷き直し、余った皮膚も切り取る」クマ取りの手術は？", "choices": ["裏ハムラ法", "経結膜脱脂", "表ハムラ法", "切開法（目の下のたるみ取り）"], "answer": 2, "explain": "取るだけ＝経結膜脱脂、裏から敷き直す＝裏ハムラ、表から敷き直して皮膚も切る＝表ハムラ、表から皮膚と脂肪を切り取る＝切開法。"}, {"id": "map-2b-3", "ch": "kuma", "card": "map-2b", "level": 2, "q": "クマ取りの手術4つのうち、顔の表に傷が残らないのは？", "choices": ["表ハムラ法と切開法", "裏ハムラ法と表ハムラ法", "経結膜脱脂と裏ハムラ法", "経結膜脱脂と切開法"], "answer": 2, "explain": "経結膜脱脂と裏ハムラはまぶたの裏から入るので表に傷がない（皮膚のたるみは取れない）。表ハムラと切開法はまつげの下の皮膚を切る。"}, {"id": "map-2b-4", "ch": "kuma", "card": "map-2b", "level": 2, "q": "目の下の「みぞ」を埋める方法として、教材が挙げる2通りは？", "choices": ["脂肪を取る（脱脂）と、皮膚を切り取る（切開法）", "スネコスと、ベビーコラーゲン", "眉下リフトと、切開法", "脂肪を敷き直す（ハムラ）と、別の場所の脂肪を足す（脂肪注入）"], "answer": 3, "explain": "みぞを埋める方法は、目の下の脂肪を敷き直すハムラ法と、太ももなど別の場所の脂肪を足す脂肪注入の2通り。脱脂や切開法はみぞを埋めない。"}, {"id": "quiz-2-1", "ch": "kuma", "card": "quiz-2", "level": 1, "q": "クマ取りの手術4つのうち、あおなぎでも受けられるのは？", "choices": ["経結膜脱脂と裏ハムラ法", "表ハムラ法と切開法", "裏ハムラ法と表ハムラ法", "経結膜脱脂と切開法"], "answer": 0, "explain": "あおなぎで受けられるのは、どちらもまぶたの裏から入る経結膜脱脂と裏ハムラ法の2つ。表ハムラ法と切開法は取り扱いなし（2026年10月時点）。"}, {"id": "c3-01-1", "ch": "nose", "card": "c3-01", "level": 1, "q": "鼻尖形成は、主にどんな悩みに向く手術？", "choices": ["鼻筋が低い", "鼻先が丸く太い団子鼻", "小鼻が下がっている", "鼻の下が長い"], "answer": 1, "explain": "鼻尖形成は鼻先の軟骨を糸で寄せて、丸い団子鼻を細くすっきりさせる手術。鼻筋が低いなら隆鼻術、小鼻の下がりは鼻翼挙上、鼻の下が長いなら人中短縮。"}, {"id": "c3-01-2", "ch": "nose", "card": "c3-01", "level": 2, "q": "鼻先まわりの手術のうち、何も足さず、今ある鼻先の軟骨を糸で寄せて細くするのは？", "choices": ["鼻尖部軟骨移植", "鼻中隔延長", "鼻尖形成", "鼻柱下降"], "answer": 2, "explain": "鼻尖形成は「足さずに寄せる」手術。鼻尖部軟骨移植・鼻中隔延長・鼻柱下降は、どれも耳などの軟骨を「足す」手術なので、ここでは違う。"}, {"id": "c3-01-3", "ch": "nose", "card": "c3-01", "level": 2, "q": "鼻尖形成で変化が出にくいことがあるのは、団子鼻の原因がどこにあるタイプ？", "choices": ["鼻先の軟骨が左右に開いていること", "鼻筋の骨の幅", "小鼻の位置の下がり", "皮膚そのものの厚さ"], "answer": 3, "explain": "団子鼻の原因が皮膚の厚さにあると、中で軟骨を寄せても厚い皮膚が形を覆い隠してしまう。軟骨が左右に開いているタイプは鼻尖形成の得意分野。"}, {"id": "c3-02-1", "ch": "nose", "card": "c3-02", "level": 1, "q": "鼻尖部軟骨移植で鼻先に足す材料と、その良い点は？", "choices": ["シリコンの棒。あとから取り出し・入れ替えができる", "ヒアルロン酸。注射だけで切らずに済む", "溶ける糸。約1年で自然に元に戻る", "自分の耳の軟骨。アレルギーの心配がなく自然"], "answer": 3, "explain": "材料は自分の耳の軟骨。人工物を使わないので、アレルギーの心配がなく、見た目も触り心地も自然。シリコンの棒は隆鼻術の材料。"}, {"id": "c3-02-2", "ch": "nose", "card": "c3-02", "level": 2, "q": "耳の軟骨を鼻先の軟骨の上に重ね、鼻先を少し高く・シャープにする手術は？", "choices": ["鼻尖形成", "鼻尖部軟骨移植", "鼻中隔延長", "鼻柱下降"], "answer": 1, "explain": "鼻先に耳の軟骨を「重ねる」のが鼻尖部軟骨移植。鼻尖形成は足さずに寄せる、鼻中隔延長は中の支柱に継ぎ足す、鼻柱下降は柱の下に足す。"}, {"id": "c3-02-4", "ch": "nose", "card": "c3-02", "level": 2, "q": "鼻尖部軟骨移植と鼻中隔延長は、どちらも軟骨を足す。違いは？", "choices": ["鼻中隔延長は中の支柱に継ぎ足し、鼻先ごと動く", "鼻尖部軟骨移植のほうが変化が大きい", "鼻中隔延長は軟骨を使わず、糸だけで行う", "鼻中隔延長は鼻筋（上半分）を高くする手術"], "answer": 0, "explain": "鼻尖部軟骨移植は鼻先に重ねるだけなので変化は少し。鼻中隔延長は中の支柱に継ぎ足すので鼻先ごと動き、変化が大きい。鼻筋を高くするのは隆鼻術。"}, {"id": "c3-03-1", "ch": "nose", "card": "c3-03", "level": 2, "q": "鼻の中の支柱（鼻中隔）に軟骨を継ぎ足して、鼻先ごと前・下へ動かす手術は？", "choices": ["鼻尖形成", "鼻中隔延長", "鼻尖部軟骨移植", "鼻柱下降"], "answer": 1, "explain": "テントの支柱を長いものに替えるように、中の支柱を伸ばして鼻先の位置そのものを動かすのが鼻中隔延長。短い鼻・上向きの鼻・低い鼻に向く。"}, {"id": "c3-03-2", "ch": "nose", "card": "c3-03", "level": 2, "q": "鼻中隔延長で継ぎ足す軟骨を、伸ばせる長さが短い順に並べると？", "choices": ["あばら → 鼻の中 → 耳", "耳 → 鼻の中 → あばら", "鼻の中 → 耳 → あばら", "耳 → あばら → 鼻の中"], "answer": 1, "explain": "伸ばせる長さは耳の軟骨が一番短く、鼻の中の仕切りの軟骨が中くらい、あばらの軟骨（肋軟骨）が一番長い。多くはまず耳の軟骨を使う。"}, {"id": "c3-04-1", "ch": "nose", "card": "c3-04", "level": 1, "q": "鼻柱下降で下に伸ばすのは、鼻のどこ？", "choices": ["左右の鼻の穴の間の柱", "鼻先の軟骨", "鼻の中の仕切り（鼻中隔）", "鼻の穴のふち"], "answer": 0, "explain": "鼻柱下降は、穴の間の柱に耳の軟骨を足して柱だけを下に伸ばす。正面から鼻の穴が目立ちにくくなる。鼻先を細くする手術ではない。"}, {"id": "c3-04-2", "ch": "nose", "card": "c3-04", "level": 2, "q": "横から見ると鼻の穴の間の柱が小鼻に隠れて見える悩みで、原因が「柱の引っ込み」ではなく「小鼻の下がり」の場合に合うのは？", "choices": ["鼻翼挙上", "鼻柱下降", "鼻中隔延長", "小鼻縮小"], "answer": 0, "explain": "柱が引っ込んでいるなら鼻柱下降、小鼻が下がっているなら小鼻を上げる鼻翼挙上。小鼻縮小は横幅や穴の大きさを小さくする手術なので違う。"}, {"id": "c3-05-1", "ch": "nose", "card": "c3-05", "level": 1, "q": "隆鼻術（シリコンプロテーゼ）で変わるのは、鼻のどこ？", "choices": ["鼻先だけ", "鼻筋と鼻先の両方", "小鼻の横幅", "鼻筋だけ"], "answer": 3, "explain": "隆鼻術が担当するのは鼻筋（上半分）だけで、鼻先の形は変わらない。鼻先も変えたいなら鼻尖形成などの鼻先のメニューと組み合わせる。"}, {"id": "c3-05-2", "ch": "nose", "card": "c3-05", "level": 1, "q": "隆鼻術で、鼻の穴の中から入れるものは？", "choices": ["自分の耳の軟骨", "ヒアルロン酸", "溶ける糸", "シリコン製の細い棒"], "answer": 3, "explain": "隆鼻術は、シリコン製の細い棒（プロテーゼ、I型）を鼻の穴の中から入れて、鼻の付け根から鼻筋を高くする。傷は顔の表面に出ない。"}, {"id": "c3-05-3", "ch": "nose", "card": "c3-05", "level": 2, "q": "鼻筋を高くするヒアルロン酸注射と比べた、プロテーゼ（隆鼻術）の特徴は？", "choices": ["注射だけで、切らずに済む", "体に吸収されないので、形が長く保たれる", "しばらくすると吸収されてなくなる", "何度も繰り返すと鼻が横に広がることがある"], "answer": 1, "explain": "プロテーゼは吸収されず半永久的。ほかの3つはヒアルロン酸注射の特徴（手軽だが吸収され、繰り返すと横に広がることがある）。"}, {"id": "c3-06-1", "ch": "nose", "card": "c3-06", "level": 1, "q": "小鼻縮小は、何を小さくする手術？", "choices": ["小鼻の高さ（位置）", "鼻の横幅や鼻の穴", "鼻先の丸み", "鼻の下の長さ"], "answer": 1, "explain": "小鼻縮小は小鼻の皮膚を切り取って縫い縮め、横幅や鼻の穴を小さくする。小鼻の位置を上げるのは鼻翼挙上、鼻の下を短くするのは人中短縮。"}, {"id": "c3-06-2", "ch": "nose", "card": "c3-06", "level": 2, "q": "小鼻縮小で、悩みが「鼻の穴が大きい」ときに選ぶやり方は？", "choices": ["外側法（小鼻の外側を切る）", "内側法（穴の底を切る）", "鼻翼挙上（小鼻の上を三日月形に切る）", "鼻孔縁挙上（穴のふちを切る）"], "answer": 1, "explain": "穴が大きいなら内側法、小鼻が外に張り出すなら外側法、両方なら内側＋外側。外側法では穴の大きさは基本的に変わらない。残り2つは別メニュー。"}, {"id": "c3-07-1", "ch": "nose", "card": "c3-07", "level": 1, "q": "鼻翼挙上は、小鼻の何を変える手術？", "choices": ["横幅を縮める", "位置を上げる", "鼻の穴のふちのカーブを上げる", "横のくぼみを埋める"], "answer": 1, "explain": "鼻翼挙上は小鼻の位置を上げる（縦の変化）。横幅を縮めるのは小鼻縮小、ふちのカーブを上げるのは鼻孔縁挙上、くぼみを埋めるのは貴族手術。"}, {"id": "c3-07-2", "ch": "nose", "card": "c3-07", "level": 2, "q": "鼻翼挙上と鼻孔縁挙上の違いとして正しいのは？", "choices": ["鼻翼挙上は小鼻そのものの位置を上げ、鼻孔縁挙上は穴のふちのカーブを上げる", "鼻翼挙上は穴のふちを切り、鼻孔縁挙上は小鼻の上を切る", "鼻翼挙上は軟骨を足し、鼻孔縁挙上は皮膚を切り取る", "どちらも小鼻の横幅を縮める手術で、切る場所だけが違う"], "answer": 0, "explain": "どちらも小鼻を「上げる」が、鼻翼挙上は小鼻の上の皮膚を三日月形に切って小鼻全体を上げ、鼻孔縁挙上はふちの皮膚を切ってふちを上げる。"}, {"id": "c3-08-1", "ch": "nose", "card": "c3-08", "level": 1, "q": "貴族手術（鼻翼基部形成）は、何をする手術？", "choices": ["鼻筋を高くして、気品のある横顔にする", "鼻の穴の間の柱の根元を前に出す", "小鼻の横のくぼみを底上げする", "小鼻の横幅を小さくする"], "answer": 2, "explain": "貴族手術は、小鼻の横のくぼみ（鼻翼基部）を口の中から底上げする。鼻を高くする手術ではない。柱の根元を前に出すのは猫手術。"}, {"id": "c3-08-2", "ch": "nose", "card": "c3-08", "level": 1, "q": "貴族手術で切るのはどこ？", "choices": ["口の中", "小鼻の外側のみぞ", "鼻の穴の間の柱", "鼻の穴のすぐ下のきわ"], "answer": 0, "explain": "貴族手術は口の中（上くちびるの裏側）を切るので、顔の表面に傷が出にくい。ヒアルロン酸を使う場合だけは切らずに注射で済む。"}, {"id": "c3-08-3", "ch": "nose", "card": "c3-08", "level": 1, "q": "「貴族手術」という名前の由来は？", "choices": ["ヨーロッパの貴族の鼻の形をまねる手術だから", "鼻筋を高くして気品を出す手術だから", "韓国での呼び名「気品のある口元にする手術」の訳", "開発した医師の名前から"], "answer": 2, "explain": "「貴族」は韓国での呼び名 Nobility Surgery（気品のある口元にする手術）の訳。鼻を高くする手術ではないので、名前で誤解しないこと。"}, {"id": "c3-09-1", "ch": "nose", "card": "c3-09", "level": 1, "q": "猫手術（鼻唇角矯正）は、何をする手術？", "choices": ["鼻先を猫のように小さく丸くする", "小鼻の横のくぼみを底上げする", "柱の根元に軟骨を入れて角度を整える", "鼻の下の皮膚を切り取って短くする"], "answer": 2, "explain": "猫手術は、鼻の穴の間の柱の根元に耳の軟骨を入れて横顔の角度を整える。猫の鼻にするわけではない。くぼみの底上げは貴族手術。"}, {"id": "c3-09-2", "ch": "nose", "card": "c3-09", "level": 2, "q": "「鼻の下が長い」悩みに対し、鼻の下の皮膚を切り取って実際に短くするのは？", "choices": ["猫手術", "貴族手術", "人中短縮", "鼻柱下降"], "answer": 2, "explain": "人中短縮は鼻の下の皮膚を切り取って実際に短くする。猫手術は柱の根元を前に出して短く「見せる」だけで、皮膚の長さは変わらない。"}, {"id": "c3-09-3", "ch": "nose", "card": "c3-09", "level": 2, "q": "貴族手術と猫手術で、物を入れる場所の組み合わせとして正しいのは？", "choices": ["貴族＝中央（柱の根元）／猫＝左右の外側（小鼻の付け根）", "貴族＝鼻筋／猫＝鼻先", "貴族＝左右の外側（小鼻の付け根）／猫＝中央（柱の根元）", "貴族＝小鼻の上のみぞ／猫＝鼻の穴のふち"], "answer": 2, "explain": "貴族手術は左右の外側でほうれい線対策、猫手術は中央で鼻と上くちびるの角度を整える。場所が重ならないので同時に受けられる。"}, {"id": "c3-10-1", "ch": "nose", "card": "c3-10", "level": 1, "q": "太い鼻筋を細くする骨切り幅寄せでは、何をする？", "choices": ["出っ張った骨を削る", "鼻筋にシリコンの棒を入れる", "骨に切れ込みを入れて寄せる", "鼻先の軟骨を糸で寄せる"], "answer": 2, "explain": "骨切り幅寄せは、鼻の上半分の骨に切れ込みを入れて中央へ寄せ、ギプスで固定する。骨を削るのはわし鼻修正、棒を入れるのは隆鼻術。"}, {"id": "c3-11-1", "ch": "nose", "card": "c3-11", "level": 1, "q": "わし鼻修正は、どんなやり方の手術？", "choices": ["鼻筋にプロテーゼを足す（足し算）", "鼻筋の骨の出っ張りを削る（引き算）", "骨を切って左右から寄せる", "鼻先に耳の軟骨を重ねる"], "answer": 1, "explain": "わし鼻修正は、骨のこぶ（ハンプ）を鼻の穴の中から削って平らにする「引き算」の手術。骨を切って寄せるのは骨切り幅寄せ、足し算は隆鼻術。"}, {"id": "c3-11-2", "ch": "nose", "card": "c3-11", "level": 2, "q": "骨をさわる3つの手術のうち、「横から見た」鼻筋の出っ張りを削るのは？", "choices": ["骨切り幅寄せ", "わし鼻修正", "斜鼻修正", "鼻尖形成"], "answer": 1, "explain": "見る向きで覚える。わし鼻修正は横から見た出っ張り（前後）、骨切り幅寄せは正面から見た幅（左右）、斜鼻修正は正面から見た曲がり。"}, {"id": "c3-12-1", "ch": "nose", "card": "c3-12", "level": 2, "q": "斜鼻修正の前に、CT撮影が必須とされる理由は？", "choices": ["入れるプロテーゼの大きさを決めるため", "傷あとが残る位置を決めるため", "曲がりの原因で手術の中身が変わるから", "使う麻酔の種類を決めるため"], "answer": 2, "explain": "鼻筋の曲がりの原因は、骨だけ・軟骨だけ・骨と軟骨の両方の3タイプ。どこが原因かで手術の中身が変わるので、事前にCTで確かめる。"}, {"id": "c3-12-2", "ch": "nose", "card": "c3-12", "level": 1, "q": "斜鼻修正のあと、鼻の中の粘膜が腫れるため、しばらく起こりやすいことは？", "choices": ["鼻がつまりやすい", "小鼻が横に広がりやすい", "上くちびるが厚くなる", "鼻先が上を向く"], "answer": 0, "explain": "斜鼻修正のあとは鼻の中の粘膜が腫れるので、しばらく鼻がつまりやすい。通りは3〜6か月かけて戻っていく。小鼻の広がりは貴族手術などの注意点。"}, {"id": "c3-13-1", "ch": "nose", "card": "c3-13", "level": 1, "q": "「鼻孔縁挙上（びこうえんきょじょう）」を名前から分解すると？", "choices": ["鼻の穴のふちを持ち上げる", "小鼻全体の位置を持ち上げる", "鼻の穴の間の柱を下げる", "鼻の穴を小さくする"], "answer": 0, "explain": "鼻孔縁＝鼻の穴のふち、挙上＝持ち上げる。垂れた分のふちの皮膚を切り取って、ふちのカーブを上げる手術。小鼻全体を上げるのは鼻翼挙上。"}, {"id": "c3-13-2", "ch": "nose", "card": "c3-13", "level": 2, "q": "鼻の穴のふちと柱の「高さの差」を直す2つの手術。それぞれ何をする？", "choices": ["鼻孔縁挙上＝柱を下げる／鼻柱下降＝ふちを上げる", "鼻孔縁挙上＝ふちを上げる／鼻柱下降＝柱を下げる", "鼻孔縁挙上＝ふちに軟骨を足す／鼻柱下降＝柱の皮膚を切り取る", "鼻孔縁挙上＝小鼻全体を上げる／鼻柱下降＝鼻先ごと前へ出す"], "answer": 1, "explain": "ふちと柱の高さの差を直す点は同じだが、ふちを上げるのが鼻孔縁挙上（皮膚を切り取る）、柱を下げるのが鼻柱下降（耳の軟骨を足す）。"}, {"id": "c3-14-1", "ch": "nose", "card": "c3-14", "level": 1, "q": "「人中（じんちゅう）」は、顔のどこ？", "choices": ["鼻の下からくちびるまでの部分", "左右の鼻の穴の間の柱", "鼻の付け根", "小鼻の横のくぼみ"], "answer": 0, "explain": "人中＝鼻の下からくちびるまでの部分。人中短縮はここの皮膚を数mm切り取って縫い縮めるので、鼻とくちびるの距離が実際に短くなる。"}, {"id": "c3-14-2", "ch": "nose", "card": "c3-14", "level": 1, "q": "人中短縮が「リップリフト」とも呼ばれるのはなぜ？", "choices": ["くちびるにヒアルロン酸を入れるから", "口の中を切る手術だから", "口角を糸で引き上げるから", "縫い縮めるとき、上くちびるが引き上げられるから"], "answer": 3, "explain": "鼻の下の皮膚を縫い縮めると上くちびるが引き上げられ、くちびるに立体的な厚みが出る。だから人中短縮は別名「リップリフト」と呼ばれる。"}, {"id": "c3-14-3", "ch": "nose", "card": "c3-14", "level": 1, "q": "人中短縮で、傷ができる場所は？", "choices": ["口の中の粘膜", "耳の後ろの付け根", "鼻の穴の下のきわ", "鼻の穴の中だけ"], "answer": 2, "explain": "人中短縮は顔の正面に傷ができる手術。鼻の穴のすぐ下のきわに沿って切り、鼻の影に隠す。口の中を切るのは貴族手術、耳の後ろは軟骨を採る所。"}, {"id": "cat-3-1", "ch": "nose", "card": "cat-3", "level": 1, "q": "鼻の手術メニューを扱っているのはどちらのクリニック？", "choices": ["デイズだけ", "あおなぎだけ", "デイズとあおなぎの両方", "どちらも扱っていない"], "answer": 0, "explain": "鼻の手術はデイズだけのメニュー。あおなぎのサイトには鼻の手術の掲載がない（2026年10月時点）。あおなぎの料金表にあるのは注射の小鼻縮小ボトックス注射。"}, {"id": "map-3-1", "ch": "nose", "card": "map-3", "level": 1, "q": "「鼻背（びはい）」は、ふつうの言葉で鼻のどこ？", "choices": ["鼻先", "小鼻", "鼻筋", "鼻の付け根"], "answer": 2, "explain": "鼻背＝鼻筋。「背」は筋の意味。鼻先は鼻尖、小鼻は鼻翼、鼻の付け根は鼻根なので違う。部位の漢字が読めれば、メニュー名の意味の見当がつく。"}, {"id": "map-3-2", "ch": "nose", "card": "map-3", "level": 1, "q": "「鼻尖（びせん）」は、ふつうの言葉で鼻のどこ？", "choices": ["鼻筋", "小鼻", "鼻の穴の間の柱", "鼻先"], "answer": 3, "explain": "鼻尖＝鼻先。「尖」は先の意味。だから鼻尖形成は「鼻先の形を作る」手術。鼻筋は鼻背、小鼻は鼻翼、穴の間の柱は鼻柱と呼ぶので違う。"}, {"id": "map-3-3", "ch": "nose", "card": "map-3", "level": 1, "q": "「鼻翼（びよく）」は、ふつうの言葉で鼻のどこ？", "choices": ["鼻の穴のふち", "鼻の下", "鼻先", "小鼻"], "answer": 3, "explain": "鼻翼＝小鼻。だから鼻翼挙上は「小鼻を上げる」手術になる。鼻の穴のふちは鼻孔縁、鼻の下は人中、鼻先は鼻尖なので、どれも違う。"}, {"id": "map-3-4", "ch": "nose", "card": "map-3", "level": 1, "q": "「鼻柱（びちゅう）」は、ふつうの言葉で鼻のどこ？", "choices": ["鼻の付け根", "鼻の中で左右の穴を分ける壁", "鼻筋", "左右の鼻の穴の間の柱"], "answer": 3, "explain": "鼻柱＝左右の鼻の穴の間にある柱。鼻の中で左右の穴を分ける壁は「鼻中隔」という別の名前なので、取り違えないように注意しよう。"}, {"id": "map-3-5", "ch": "nose", "card": "map-3", "level": 1, "q": "「鼻根（びこん）」は、ふつうの言葉で鼻のどこ？", "choices": ["鼻の先端", "鼻と口の間", "左右の小鼻", "鼻の付け根"], "answer": 3, "explain": "鼻根＝鼻の付け根。「根」は付け根の意味。部位の名前は「鼻」＋部位の漢字（根・背・尖・翼・柱・孔）でできているので、漢字から見当がつく。"}, {"id": "map-3b-1", "ch": "nose", "card": "map-3b", "level": 1, "q": "鼻の中身（骨と軟骨）の配置として正しいのは？", "choices": ["上半分が軟骨、下半分が骨", "全体が骨", "上半分が骨、下半分が軟骨", "全体が軟骨"], "answer": 2, "explain": "鼻は上半分が骨、下半分が軟骨でできている。自分の鼻をつまむと、上はかたく、下はぐにぐに動くのはこのため。手術のやり方もこれで変わる。"}, {"id": "map-3b-2", "ch": "nose", "card": "map-3b", "level": 1, "q": "「鼻中隔（びちゅうかく）」とは何？", "choices": ["左右の鼻の穴の間にある、外から見える柱", "鼻先の形を作る左右1対の軟骨", "鼻の上半分のかたい骨", "鼻の中で左右の穴を分ける壁"], "answer": 3, "explain": "鼻中隔は鼻の中の仕切りの壁で、鼻先を内側から支える柱の役目。外から見える柱は鼻柱、左右1対の軟骨は大鼻翼軟骨、上半分の骨は鼻骨。"}, {"id": "map-3b-3", "ch": "nose", "card": "map-3b", "level": 2, "q": "鼻の手術の切り方「オープン法」の説明として正しいのは？", "choices": ["穴の中と柱を切り、中を直接見ながら細かい作業ができる", "鼻の穴の中だけを切るので、傷が表に出ない", "皮膚を切らず、溶ける糸を鼻先から入れる", "口の中を切るので、顔の表面に傷が出ない"], "answer": 0, "explain": "オープン法は柱も切るので傷は柱に残るが、細かい作業ができ、軟骨を足す手術でよく選ばれる。穴の中だけを切るのはクローズ法。"}, {"id": "map-3d-1", "ch": "nose", "card": "map-3d", "level": 2, "q": "鼻の手術が「組み合わせ」で行われることが多いのはなぜ？", "choices": ["1つのメニューが担当するのは、ほぼ1か所だけだから", "1つのメニューだけだと効果が1年ほどで消えるから", "組み合わせると料金が1回分にまとまるから", "鼻のメニューは単独では受けられない決まりだから"], "answer": 0, "explain": "鼻は1メニュー＝1か所。鼻筋も鼻先も変えたいならメニューを重ねる。料金もメニューごとにかかるので「1回分にまとまる」は違う。"}, {"id": "c4-01-1", "ch": "lift", "card": "c4-01", "level": 1, "q": "脂肪注入（ナノファット2.0）で、顔に入れるものは？", "choices": ["自分の太ももから取った脂肪", "ゼリー状のヒアルロン酸", "脂肪を溶かす薬", "トゲのついた溶ける糸"], "answer": 0, "explain": "脂肪注入は、自分の太ももの内側から取った脂肪を加工して、顔のくぼみやシワに少しずつ入れる「足す」施術。自分の細胞なので異物としてはねのける反応が起きにくい。"}, {"id": "c4-01-2", "ch": "lift", "card": "c4-01", "level": 1, "q": "脂肪注入で入れた脂肪のうち、根づいて残るのはどのくらい？", "choices": ["入れた量の全部", "入れた量の5％ほど", "入れた量の30〜70％", "入れた量の2倍に増える"], "answer": 2, "explain": "根づいた（定着した）分だけが長く残り、その割合は入れた量の30〜70％。根づかなかった分は体に吸収されて消える。どれだけ残るかは人による。"}, {"id": "c4-01-3", "ch": "lift", "card": "c4-01", "level": 2, "q": "脂肪注入とヒアルロン酸注射を比べたとき、脂肪注入について正しいのは？", "choices": ["溶かしてやり直すことができない", "効果は数か月で必ず消える", "入れたあと酵素で溶かして戻せる", "太ももから脂肪を取る手間はない"], "answer": 0, "explain": "ヒアルロン酸は溶かして戻す方法があるが、脂肪注入は元に戻すのが難しい。そのかわり定着した分は永久的に残る。太ももから脂肪を取る手間もかかる。"}, {"id": "c4-02-1", "ch": "lift", "card": "c4-02", "level": 1, "q": "脂肪吸引注射は、何をする施術？", "choices": ["脂肪を溶かす薬を注射する", "ごく細い針で脂肪を吸い出す", "口の中を切って脂肪を取り出す", "自分の脂肪を顔に入れる"], "answer": 1, "explain": "名前は「注射」でも薬は入れない。ごく細い針で皮膚の下の脂肪をじかに吸い出す、小さな脂肪吸引。薬を入れて溶かすのは脂肪溶解注射。"}, {"id": "c4-02-2", "ch": "lift", "card": "c4-02", "level": 2, "q": "注射器のピストンにたとえたとき、脂肪吸引注射と脂肪溶解注射の正しい組み合わせは？", "choices": ["吸引注射は「押して薬を入れる」、溶解注射は「引いて吸い出す」", "どちらも「押して薬を入れる」", "どちらも「引いて吸い出す」", "吸引注射は「引いて吸い出す」、溶解注射は「押して薬を入れる」"], "answer": 3, "explain": "押して薬を入れ、脂肪を溶かすのが脂肪溶解注射。引いて脂肪を吸い出すのが脂肪吸引注射。名前は似ているが、向きが逆の別メニュー。"}, {"id": "c4-03-1", "ch": "lift", "card": "c4-03", "level": 1, "q": "顔の脂肪吸引がリバウンドしにくいといわれる理由は？", "choices": ["脂肪の細胞を小さくするだけだから", "首の筋肉を締め直すから", "薬で脂肪を溶かすから", "脂肪の細胞の数そのものを減らすから"], "answer": 3, "explain": "ダイエットは細胞が小さくなるだけで数は同じ。脂肪吸引は細胞そのものを吸い出して数を減らすので、リバウンドしにくい（体重が急に増えれば影響は出る）。"}, {"id": "c4-03-2", "ch": "lift", "card": "c4-03", "level": 2, "q": "顔の脂肪吸引と比べたとき、ジョール・メーラー・バッカルの各ファット除去の取り方の特徴は？", "choices": ["口の中から、決まった場所の脂肪をねらって取る", "皮膚の外から、脂肪を広く薄くする", "薬を注射して少しずつ溶かす", "脂肪を取らずに上へ戻して留める"], "answer": 0, "explain": "顔の脂肪吸引は皮膚の外から、皮膚の下の脂肪を広く薄くする。3つのファット除去は口の中から、決まった部屋の脂肪をねらって取る。"}, {"id": "c4-04-1", "ch": "lift", "card": "c4-04", "level": 1, "q": "脂肪溶解注射は、どうやって脂肪を減らす？", "choices": ["溶かす薬を注射し、数回かけて減らす", "ごく細い針で、1回で脂肪を吸い出す", "口の中を小さく切って取り出す", "超音波で筋肉の膜を縮める"], "answer": 0, "explain": "脂肪溶解注射は薬を「入れて」脂肪をこわし、体に片づけてもらう切らない施術で、1回では終わらず数回くり返す。針で吸い出すのは脂肪吸引注射。"}, {"id": "c4-04-2", "ch": "lift", "card": "c4-04", "level": 2, "q": "脂肪溶解注射の薬が、頬の奥のバッカルファットに基本的に届かないのはなぜ？", "choices": ["バッカルファットは脂肪ではなく筋肉だから", "薬が皮膚の表面にしか効かないから", "薬が届くのは針のまわりの浅い脂肪だけだから", "バッカルファットは時間がたつと自然に消えるから"], "answer": 2, "explain": "薬が届くのは針のまわりの浅い脂肪だけ。バッカルファットは筋肉や膜の奥にある深い脂肪なので、口の中から取り出すバッカルファット除去の対象になる。"}, {"id": "c4-05-1", "ch": "lift", "card": "c4-05", "level": 1, "q": "ジョールファット除去で、顔の表面に傷が出ないのはなぜ？", "choices": ["耳のまわりの髪で傷が隠れるから", "針で薬を入れるだけだから", "切るのは口の中だけだから", "まぶたの裏から入るから"], "answer": 2, "explain": "ジョールファット除去は口角の内側を約5mm切って脂肪を取るので、顔の表面に傷が出ない。溶ける糸で縫うので抜糸もいらない。"}, {"id": "c4-06-1", "ch": "lift", "card": "c4-06", "level": 1, "q": "メーラーファット除去の主なねらいは？", "choices": ["口元のもたつきと、口角から下への線", "あご下のたるみと、首の縦のスジ", "目元の小じわと毛穴", "ほうれい線と、笑ったときの頬のふくらみ"], "answer": 3, "explain": "メーラーファットはほうれい線の上にのる頬の脂肪。口の中から吸って軽くし、ほうれい線と笑ったときのふくらみを目立たなくする。口元のもたつきはジョールの担当。"}, {"id": "c4-06-2", "ch": "lift", "card": "c4-06", "level": 2, "q": "頬の上の脂肪が「下がって」、目の下がくぼんで見える人に合うのは？", "choices": ["メーラーファット除去", "バッカルファット除去", "脂肪溶解注射", "ミッドフェイスリフト"], "answer": 3, "explain": "同じ頬の上の脂肪でも、多いなら減らす（メーラーファット除去）、下がったなら上へ戻す（ミッドフェイスリフト）。下がった人から取ると、目の下の影などがかえって目立つことがある。"}, {"id": "c4-07-1", "ch": "lift", "card": "c4-07", "level": 1, "q": "ジョール・メーラー・バッカルの3つのファット除去で、共通している入り口は？", "choices": ["耳のまわり", "口の中", "あごの下", "まぶたの裏"], "answer": 1, "explain": "3つとも口の中から入るので、顔の表面に傷は出ない。違うのは「どの部屋の脂肪を取るか」で、組み合わせて受けることもできる。"}, {"id": "c4-07-2", "ch": "lift", "card": "c4-07", "level": 2, "q": "たるみが強い人がバッカルファット除去を受けると、どうなることがある？", "choices": ["たるみも必ず消える", "余計にたるむことがある", "取った脂肪がすぐ再生する", "顔の表面に大きな傷が残る"], "answer": 1, "explain": "たるみが強い人や、たるみの原因がバッカルファット以外にある人は、取ると余計にたるむことがある。サイトのおすすめは、たるみが目立つ前の20〜30代。"}, {"id": "c4-08-1", "ch": "lift", "card": "c4-08", "level": 1, "q": "ミッドフェイスリフトは、下がった頬の脂肪をどうする手術？", "choices": ["上へ戻して、骨の表面の膜に糸で留める", "口の中から吸い出して減らす", "薬を注射して溶かす", "太ももの脂肪を足してふくらませる"], "answer": 0, "explain": "脂肪を取らずに上へ戻し、伸びたり垂れたりしない骨膜（骨の表面の膜）に留める。だから、こけた人にも使える。吸って減らすのはメーラーファット除去。"}, {"id": "c4-09-1", "ch": "lift", "card": "c4-09", "level": 1, "q": "糸リフトは、どんな方法で顔を引き上げる？", "choices": ["溶ける糸を針で通し、引っぱり上げる", "超音波で筋肉の膜を熱で縮める", "耳のまわりを切って皮膚を切り取る", "ゼリー状の成分を入れてふくらませる"], "answer": 0, "explain": "糸リフトは、トゲのついた溶ける糸を針で頬の中に通し、引っかけて引き上げる切らないリフト。傷は針穴だけで、20〜30分で終わる。"}, {"id": "c4-09-2", "ch": "lift", "card": "c4-09", "level": 1, "q": "糸リフトの効果が続く期間の目安は？", "choices": ["1〜2週間ほど", "5〜10年ほど", "一生続く", "1〜2年ほど"], "answer": 3, "explain": "糸は体の中で溶けるので、効果は1〜2年ほど。糸の種類で引き上げる力・もち・料金が変わる。5〜10年ほどもつのは切開リフト。"}, {"id": "c4-09-3", "ch": "lift", "card": "c4-09", "level": 2, "q": "機械（HIFUなど）と糸リフトの、引き上げ方の違いは？", "choices": ["機械は物理的に引っぱり、糸は熱で縮める", "どちらも余った皮膚を切り取る", "機械は熱で縮め、糸は物理的に引っぱる", "どちらも薬で脂肪を溶かす"], "answer": 2, "explain": "機械は熱をあてて組織を縮める。糸はトゲで引っかけて物理的に引っぱる。どちらも余った皮膚は減らせず、それができるのは切開リフトだけ。"}, {"id": "c4-10-1", "ch": "lift", "card": "c4-10", "level": 1, "q": "ペリカン手術がねらうのは何？", "choices": ["頬の奥の脂肪", "目の下の脂肪", "皮膚の浅い層のコラーゲン", "あご下〜首の筋肉のゆるみ"], "answer": 3, "explain": "ペリカン手術は、首の前をおおう薄い筋肉（広頸筋）のゆるみを、中央に寄せて縫って締め直す手術。ねらうのは脂肪ではなく筋肉。"}, {"id": "c4-10-2", "ch": "lift", "card": "c4-10", "level": 2, "q": "二重あごの原因に合わせた使い分けとして、正しいのは？", "choices": ["脂肪が原因ならペリカン手術、筋肉が原因なら脂肪吸引", "どちらが原因でもボトックス", "脂肪が原因なら脂肪吸引、筋肉が原因ならペリカン手術", "どちらが原因でもヒアルロン酸注射"], "answer": 2, "explain": "脂肪が原因なら脂肪吸引、首の筋肉のゆるみが原因ならペリカン手術。両方に問題があれば組み合わせる、とサイトに書かれている。"}, {"id": "c4-11-1", "ch": "lift", "card": "c4-11", "level": 1, "q": "機械や糸リフトにはできず、切開リフトだけができることは？", "choices": ["熱でコラーゲンを増やす", "針穴だけで済ませる", "麻酔なしで受けられる", "余った皮膚そのものを切り取る"], "answer": 3, "explain": "切開リフトは奥の膜（SMAS）ごと引き上げ、余った皮膚を切り取る。機械は熱で縮めるだけ、糸は引っぱるだけで、皮膚の量は減らせない。"}, {"id": "c4-11-2", "ch": "lift", "card": "c4-11", "level": 1, "q": "切開リフト（フェイスリフト）の効果が続く目安は？", "choices": ["3〜6か月ほど", "1〜2年ほど", "1か月ほど", "5〜10年ほど"], "answer": 3, "explain": "切開リフトの効果は5〜10年ほどで、はしごの中でいちばん長もち。そのかわり腫れは3〜4週間と、体への負担もいちばん大きい。"}, {"id": "c4-11-3", "ch": "lift", "card": "c4-11", "level": 2, "q": "HIFUと切開リフトが、どちらもねらう層は？", "choices": ["奥の膜（SMAS）", "皮膚の浅い層（真皮）", "頬の奥のバッカルファット", "骨"], "answer": 0, "explain": "どちらも筋肉の膜（SMAS）をねらう。HIFUは切らずに熱で縮め、切開リフトは手で引き上げて留める。切らないぶん、HIFUの効果は数か月と短い。"}, {"id": "c4-12-1", "ch": "lift", "card": "c4-12", "level": 1, "q": "ソフウェーブは、何のエネルギーで、どの深さを温める機械？", "choices": ["高周波で、真皮〜脂肪の奥", "超音波で、いちばん深い筋肉の膜", "超音波で、皮膚の浅い真皮", "高周波で、骨の表面"], "answer": 2, "explain": "ソフウェーブは超音波で浅い真皮（約0.5〜2.0mm）を広く温め、ハリ・小じわが得意。高周波で真皮〜脂肪はXERF、超音波で筋肉の膜はHIFU。"}, {"id": "c4-12-2", "ch": "lift", "card": "c4-12", "level": 2, "q": "「HIFUのあと頬がこけた」「顔の脂肪が少ない」人に、サイトがすすめているメニューは？", "choices": ["ウルトラセルZi（HIFU）", "バッカルファット除去", "ソフウェーブ", "脂肪溶解注射"], "answer": 2, "explain": "ソフウェーブは浅い真皮だけを温めるので、頬がこけやすい人にも向く。HIFUの熱は脂肪も減らす方向に働くことがあり、やせている人はかえって老けて見えることがある。"}, {"id": "c4-13-1", "ch": "lift", "card": "c4-13", "level": 1, "q": "機械3種（HIFU・ソフウェーブ・XERF）のうち、唯一「高周波（電気の熱）」を使うのは？", "choices": ["ソフウェーブ", "XERF（ザーフ）", "ウルトラセルZi（HIFU）", "3つとも高周波"], "answer": 1, "explain": "XERFは3つの中で唯一の高周波で、真皮から脂肪の奥まで深さを選べる。ソフウェーブとHIFUはどちらも超音波で、HIFUは高周波ではない。"}, {"id": "c4-13-2", "ch": "lift", "card": "c4-13", "level": 2, "q": "XERFを受ける前に「体の中に金属が入っているか」を確認するのはなぜ？", "choices": ["高周波の電気が金属に集まり熱くなるおそれがあるから", "金属アレルギーがある人は受けられないから", "超音波が金属ではね返って効かなくなるから", "金属があると麻酔クリームが効かないから"], "answer": 0, "explain": "高周波は電気なので、体内の金属に集まりやすく、そこだけ熱くなるおそれがある。確認するのは「金属アレルギーがあるか」ではなく「金属が入っているか」。"}, {"id": "c4-13-3", "ch": "lift", "card": "c4-13", "level": 2, "q": "XERFとHIFUの熱の入り方の違いとして、正しいのは？", "choices": ["XERFは1点に集めて熱し、HIFUは広い面をじんわり温める", "XERFは広い面をじんわり温め、HIFUは1点に集めて熱する", "どちらも1点に集めて熱する", "どちらも広い面をじんわり温める"], "answer": 1, "explain": "XERFは電気毛布のように面でじんわり温める。HIFUは虫めがねのように超音波を1点に集め、深い筋肉の膜を点で熱する。深さを分担する関係。"}, {"id": "c4-14-1", "ch": "lift", "card": "c4-14", "level": 1, "q": "ウルトラセルZi（HIFU）がねらうのは、どの層？", "choices": ["筋肉の膜（SMAS）", "皮膚の浅い層（真皮）だけ", "真皮〜脂肪を広く", "骨"], "answer": 0, "explain": "HIFUは超音波を1点に集め、3つの機械でいちばん深い筋肉の膜（SMAS）を熱で縮める。だから引き上げが得意。真皮はソフウェーブ、真皮〜脂肪はXERF。"}, {"id": "c4-14-2", "ch": "lift", "card": "c4-14", "level": 1, "q": "「HIFU」と「ウルトラセルZi」の関係として、正しいのは？", "choices": ["HIFUは機械の名前、ウルトラセルZiは技術の名前", "HIFUは技術の名前、ウルトラセルZiは機械の名前", "どちらも高周波の機械の名前", "HIFUはソフウェーブの別名"], "answer": 1, "explain": "HIFU（高密度焦点式超音波）は技術の名前で、ウルトラセルZiはその技術を使う機械の名前。ウルトラセルというシリーズの最新型にあたる。"}, {"id": "c4-15-1", "ch": "lift", "card": "c4-15", "level": 1, "q": "ヒアルロン酸注射は、この章の分類でいうと何をする施術？", "choices": ["脂肪を減らす", "筋肉の動きを止める", "足してふくらませる", "熱で引き締める"], "answer": 2, "explain": "ヒアルロン酸は水分を含むゼリー状の成分を入れ、へこみを下から持ち上げる「② 足す」施術。筋肉の動きを弱めるのはボトックス。"}, {"id": "c4-15-2", "ch": "lift", "card": "c4-15", "level": 2, "q": "目の下や唇に入れるヒアルロン酸は、どんな硬さのものを使う？", "choices": ["形がしっかり出るかためのもの", "どの場所にも同じ硬さのもの", "やわらかいもの", "皮膚がうすいので、ヒアルロン酸は入れない"], "answer": 2, "explain": "皮膚がうすい目の下・涙袋・唇にはやわらかいもの、形を出したい鼻・あごにはかためのものを使う。入れる場所によって硬さを使い分ける。"}, {"id": "c4-16-1", "ch": "lift", "card": "c4-16", "level": 1, "q": "ボトックスは何をする薬？", "choices": ["へこみを足してふくらませる", "脂肪を溶かす", "筋肉の動きを弱める", "皮膚を熱で引き締める"], "answer": 2, "explain": "ボトックスは神経から筋肉への「縮め」の命令を一時的に止め、筋肉の動きを弱める。何も足さないのでふくらみはしない。ふくらませるのはヒアルロン酸。"}, {"id": "c4-16-2", "ch": "lift", "card": "c4-16", "level": 1, "q": "この章の分類（減らす・足す・引き上げる…）で、ボトックスはどこに入る？", "choices": ["足す", "動きを止める", "減らす", "引き上げる・締める"], "answer": 1, "explain": "ボトックスは何も足さず、筋肉の動きを弱めるだけ。足すヒアルロン酸とは考え方が逆で、分類では「動きを止める」に入る。脂肪やたるみではなく筋肉が原因のときに使う。"}, {"id": "c4-16-3", "ch": "lift", "card": "c4-16", "level": 2, "q": "「動くと出るしわ」と「じっとしていても見える溝」。合うメニューの正しい組み合わせは？", "choices": ["動くと出るしわはボトックス、じっとしていても見える溝はヒアルロン酸", "動くと出るしわはヒアルロン酸、じっとしていても見える溝はボトックス", "どちらもボトックス", "どちらも糸リフト"], "answer": 0, "explain": "ボトックスは筋肉の動きを弱めるので、動かすと出るしわに向く。ヒアルロン酸は足して持ち上げるので、じっとしていても見える溝やへこみに向く。"}, {"id": "c4-16-4", "ch": "lift", "card": "c4-16", "level": 2, "q": "エラの張りを小さくしたい人のうち、ボトックスが向かないのはどの場合？", "choices": ["エラのかむ筋肉が発達している", "エラの張りが骨格によるもの", "奥歯をかみしめるとエラが硬くふくらむ", "発達したエラの筋肉を細くしたい"], "answer": 1, "explain": "ボトックスは筋肉を細くする薬なので、かむ筋肉（咬筋）の張りには向く。張りが骨格によるものなら効果が期待できないので、事前の診断が必要とサイトに明記されている。"}, {"id": "c4-16-5", "ch": "lift", "card": "c4-16", "level": 1, "q": "エラにボトックスを打ったとき、効き始める目安は？", "choices": ["打った直後", "2〜3週間後", "半年後", "1年後"], "answer": 1, "explain": "表情じわへの効果は数日で出るが、エラは2〜3週間後から効き始め、平均2か月ほどで小顔の効果が目に見える。効いていないと判断するのは2週間たってから。"}, {"id": "map-4-1", "ch": "lift", "card": "map-4", "level": 1, "q": "顔の脂肪の部屋のうち、1つだけ筋肉や膜の奥（深い所）にあるのはどれ？", "choices": ["メーラーファット", "ジョールファット", "あご下の脂肪", "バッカルファット"], "answer": 3, "explain": "バッカルファットは頬の奥深く、口の中に近い場所にある深い脂肪。メーラー・ジョール・あご下は皮膚のすぐ下の浅い脂肪で、外から針や細い管で届く。"}, {"id": "map-4-2", "ch": "lift", "card": "map-4", "level": 1, "q": "ほうれい線のすぐ上にあり、笑うと盛り上がる所の脂肪は？", "choices": ["バッカルファット", "メーラーファット", "ジョールファット", "あご下の脂肪"], "answer": 1, "explain": "メーラーファットは頬の上のほう、ほうれい線の上にのっている浅い脂肪。バッカルは頬の奥、ジョールは口の横〜フェイスラインの脂肪。"}, {"id": "map-4-3", "ch": "lift", "card": "map-4", "level": 1, "q": "「口の横〜フェイスライン」にある脂肪の部屋は？", "choices": ["メーラーファット", "バッカルファット", "ジョールファット", "あご下の脂肪"], "answer": 2, "explain": "ジョールファットは口の横からフェイスラインにかけての浅い脂肪で、垂れると口元がもたつく。メーラーは頬の上、バッカルは頬の奥、あご下は二重あごのもと。"}, {"id": "map-4-4", "ch": "lift", "card": "map-4", "level": 1, "q": "「二重あごのもと」になる脂肪の部屋はどこ？", "choices": ["バッカルファット", "メーラーファット", "ジョールファット", "あご下の脂肪"], "answer": 3, "explain": "あご下（顎下）の脂肪は、あごの裏側にある浅い脂肪で、二重あごのもと。メーラーは頬の上、バッカルは頬の奥、ジョールは口の横の脂肪。"}, {"id": "map-4-5", "ch": "lift", "card": "map-4", "level": 2, "q": "「頬やフェイスラインが下がってきた」のが原因の人に合う、やることはどれ？", "choices": ["脂肪を減らす", "へこみに足す", "引き上げる・締める", "筋肉の動きを止める"], "answer": 2, "explain": "原因が「下がった」なら引き上げる、「へこんだ」なら足す。減らすのは脂肪が多いときだけで、動きを止めるのはエラの筋肉の張りや表情ジワのとき。"}, {"id": "map-4-6", "ch": "lift", "card": "map-4", "level": 2, "q": "顔の脂肪を取りすぎると、どうなりやすい？", "choices": ["体が脂肪をすぐ作り直して元に戻る", "筋肉が張ってエラが目立つ", "皮膚がピンと張って若く見える", "頬がこけたり、余った皮膚がたるんだりする"], "answer": 3, "explain": "脂肪は皮膚を内側から支えるクッション。取りすぎると頬がこけたり余った皮膚がたるんだりし、しかも取った脂肪は元に戻せない。"}, {"id": "map-4b-1", "ch": "lift", "card": "map-4b", "level": 1, "q": "たるみ治療の「はしご」を、軽い段から正しく並べたものは？", "choices": ["糸 → 機械 → 切開リフト → 部分の手術", "機械 → 糸 → 部分の手術 → 切開リフト", "機械 → 部分の手術 → 糸 → 切開リフト", "切開リフト → 部分の手術 → 糸 → 機械"], "answer": 1, "explain": "機械（HIFU・ソフウェーブ・XERF）→糸リフト→部分の手術（ペリカン・ミッドフェイス）→切開リフトの順に強くなる。軽い段から試し、足りなければ上の段へ進む。"}, {"id": "map-4b-2", "ch": "lift", "card": "map-4b", "level": 1, "q": "たるみ治療のはしごで、「部分の手術」の段に入るメニューは？", "choices": ["HIFUとXERF", "ペリカン手術とミッドフェイスリフト", "糸リフト", "フェイスリフトとネックリフト"], "answer": 1, "explain": "部分の手術は、あご下のペリカン手術と頬のミッドフェイスリフト。HIFU・XERFは機械の段、糸リフトはその次の段、フェイスリフト等はいちばん上の切開リフト。"}, {"id": "map-4b-3", "ch": "lift", "card": "map-4b", "level": 2, "q": "たるみ治療のはしごで、上の段へ行くほどどうなる？", "choices": ["効果は強く長もちするが、休む期間と料金も大きくなる", "効果は弱くなるが、休む期間は短くなる", "効果も休む期間も変わらず、料金だけ上がる", "効果は強くなり、休む期間はいらなくなる"], "answer": 0, "explain": "段を上がるほど効果は強く長もちするが、ダウンタイム（回復までに休む期間）と料金も大きくなる。だから軽い段から試し、足りなければ上の段へ進む。"}, {"id": "map-4b-4", "ch": "lift", "card": "map-4b", "level": 2, "q": "ヒアルロン酸とボトックスは、たるみ治療の「はしご」のどこに入る？", "choices": ["はしごとは別の道具", "機械と同じ段", "糸リフトと同じ段", "切開リフトより上の段"], "answer": 0, "explain": "ヒアルロン酸は「② 足す」でふくらませ、ボトックスは「動きを止める」で筋肉の動きを弱める。どちらも下がった顔を引き上げるはしごとは別の道具。"}, {"id": "c5-01-1", "ch": "body", "card": "c5-01", "level": 1, "q": "ハイブリッド豊胸で、自分の脂肪はどんな役割をする？", "choices": ["胸の大きさの大部分を出す", "袋の輪郭をかくす", "袋を固定する糸の代わりになる", "乳腺を守る"], "answer": 1, "explain": "ハイブリッド豊胸は、袋が「大きさ」担当、自分の脂肪が「輪郭をかくす」担当。脂肪で袋をくるむので、輪郭がなめらかでさわり心地もやわらかくなる。"}, {"id": "c5-01-2", "ch": "body", "card": "c5-01", "level": 2, "q": "ハイブリッド豊胸について、正しいのは？", "choices": ["切らずに注射だけで終わる", "この章でいちばん大がかりで、4〜5時間かかる", "3つの豊胸のうち、大きくできる量がいちばん少ない", "脂肪を吸う工程がないので、3つの中でいちばん短い"], "answer": 1, "explain": "ハイブリッド豊胸は脂肪を吸う工程と袋を入れる工程の両方があり、4〜5時間かかるこの章でいちばん大がかりな手術。3つの中で最も大きくしやすい。"}, {"id": "c5-02-1", "ch": "body", "card": "c5-02", "level": 1, "q": "シリコンバッグ豊胸の強みとして、教材に書かれているのは？", "choices": ["体質に関係なく確実に大きくできる", "人工物を一切使わずにすむ", "脂肪を吸った所も細くなる", "切らずに注射だけで終わる"], "answer": 0, "explain": "袋は入れたぶんだけ確実にふくらむので、体質に関係なく大きくできる。人工物を使わない・吸った所が細くなるのは脂肪豊胸の特徴。"}, {"id": "c5-02-2", "ch": "body", "card": "c5-02", "level": 2, "q": "シリコンバッグ豊胸の料金について、正しいのは？", "choices": ["表の金額に袋の代金も含まれている", "表の金額とは別に、脂肪を吸う料金がかかる", "袋の代金は大きさと種類によって別にかかる", "大きくするカップ数ごとに表の金額が上がる"], "answer": 2, "explain": "料金表の金額は手術の料金で、袋（バッグ）の代金は入っていない。袋の代金は大きさと種類で変わり別にかかる。脂肪を吸う料金が別なのは脂肪豊胸。"}, {"id": "c5-02-3", "ch": "body", "card": "c5-02", "level": 2, "q": "シリコンバッグ豊胸のリスクとしてあがる「被膜拘縮」とは？", "choices": ["袋のふちが、皮膚の上から波打って見えること", "入れた脂肪の一部が体に吸収されること", "乳管が傷ついて授乳しにくくなること", "袋のまわりにできる膜が、かたく縮んで胸がかたくなること"], "answer": 3, "explain": "被膜拘縮は、袋のまわりにできる膜がかたく縮んで胸がかたくなること。公式の表では、乳腺の下に入れる方法でリスクが比較的高いとされる。波打って見えるのはリップリング。"}, {"id": "c5-02-4", "ch": "body", "card": "c5-02", "level": 2, "q": "シリコンバッグ豊胸で起こることがある「リップリング」とは？", "choices": ["袋のまわりの膜が、かたく縮んで胸がかたくなること", "入れたものの一部が体に吸収されること", "乳頭が内側にへこむこと", "袋のふちが、皮膚の上から波打って見えること"], "answer": 3, "explain": "リップリングは、袋のふちが皮膚の上から波打って見えること（袋のゆがみ）。公式の表では、筋肉の下に入れる方法の弱点にあげられている。膜がかたく縮むのは被膜拘縮。"}, {"id": "c5-03-1", "ch": "body", "card": "c5-03", "level": 1, "q": "脂肪豊胸（豊胸術・脂肪幹細胞注入）で、胸に入れるものは？", "choices": ["シリコンでできた袋", "お腹や太ももから吸った自分の脂肪", "シリコンの袋と自分の脂肪の両方", "脂肪を溶かす薬"], "answer": 1, "explain": "脂肪豊胸は、お腹や太ももの脂肪を吸い取り、きれいにしてから胸に注射で移す。人工物を使わない豊胸。袋と脂肪の両方を入れるのはハイブリッド豊胸。"}, {"id": "c5-03-2", "ch": "body", "card": "c5-03", "level": 1, "q": "脂肪豊胸で大きくできる量の目安は？", "choices": ["2〜3カップ", "最大で2倍", "1〜2カップ", "半カップまで"], "answer": 2, "explain": "脂肪豊胸で大きくできるのは1〜2カップまで。それ以上を希望する人には袋を使う方法が案内される。2〜3カップ以上もねらえるのはシリコンバッグ豊胸。"}, {"id": "c5-03-3", "ch": "body", "card": "c5-03", "level": 2, "q": "脂肪豊胸の料金表の金額とは別にかかるものは？", "choices": ["脂肪を吸う料金", "シリコンバッグの代金", "GLP-1注射の代金", "乳輪縮小の料金"], "answer": 0, "explain": "脂肪豊胸の料金表は「吸引代別途」で、脂肪を吸う料金は別にかかる（金額はページに記載なし）。袋の代金が別にかかるのは、シリコンバッグ豊胸やハイブリッド豊胸。"}, {"id": "c5-04-1", "ch": "body", "card": "c5-04", "level": 1, "q": "モントゴメリー腺除去は、何をする手術？", "choices": ["乳輪そのものを輪の形に切って小さくする", "わきの余分な乳房の組織を取る", "へこんだ乳頭を外に出す", "乳輪の中の小さなぶつぶつを1個ずつ切り取って縫う"], "answer": 3, "explain": "モントゴメリー腺除去は、乳輪にある小さなぶつぶつを1個ずつ切り取って縫う手術。料金も1個いくら。輪そのものを小さくするのは乳輪縮小術。"}, {"id": "c5-04-2", "ch": "body", "card": "c5-04", "level": 2, "q": "モントゴメリー腺除去と乳輪縮小術の違いは？", "choices": ["モントゴメリー腺除去は輪そのものを小さくし、乳輪縮小はぶつぶつだけを取る", "どちらも中央の突起（乳頭）を小さくする手術", "モントゴメリー腺除去は輪の大きさを変えずぶつぶつだけを取り、乳輪縮小は輪そのものを小さくする", "どちらも切らずに注射で行う施術"], "answer": 2, "explain": "乳輪縮小術は輪そのものの大きさを小さくする。モントゴメリー腺除去は輪の大きさは変えず、輪の中のぶつぶつだけを取る。中央の突起を小さくするのは乳頭縮小術。"}, {"id": "c5-05-1", "ch": "body", "card": "c5-05", "level": 1, "q": "副乳除去で取りのぞく「副乳」とは？", "choices": ["わきなどに残った余分な乳房の組織", "乳輪の中のあぶらを出す腺", "内側に埋もれた乳頭", "わきの皮膚のたるみ"], "answer": 0, "explain": "副乳は、胸以外の場所に残った余分な乳房の組織。副乳除去は、それを皮膚を切って組織ごと取りのぞく手術。乳輪の中のあぶらを出す腺はモントゴメリー腺。"}, {"id": "c5-05-2", "ch": "body", "card": "c5-05", "level": 2, "q": "副乳除去と、身体の脂肪吸引の「副乳（脇肉）」の違いは？", "choices": ["副乳除去は細い管で吸い出し、脂肪吸引は切って取る", "どちらも薬を注射して溶かす", "同じ施術で、名前が違うだけ", "副乳除去は切って取り、脂肪吸引は細い管で吸い出す"], "answer": 3, "explain": "脂肪吸引の副乳（脇肉）は細い管で吸い出す方法、副乳除去は切って取る方法。どちらが合うかは、ふくらみの中身を診察して医師が判断する。"}, {"id": "c5-06-1", "ch": "body", "card": "c5-06", "level": 1, "q": "「胸の先の突起（乳頭）が大きい・長い」悩みに対応する手術は？", "choices": ["乳輪縮小術", "陥没乳頭術", "乳頭縮小術", "モントゴメリー腺除去"], "answer": 2, "explain": "乳頭縮小術は、大きい・長い乳頭の一部を切り取って縫い、細く・低く整える。乳輪縮小術は色のついた輪、陥没乳頭術はへこんだ突起を出す手術。"}, {"id": "c5-06-2", "ch": "body", "card": "c5-06", "level": 2, "q": "乳頭縮小術と陥没乳頭術の違いは？", "choices": ["乳頭縮小は埋もれた突起を外に出し、陥没乳頭術は出すぎた突起を小さくする", "乳頭縮小は出すぎた突起を小さくし、陥没乳頭術は埋もれた突起を外に出す", "どちらも色のついた輪（乳輪）を小さくする手術", "どちらも輪の中のぶつぶつを取る手術"], "answer": 1, "explain": "2つは向きが逆。乳頭縮小術は出すぎている突起を小さくし、陥没乳頭術はへこんで埋もれた突起を外に出す。乳輪を小さくするのは乳輪縮小術。"}, {"id": "c5-07-1", "ch": "body", "card": "c5-07", "level": 1, "q": "陥没乳頭術には、見た目を整える以外にどんな目的がある？", "choices": ["母乳の出る量を増やす", "へこみで起こる炎症を防ぐ", "胸全体を大きくする", "わきのふくらみをなくす"], "answer": 1, "explain": "へこみに汚れがたまるとばい菌が増え、乳腺炎・乳管炎を起こしやすい。埋もれた突起を外に出すことで、炎症を防ぐ意味もある。男女共通。"}, {"id": "c5-08-1", "ch": "body", "card": "c5-08", "level": 1, "q": "乳輪縮小術で、乳輪は最大でどのくらい小さくできる？", "choices": ["最大で10%", "最大で50%", "最大で90%", "1〜2カップぶん"], "answer": 1, "explain": "乳輪縮小術は、輪の一部を輪の形に切り取って縫いちぢめ、最大で50%小さくできる。輪が小さくなると、胸そのものが大きく見える効果もある。"}, {"id": "c5-08-2", "ch": "body", "card": "c5-08", "level": 2, "q": "乳輪縮小と豊胸の両
